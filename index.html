<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Literatura Fuvest 2027</title>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:17px;
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F5F5F8;--ink:#1C1C1E;--ink2:#3A3A3C;--muted:#636366;
  --line:rgba(60,60,67,.12);--hair:rgba(60,60,67,.2);
  --accent:#2457C5;--accent-ink:#1E4BAA;--accent-bg:#EAF0FC;
  --warn:#B42318;--warn-bg:#FCF0EE;--gold:#8A5300;--gold-bg:#FBF3E3;--ok:#1E7A3E;--ok-bg:#E5F3E9;
  --seg:#E3E3E9;--seg-on:#FFFFFF;--bar:#F8F8FA;--gl:rgba(60,60,67,.35);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 10px rgba(16,24,40,.05);
  --c:#2457C5;--c-lt:#7DA5FF;--c-ink:var(--c);--btn:#2457C5;--tabH:56px;--topH:52px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--surface:#1C1C1E;--surface2:#2A2A2D;--ink:#F2F2F5;--ink2:#D9D9DE;--muted:#A1A1A8;
  --line:rgba(255,255,255,.09);--hair:rgba(255,255,255,.15);
  --accent:#7DA5FF;--accent-ink:#A3C0FF;--accent-bg:#1B2640;
  --warn:#FF8B7D;--warn-bg:#35201D;--gold:#F0C064;--gold-bg:#30281A;--ok:#6FD08F;--ok-bg:#16301F;
  --seg:#2C2C2F;--seg-on:#55555B;--bar:#141416;--gl:rgba(235,235,245,.35);--shadow:none;--c-ink:var(--c-lt);--btn:#2F62D0;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface2:#2A2A2D;--ink:#F2F2F5;--ink2:#D9D9DE;--muted:#A1A1A8;
  --line:rgba(255,255,255,.09);--hair:rgba(255,255,255,.15);
  --accent:#7DA5FF;--accent-ink:#A3C0FF;--accent-bg:#1B2640;
  --warn:#FF8B7D;--warn-bg:#35201D;--gold:#F0C064;--gold-bg:#30281A;--ok:#6FD08F;--ok-bg:#16301F;
  --seg:#2C2C2F;--seg-on:#55555B;--bar:#141416;--gl:rgba(235,235,245,.35);--shadow:none;--c-ink:var(--c-lt);--btn:#2F62D0;color-scheme:dark;}
:root[data-fs="0"]{--fs:16px}:root[data-fs="2"]{--fs:19px}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--fs);line-height:1.6;
  padding-bottom:calc(var(--tabH) + env(safe-area-inset-bottom,0px) + 16px);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.playing body{padding-bottom:calc(var(--tabH) + env(safe-area-inset-bottom,0px) + 84px)}
img{max-width:100%}
a{color:var(--accent-ink);text-decoration:none}
button,select,input{font-family:inherit;font-size:16px;color:inherit}
p,li,td,dd{overflow-wrap:break-word}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* topo */
.top{position:sticky;top:0;z-index:30;background:var(--bar);
  padding-top:env(safe-area-inset-top,0px);box-shadow:0 .5px 0 var(--hair)}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;height:52px;max-width:720px;margin:0 auto;padding:0 6px}
.bar .bl{display:flex;min-width:0;max-width:112px}.bar .br{display:flex;justify-content:flex-end}
.back{all:unset;cursor:pointer;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 6px;color:var(--accent-ink);font-size:17px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back #backLbl{overflow:hidden;text-overflow:ellipsis}
.back .chev{font-size:30px;line-height:1;margin-top:-4px;font-weight:500}
.back[hidden]{display:none}
.ttl{position:absolute;left:50%;transform:translateX(-50%);font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 248px);text-align:center;pointer-events:none;opacity:0;transition:opacity .18s}
.top.show-t .ttl{opacity:1}
.aa{all:unset;cursor:pointer;min-width:44px;min-height:44px;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--accent-ink);border-radius:12px}
.aa[aria-expanded="true"]{background:var(--accent-bg)}
.pop{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 56px);right:max(10px,calc(50vw - 350px));width:290px;max-width:calc(100vw - 20px);background:var(--surface);border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.22);padding:14px 14px 6px}
.pop[hidden]{display:none}
.pop .lab{margin:0 0 6px}
.pop .seg{margin-bottom:14px}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);
  box-shadow:0 -.5px 0 var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;max-width:720px;margin:0 auto;height:var(--tabH)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:44px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em}
.tabbar .tb-i{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.55;transition:opacity .15s}
.tabbar a.on{color:var(--accent-ink)}
.tabbar a.on .tb-i{filter:none;opacity:1}

/* conteúdo */
main{max-width:720px;margin:0 auto;padding:8px 18px 24px}
h1{font-size:calc(var(--fs) * 1.7);line-height:1.15;margin:6px 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-size:calc(var(--fs) * 1.16);line-height:1.3;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:1em;margin:18px 0 6px;font-weight:700}
p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 12px}li{margin-bottom:6px}
.ph{margin:10px 0 18px}
.eyebrow,.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.sub{color:var(--muted);font-size:calc(var(--fs) * .9);line-height:1.5;margin-bottom:14px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border-radius:16px;padding:18px 18px 8px;margin:0 0 16px;box-shadow:var(--shadow);position:relative}
.card>h2:first-child{margin-top:0}
.sect{margin:28px 4px 12px}
.sechead{display:flex;align-items:flex-start;gap:8px}
.sechead h2{flex:1}
.say{flex:none;width:44px;height:44px;margin:-10px -12px -8px 0;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.say span{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:11px;color:var(--muted);padding-left:2px}
.say[aria-pressed="true"] span{background:var(--btn);color:#fff}
.card.tone .say span{background:rgba(127,127,127,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:14px;padding:0 18px;background:var(--btn);color:#fff;cursor:pointer;font-weight:650;font-size:16px;text-decoration:none;line-height:1.2}
.btn.ghost{background:var(--accent-bg);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:999px}
.btn.wide{width:100%}
.btn.done{background:var(--ok-bg);color:var(--ok)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}

/* notas */
.note{border-radius:12px;padding:12px 14px 2px;margin:0 0 14px;background:var(--surface2)}
.note .lab{margin-bottom:4px}
.note.cai{background:var(--accent-bg)}.note.cai .lab{color:var(--accent-ink)}
.note.peg{background:var(--warn-bg)}.note.peg .lab{color:var(--warn)}
.note.mn{background:var(--gold-bg)}.note.mn .lab{color:var(--gold)}
.note>p:last-child,.note>ul:last-child{margin-bottom:12px}
.note:not(:has(p,ul,ol)){padding-bottom:12px}
.card.tone{box-shadow:none}
.card.tone.cai{background:var(--accent-bg)}.card.tone.cai h2{color:var(--accent-ink)}
.card.tone.peg{background:var(--warn-bg)}.card.tone.peg h2{color:var(--warn)}
.card.tone.mn{background:var(--gold-bg)}.card.tone.mn h2{color:var(--gold)}
ul.pegs{list-style:none;padding:0}ul.pegs li{position:relative;padding-left:26px;margin-bottom:10px}
ul.pegs li::before{content:"!";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;line-height:1}
ul.tight{padding-left:20px}ul.tight li{margin-bottom:8px}

/* glossário */
span.fg,span.es,span.rd{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--gl);-webkit-tap-highlight-color:rgba(36,87,197,.12)}
span.fg:hover,span.es:hover,span.rd:hover{text-decoration-color:var(--accent)}
#figBack{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#figSheet{position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;z-index:61;font-size:16px;line-height:1.55;max-width:720px;margin:0 auto}
#figSheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 10px}
.fs-open #figSheet{transform:none}.fs-open #figBack{opacity:1;pointer-events:auto}
#figSheet .fs-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
#figSheet .fs-t{font-size:19px}
#figSheet .fs-x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:14px;margin:6px -4px 6px 0;box-shadow:0 0 0 6px transparent}
#figSheet p{margin:0 0 12px}
#figSheet .fs-l{display:block;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#figSheet .fs-k{font-size:13px;color:var(--muted);margin:0 0 12px}
#figSheet .fs-go{font-size:15px;font-weight:600}

/* perguntas e respostas */
.qp{margin:0 0 12px}
details{margin:0 0 14px}
details>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details>summary::-webkit-details-marker{display:none}
details:not(.disc)>summary{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--accent-bg);color:var(--accent-ink);font-weight:650;font-size:15px}
details.qa>summary{display:flex;justify-content:space-between;gap:10px;background:none;padding:0;border-radius:0;min-height:44px;color:var(--muted);font-weight:500}
details.qa>summary .pill{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--accent-bg);color:var(--accent-ink);font-weight:650;white-space:nowrap}
details.qa .try{align-self:center;font-size:14px;white-space:nowrap}
details.qa .o1{display:none}details.qa[open] .o0{display:none}details.qa[open] .o1{display:inline}
details:not(.disc)>.in{margin-top:12px;padding:14px 16px 4px;border-radius:12px;background:var(--surface2)}
.ans p{margin-bottom:12px}
.ans .st{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:2px}
.q{font-style:normal}

/* recolhíveis */
details.disc{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px}
details.disc>summary{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;font-weight:650}
details.disc>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 auto;transition:transform .2s}
details.disc[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.disc>summary small{color:var(--muted);font-weight:500;font-size:14px}
details.disc>.in{padding:0 18px 8px}
details.disc .card{box-shadow:none;background:var(--surface2);padding:16px 16px 6px}
details.disc .card.tone{background:var(--surface2)}
details.disc details.disc{background:var(--surface2);box-shadow:none}

/* página de obra */
.bhead{display:flex;gap:14px;align-items:center;margin:12px 0 14px}
.bico{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:32px;background:var(--surface)}
.bhead h1{font-size:calc(var(--fs) * 1.5);margin:2px 0 2px}
.bhead .eyebrow{color:var(--muted)}
.bper{font-size:14px;color:var(--muted);line-height:1.4}
.stick{position:sticky;top:calc(var(--topH) + env(safe-area-inset-top,0px));z-index:20;margin:0 -18px;padding:6px 18px 0;background:var(--bg)}
.stick::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:8px;min-height:36px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;padding:0 4px}
.seg button[aria-selected="true"],.seg button.on{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;height:46px;align-items:center;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:none;padding:0;min-height:44px;cursor:pointer;display:flex;align-items:center}
.chips button span{display:block;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink2);background:var(--surface);box-shadow:var(--shadow);white-space:nowrap}
.chips button.on span{background:var(--c);color:#fff;box-shadow:none}
.chips[hidden]{display:none}
#panel{padding-top:14px}
.lead{font-size:1.06em;line-height:1.55;margin-bottom:12px}
.card.intro{border-top:0}
.card.intro .eyebrow{color:var(--c-ink);margin-bottom:6px}
.ficha-top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;gap:10px}
.ficha-top .meta{font-size:14px;color:var(--muted)}
.fio{font-size:1.04em;color:var(--ink2);margin:0 0 14px;padding-left:12px;border-left:3px solid var(--c-ink)}
.arc{display:grid;gap:4px;margin:0 0 18px;background:var(--surface2);border-radius:12px;padding:12px 14px}
.arc .who{font-weight:700}
.arc .step{display:flex;gap:10px;align-items:baseline}
.arc .step i{font-style:normal;color:var(--c-ink);font-weight:800;flex:none;width:14px;text-align:center}
ol.tl2{list-style:none;padding:0;margin:6px 0 6px}
ol.tl2 li{position:relative;padding:0 0 18px 40px;margin:0}
ol.tl2 li::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
ol.tl2 li:last-child::before,ol.tl2 li.endg::before{display:none}
ol.tl2 .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--c-ink);background:var(--surface);box-shadow:inset 0 0 0 2px var(--c-ink)}
ol.tl2 li.star .dot{background:var(--c);color:#fff}
ol.tl2 .sc-t{margin:2px 0 4px;font-size:1em;line-height:1.35}
ol.tl2 .sc-t .star{font-size:.9em;margin-right:2px}
ol.tl2 p{margin:0 0 8px}
ol.tl2 .imp{font-size:.94em;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:8px 12px;margin-top:6px}
ol.tl2 .imp .lab{font-size:11px;color:var(--c-ink);margin-bottom:1px}
ol.tl2 li.grp{padding:6px 0 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ol.tl2 li.grp::before{display:none}
dl.people{margin:0 0 8px}
dl.people dt{font-weight:700;margin-top:12px}
dl.people dt:first-child{margin-top:0}
dl.people dd{margin:2px 0 0;padding-bottom:12px;border-bottom:.5px solid var(--hair)}
dl.people dd:last-child{border-bottom:0}
.endbox{margin:24px 0 8px;display:grid;gap:12px}
.nextc{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink);min-height:64px}
.nextc .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.nextc .tx{flex:1;min-width:0}
.nextc .tx small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nextc .tx b{display:block;line-height:1.3}
.nextc .go{color:var(--accent-ink);font-size:22px}
.pp>summary .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;background:var(--c)}
.pp>summary .pt{flex:1;min-width:0;line-height:1.35}
.pp>summary .pt small{display:block;margin-top:2px}
.pp .sayrow{float:right;margin:-8px -8px 0 8px}
.pp .sayrow .say{margin:0}
.pp p>b:first-child{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.qcard .eyebrow{margin-bottom:8px}

/* listas */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:0 0 16px;padding:0;list-style:none;overflow:hidden}
.list li{margin:0}
.list a,.list .row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:64px;color:var(--ink);position:relative}
.list li+li a::before,.list li+li .row::before{content:"";position:absolute;top:0;left:72px;right:0;height:.5px;background:var(--hair)}
.list .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface2)}
.list .tx{flex:1;min-width:0;line-height:1.3}
.list .tx b{display:block;font-weight:650}
.list .tx small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.list .tx .eyebrow{font-size:11px;margin-bottom:1px}
.chev{flex:none;color:var(--hair);font-size:22px;line-height:1}
.ck{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.prog{height:6px;background:var(--seg);border-radius:9px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:9px}

/* hoje */
.cont{display:flex;align-items:center;gap:12px;background:var(--btn);color:#fff;border-radius:16px;padding:14px 16px;margin:0 0 16px;min-height:60px}
.cont .tx{flex:1;min-width:0;line-height:1.3}
.cont small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cont b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .go{font-size:22px}
.day h2{font-size:calc(var(--fs) * 1.28);margin:4px 0 14px}
.day .eyebrow{color:var(--accent-ink)}
.big{display:flex;align-items:center;gap:14px;background:var(--surface2);border-radius:14px;padding:12px 14px;margin:0 0 10px;color:var(--ink);min-height:64px}
.big .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--surface)}
.big .tx{flex:1;min-width:0;line-height:1.3}.big .tx b{display:block}.big .tx small{display:block;color:var(--muted);font-size:14px}
.redtask{display:flex;gap:12px;align-items:center;border-top:.5px solid var(--hair);margin:14px -18px 0;padding:14px 18px 6px;color:var(--ink)}
.redtask .ic{flex:none;font-size:22px}
.redtask .tx{flex:1;min-width:0;font-size:15px;line-height:1.45}
.redtask .tx .eyebrow{color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 16px}
.stat{background:var(--surface);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);min-width:0}

<script>
const BOOKS=[];
BOOKS.push({id:'gh',short:'G. H.',e:'🪳',c:'#6E7A22',t:'A paixão segundo G. H.',a:'Clarice Lispector',y:1964,per:'Romance introspectivo, 3ª fase do Modernismo (prosa intimista)',
idt:`<p><b>Clarice Lispector</b> (1920–1977) nasceu na Ucrânia, chegou ao Brasil bebê (1922), cresceu em Maceió e Recife e viveu no Rio. É a grande voz da prosa introspectiva brasileira: rompe com o enredo de fatos e mergulha na consciência, com fluxo de pensamento e metáforas insólitas.</p>
<p><b>O livro (1964):</b> um romance em que quase nada acontece por fora e tudo acontece por dentro. Uma mulher rica, identificada só pelas iniciais <b>G. H.</b>, conta, no dia seguinte, a experiência que a desmontou: entrar no quarto da empregada e encarar uma barata.</p>
<p><b>Abre com uma dedicatória</b> “a possíveis leitores”, pedindo pessoas de alma já formada, que saibam que toda aproximação é lenta e passa pelo oposto. O texto começa e termina com uma fileira de travessões: a história não tem começo nem fim fechados.</p>`,
cenas:[
['A desorganização',' G. H. tenta contar o que viveu “ontem”. Diz que perdeu algo como uma terceira perna, que a deixava estável mas a impedia de andar. Agora está desorganizada e tem medo de não saber viver assim.'],
['A manhã, na cobertura','Quase dez horas, apartamento de cobertura no Rio, com treze andares abaixo. A empregada pediu demissão na véspera. Sozinha e satisfeita, G. H. planeja arrumar a casa começando pelo fim: o quarto de empregada, que imagina sujo.'],
['O quarto e o mural','Surpresa: o quarto está limpo, branco, seco e iluminado como um deserto. Na parede caiada há um desenho a carvão de um homem, uma mulher e um cão nus, só em contorno. G. H. lembra, com esforço, o nome da empregada, Janair, e percebe que ela a odiava e que nunca a tinha realmente visto.'],
['A barata','Ao abrir o guarda-roupa, surge uma barata. Num gesto rápido, G. H. fecha a porta sobre ela e a prende pelo meio do corpo. Ia dar o golpe final, mas desiste ao ver a cara da barata. Da barata ainda viva começa a sair uma massa branca.'],
['A travessia','Diante da barata, G. H. perde as camadas humanas: enxerga uma vida “neutra”, anterior ao humano, sem sentido nem beleza. Atravessa inferno, nojo e êxtase. Lembra um aborto que fez, um homem que amou, e pede a uma mão imaginária (um “tu”) que a segure.'],
['O ato proibido','Vomita o café da manhã, avança de novo e, numa vertigem, sem assistir ao próprio gesto, põe na boca a massa branca da barata. Chama isso de antipecado: o oposto de uma pureza fácil. Depois cospe, lembrando a passagem do Apocalipse sobre vomitar os mornos.'],
['A desistência','No fim, G. H. aceita que o mundo independe dela e que não vai compreender o que viveu. A revelação é desistir de entender. A última palavra é o verbo adorar, no presente, seguida de travessões.']],
pers:[['G. H.','Narradora, escultora amadora, mulher rica e independente, que vive “em semiluxo”. Só tem iniciais (as mesmas gravadas na mala do quarto): uma identidade de fachada, que o livro desmonta.'],
['Janair','A empregada que saiu. Nunca aparece em cena, mas está em tudo: no quarto limpo, no silêncio, no desenho que funciona como um julgamento de G. H. É negra, e G. H. a imagina como uma rainha estrangeira e hostil dentro de sua casa. Era “invisível” para a patroa.'],
['A barata','Quase uma personagem: matéria viva, antiga, sem individualidade. É o espelho em que G. H. vê a vida sem as máscaras humanas. Na Bíblia, é um dos animais “imundos”.'],
['O “tu” e a mão','Interlocutor imaginado a quem G. H. pede a mão enquanto narra. Às vezes parece um homem que ela amou; às vezes, o próprio leitor. Ela também se dirige à mãe (preces em forma de Ave-Maria) e a Deus.']],
tec:`<p><b>Narrador:</b> 1ª pessoa, monólogo interior com fluxo de consciência. G. H. narra no dia seguinte, tentando “dar a alguém” o que viveu.</p>
<p><b>Tempo:</b> psicológico. A ação dura uma manhã, mas é esticada em centenas de páginas de reflexão, memória e delírio.</p>
<p><b>Espaço:</b> a cobertura organizada (a vida de fachada) contra o quarto de empregada, branco e seco como um deserto, nos fundos, o <i>bas-fond</i> da casa, como ela diz (o lugar do que ela não queria ver).</p>
<p><b>Estrutura:</b> 33 seções encadeadas. A última frase de uma seção é repetida no começo da seguinte, como uma corrente. 33 é a idade de Cristo: o título liga “paixão” amorosa à Paixão de Cristo e imita os evangelhos (“segundo” Mateus, “segundo” G. H.).</p>
<p><b>Linguagem:</b> paradoxos e oxímoros (alegria difícil, covardia como coragem), repetições, frases que se corrigem, metáforas estranhas. A linguagem confessa que não alcança o vivido.</p>`,
temas:[['Crise de identidade','perder a “terceira perna” é perder a pessoa montada para os outros e encontrar algo mais primitivo'],
['O neutro e o inexpressivo','a vida em estado bruto, sem sentido humano, que a barata revela'],
['Classe e raça','o quarto dos fundos, a empregada invisível, o desenho como acusação silenciosa da patroa'],
['Religião às avessas','a massa da barata como hóstia invertida, o antipecado, a paixão como via-crúcis de uma manhã'],
['Limites da linguagem','a palavra mente quando tenta dizer o vivido; por isso G. H. desiste de entender e adora'],
['Epifania','um fato banal (uma barata) provoca uma revelação que muda o modo de ver tudo']],
cai:`<p>Fuvest gosta de pedir: a relação G. H.–Janair (classe e raça), o sentido da barata, a técnica do fluxo de consciência e do tempo psicológico, e a epifania. O desenho na parede é a cena com mais chance de virar excerto.</p>`,
peg:['Não é romance de terror nem realista: quase nada acontece fora da cabeça de G. H.','G. H. não é pobre nem vítima: é patroa, rica (embora lembre uma infância pobre), e o livro expõe justamente o seu privilégio.','O final não é “E então adorei”: o verbo está no presente. Ela não compreende, adora.','Não confundir com outras obras com empregadas: Janair nunca fala no livro.'],
mn:`<p><b>B-A-R-A-T-A:</b> <b>B</b>ranco do quarto · <b>A</b>borto lembrado · <b>R</b>etrato a carvão (mural) · <b>A</b>ntipecado (comer a massa) · <b>T</b>erceira perna perdida · <b>A</b>dora no fim.</p>`,
q:{p:'No quarto de Janair, G. H. encontra um desenho a carvão de um homem, uma mulher e um cão. a) Por que o desenho funciona como um espelho para a protagonista? b) Que relação o episódio estabelece entre G. H. e a empregada?',
a:['O desenho obriga G. H. a se ver pelos olhos de outra pessoa: pela primeira vez ela imagina como é julgada por alguém de fora do seu meio.','Ela suspeita que as figuras rígidas e nuas a retratam (primeiro se pergunta se seria o homem e o cão um apelido; depois se reconhece na mulher da parede), e conclui que Janair a odiava e que ela nunca tinha prestado atenção na empregada, que lhe era “invisível”.','Assim, o mural revela a distância de classe (e de raça) entre patroa e empregada: o quarto dos fundos guardava uma acusação silenciosa. Esse choque é o primeiro passo da desorganização de G. H.']},
ap:`<p><b>Clarice:</b> estreou com <i>Perto do coração selvagem</i> (1943). Outros: <i>Laços de família</i> (contos, 1960), <i>A hora da estrela</i> (1977). Em “Amor” (Laços de família), Ana tem uma epifania ao ver um cego mascando chiclete: compare com a barata.</p>
<p><b>Epifania:</b> revelação súbita provocada por algo banal. Em G. H. ela é levada ao extremo: a revelação destrói a identidade em vez de confirmá-la.</p>
<p><b>Intertextos:</b> a Bíblia (os animais imundos do Levítico, o Apocalipse dos mornos), a ideia de Paixão (Bach, os evangelhos), a hóstia. G. H. inverte o sagrado: chega a Deus pelo que é “imundo”.</p>
<p><b>Cenas secundárias úteis:</b> as fotografias de G. H. (o rosto sorridente que esconde um vazio); a vista da cobertura, treze andares acima da rua, como garganta de prédios; a memória do aborto, andando pelas ruas e olhando manequins de vitrine; a lembrança de um homem amado, cujo sal ela sentiu nos olhos.</p>
<p><b>Contexto:</b> 1964 é o ano do golpe militar, mas o livro não trata de política diretamente. A crítica social aparece pelo avesso: no quarto de empregada, herança doméstica da escravidão.</p>`,
cx:['<b>Visão das plantas:</b> em ambas, o contato com uma vida não humana e indiferente (barata, plantas) desmonta o humano. As plantas não julgam Celestino; a barata não julga G. H.','<b>Memórias de Martha:</b> classe social vista de dois lados: Martha é a pobre que sobe; G. H. é a rica que desce ao quarto dos fundos.','<b>Canção:</b> Janair é silenciada; Juventina tem voz e conta sua história. Duas mulheres negras, dois modos de presença no texto.','<b>Geografia:</b> no poema final de Sophia, o eu está voltado para fora e procura Deus no real; G. H. chega ao divino pelo real mais cru.'],
aq:{p:'O livro é dividido em 33 seções e se chama “A paixão segundo G. H.”. Explique a relação entre esses elementos e a experiência vivida pela narradora.',
a:['O título e a estrutura aproximam a experiência de G. H. da Paixão de Cristo.','33 é a idade de Cristo, e “segundo G. H.” imita os títulos dos evangelhos. A manhã no quarto é uma via-crúcis: sofrimento, morte da antiga identidade e uma comunhão invertida ao comer a massa da barata.','“Paixão” tem duplo sentido: sofrimento e amor intenso. A narradora atravessa a dor para chegar a uma forma de adoração do real.']},
cards:[['Onde se passa quase toda a ação de G. H.?','No quarto de empregada da cobertura (treze andares acima da rua), no Rio de Janeiro.'],['Quem é Janair?','A empregada que pediu demissão na véspera. Nunca aparece, mas deixa o mural a carvão na parede.'],['O que há no mural?','Contornos de um homem, uma mulher e um cão nus, desenhados a carvão.'],['O que G. H. faz com a barata?','Fecha a porta do guarda-roupa sobre ela, prendendo-a pelo meio, e depois põe na boca a massa branca que sai dela.'],['O que é a “terceira perna”?','A identidade organizada que dava estabilidade a G. H., mas a impedia de andar de verdade.'],['Como é a estrutura do livro?','33 seções encadeadas: a última frase de uma abre a seguinte.'],['Como termina o livro?','Com a desistência de entender e o verbo adorar no presente, seguido de travessões.'],['Que lembrança íntima volta a G. H. diante da barata?','A de um aborto que fez.']],
cola:'Mulher rica entra no quarto da empregada Janair, vê um mural, prende uma barata na porta do armário e põe na boca sua massa: perde a identidade e encontra o “neutro”. Fluxo de consciência, 33 seções, título como Paixão.'});

BOOKS.push({id:'geografia',short:'Geografia',e:'🗺️',c:'#1C7486',t:'Geografia',a:'Sophia de Mello Breyner Andresen',y:1967,per:'Poesia portuguesa moderna, sob a ditadura de Salazar',
enT:'O livro em 7 partes',
idt:`<p><b>Sophia de Mello Breyner Andresen</b> (1919–2004), poeta portuguesa nascida no Porto, de família aristocrática. Católica progressista, foi opositora da ditadura de Salazar e, depois da Revolução dos Cravos (1974), deputada constituinte. Ganhou o Prêmio Camões em 1999.</p>
<p><b>O livro (1967):</b> uma antologia de poemas organizada como um mapa: praias do Algarve, a casa à noite, o Mediterrâneo grego, o Brasil e, por fim, o próprio poema. “Geografia” aqui é poesia de lugares vividos, em que paisagem vira ética.</p>
<p><b>Contexto:</b> Portugal vivia a ditadura (1926–1974), chamada Estado Novo a partir de 1933, com Salazar até 1968 e Marcelo Caetano depois: censura, polícia política e guerra colonial na África (desde 1961). Parte dos poemas responde a esse “mau tempo”.</p>
<p><b>Marcas da poeta:</b> luz, mar, cal branca, pedra, sal, casa, nudez das coisas. Uma poesia de atenção ao real e de clareza clássica.</p>`,
cenas:[
['Ingrina','Praias do Algarve. O sol, a cal, o orégão e o mar devolvem ao eu lírico a alegria e a sensação de recomeçar o mundo. Em “Mundo nomeado ou descoberta das ilhas”, os navegadores dão nome a baías e praias, e as coisas parecem nascer ao serem nomeadas: nomear é criar.'],
['Procelária','A parte política. A procelária é uma ave que voa na tempestade e faz da insegurança sua força: imagem do poeta que canta no mau tempo. Aqui estão “Cidade dos outros” (a desonestidade que compra e vende), “Esta gente” (o povo humilhado de um país ocupado e o desejo de um país liberto), “Os aviões” (bombardeios que matam longe), “Túmulo de Lorca” (o poeta espanhol fuzilado em 1936 e os presos sem nome) e “Néon” (uma luz violenta que viola o interior).'],
['A noite e a casa','Poemas passados dentro de casa, à noite (recolhimento do eu lírico): a vela, os espelhos, a janela, o silêncio da noite. Em “Escuto”, o eu não sabe se ouve o silêncio ou Deus. Em “Bach Segóvia guitarra”, a música cria morada. A casa reúne e protege.'],
['Dual','Amor, ausência e morte. “De um amor morto” mostra o amor que acaba sem deixar retrato. “No deserto” traz o eu que domina a si mesmo como a um cavalo para chegar ao deserto limpo. Há também “O filho pródigo” e “Caminho” (na marcha pelo deserto, quem morre antes do próximo oásis é o próprio eu).'],
['Mediterrâneo','Grécia e Itália. Em “Acaia”, o eu tira o vestido de exílio. Em “Electra”, o grito convoca a justiça dos deuses. Em “Epidauro”, o Minotauro é um monstro que devora os dias da nossa vida, e libertar-se dele é libertar-se da violência. “Crepúsculo dos deuses” lamenta o vazio deixado pelo fim do sagrado. “Ítaca” evoca a <i>Odisseia</i>, mas sem Ulisses: um “tu” feminino parte de Brindisi para um segundo nascimento.'],
['Brasil ou do outro lado do mar','“Descobrimento” imagina a chegada dos navegadores e um povo recém-criado, cor de barro. “Manuel Bandeira” lembra a leitura do poeta na infância. “Brasília” elogia a cidade de Lúcio Costa e Niemeyer, lógica e lírica, grega e brasileira, erguida no fim da caminhada dos candangos. “Poema de Helena Lanari” celebra o português do Brasil, que pronuncia todas as sílabas.'],
['No poema','A poética. “Poesia de inverno” fala de um tempo sem deuses, de palavras envergonhadas. “Da transparência” desconfia do jogo de se mostrar inteiro. “Poema” fecha o livro: o eu se define pelo mundo que vê (mar, terra, sol, vento), não por documentos, e procura Deus no real.']],
pers:[['O eu lírico','Atento ao mundo, voltado para fora. Busca justiça, clareza e o sagrado nas coisas concretas. Sofre com a opressão, mas recomeça sempre.'],['O povo (“Esta gente”)','Gente humilhada e pisada, cujo rosto lembra ora escravos, ora reis. Renova no eu a vontade de lutar.'],['Os navegadores','Os que dão nome às ilhas e chegam ao Brasil. O livro os vê com encanto, como descobridores.'],['Figuras míticas','Electra, o Minotauro, os deuses gregos, Antínoo: máscaras para falar de justiça, tirania e exílio.'],['Poetas','Lorca (assassinado pelo franquismo) e Manuel Bandeira (memória afetiva de leitura).']],
tec:`<p><b>Forma:</b> versos livres, sem rima fixa; muitos poemas quase sem pontuação. Há poemas em prosa (“Ingrina”, “Epidauro”).</p>
<p><b>Recursos:</b> enumeração de substantivos concretos (cal, pedra, sal, luz, mar), anáfora (repetição no início dos versos), frases nominais, imagens de luz e transparência.</p>
<p><b>Tom:</b> clássico e sereno, mas com indignação contida nos poemas políticos. A clareza da forma é também uma ética: dizer o real com exatidão.</p>
<p><b>Espaço:</b> o título não é decorativo. Cada parte é um lugar (praia, casa, Grécia, Brasil, o próprio poema), e cada lugar é uma forma de estar no mundo.</p>`,
temas:[['Nomear o mundo','a palavra poética como ato de criação e descoberta'],['Resistência','a procelária, o povo humilhado, Lorca: poesia contra a opressão do Estado Novo'],['Luz, mar e cal','símbolos de pureza, justiça e verdade'],['Casa e noite','interioridade, silêncio, atenção ao sagrado'],['Mito grego','o Mediterrâneo como origem da medida, da justiça e da beleza'],['Brasil','descoberta, modernidade (Brasília) e língua partilhada'],['Poética','o poeta não tem outra identidade além do mundo que olha']],
cai:`<p>Obra nova na lista, já cobrada na 1ª fase 2027 (Q27, “Eu me perdi”: a paisagem como parâmetro de verdade contra a opacidade do regime). Prepare-se para um poema dado, com pedido de relacioná-lo ao contexto da ditadura salazarista, à parte do Brasil ou à poética da luz e do real. A Fuvest já usou um poema de Sophia (de <i>Mar novo</i>) na coletânea da redação de 2026.</p>`,
peg:['<i>Geografia</i> e <i>O Cristo Cigano</i> vêm juntos em muitas edições, mas só <i>Geografia</i> está na lista de 2027. O Cristo Cigano é outra obra, sobre um escultor e um cigano.','Sophia é portuguesa, não brasileira. A parte “Brasil” é o olhar de quem vem do outro lado do mar.','“Brasília” é um elogio, não uma crítica à cidade modernista.','Procelária é uma ave das tempestades, não uma planta nem um lugar.'],
mn:`<p>As 7 partes em ordem: <b>I</b>ngrina, <b>P</b>rocelária, <b>N</b>oite e casa, <b>D</b>ual, <b>M</b>editerrâneo, <b>B</b>rasil, <b>P</b>oema. Frase: “<b>I</b>sso <b>P</b>arece <b>N</b>ossa <b>D</b>upla <b>M</b>issão: <b>B</b>rasil e <b>P</b>oesia.”</p>`,
q:{p:'Em “Procelária”, a ave que voa firme na tempestade é apresentada como imagem justa para quem vive e canta no mau tempo. a) Explique a metáfora, considerando o contexto de Portugal em 1967. b) Cite outro poema da mesma parte do livro que confirme essa leitura.',
a:['A procelária representa o poeta que não foge do perigo: faz da insegurança sua força e continua a cantar em tempos de opressão.','Em 1967, Portugal vivia a ditadura salazarista, com censura e guerra colonial. O “mau tempo” é o tempo político; cantar nele é resistir.','Na mesma parte, “Esta gente” mostra o povo humilhado de um país ocupado e o desejo de um país liberto e de um tempo justo; “Túmulo de Lorca” lembra o poeta fuzilado e os presos sem nome. Ambos confirmam a poesia como resistência.']},
ap:`<p><b>Sophia e o Estado Novo:</b> sua poesia evita o panfleto. A crítica vem por imagens: a cidade dos outros, a luz de néon que viola, o Minotauro que devora a vida. Depois do 25 de Abril (1974), ela escreveu poemas célebres sobre a liberdade (fora deste livro).</p>
<p><b>Poética do real:</b> Fora deste livro (em “Arte poética IV”, de <i>Dual</i>, 1972), Sophia retoma a frase de Pessoa de que um poema lhe “aconteceu”. Em “Poema”, o eu recusa cartão de identidade e entrevistas: sua biografia é o mundo. Em “Poesia de inverno”, lamenta um tempo em que as palavras perderam a substância.</p>
<p><b>Brasil:</b> a seção nasce de uma viagem ao Brasil nos anos 1960. Note a inversão: em “Descobrimento”, a voz é a dos navegadores que chegam; em “Poema de Helena Lanari”, a portuguesa admira como o Brasil pronuncia o português.</p>
<p><b>Para ler qualquer poema na prova:</b> 1) em que parte do livro ele estaria? 2) que elementos concretos aparecem (luz, mar, casa, cal)? 3) há um conflito entre limpidez e sordidez, ou entre exílio e regresso?</p>`,
cx:['<b>Nebulosas:</b> duas poetas que leem o cosmos e a natureza como lugar de verdade e que ligam poesia e liberdade política (Narcisa contra o Império e a escravidão; Sophia contra Salazar).','<b>A visão das plantas:</b> o mar português e a expansão marítima. Sophia celebra a descoberta; Djaimilia mostra o lado do porão negreiro.','<b>A paixão segundo G. H.:</b> as duas buscam o sagrado no real concreto, não em ideias abstratas.','<b>Caminho de pedras:</b> poesia e romance contra ditaduras (Salazar em Portugal, Vargas no Brasil).'],
aq:{p:'Explique como o livro “Geografia” transforma lugares em formas de pensar o mundo, usando exemplos de duas partes diferentes.',
a:['Em Geografia, cada lugar corresponde a uma atitude diante da vida: a paisagem vira ética e reflexão.','Em “Ingrina”, a praia luminosa é recomeço e alegria, e nomear as ilhas é criar o mundo. Em “Procelária”, a cidade é lugar de desonestidade e opressão, e o poeta resiste como a ave na tempestade. No Mediterrâneo, a Grécia oferece medida e justiça contra o Minotauro.','Por isso o título: o livro é um mapa de experiências, que termina no próprio poema, onde o eu diz que sua identidade é o mundo.']},
cards:[['Quais são as 7 partes de Geografia?','Ingrina, Procelária, A noite e a casa, Dual, Mediterrâneo, Brasil ou do outro lado do mar, No poema.'],['O que simboliza a procelária?','O poeta que canta no mau tempo político, fazendo da insegurança sua força.'],['Que poeta assassinado recebe um poema de Sophia?','García Lorca, fuzilado pelo franquismo em 1936 (“Túmulo de Lorca”).'],['Que regime governava Portugal em 1967?','O Estado Novo (1933–1974): Salazar até 1968, depois Marcelo Caetano.'],['Quais poemas compõem a parte do Brasil?','“Descobrimento”, “Manuel Bandeira”, “Brasília” e “Poema de Helena Lanari”.'],['O que “Poema de Helena Lanari” elogia?','O português falado no Brasil, que pronuncia todas as sílabas das palavras.'],['Qual a ideia central do poema que fecha o livro?','A identidade do poeta é o mundo que ele vê; Deus é procurado no real.'],['O Cristo Cigano está na lista de 2027?','Não. Só Geografia. O Cristo Cigano era da lista de 2026.']],
cola:'Poesia portuguesa de 1967, sob Salazar, em 7 partes como um mapa. Luz, mar e cal; a procelária como poeta da resistência; Grécia; Brasil (Brasília, Bandeira, o português do Brasil); identidade = mundo.'});

BOOKS.push({id:'caminho',short:'Caminho de pedras',e:'🪨',c:'#7A6146',t:'Caminho de pedras',a:'Rachel de Queiroz',y:1937,per:'Romance de 30, romance social e político urbano',
idt:`<p><b>Rachel de Queiroz</b> (1910–2003), cearense, estreou aos 19 anos com <i>O Quinze</i> (1930). Foi a primeira mulher a entrar na Academia Brasileira de Letras (1977) e a primeira a ganhar o Prêmio Camões (1993). Na juventude, militou na esquerda.</p>
<p><b>O livro (1937):</b> datado “Fortaleza, outubro de 1936”. Não é romance da seca: é urbano e político. Acompanha uma célula de militantes comunistas em Fortaleza e, dentro dela, Noemi, uma mulher que rompe o casamento por amor e paga caro por isso.</p>
<p><b>Contexto:</b> Era Vargas, logo após a Intentona Comunista (1935): repressão, prisões e deportações de presos políticos. Em 1937, com o Estado Novo, livros de Rachel e de outros romancistas foram queimados em praça pública. O partido nunca é nomeado no livro: é “a organização”.</p>`,
cenas:[
['A volta de Roberto','Roberto, intelectual militante, volta a Fortaleza depois de dez anos, mandado pelo Rio para reorganizar a “Região” da organização. Não reconhece a cidade nem é reconhecido.'],
['A desconfiança dos operários','Na primeira reunião, numa casa pobre, os operários o recebem com frieza. Vinte-e-Um, operário negro e ex-marinheiro, o chama de pequeno-burguês. É o conflito entre intelectuais e operários que atravessa o livro.'],
['Noemi','Noemi trabalha retocando fotos na Fotografia de Seu Benevides, é casada com João Jaques e mãe do Guri. Entra no grupo e se aproxima de Roberto. Os dois se apaixonam.'],
['O comício','Um comício é reprimido pela polícia: Roberto e outros são presos e um homem negro da multidão fica caído, agonizando. João Jaques acha a ação uma provocação inútil. O casamento entra em crise.'],
['A ruptura','Noemi e Roberto viram amantes. Roberto conta tudo ao marido, que vai embora de navio. Os próprios camaradas condenam Noemi: no fundo, têm horror ao adultério e dizem que as mulheres confundem questão social com questão sexual.'],
['As perdas','Noemi é demitida porque a freguesia “de família” reclama do seu comportamento. Sem emprego, vive à custa de Roberto. O Guri adoece e morre. Filipe, o amigo mais próximo, é mandado para o interior. O grupo se desfaz.'],
['Um ano depois','Distribuindo boletins de madrugada, Noemi e Roberto são delatados e presos. Ela, grávida, é solta em dois dias; ele é deportado para uma colônia numa ilha. Sozinha, costurando para viver, Noemi sobe uma ladeira de pedras, vê apagando-se um letreiro de “Liberdade para...” escrito por Roberto e fala com ternura ao filho na barriga, chamando-o de companheiro.']],
pers:[['Noemi','Protagonista. Mulher que trabalha, escolhe o amor e a militância, e enfrenta o julgamento de todos. Perde marido, filho, emprego e companheiro, mas termina de pé, com dignidade.'],['Roberto','Intelectual idealista, apaixonado, um pouco ciumento e protetor. Acaba preso e deportado.'],['João Jaques','O marido. Ex-militante, expulso da organização no Rio, cético. Sai de cena com dignidade e sofrimento, e manda um telegrama desesperado quando o filho morre.'],['Filipe','Guarda-livros que mora nas “areias”, bairro pobre. Lúcido e irônico, transita entre intelectuais e operários. Muito próximo de Noemi.'],['Vinte-e-Um','Operário negro, ex-marinheiro. Desconfia dos intelectuais que querem “governar” os operários.'],['Angelita','Costureira de paramentos de igreja e militante convicta. Seu filho se chama Vladimir.'],['Seu Benevides e Guiomar','O patrão fotógrafo, que demite Noemi, e a colega que inveja e espia.'],['O Guri','Filho de Noemi e João Jaques. Sua morte é o ponto mais baixo do romance.']],
tec:`<p><b>Narrador:</b> 3ª pessoa, com discurso indireto livre: o narrador entra na cabeça de Roberto, Filipe e, sobretudo, Noemi. No capítulo 20, há um monólogo de Noemi dirigido ao marido que partiu.</p>
<p><b>Tempo:</b> linear, sem datas; o livro não marca a duração total; o último capítulo salta “um ano”.</p>
<p><b>Espaço:</b> Fortaleza urbana: Praça do Ferreira, bondes, cafés, a Fotografia, os bairros pobres de areia. É o regionalismo de 30 levado para a cidade.</p>
<p><b>Linguagem:</b> seca, direta, coloquial, com diálogos ágeis e capítulos curtos (27). Sem sentimentalismo, mesmo nas cenas de dor.</p>`,
temas:[['Militância e vida privada','a organização quer controlar até o amor dos militantes'],['Machismo na esquerda','os camaradas que pregam a revolução condenam a mulher adúltera'],['Classe','operários desconfiados de intelectuais “pequeno-burgueses”'],['Trabalho feminino','Noemi tem emprego e salário, e perdê-los a torna dependente'],['Repressão política','prisões, delação, deportação para ilhas-presídio'],['O título','o caminho de pedras é a trajetória dura de Noemi e, literalmente, a ladeira calçada do final']],
cai:`<p>O desfecho (Noemi sozinha, grávida, na ladeira) e a crítica ao moralismo dos próprios militantes são os pontos mais prováveis. Também vale saber comparar com o regionalismo de 30: aqui o “social” é urbano e político, não a seca.</p>`,
peg:['Não é romance da seca nem do sertão (isso é <i>O Quinze</i>). É urbano.','O filho que morre (Guri) é de João Jaques; o bebê do final é de Roberto.','O partido nunca é nomeado: é sempre “a organização”.','Noemi não é “castigada” pelo narrador: o livro mostra a injustiça do julgamento social.'],
mn:`<p><b>N-O-E-M-I:</b> <b>N</b>oemi deixa o marido · <b>O</b>perários desconfiam · <b>E</b>mprego perdido · <b>M</b>orte do Guri · <b>I</b>lha (Roberto deportado). E no fim: grávida, subindo a ladeira de pedras.</p>`,
q:{p:'No desfecho de “Caminho de pedras”, Noemi, grávida e sozinha, sobe uma ladeira calçada de pedras e vê apagar-se um letreiro que pedia liberdade. a) Que sentido o título ganha nessa cena? b) Que balanço o desfecho faz da trajetória da protagonista?',
a:['O caminho de pedras é ao mesmo tempo a ladeira real e a vida difícil de Noemi.','Ela perdeu o marido, o filho, o emprego, os amigos e o companheiro, preso e deportado; o letreiro apagado sugere a derrota do movimento e a repressão política.','Mas ela continua subindo, trabalha para viver e trata o filho que espera como “companheiro”: há perda, mas também resistência e esperança, sem idealização.']},
ap:`<p><b>Rachel e o romance de 30:</b> a geração de Graciliano Ramos, José Lins do Rego e Jorge Amado fez o romance social do Nordeste. Rachel começou pela seca (<i>O Quinze</i>), mas aqui escreve um romance proletário e urbano, de base parcialmente autobiográfica, sem ser autobiografia.</p>
<p><b>Cenas secundárias úteis:</b> a rodinha de intelectuais na Praça do Ferreira, que finge não conhecer os operários na rua; Angelita levando o filho pequeno ao comício; o delegado vindo do Rio para resolver brigas internas; a noite em que Noemi, depois de virar amante de Roberto, sente que o êxtase sonhado falhou e só quer protegê-lo como um menino; Noemi, sem emprego, brincando que só lhe restaria ser copeira ou garçonete.</p>
<p><b>Para comparar com 2025:</b> a Fuvest perguntou se <i>Os ratos</i> se aproximava do regionalismo de 30. Aqui a resposta seria: sim no compromisso social, não no cenário rural.</p>`,
cx:['<b>Balada de amor ao vento:</b> duas mulheres julgadas por adultério, abandonadas e que terminam criando filhos com o próprio trabalho.','<b>Memórias de Martha:</b> mulher que precisa trabalhar e é avaliada pela moral; o emprego como condição de dignidade.','<b>Opúsculo:</b> o debate sobre emancipação feminina, um século antes.','<b>Geografia:</b> literatura sob ditaduras (Vargas aqui, Salazar em Sophia).'],
aq:{p:'Explique de que forma o romance critica não só a repressão do Estado, mas também a própria organização militante.',
a:['O livro mostra a violência policial, mas também as contradições internas da esquerda.','Os operários desconfiam dos intelectuais, e estes os tratam com paternalismo; e, quando Noemi deixa o marido, os camaradas a condenam e repetem que as mulheres confundem política com sexo.','Assim, a luta por liberdade convive com moralismo e machismo: Noemi é oprimida pelo patrão, pela polícia e também pelos companheiros.']},
cards:[['Onde e quando se passa Caminho de pedras?','Em Fortaleza, nos anos 1930 (o livro é datado de outubro de 1936).'],['Por quem Noemi deixa João Jaques?','Por Roberto, militante intelectual vindo do Rio.'],['Onde Noemi trabalha?','Retocando fotografias na Fotografia de Seu Benevides.'],['Por que Noemi é demitida?','Porque a freguesia “de família” reclama do seu comportamento (o adultério).'],['Quem é Vinte-e-Um?','Operário negro, ex-marinheiro, que chama Roberto de pequeno-burguês.'],['O que acontece com o Guri?','Adoece e morre.'],['Qual o destino de Roberto?','É preso distribuindo boletins e deportado para uma colônia numa ilha.'],['Como termina o romance?','Noemi, grávida e sozinha, sobe uma ladeira de pedras falando com o filho que espera.']],
cola:'Fortaleza, anos 30: Noemi deixa o marido por Roberto, militante. Condenada pelos camaradas, demitida, perde o filho; Roberto é deportado. Termina grávida, sozinha, subindo a ladeira. Romance de 30 urbano e político.'});

BOOKS.push({id:'balada',short:'Balada',e:'🌬️',c:'#B4421F',t:'Balada de amor ao vento',a:'Paulina Chiziane',y:1990,per:'Literatura moçambicana pós-independência',
idt:`<p><b>Paulina Chiziane</b> (1955), moçambicana, foi a primeira mulher a publicar um romance em Moçambique: este, em 1990. Em 2021, tornou-se a primeira africana a receber o Prêmio Camões. Outra obra famosa: <i>Niketche</i> (2002), sobre poligamia.</p>
<p><b>O livro:</b> Sarnau, já velha, conta sua vida: o primeiro amor por Mwando, o casamento com o futuro rei, o adultério, a fuga, o abandono e a sobrevivência na cidade.</p>
<p><b>Contexto:</b> Moçambique colonial, sob domínio português. Margens do rio Save (Mambone) e, depois, Lourenço Marques, a atual Maputo, no bairro pobre da Mafalala. Aparecem a missão católica, os sipaios (policiais africanos a serviço do colono), a caderneta de indígena e a deportação para trabalho forçado em Angola.</p>
<p><b>Palavras-chave:</b> <b>lobolo</b> (pagamento, em gado ou dinheiro, da família do noivo à família da noiva), <b>poligamia</b>, curandeiros, espíritos dos antepassados.</p>`,
cenas:[
['O primeiro amor','Sarnau, velha, na Mafalala, lembra a juventude em Mambone. Ama Mwando, rapaz educado na missão católica. Vivem o primeiro amor na natureza.'],
['O abandono','Mwando vai casar com a moça escolhida pelos pais e, cristão, recusa a poligamia: não aceita Sarnau nem como segunda esposa. Desesperada, entra na lagoa para morrer; um pescador a salva, e ela perde o filho que esperava. Uma curandeira prevê que ela morrerá do outro lado do mar.'],
['A rainha','Sarnau é escolhida para esposa de Nguila, herdeiro do rei, com grande lobolo em gado. Vive o luxo e a vaidade do poder, tem filhas gêmeas, mas é desprezada quando o marido toma outras esposas, sobretudo a favorita, Phati. Sofre violência.'],
['O reencontro','Mwando, abandonado pela esposa Sumbi e tendo perdido o filho pequeno, volta a Mambone. Ele e Sarnau viram amantes. Ela engravida de Mwando, e o menino nasce como se fosse o herdeiro do rei.'],
['A fuga','Phati os espia e o caso é descoberto. Sarnau e Mwando fogem de barco pelo Save até o mar e o sul, deixando os filhos. Phati é morta. Com medo dos homens do rei, Mwando rejeita Sarnau, a agride e a abandona grávida.'],
['O degredo','Mwando é preso por armação de um sipaio, sem caderneta de indígena em dia, e condenado à deportação. Em Angola, faz trabalho forçado nas roças de café e cana, sob a violência colonial. Anos depois, consegue voltar.'],
['O preço','Sarnau sobrevive em Lourenço Marques: prostituiu-se e depois virou vendedora no mercado da Mafalala, mãe de filhos. Reencontra Mwando num temporal e exige que ele pague: a oferenda nunca dada à protetora e o “preço da honra”, vinte e quatro casamentos, porque ela mesma devolveu a Nguila as 36 vacas do lobolo. Foge. Ele vai à casa dela; Phati, filha dele, e João o chamam de pai, e Sarnau, vencida, o aceita.']],
pers:[['Sarnau','Narradora e protagonista. Apaixonada, vaidosa, sofredora e resistente: vai de camponesa a “rainha”, de prostituta a comerciante. Não é vítima passiva.'],['Mwando','Formado pela missão, dividido entre o cristianismo e a tradição. Covarde no amor, vítima do colonialismo no degredo, onde, ironicamente, vira o “padre Moçambique” útil aos colonos e volta após quinze anos.'],['Nguila','Herdeiro e depois rei. Polígamo, violento, poderoso.'],['Phati','A quinta esposa, favorita de Nguila e rival de Sarnau. Descobre o adultério e acaba morta.'],['Sumbi','Esposa de Mwando que se recusa a cumprir as regras de submissão e o abandona por um homem mais velho e rico.'],['As mulheres da família','Mãe, tias e irmã (Rindau) que ensinam a Sarnau que o marido é senhor e a esposa deve servir.']],
tec:`<p><b>Narrador:</b> alterna a 1ª pessoa de Sarnau (memória de uma mulher velha) com blocos em 3ª pessoa sobre Mwando (o colégio, o casamento com Sumbi, a perseguição, o degredo em Angola).</p>
<p><b>Tempo:</b> memorialístico; da juventude no Save à velhice na cidade, com cerca de dezesseis anos entre a fuga e o reencontro.</p>
<p><b>Espaço:</b> campo (Mambone, rio Save) contra cidade (Mafalala); o mar como travessia e castigo; Angola como degredo.</p>
<p><b>Linguagem:</b> poética e oral, cheia de provérbios, imagens da natureza, cantos e termos locais (há glossário). Português de Moçambique.</p>`,
temas:[['Condição feminina','lobolo, poligamia, violência doméstica, conselhos de submissão'],['Amor x tradição','o amor de Sarnau e Mwando esbarra em casamentos arranjados e regras sociais'],['Colonialismo','missão, sipaios, caderneta de indígena, deportação e trabalho forçado'],['Sobrevivência','a mulher que sustenta a casa com o próprio comércio'],['Oralidade','o romance como “balada”: canto, memória e provérbio'],['O título','as baladas de amor cantadas ao vento: um amor que o vento leva, como o próprio Mwando']],
cai:`<p>Prováveis: o lobolo e a poligamia como formas de controle da mulher; a crítica ao colonialismo (degredo de Mwando); a narração alternada; o desfecho ambíguo, em que Sarnau cobra um preço e, ainda assim, cede.</p>`,
peg:['Não é romance da guerra de independência: é ambientado no período colonial.','Mwando não é herói romântico: abandona Sarnau duas vezes.','O final não é idílio puro: Sarnau se diz vencida e aceita Mwando pelos filhos e pela própria necessidade de ser feliz.','Phati é ao mesmo tempo o nome da rival morta e o de uma filha de Sarnau no final; não confunda.'],
mn:`<p><b>S-A-V-E</b> (o rio): <b>S</b>arnau ama · <b>A</b>bandono (Mwando cristão) · <b>V</b>ira rainha (lobolo) · <b>E</b>xílios (fuga, Angola, Mafalala).</p>`,
q:{p:'No reencontro com Mwando, anos depois, Sarnau exige que ele pague antes de ficarem juntos. a) Explique o sentido dessa exigência, considerando a tradição do lobolo. b) O que ela revela sobre a trajetória da personagem?',
a:['O lobolo é o pagamento que a família do noivo faz à da noiva para selar o casamento; Mwando levou Sarnau na fuga sem nunca pagar nada.','Ao exigir pagamento, Sarnau cobra o lobolo que ela mesma teve de devolver e, ao mesmo tempo, o preço de tudo o que sofreu: o abandono, a prostituição, a perda dos filhos. A frase choca Mwando, que a acusa de ter se prostituído.','A exigência mostra que Sarnau deixou de ser a moça submissa: aprendeu, sozinha na cidade, a valorizar a si mesma e a negociar. Mesmo assim, o desfecho é ambíguo, porque ela acaba cedendo.']},
ap:`<p><b>Contexto histórico:</b> Moçambique foi colônia portuguesa até 1975. O regime do indigenato separava “indígenas” de “civilizados”: o africano precisava de caderneta e podia ser condenado a trabalho forçado. Angola recebia deportados para roças de café e engenhos de cana (é para lá que Mwando vai).</p>
<p><b>Cenas secundárias úteis:</b> a festa do casamento com o filho do rei e os conselhos de submissão cantados pelas mulheres; a gravidez de Sarnau tratada como paraíso pelo marido; o ritual da lua cheia que apresenta o “herdeiro” (filho de Mwando); o navio de deportados, com o porão escuro; o mercado da Mafalala, com os pregões das vendedoras.</p>
<p><b>Leitura feminista:</b> Sarnau critica a poligamia, mas também a deseja quando lhe convém (sonha ser rainha). Chiziane não idealiza a tradição nem a condena em bloco: mostra mulheres que negociam dentro dela.</p>`,
cx:['<b>A visão das plantas:</b> o porão do navio. Lá, escravos sufocados com cal; aqui, deportados levados para Angola. A violência colonial pelo mar nos dois livros.','<b>Canção:</b> a poligamia oficial de Nguila e a poligamia informal de Fio Jasmim; mulheres que esperam e criam filhos sozinhas.','<b>Caminho de pedras:</b> adultério, julgamento e mulher sozinha com filho no fim.','<b>Opúsculo:</b> Nísia já ligava o destino das mulheres ao grau de civilização e denunciava a colonização.'],
aq:{p:'O romance alterna a voz de Sarnau, em 1ª pessoa, com capítulos em 3ª pessoa sobre Mwando. Que efeito essa alternância produz?',
a:['A alternância mostra a mesma história por dois ângulos e amplia o retrato da opressão.','A voz de Sarnau traz a memória íntima da mulher submetida ao lobolo, à poligamia e ao abandono. Os capítulos sobre Mwando mostram o que ela não poderia saber: o degredo, o porão do navio e o trabalho forçado em Angola.','Assim, o romance une a opressão de gênero à opressão colonial: ela sofre como mulher; ele, como colonizado.']},
cards:[['Quem narra Balada de amor ao vento?','Sarnau, já velha, em 1ª pessoa, alternando com capítulos em 3ª pessoa sobre Mwando.'],['O que é lobolo?','Pagamento (gado, dinheiro) da família do noivo à família da noiva para selar o casamento.'],['Por que Mwando rejeita Sarnau no começo?','Vai casar com a moça escolhida pelos pais e, cristão, não aceita a poligamia.'],['Com quem Sarnau se casa?','Com Nguila, herdeiro do rei de Mambone.'],['Quem descobre o adultério?','Phati, a quinta esposa e favorita de Nguila.'],['Para onde Mwando é deportado?','Para Angola, para trabalho forçado nas roças.'],['Onde Sarnau vive na velhice?','Na Mafalala, bairro pobre de Lourenço Marques (Maputo).'],['O que Sarnau exige no reencontro?','Que Mwando pague o preço da honra (24 casamentos), já que ela mesma devolveu as 36 vacas do lobolo, e a oferenda nunca dada.']],
cola:'Moçambique colonial: Sarnau ama Mwando, é abandonada, vira esposa do herdeiro (lobolo, poligamia), foge com Mwando e é abandonada de novo. Ele é deportado para Angola; ela sobrevive na Mafalala. Reencontro: exige que ele pague; acaba aceitando-o.'});

BOOKS.push({id:'cancao',short:'Canção',e:'🚂',c:'#8E3B6E',t:'Canção para ninar menino grande',a:'Conceição Evaristo',y:2018,per:'Literatura afro-brasileira contemporânea (2ª edição ampliada, 2022)',
idt:`<p><b>Conceição Evaristo</b> (1946), mineira de Belo Horizonte, é uma das maiores vozes da literatura afro-brasileira. Autora de <i>Ponciá Vicêncio</i> (2003) e <i>Olhos d’água</i> (Jabuti 2015). Criou o conceito de <b>escrevivência</b>: escrita que nasce da vivência, sobretudo das mulheres negras, misturando memória, experiência e invenção.</p>
<p><b>O livro:</b> 1ª edição em 2018; a 2ª (2022), que é a usada, acrescenta histórias de novas mulheres. Uma narradora ouve de Juventina a história de Fio Jasmim, maquinista de trem casado, e das muitas mulheres que cruzaram o caminho dele.</p>
<p><b>Na introdução,</b> a narradora diz que contar já trai o vivido e que recontar é dupla traição, porque a escrita não registra gestos, silêncios e o tremor da voz. Mesmo assim, persiste. (Esse trecho caiu na Fuvest 2026.)</p>`,
cenas:[
['A moldura','A narradora e um grupo de amigas socorrem Juventina, que sente uma dor no peito. Ela se recupera cantando a “Canção para ninar menino grande”. Depois conta sua história, e a narradora decide escrever.'],
['Fio Jasmim','Homem negro, bonito, maquinista como o pai, Máximo Jasmim. Casado desde os 20 anos com Pérola Maria, com quem tem oito filhos e o nono a caminho. Em cada cidade onde o trem para, há uma mulher.'],
['Neide e Angelina','Neide Paranhos, no Vale dos Laranjais, namora Fio e quer dele só um filho, sem ser esposa de ninguém; o menino leva só o nome da mãe. Angelina, enfermeira de Alma das Flores, primeira da família com curso superior, esperava um noivo; às vésperas do próprio casamento, Fio finge ser esse noivo, a conselho dos maquinistas, e ela, ao descobrir, se joga de uma ribanceira.'],
['As mulheres da 2ª edição','Aurora, que se banha nua no rio e ama Fio de longe; Antonieta, a mais desejada de Remanso Velho, que planta jasmins; Dolores, herdeira de joias e mãe de gêmeas, a única que transforma amor em ódio e planeja vingança, mas desiste da arma; Dalva, a Ruiva, cujos filhos ruivos têm o cabelo crespo do pai.'],
['Juventina','Amou Fio sozinha durante 35 anos, sem nunca ser correspondida do mesmo modo; ele a mantinha virgem num jogo de carícias. Ela compôs para ele a canção de ninar. Na infância, um pai ausente a abordou na rua de modo repulsivo, e ela apagou essa memória.'],
['Eleonora','Expulsa de casa aos 17 anos por amar uma moça, Eleonora encontra Fio num bar. Ele chora sem saber por quê: é a primeira vez que encara as próprias dores. Os dois se tornam quase irmãos.'],
['O fim e a escrita','Juventina deixa Fio, não por falta de amor, mas para entender esse amor; quer ouvir outras mulheres e compor uma grande ária coletiva. Eleonora encontra Juventina na roda das amigas, e algo novo se anuncia. A narradora conclui que ficção e verdade têm a mesma medida e que a canção também é dela.']],
pers:[['Fio Jasmim','O “menino grande”: sedutor, criado pelo pai e pelos homens mais velhos para ver a conquista de mulheres como prova de macheza. Cumpre o papel de provedor da família oficial, mas foge de toda responsabilidade afetiva. Não é vilão caricato: é produto dessa educação.'],['Juventina (Tina)','Mulher negra, professora de música concursada e compositora, fonte da história. Ama sozinha e, no fim, escolhe entender o próprio amor.'],['A narradora','Ouvinte e escritora. Viúva, mãe de uma filha. Diz que, de certa forma, também foi uma das mulheres de Fio, e que ele lembra um pai que lhe faltou.'],['Pérola Maria','A esposa oficial, que tem filhos um atrás do outro e prefere chamar os rumores de inveja.'],['Eleonora Distinta de Sá','Mulher lésbica, rejeitada pela família, que acolhe o choro de Fio e talvez encontre afeto em Juventina.'],['As outras','Neide, Angelina, Aurora, Antonieta, Dolores, Dalva (branca e ruiva; nem todas são negras): cada uma ama, espera, esquece ou odeia de um jeito.']],
tec:`<p><b>Narrador:</b> uma narradora-testemunha que ouviu a história de Juventina e a reconta. É um relato de segunda mão, que admite lacunas, dúvidas e invenção.</p>
<p><b>Estrutura:</b> em mosaico, ou “caleidoscópio”: cada parte foca uma mulher, e a imagem de Fio se monta pelos olhos delas.</p>
<p><b>Tempo:</b> não linear; vai e volta entre a juventude de Fio e o presente da roda de amigas.</p>
<p><b>Espaço:</b> a ferrovia e cidades de nomes alegóricos (Vale dos Laranjais, Remanso Velho, Águas Infindas, Ardência Antiga, Chegada Feliz).</p>
<p><b>Linguagem:</b> oral, poética, com repetições e digressões, como uma conversa entre mulheres.</p>`,
temas:[['Masculinidade','o homem infantilizado, educado para conquistar, que precisa ser ninado'],['Amor e suas demências','amar sozinha, esperar, odiar, esquecer'],['Mulheres negras','corpo, desejo, maternidade solo e autonomia'],['Memória e oralidade','a história passa de boca em boca e a escrita sempre perde algo'],['Sororidade','a roda de amigas como espaço de cuidado e escuta'],['O título','uma canção de ninar para um homem adulto: Fio é um menino grande, cuidado pelas mulheres (a expressão vem da mãe de Tina, para quem os homens eram meninos grandes)']],
cai:`<p>Já caiu em 2026, comparado com <i>As meninas</i>, sobre memória como recurso narrativo. Prováveis de novo: a escrevivência, o papel da narradora-ouvinte, o sentido do título e a construção da masculinidade de Fio.</p>`,
peg:['O narrador não é Fio Jasmim nem Juventina: é uma narradora que ouve e reconta.','A edição de referência é a 2ª (2022), ampliada com Aurora, Antonieta, Dolores e Dalva.','Escrevivência não é sinônimo de autobiografia: mistura vida e criação.','Fio não é apresentado como monstro: o livro mostra a educação machista que o formou.'],
mn:`<p>O trem para em cada mulher: <b>Pérola</b> (a esposa), depois <b>N</b>eide e as três de “A” (<b>A</b>ngelina, <b>A</b>urora, <b>A</b>ntonieta), as duas de “D” (<b>D</b>olores, <b>D</b>alva) e, fechando, <b>J</b>uventina e <b>E</b>leonora.</p>`,
q:{p:'Na introdução do livro, a narradora afirma que recontar o que ouviu é uma dupla traição, porque a escrita não registra gestos e silêncios. a) Explique essa afirmação. b) Como ela se relaciona com o conceito de escrevivência?',
a:['Contar o vivido já é reconstruir a lembrança de modo imperfeito; recontar o que outra pessoa contou soma uma segunda perda.','A narradora ouviu a história de Juventina, com seu corpo, sua voz e seus silêncios, e sabe que a escrita não captura tudo; por isso admite lacunas e invenções.','A escrevivência assume essa mistura: é uma escrita feita da vivência própria e da escuta de outras mulheres negras, em que memória e ficção têm “a mesma medida”.']},
ap:`<p><b>Escrevivência:</b> termo criado por Conceição para nomear uma escrita que parte da experiência coletiva, sobretudo das mulheres negras, e que recusa a separação rígida entre vida e literatura. A narradora diz que também foi, de algum modo, uma das mulheres de Fio.</p>
<p><b>Cenas secundárias úteis:</b> Fio hipnotizado pelos pés de Neide na festa da estação; os conselhos dos maquinistas mais velhos sobre “moças de família” e “mulheres livres”; Dolores com a arma, desistindo da vingança e decidindo apresentar as filhas aos irmãos; Dalva Ruiva visitando Pérola com os filhos, como comadres; o pai de Fio ensinando que homem de verdade respeita a honra de uma virgem.</p>
<p><b>Conceição na USP:</b> em 2022, assumiu a Cátedra Olavo Setúbal do Instituto de Estudos Avançados da USP.</p>`,
cx:['<b>Memórias de Martha:</b> memória em 1ª pessoa, mas de modos diferentes: Martha lembra a própria vida; a narradora de Canção reconta a vida de outra.','<b>Balada:</b> o homem que circula e as mulheres que ficam; poligamia oficial (Nguila) e informal (Fio).','<b>A paixão segundo G. H.:</b> Janair é silenciada; Juventina fala e é ouvida.','<b>Caminho de pedras:</b> mulheres que criam filhos sozinhas e são julgadas pelo amor.'],
aq:{p:'Por que se pode dizer que o título “Canção para ninar menino grande” resume a visão do romance sobre Fio Jasmim?',
a:['O título mostra Fio como um homem adulto tratado como criança.','Ele foi educado para ver mulheres como conquistas e foge de responsabilidades afetivas; as mulheres o desejam, esperam e cuidam dele. Juventina compõe para ele uma canção de ninar, e Eleonora acolhe seu choro.','Assim, o título ironiza a masculinidade de Fio: o “grande” sedutor é, no fundo, um menino frágil que precisa ser ninado, enquanto as mulheres sustentam a vida.']},
cards:[['Quem narra Canção para ninar menino grande?','Uma narradora que ouviu a história de Juventina e a reconta (narradora-testemunha).'],['Qual a profissão de Fio Jasmim?','Maquinista de trem, como o pai, Máximo Jasmim.'],['Quem é a esposa de Fio?','Pérola Maria, mãe de oito filhos (o nono a caminho).'],['Por quanto tempo Juventina amou Fio?','35 anos.'],['Que mulheres a 2ª edição acrescenta?','Aurora, Antonieta, Dolores e Dalva.'],['Quem planeja vingança contra Fio?','Dolores dos Santos, mãe de gêmeas, que desiste da arma.'],['Quem é Eleonora?','Mulher lésbica expulsa de casa, que acolhe o choro de Fio.'],['O que é escrevivência?','Escrita que nasce da vivência, sobretudo de mulheres negras, unindo memória e invenção.']],
cola:'Narradora reconta o que ouviu de Juventina sobre Fio Jasmim, maquinista casado com uma mulher em cada estação. Mosaico de mulheres; masculinidade infantilizada (“menino grande”); escrevivência; memória e escrita que trai o vivido.'});

BOOKS.push({id:'visao',short:'Visão das plantas',e:'🌿',c:'#2E7D4F',t:'A visão das plantas',a:'Djaimilia Pereira de Almeida',y:2019,per:'Literatura portuguesa contemporânea, pós-colonial',
idt:`<p><b>Djaimilia Pereira de Almeida</b> (1982) nasceu em Luanda, Angola, e cresceu em Portugal. Doutora em teoria da literatura. Ganhou o Prêmio Oceanos em 2019 (<i>Luanda, Lisboa, Paraíso</i>) e voltou a ficar entre os premiados em 2020, com este livro (o 1º lugar foi de <i>Torto arado</i>).</p>
<p><b>O livro (2019):</b> romance curto que expande um parágrafo de <b>Raul Brandão</b>, <i>Os pescadores</i> (1923). Nesse trecho, usado como epígrafe, Brandão lembra o capitão Celestino: começou como pirata, sufocou com sacos de cal uma revolta de escravizados no porão do navio negreiro e acabou a vida cuidando de flores, sem uma dúvida na consciência.</p>
<p><b>A pergunta do romance:</b> como pode um homem que cometeu atrocidades viver em paz entre flores? Djaimilia reescreve um clássico português para expor o que ele tratou com naturalidade: a violência da escravidão.</p>`,
cenas:[
['A epígrafe','O trecho de Raul Brandão apresenta Celestino: pirata e negreiro que virou jardineiro “santo”.'],
['A volta','Velho, a caminho de cegar, com pala num olho, Celestino volta à casa da família, na rua dos choupos, numa vila de pescadores do norte de Portugal. A casa e o quintal estão em ruínas, comidos pelo tempo e pelo mar.'],
['O jardim','Ele se livra dos móveis e, sem drama, queima numa vala as roupas, rendas e bordados das mulheres da casa (caiu na 1ª fase 2027: a enumeração ligada ao apagamento do trabalho feminino). Depois limpa o quintal e passa a cultivar roseiras, cravos, camélias, ameixeira e legumes. Torna-se um jardineiro obsessivo e delicado.'],
['A vila e o padre','Os vizinhos o temem e espiam pelas sebes; as crianças imaginam o pirata atrás da pala, e ele lhes deixa doces no muro. O padre Alfredo o visita e insiste na confissão; Celestino recusa. Às crianças, conta crimes como se fossem aventuras.'],
['Os fragmentos','Entre os capítulos aparecem anotações soltas, quase um diário: mortes, a frase “sangue e luz”, a vida da horta. O passado irrompe na linguagem sem virar arrependimento.'],
['Os fantasmas','A memória volta em forma de visitas: uma menina holandesa de olhos vendados e uma velha escrava negra que ele lançou ao mar. Elas o cuidam como amas. Ele delira, se perde, bebe, e revê o porão com os corpos sufocados pela cal.'],
['A morte','Numa noite de inverno, Celestino morre, sem uma dúvida na consciência. O padre Alfredo olha o jardim com cobiça; nas mãos dele, todas as plantas morriam. As plantas ainda não sabiam que o amigo tinha morrido.']],
pers:[['Celestino','Ex-capitão pirata e negreiro, agora jardineiro. Não se arrepende, não confessa e não é punido. É um homem comum, e isso é o mais assustador.'],['Padre Alfredo','Quer a confissão do pirata e, no fim, cobiça o jardim. Representa uma religião mais preocupada com aparências.'],['Manuel','Rapaz da vila, primo do falecido caseiro Amadeu, que cuida do velho, fascinado por estar perto de um pirata de verdade. No São João, Celestino lhe pede que o leve para casa: a única vez que implorou algo.'],['As crianças','Raul, Pedro e Luzia, que espiam o quintal e ouvem as histórias.'],['Os fantasmas','A menina holandesa e a velha escrava: as vítimas que voltam, não para punir, mas para acompanhar o velho até a morte.'],['As plantas','Quase personagens: o narrador mostra como elas veem o jardineiro, sem gratidão e sem julgamento.']],
tec:`<p><b>Narrador:</b> 3ª pessoa, que às vezes adota o ponto de vista das plantas (daí o título), intercalado com fragmentos em 1ª pessoa (anotações, falas de Celestino).</p>
<p><b>Tempo:</b> o presente da velhice, invadido pelo passado em lembranças, delírios e fantasmas.</p>
<p><b>Espaço:</b> a casa e o quintal, que espelham o navio. Em noites de tempestade, a casa parece um barco à deriva ou um porão de escravos; o quintal vira um “mar outro, sem homens e sem tempo”.</p>
<p><b>Linguagem:</b> prosa poética, sensorial e densa: cheiros, cores, texturas da terra, contrastando com a brutalidade dos crimes.</p>`,
temas:[['Memória do crime colonial','o tráfico de escravizados e a violência que Portugal naturalizou'],['Ausência de remorso','Celestino não se arrepende nem é punido'],['Natureza amoral','as plantas não julgam; florescem do mesmo jeito'],['Beleza e horror','o jardim cresce sobre um passado de mortes; as flores lembram os mortos'],['Religião e hipocrisia','o padre que quer confissão e cobiça o jardim'],['Reescrita','dar outra leitura a um texto canônico (Raul Brandão)']],
cai:`<p>Caiu em 2026: comparar a frieza de Celestino jovem, no massacre, com seu estado psicológico na velhice, e explicar a relação simbólica entre o navio e a casa. Pode voltar com o tema do arrependimento, do título ou da reescrita de Brandão.</p>`,
peg:['Celestino não se arrepende: não há redenção nem confissão.','O título tem duplo sentido: o olhar das plantas sobre Celestino (sem julgamento) e a visão do jardim pelos outros (no fim, ao padre, parece uma aleluia). Não é o olhar de Celestino sobre as plantas.','O episódio da cal vem do texto de Raul Brandão e é retomado no romance.','A casa fica em Portugal, não na África.'],
mn:`<p><b>Do porão ao canteiro:</b> <b>C</b>al no porão (o crime) → <b>C</b>asa em ruínas → <b>C</b>ravos no quintal → <b>C</b>onfissão recusada → <b>C</b>onsciência “tranquila” na morte. Cinco C.</p>`,
q:{p:'Na velhice, Celestino não se sente no mar onde navegou, mas num “mar outro, sem homens e sem tempo”. a) Compare sua atitude diante da violência na juventude com seu estado na velhice. b) Explique a relação simbólica entre o navio e a casa.',
a:['Jovem, Celestino é frio: manda sufocar com cal os africanos revoltados no porão e, depois do massacre, olha o horizonte e respira a maresia, sem olhar os mortos. Velho, vive em tormento: delira, esquece, sonha de olhos abertos e o corpo repete gestos de marinheiro.','Ele não sente culpa explícita, mas o passado volta em fantasmas e lembranças. A casa, na tempestade, parece um navio à deriva e até um porão de escravos.','Na tempestade, o silêncio do porão é trocado pelo barulho dos trovões, que despertam a “arte antiga” guardada sob a pele. O “mar outro” (o quintal) é o espaço da consciência e do isolamento, onde ele é obrigado a confrontar a própria história: a casa repete o navio, e o crime continua presente.']},
ap:`<p><b>Raul Brandão</b> (1867–1930), autor de <i>Os pescadores</i> e <i>Húmus</i>. Seu Celestino é lembrado com simpatia, quase como um santo jardineiro. Djaimilia lê o trecho a contrapelo: o que era um detalhe pitoresco vira o centro de uma reflexão sobre a violência colonial e sua impunidade.</p>
<p><b>Portugal e a escravidão:</b> Portugal foi um dos maiores traficantes de africanos escravizados do Atlântico, e o tráfico seguiu mesmo depois de proibido. O romance mostra como essa história foi esquecida em casa, entre flores.</p>
<p><b>Cenas secundárias úteis:</b> o pires de doces deixado no muro para as crianças; o peixe que o padre lhe dá no Natal e apodrece esquecido; Celestino mostrando às crianças o corpo tatuado como um mapa; a noite de São João em que se perde na multidão; a gata que dá cria e o emociona como se fossem filhos.</p>`,
cx:['<b>Balada de amor ao vento:</b> o porão do navio e a deportação de africanos pelo mar.','<b>Opúsculo e Nebulosas:</b> a escravidão vista no século XIX por autoras brasileiras; aqui, a memória dela vista do século XXI.','<b>Geografia:</b> Sophia celebra os navegadores; Djaimilia mostra o que ia no porão.','<b>A paixão segundo G. H.:</b> a vida não humana (plantas, barata) que não julga e desmonta o humano.'],
aq:{p:'Por que o romance se chama “A visão das plantas”?',
a:['O título aponta para um ponto de vista não humano: o modo como as plantas veem o jardineiro.','O narrador diz que as plantas não agradecem nem julgam Celestino: tratam o regador como chuva e são da mesma seiva sem piedade que ele. Elas florescem sobre um passado de mortes.','Assim, o título sugere uma natureza indiferente à moral humana, o que torna mais incômoda a impunidade de Celestino: ninguém o julga, nem as flores, nem a vila, nem o padre.']},
cards:[['De que texto parte A visão das plantas?','De um parágrafo de Raul Brandão, Os pescadores (1923), sobre o capitão Celestino.'],['Qual foi o crime de Celestino?','Sufocou com cal, no porão do navio negreiro, uma revolta de africanos escravizados.'],['O que Celestino faz na velhice?','Cultiva com obsessão o jardim da casa da família, na rua dos choupos.'],['Celestino se confessa ao padre?','Não. Recusa e morre sem uma dúvida na consciência.'],['Que fantasmas o visitam?','Uma menina holandesa vendada e uma velha escrava que ele lançou ao mar.'],['O que acontece com as plantas nas mãos do padre Alfredo?','Morrem.'],['O que é o “mar outro”?','O quintal, sentido como um mar sem homens e sem tempo: espaço da consciência e do isolamento, onde ele confronta a própria história.'],['Qual a nacionalidade de Djaimilia?','Nasceu em Angola e vive e escreve em Portugal.']],
cola:'Celestino, ex-negreiro que matou escravizados com cal, volta velho a Portugal e vira jardineiro. Recusa confissão, é visitado por fantasmas e morre sem culpa. Reescreve Raul Brandão; plantas que não julgam; casa como navio.'});

BOOKS.push({id:'martha',short:'Martha',e:'🏚️',c:'#9C4A26',t:'Memórias de Martha',a:'Júlia Lopes de Almeida',y:1899,per:'Realismo e Naturalismo; romance de formação feminino',
idt:`<p><b>Júlia Lopes de Almeida</b> (1862–1934), carioca, romancista e cronista de grande sucesso. Ajudou a idealizar a Academia Brasileira de Letras, mas seu nome, que constava de uma lista extraoficial de fundadores, foi retirado por ser mulher; o marido, o poeta Filinto de Almeida, ficou entre os fundadores. Outra obra: <i>A falência</i> (1901).</p>
<p><b>O livro (1899):</b> Martha, já adulta, conta sua infância e juventude: a morte do pai, a pobreza num cortiço do Rio, a escola, as paixões e a conquista de uma profissão. É um romance de formação: acompanha o crescimento de uma menina até a vida adulta.</p>
<p><b>Contexto:</b> Rio de Janeiro do fim do século XIX: cortiços, epidemias, higienismo, e o magistério como uma das poucas profissões respeitáveis para mulheres. O mesmo tempo de <i>O Cortiço</i> (1890), de Aluísio Azevedo.</p>`,
cenas:[
['A queda','Aos cinco anos, Martha vê o pai morto e a família despejada. Mãe e filha vão morar num cortiço em São Cristóvão. A mãe, viúva e doente, engoma roupa para fora o dia inteiro.'],
['O cortiço','Vizinha bruta (uma ilhoa, açoriana), crianças doentes e humilhadas: Carolina, boa e de pernas inchadas pela umidade, e o irmão Maneco, frágil. Brigas, epidemias de difteria e sarampo. Na casa rica de Lucinda, Martha ganha um vestido encarnado usado e é chamada de macaquinho.'],
['A escola e Mathilde','Na escola pública da professora D. Anninha, Martha é ajudada por Mathilde, colega mulata e pobre. Mathilde é acusada de roubo e excluída; Martha a abandona como todas as outras, e trinta e tantos anos depois ainda sente essa culpa como uma mancha.'],
['O segredo do pai','A mãe revela: o pai, caixeiro-viajante, foi roubado do dinheiro dos patrões, ninguém acreditou nele e ele se envenenou para não ser preso. Por isso elas vivem no cortiço: são a viúva e a filha de um “ladrão”. Martha sonha ficar rica para pagar a dívida.'],

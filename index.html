perto:[
['1. A queima das roupas das mulheres (início do livro)','<p><b>O que acontece.</b> Um mês depois de voltar, Celestino se livra dos móveis velhos (ficam duas cadeiras, a mesa, o camiseiro e os retratos). Abre as arcas das mulheres da casa, cava uma vala, joga nela vestidos, roupa de cama, xales e toucas e põe fogo. Rendas e bordados queimam. Ele dorme na cama em que a mãe morreu sem notícias dele e não sente saudade.</p><p><b>Como está escrito.</b> <b>Enumeração</b> longa, em assíndeto, que acumula a vida doméstica de gerações (do cueiro do bebê à touca da velha). Logo depois, o narrador diz que não houve drama nenhum: contraste entre o tamanho do que se destrói e a frieza do gesto.</p><p><b>O que significa.</b> Apaga o <b>trabalho feminino</b> (os lavores das mulheres que ficavam em terra) e a memória da mãe. Duas ligações que valem ponto: menino, ele <b>sonhava</b> ser dono da casa e queimar as roupas das mulheres (na história que conta às crianças); velho, diz ao padre que ainda guarda a <b>queimadura</b> da fogueira da roupa da mãe. O gesto frio deixou marca.</p><p><b>Como cairia.</b> Já caiu na 1ª fase 2027 (enumeração + destruição = apagamento do trabalho). Na 2ª fase: ligar a queima à mãe e à infância, à condição feminina ou ao despojamento de G. H.</p>'],
['2. O padre Alfredo: da confissão à cobiça (do início ao fim)','<p><b>O que acontece.</b> Na primeira visita, o padre vem pregar e se cala diante das rosas; quer levar Celestino a confessar-se, lembrando a mãe dele. Na igreja, o capitão se senta, mas não se ajoelha, e finge não entender a oferta de escuta. Mais tarde, quando o padre diz que nunca é tarde, ele responde falando de ameixas e compara Deus a um caroço de pêssego venenoso. Doente, com febre, recusa a confissão balançando a cabeça com força. O peixe que o padre lhe dá no Natal apodrece esquecido. No fim, o padre benze o corpo, chama-o de “meu pequeno pirata” e olha o jardim com cobiça; nas mãos dele, todas as plantas morriam.</p><p><b>Como está escrito.</b> Diálogos desencontrados: o padre fala de alma, Celestino responde com jardinagem. <b>Ironia</b> final: as mãos piedosas do padre matam as plantas; as mãos de assassino de Celestino as fazem florir.</p><p><b>O que significa.</b> A confissão seria o caminho da culpa ao perdão, e Celestino o recusa até o fim. A Igreja não nomeia o crime (sozinho com ele, o padre não ousa falar do passado) e acaba interessada no jardim. Não há castigo nem redenção.</p><p><b>Como cairia.</b> Ausência de remorso; ironia do desfecho; religião e culpa.</p>'],
['3. O espantalho e a vila: medo e fascínio','<p><b>O que acontece.</b> A vila recebe o velho de pala com boatos cada vez mais absurdos (cortou cabeças, queimou um elefante no Congo, ou um bisonte em Salvador). Ele faz um espantalho com o veludo das cortinas da sala; a vizinha o toma por fantasma e conta ao padre que o capitão adora o diabo e fala a língua dos pretos. As avós ameaçam os netos com ele. Mas o cheiro de rosas e jasmim atrai todos, e quem espia pela hera vê ali a vida que não viveu: viagens, florestas, desejos de sangue. As crianças Raul, Pedro e Luzia acham no muro um pires com marmelada e queijo.</p><p><b>Como está escrito.</b> Vozes da vila em <b>discurso indireto livre</b>, sem aspas; <b>hipérboles</b> dos rumores; imagens de olhar através (sebes, hera, frestas): a vila vê sombra, nunca o homem.</p><p><b>O que significa.</b> A vila teme o diabo e a magia, não o crime contra africanos, que ninguém lamenta. Numa terra de homens do mar, histórias terríveis se dissolvem no cotidiano; no fim, os rumores viram cantigas de pescadores e ele, um herói distante. É assim que a memória portuguesa transforma o tráfico em lenda, como faz o parágrafo de Raul Brandão.</p><p><b>Como cairia.</b> Espaço (dentro e fora do muro); memória coletiva e esquecimento; texto externo sobre memória colonial.</p>'],
['4. A cantilena às crianças: infância, mãe e crimes','<p><b>O que acontece.</b> Celestino chama os meninos e conta: a mãe e as tias bordavam, o pai, capitão Nuno, morreu no mar, ele tinha medo à noite. Partiu para a África; na febre, holandeses e uma menina cuidaram dele; ele os degolou e deixou a menina <b>vendada, amarrada a um tronco</b>. Segue a lista: matou bichos, dez mulheres, centenas de homens, um amigo, um albino. Fecha com a mãe trazendo leite morno na hora de dormir. As crianças, comendo amoras, pedem mais sangue; a vizinha ouve e reza a noite toda. Mais tarde, ao mostrar as tatuagens, ele repete a mesma fala, quase palavra por palavra.</p><p><b>Como está escrito.</b> Imita a fala bíblica (Jesus chamando as crianças) e a <b>canção de ninar</b>. <b>Enumeração</b> e <b>anáfora</b> do verbo matar; <b>antítese</b> entre o horror do conteúdo e a doçura da forma (amoras, leite, melodia).</p><p><b>O que significa.</b> A doçura da infância portuguesa e a violência na África saem da mesma boca, no mesmo tom. O crime vira doce para crianças: é <b>naturalizado</b> e passado adiante como aventura.</p><p><b>Como cairia.</b> Infância e mãe; comparação com a cantiga de ninar de <i>Canção para ninar menino grande</i>; com o <i>Opúsculo</i> (crianças e escravidão).</p>'],
['5. Os fragmentos: “sangue e luz”','<p><b>O que acontece.</b> Quatro séries de anotações em 1ª pessoa, separadas por travessões (em itálico no original), cortam a narração. Misturam horta (sementes de Espinho, dálias, cravos), vila (o barbeiro, a vizinha com bolo), mortes do passado (a menina holandesa, “Rota da Índia”, a data 1833, uma madrugada “feliz” com vinte e três mortos em volta da fogueira) e vontades de matar (o padre, um mendigo, uma fornada de pão envenenada). No fim, o caderno vira sílabas que ele não entende.</p><p><b>Como está escrito.</b> Frases nominais curtíssimas, <b>assíndeto</b>, sem ligação entre uma linha e outra. O refrão “sangue e luz” volta como tique: <b>repetição</b> que funciona como sintoma.</p><p><b>O que significa.</b> É a única voz direta de Celestino sobre o passado sem plateia, e mesmo aí não há culpa: o crime aparece ao lado do feijão de debulhar, no mesmo nível. A forma quebrada imita a memória que volta sem virar arrependimento; a letra que se desfaz acompanha a dissolução do homem.</p><p><b>Como cairia.</b> Foco narrativo (3ª pessoa e fragmentos em 1ª); recurso da repetição; memória sem remorso.</p>'],
['6. A visão das plantas e a cal no porão (cerca de um terço do livro)','<p><b>O que acontece.</b> O narrador passa ao ponto de vista das plantas: elas veem o jardineiro como veem a chuva, não agradecem, não sentem falta, não julgam; tanto lhes faz serem cuidadas por um assassino. Se ele morrer, “alforriadas”, invadirão a casa. Nenhuma flor lamenta os escravos, e então vem o massacre: os homens despejam a cal no porão, Celestino fecha a porta, há gemidos e depois silêncio; morrem os sessenta e poucos africanos que restavam da revolta; ele sorri, vai à proa sem olhar os mortos e respira a maresia. Fecho: ele e as plantas são da mesma seiva sem piedade; no lugar do coração, ele tem uma planta.</p><p><b>Como está escrito.</b> <b>Prosopopeia</b> (as plantas olham e vigiam); <b>comparações</b> (como um olho de vidro vê as nuvens); <b>anáfora</b> de “tanto lhes fazia”; o massacre em frases curtas e objetivas, sem adjetivos de condenação. “Alforriadas” aplica às plantas a palavra da escravidão.</p><p><b>O que significa.</b> É a origem do título: o olhar <b>sem julgamento</b> da natureza. O crime aparece no meio do capítulo das flores para mostrar que nada no mundo natural o pune. A indiferença das plantas espelha a de Celestino e a da sociedade que nunca o julgou: o leitor fica sozinho com o julgamento.</p><p><b>Como cairia.</b> Título; foco narrativo; natureza indiferente contra a natureza romântica (<i>Nebulosas</i>); comparação com a barata de G. H.</p>'],
['7. A floresta e o móvel de mogno (meio do livro)','<p><b>O que acontece.</b> Em delírio, Celestino volta à floresta africana, abrindo caminho a faca, querendo ser engolido por ela, mas Deus não o engole. A narração salta para os retratos dos avós (o avô morreu no mar) e para o <b>camiseiro de mogno vindo do Pará</b>, encomendado pela mãe: o carpinteiro sente a floresta pulsar na madeira; os troncos cruzaram o mar deitados como nem aos homens se permitia; a mãe, viúva e sozinha, limpa o móvel sem saber que ele conta a história do filho.</p><p><b>Como está escrito.</b> <b>Metáforas</b> fortes (a floresta = estômago de Deus; a mata = tecido de séculos que ele rasga com as pernas); <b>prosopopeia</b> da madeira que conta histórias; salto brusco entre África e Portugal.</p><p><b>O que significa.</b> O conforto da casa portuguesa é feito de matéria colonial: o móvel da mãe é floresta arrancada e transportada pelo mar, como os africanos no porão. A mãe representa a inocência doméstica que convive, sem ver, com a violência que a sustenta.</p><p><b>Como cairia.</b> Colonialismo e casa; a mãe; texto externo sobre comércio colonial.</p>'],
['8. A cova e o espelho','<p><b>O que acontece.</b> Vendo um brilho num canteiro, Celestino cava com a pá até a noite, sem conseguir parar, destruindo o canteiro. Não há tesouro nem cadáver, só terra. Cai de costas, olha as estrelas e desmaia. No dia seguinte acorda mais velho e mais cego; olha-se no espelho pela primeira vez em anos, corta a barba, esquece a pala e, na porta, sob a chuva, vive seu último momento “ao leme”.</p><p><b>Como está escrito.</b> <b>Repetição</b> e <b>gradação</b> (cavou, cavou, mais fundo) que imitam o ritmo da pá; frases que negam (nem segredo, nem saudade, nem lamento).</p><p><b>O que significa.</b> É o mais perto que o livro chega de um exame de consciência, e ele sai vazio: Celestino cava como quem procura o passado enterrado, mas a terra não devolve culpa. A cena marca a virada para a decadência e anuncia a sepultura; sem barba e sem pala, desmonta-se a figura lendária do pirata de Brandão.</p><p><b>Como cairia.</b> Transformação do personagem; símbolos (cova, espelho, barba, pala); recurso da repetição.</p>'],
['9. As tatuagens e o “supremo castigo”','<p><b>O que acontece.</b> Às crianças, Celestino mostra o peito tatuado (caveira, cruz de ossos, uma mulher, um facão, um veleiro, nomes e datas) e repete a lista de crimes. Percebe o espanto misturado com nojo do corpo velho e se cala. Pensa que a vida não lhe deu a nobreza de morrer jovem e que o jardim o domesticou, o enjaulou. O narrador chama isso de supremo castigo: ele se deixou <b>escravizar</b> pelo cuidado com as flores, cuja revolta foi silenciosa; foi ele mesmo quem se acorrentou.</p><p><b>Como está escrito.</b> O corpo como <b>mapa</b> e testamento da viagem (metáfora). <b>Ironia</b>: o traficante fica “cativo” do jardim; as plantas fazem uma revolta que vence, ao contrário da revolta no porão.</p><p><b>O que significa.</b> É o único “castigo” do livro, e é irônico e brando: nenhuma justiça humana, só a prisão afetiva a um jardim. A inversão de senhor e escravo não repara nada; o leitor percebe a ironia, Celestino não a transforma em culpa.</p><p><b>Como cairia.</b> Ironia e metáfora; “Celestino é punido?”; comparação com obras sobre escravidão.</p>'],
['10. Relâmpagos, fantasmas e morte (último quarto)','<p><b>O que acontece.</b> O esquecimento avança. Sonâmbulo, Celestino encontra na cozinha uma <b>velha negra</b> que lhe serve comida; depois ela aparece de dia, lava-o, segue-o pela floresta e o leva no colo para casa, adiando a morte. A <b>menina holandesa</b>, vendada, dorme no peito dele como uma neta. Nos relâmpagos do último outono, a casa parece porão de navio negreiro à deriva, os braços dele fazem gestos de marinhar e, no quintal, ele se sente num <b>mar outro, sem homens e sem tempo</b>. Revê o porão e a velha negra jogada ao mar e atira farinha nas flores, numa dança dos mortos. Manuel o leva à praia, onde ele vê a menina sair da água. Morre numa noite de inverno, sem uma dúvida na consciência.</p><p><b>Como está escrito.</b> Real e alucinação sem fronteira. <b>Antítese</b>: as vítimas aparecem como amas e anjos sem rancor; a velha negra é chamada de “mãe morte”. A venda que ele não consegue desatar é <b>símbolo</b>: não pode ver os olhos da menina nem ser visto por ela, e por isso não pode curar-se. A última frase repete Brandão.</p><p><b>O que significa.</b> As vítimas voltam não para vingar, mas para cuidar: de novo, o trabalho de mulheres (uma delas escravizada) serve a ele. A casa como porão mostra o passado guardado sob a pele (leitura oficial: <b>tormento</b> e espaço da <b>consciência</b>). Repetida no fim, a “consciência tranquila” de Brandão vira ironia e horror.</p><p><b>Como cairia.</b> Já caiu (relâmpagos, Fuvest 2026). Novos ângulos: os fantasmas como cuidadoras; a venda; o desfecho circular.</p>']
],
critica:'<p><b>De onde vem o livro.</b> Djaimilia Pereira de Almeida (Luanda, 1982; cresceu em Portugal; doutora em teoria da literatura pela Universidade de Lisboa) parte de um parágrafo de <i>Os pescadores</i> (1923), de <b>Raul Brandão</b> (1867–1930), escritor nascido na Foz do Douro. Ali, o narrador lembra o capitão Celestino, que começou pirata e acabou “como um santo”, cultivando cravos; o massacre com cal no porão aparece como boato, e o que ele diz saber com certeza é que ninguém fazia alporques de cravos como ele. O romance inverte essa hierarquia: põe o crime no centro e termina com a mesma frase de Brandão (morreu sem uma dúvida na consciência), agora irônica.</p><p><b>Prêmios e edições.</b> Edição portuguesa: Relógio D’Água, 2019. No Brasil: Todavia, 2021, com a grafia de Portugal (por isso “facto”, “acção”, “xailes”). Ficou em <b>2º lugar no Prêmio Oceanos 2020</b> (o 1º foi <i>Torto arado</i>); a autora já tinha vencido o Oceanos 2019 com <i>Luanda, Lisboa, Paraíso</i>.</p><p><b>Contexto histórico.</b> Portugal proibiu por decreto a exportação de escravizados em 1836, sob pressão inglesa, mas o tráfico continuou ilegalmente; em 1842 os dois países fizeram acordo para aboli-lo. No romance, um fragmento traz a data 1833 e a “Rota da Índia”, e a epígrafe fala de africanos levados para o Brasil. A velhice de Celestino se passa no fim do século XIX (“vem aí o novo século”).</p><p><b>O que a crítica diz.</b></p><ul><li><b>Mônica Genelhu Fagundes</b> (“Paisagem com a queda de Celestino”, revista <i>Metamorfoses</i>, UFRJ, 2022) lê o livro com o ensaio “A nau de Ícaro”, de Eduardo Lourenço, e a tela <i>Paisagem com a queda de Ícaro</i>, atribuída a Bruegel, em que a paisagem segue indiferente à queda.</li><li><b>Nicola Biasio</b> (revista <i>Abril</i>, 2021) faz leitura <b>ecocrítica</b> e descolonizadora, com foco na <b>culpa</b>.</li><li><b>Sandra Sousa</b> (“Ecocumplicidade em A visão das plantas”, Universidade do Minho) discute Biasio e recusa ver no livro uma conciliação entre dominador e dominado.</li><li><b>Cristina Arena Forli e Gustavo Rückert</b> (“O que fazer com o passado colonial?”, <i>Via Atlântica</i>, USP, 2025) tratam da memória colonial portuguesa.</li></ul><p><i>Esses estudos foram localizados por busca; não foi possível abrir os textos completos.</i></p><p><b>Três eixos para a prova.</b> (1) <b>Reescrita pós-colonial</b> de um clássico que tratou o massacre como detalhe. (2) <b>Ecocrítica</b>: as plantas como olhar não humano, indiferente ou cúmplice. (3) <b>Memória e culpa</b>: não há confissão, castigo nem redenção; o julgamento fica com o leitor.</p><p><b>Como a Fuvest já leu o livro.</b> <b>2ª fase 2026 (Q4):</b> a resposta oficial pede, na juventude, frieza calculada (o silêncio depois do massacre, o olhar no horizonte); na velhice, <b>tormento</b> (os trovões, a casa como porão de navio à deriva); a casa como <b>projeção do passado traumático</b>; o “mar outro, sem homens e sem tempo” como espaço da <b>consciência e do isolamento</b>, onde ele é forçado a confrontar a própria história. <b>1ª fase 2027 (Q80, gabarito A):</b> na queima das roupas das mulheres, a enumeração somada à destruição cria acumulação e liga a queima ao <b>apagamento do trabalho</b> que os objetos representam.</p><p><b>Escola.</b> Confirma o contemporâneo pós-colonial (revisão da história, intertexto, fragmentos, memória). Rompe com a denúncia direta: o foco é o perpetrador, as vítimas não falam e o narrador quase não julga (embora chame Celestino de “monstro” uma vez). Rompe com o Romantismo: a natureza não espelha nem consola o eu, é indiferente.</p>',
qbank:[
{p:'(Texto externo: Raul Brandão) Na epígrafe, tirada de <i>Os pescadores</i> (1923), o narrador diz que o capitão Celestino começou a vida como pirata e a acabou “como um santo”, que dele se diziam coisas piores, mas que o que sabia com exatidão é que ninguém o igualava nos alporques de cravos; e termina dizendo que morreu “sem uma dúvida na consciência tranquila”. a) Que lugar o massacre ocupa no texto de Brandão? b) Como o romance reescreve esse texto, sobretudo no desfecho?',a:['Em Brandão, o massacre com cal é um boato secundário e o centro é a admiração pelo jardineiro “santo”; Djaimilia inverte essa hierarquia e põe o crime no centro.','O romance narra o massacre em detalhe (a cal, a porta fechada por Celestino, os sessenta e poucos mortos, o sorriso e o olhar no horizonte) e termina com a mesma frase de Brandão, depois que o leitor viu a confissão recusada, os fantasmas das vítimas e os rumores virando cantigas de pescadores.','A repetição literal da frase final cria ironia: o que em Brandão era elogio vira sinal de horror diante da impunidade, e o livro mostra como a memória portuguesa transformou o tráfico em lenda pitoresca.']},
{p:'(Imagem descrita) A tela <i>Paisagem com a queda de Ícaro</i>, atribuída a Pieter Bruegel, o Velho, mostra em primeiro plano um lavrador arando, um pastor e um pescador; um navio segue viagem; num canto, quase invisíveis, as pernas de Ícaro afundam no mar, e ninguém nota. A crítica Mônica Genelhu Fagundes usa a tela para ler o romance. a) Que relação há entre a tela e o olhar das plantas? b) Quem, além das plantas, mantém essa indiferença?',a:['Como a paisagem de Bruegel, que segue seu curso diante da queda, as plantas olham Celestino sem julgamento: tanto lhes faz serem cuidadas por um assassino.','O narrador diz que elas tratam o regador como chuva, não lamentam os escravos sufocados com cal e, no fim, nem sabem que o amigo morreu; a vila também segue a vida: os rumores se dissolvem nas novidades, o padre não ousa falar do passado e a memória do capitão vira cantiga de pescadores.','A indiferença da paisagem, na tela e no livro, não absolve: ela deixa ao leitor a tarefa de ver a queda, isto é, o crime colonial que ninguém em volta quis ver.']},
{p:'(Texto externo: história) Em 1836, um decreto do governo português proibiu a exportação de escravizados de seus territórios, sob pressão britânica; historiadores mostram que o tráfico continuou ilegalmente nos anos seguintes. a) Que indícios do romance ligam Celestino a esse comércio? b) Como o romance mostra a relação de Portugal com essa memória?',a:['O passado de Celestino é o tráfico atlântico: a epígrafe diz que ele levava africanos para vender no Brasil, e os fragmentos de diário trazem a data 1833 e a “Rota da Índia”.','A vila conhece as histórias, mas as transforma em boatos sobre diabo e magia, em ameaça para crianças e, no fim, em cantigas de pescadores sobre um herói distante; o padre quer confissão, mas nunca fala do crime; até o móvel de mogno da mãe veio do Pará, atravessando o mar.','O romance mostra uma sociedade que conviveu com o tráfico e o converteu em lenda e esquecimento, em vez de responsabilidade, o contrário do que a proibição legal deveria significar.']},
{p:'(Comparação: G. H.) Em <i>A paixão segundo G. H.</i>, a narradora, diante da barata, vive uma experiência de despojamento do humano. a) Compare o contato com o não humano nas duas obras. b) Compare o resultado dessa experiência para G. H. e para Celestino.',a:['Nas duas obras, um ser não humano (a barata, as plantas) aparece como vida neutra, sem moral, que não julga; e as duas começam despojando a casa: G. H. quer limpar o quarto de Janair, Celestino se livra dos móveis e queima as roupas das mulheres.','G. H. se transforma: perde a identidade social, prova a massa da barata e sai mudada; Celestino, ao contrário, se reconhece da mesma seiva sem piedade das plantas e não muda: recusa a confissão, e o despojamento final (sem barba, sem pala, sem memória) é decadência, não revelação.','O não humano desmonta G. H. e a obriga a ver o outro (Janair); em Celestino, só confirma a indiferença, e ele morre sem uma dúvida na consciência.']},
{p:'(Comparação: Opúsculo humanitário) Nísia Floresta critica a criação de crianças brancas entre escravizados, que naturaliza a escravidão e deforma a formação moral (a menina que maltrata a ama que a amamentou). a) Que cena do romance mostra a naturalização da violência diante de crianças? b) Compare o papel das mulheres negras nas duas obras.',a:['Em <i>A visão das plantas</i>, Celestino conta às crianças da vila, como cantiga doce, que matou mulheres, homens, um amigo e um albino; elas, comendo amoras, pedem mais sangue: a violência vira diversão e é naturalizada.','Em Nísia, a ama negra cuida e é maltratada; no romance, a velha negra que Celestino jogou ao mar volta como fantasma e cuida dele como ama (alimenta, lava, leva no colo), sem rancor, enquanto ele nunca se arrepende.','As duas obras mostram o cuidado de mulheres negras sustentando quem as violentou e denunciam uma formação moral que naturaliza a escravidão: Nísia em 1853, Djaimilia olhando esse passado do século XXI.']},
{p:'(Comparação: Geografia) Em <i>Geografia</i>, Sophia associa o mar à limpidez e à verdade, por contraste com a “noite” moral do regime salazarista. a) Como é o mar para Celestino? b) Compare o sentido do mar nas duas obras.',a:['Para Celestino o mar não é limpidez: ele o envernizou e o degradou, é o espaço do porão e do massacre; na velhice, volta como tormento (a casa vira porão à deriva) e, no quintal, como um mar outro, sem homens e sem tempo.','O narrador diz que o mar nunca lhe trouxe a vida; nos fragmentos ele não suporta o cheiro do mar e, ao fechar o olho, vê sangue; na praia, levado por Manuel perto da morte, vê a menina holandesa sair das águas.','Em Sophia, o mar é medida de verdade contra a opacidade do regime; em Djaimilia, o mar português é lugar de crime e de memória que retorna: as duas usam o mar para julgar Portugal, uma pela pureza, a outra pelo que ia no porão.']},
{p:'(Personagem e recurso) No início do romance, Celestino abre as arcas das mulheres, queima roupas e bordados numa vala, e o narrador comenta que não houve nisso drama nenhum. a) Identifique o recurso entre o gesto e o comentário e explique o efeito. b) Relacione a cena à infância e à mãe de Celestino, em outras partes do livro.',a:['Há contraste (antítese) entre a acumulação dos objetos destruídos e o comentário seco sobre a falta de drama: o narrador imita a frieza do personagem e faz o leitor sentir o peso que ele recusa.','Ao contar sua vida às crianças, Celestino lembra que a mãe e as tias bordavam e que ele, menino, sonhava ser dono da casa e queimar as roupas das mulheres; ao padre, diz ainda guardar a queimadura da fogueira da roupa da mãe, que morreu sem notícias dele, na cama em que ele agora dorme sem saudade.','A queima realiza um desejo infantil de poder e apaga o trabalho e a memória das mulheres da família; a queimadura lembrada mostra que o gesto frio deixou marca, como o passado que ele nunca confessa.']},
{p:'(Desfecho e polissemia) Na última cena, o padre Alfredo sai da casa do morto e a visão das plantas lhe parece uma aleluia; ele diz “meu pequeno pirata” com cobiça, e nas mãos dele todas as plantas morriam. a) Explique o duplo sentido da expressão que dá título ao livro nesse trecho. b) Explique o papel do padre no romance e a ironia do desfecho.',a:['“A visão das plantas” significa o olhar das plantas sobre Celestino (sem julgamento, como o narrador mostra no meio do livro) e também a visão que os outros têm delas: no fim, o jardim visto pelo padre como aleluia.','O padre tentou várias vezes levar Celestino à confissão, inclusive em nome da mãe dele, e foi recusado até no leito de febre; nunca falou do passado do pirata e agora cobiça o jardim, embora mate as plantas que toca.','A ironia opõe as mãos de assassino que fazem florir às mãos piedosas que matam: nem a religião julga nem redime Celestino, que morre sem uma dúvida na consciência, e a beleza do jardim sobrevive ao crime.']},
{p:'(Escola) Em <i>Nebulosas</i>, a natureza é extensão do eu romântico: reflete e consola a dor do sujeito. a) Como a natureza aparece em <i>A visão das plantas</i>? b) Em que o romance confirma e em que rompe com a literatura pós-colonial contemporânea?',a:['Em Djaimilia, a natureza não espelha nem consola: as plantas são indiferentes, tratam Celestino como tratam a chuva e nem sabem que ele morreu; o vento e as folhas não respondem ao desafio dele.','O romance confirma o pós-colonial ao reescrever Raul Brandão e expor o tráfico que Portugal esqueceu, com fragmentos, intertexto e memória; mas rompe com a denúncia direta, porque o foco é o perpetrador, as vítimas (a velha negra, a menina vendada) não falam e o narrador evita condenar.','Ao contrário da natureza romântica de Narcisa, confidente do eu, a natureza indiferente de Djaimilia obriga o leitor a fazer o julgamento que nem as plantas, nem a vila, nem o padre fazem.']},
{p:'(Figura típica) O narrador diz que, se Celestino morresse, as plantas, “alforriadas”, tomariam a casa; mais tarde, chama de “supremo castigo” o fato de ele ter se deixado escravizar pelo jardim, cuja revolta foi silenciosa. a) Identifique e explique o recurso. b) Por que esse castigo não equivale a punir o crime?',a:['É ironia construída por metáfora: palavras da escravidão (alforria, escravo, revolta, correntes) passam para a relação entre o jardineiro e as plantas, invertendo os papéis de senhor e escravo.','O traficante que sufocou com cal uma revolta no porão vê as plantas fazerem uma revolta silenciosa que vence: ele fica cativo do cuidado com elas e teme mais a destruição do jardim do que a própria morte.','O castigo é só simbólico e afetivo: Celestino não sente culpa, recusa a confissão e morre tranquilo, e a ironia mostra ao leitor que não houve justiça real para as vítimas.']}
]

<script>

 ['2026-12-02','qua 2/12',['questoes'],'Questões, dia 1','Contraponto: 3 objeções, escrever a melhor (10 min).'],

 ['2026-12-04','sex 4/12',['questoes','cruzar'],'Questões, dia 3, e cruzar obras','Norma: caçar 6 erros num parágrafo (10 min).'],
 ['2026-12-05','sáb 5/12',['cards','cola'],'Flashcards e a cola de uma tela','Véspera: tese e plano para um tema-palpite; checklist; episódio 26.'],
 ['2026-12-06','dom 6/12',['cola'],'Dia da prova: só a cola, com calma','Prova: marque a proposta escolhida na folha.']];
/* módulo de redação ligado à tarefa de cada dia do PLAN (só navegação) */
const PLAN_RED=['regras','tese','coletanea','prova','regras','coletanea','contraponto','contraponto','norma','prova','prova'];
let ST={done:{},cards:{}};
try{const r=localStorage.getItem('fuv27lit');if(r)ST=Object.assign(ST,JSON.parse(r));}catch(e){}
if(!ST.done||typeof ST.done!=='object')ST.done={};if(!ST.cards||typeof ST.cards!=='object')ST.cards={};
if(!ST.red||typeof ST.red!=='object')ST.red={};if(!ST.tab||typeof ST.tab!=='object')ST.tab={};
function save(){try{localStorage.setItem('fuv27lit',JSON.stringify(ST));}catch(e){}}
function isoToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayIdx(){const iso=isoToday();let i=PLAN.findIndex(p=>p[0]>=iso);if(i<0)i=PLAN.length-1;return i;}
function daysLeft(){const d=new Date();return Math.round((Date.UTC(2026,11,6)-Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function strip(s){return String(s).replace(/<[^>]+>/g,'');}
function tint(hex,a){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 'var(--surface2)';const n=parseInt(m[1],16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function lighten(hex,k){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return hex;const n=parseInt(m[1],16);const f=v=>Math.round(v+(255-v)*k);return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;}
function mods(){return [...(typeof REDACAO!=='undefined'?REDACAO:[])].sort((a,b)=>a.ord-b.ord);}
function modBy(id){return mods().find(m=>m.id===id);}

/* rotas */
const ROOTS={inicio:'Hoje',obras:'Obras',redacao:'Redação',treinar:'Treinar',cola:'Cola'};
const TOOLS={
 questoes:['🧩','Questões por dia','#2E7D4F'],cards:['🃏','Flashcards','#7A4AA8'],cruzar:['🔀','Cruzar obras','#B4421F'],
 figuras:['🔤','Figuras de linguagem','#2457C5'],escolas:['🏛️','Escolas literárias','#8A5300'],metodo:['🧭','Como responder','#1C7486']};
function info(r){
  if(ROOTS[r])return {tab:r,title:ROOTS[r],parent:null};
  if(BY[r])return {tab:'obras',title:BY[r].short,parent:'obras'};
  if(TOOLS[r])return {tab:'treinar',title:TOOLS[r][1],parent:'treinar'};
  if(r.indexOf('r-')===0&&modBy(r.slice(2)))return {tab:'redacao',title:modBy(r.slice(2)).t,parent:'redacao'};
  return null;
}
function label(r){const i=info(r);if(!i)return '';if(BY[r])return BY[r].e+' '+BY[r].t;if(TOOLS[r])return TOOLS[r][0]+' '+TOOLS[r][1];if(r.indexOf('r-')===0){const m=modBy(r.slice(2));return (m.ic||'✍️')+' '+m.t;}return i.title;}

/* blocos comuns */
function sec(id,title,inner,extra=''){return `<section class="card ${extra}" id="${id}"><div class="sechead"><h2>${title}</h2><button class="say" type="button" data-say="${id}" aria-pressed="false" aria-label="Ouvir: ${esc(strip(title))}"><span aria-hidden="true">▶</span></button></div><div class="body">${inner}</div></section>`;}
function qparts(t){return String(t).replace(/([?.:])\s+([a-e]\))\s/g,'$1<br>$2 ');}
function qa(q){return `<div class="qp q">${qparts(q.p)}</div><details class="qa"><summary><span class="try"><span class="o0">Tente antes →</span><span class="o1">Compare com a sua</span></span><span class="pill"><span class="o0">Ver resposta-modelo</span><span class="o1">Ocultar</span></span></summary><div class="in ans">${q.a.map((s,k)=>`<p><span class="st">${(q.l||['Afirme','Prove com a obra','Ligue ao enunciado'])[k]||''}</span>${s}</p>`).join('')}</div></details>`;}
function note(cls,lab,html){return `<div class="note ${cls}"><span class="lab">${lab}</span>${html}</div>`;}
function ph(eyebrow,title,sub){return `<header class="ph">${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:''}<h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</header>`;}
function itemLink(id,extra){
  if(BY[id]){const b=BY[id];return `<a class="big" href="#${id}"><span class="ic" style="background:${tint(b.c,.14)}">${b.e}</span><span class="tx"><b>${b.t}</b><small>${b.a} · ~10 min</small></span>${ST.done[id]?'<span class="ck" aria-label="estudada">✓</span>':'<span class="chev" aria-hidden="true">›</span>'}</a>`;}
  const t=id==='cola'?['📝','A cola de uma tela','#636366']:TOOLS[id];if(!t)return '';
  return `<a class="big" href="#${id}"><span class="ic" style="background:${tint(t[2],.14)}">${t[0]}</span><span class="tx"><b>${t[1]}</b>${extra?`<small>${extra}</small>`:''}</span><span class="chev" aria-hidden="true">›</span></a>`;
}
const SUBS={escolas:'Do Romantismo ao contemporâneo',figuras:'As que mais caem, com treino',questoes:'Seis por dia, com resposta-modelo',cruzar:'Pontes entre as obras',cards:'Revisão rápida',cola:'Uma linha por obra'};

/* HOJE */
function home(){
  const ti=todayIdx(),p=PLAN[ti],dl=daysLeft();
  const nd=ORDER.filter(id=>ST.done[id]).length,M=mods(),nr=M.filter(m=>ST.red[m.id]).length;
  let ds='';try{ds=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});ds=ds.charAt(0).toUpperCase()+ds.slice(1);}catch(e){}
  const sub=dl>1?`Prova: domingo, 6/12 (1º dia: Português e redação).`:dl===1?'A prova é <b>amanhã</b>. Revise a cola e descanse.':dl===0?'<b>Hoje é a prova.</b> Calma: só a cola.':'A prova já passou. O material continua aqui.';
  const L=ST.last&&ST.last.r&&info(ST.last.r)&&!ROOTS[ST.last.r]?ST.last:null;
  const lastTab=L&&BY[L.r]?({ficha:'Ficha',aprof:'Aprofundar',perto:'De perto',quest:'Questões'})[ST.tab[L.r]||'ficha']:'';
  const mid=PLAN_RED[ti],rm=modBy(mid);
  let h=ph(ds,'Hoje',sub);
  if(L)h+=`<a class="cont" href="#${L.r}" id="contBtn"><span class="tx"><small>Continuar de onde parei</small><b>${label(L.r)}${lastTab?' · '+lastTab:''}</b></span><span class="go" aria-hidden="true">›</span></a>`;
  h+=`<section class="card day"><span class="eyebrow">${p[1]} · dia ${ti+1} de ${PLAN.length}</span><h2>${p[3]}</h2>${p[2].map(id=>itemLink(id,SUBS[id])).join('')}
   ${p[4]?`<a class="redtask" href="#${rm?'r-'+mid:'redacao'}"><span class="ic" aria-hidden="true">✍️</span><span class="tx"><span class="eyebrow">Redação de hoje</span>${p[4]}${rm?`<br><span class="muted">Módulo: ${rm.t}</span>`:''}</span><span class="chev" aria-hidden="true">›</span></a>`:''}</section>`;
  h+=`<div class="stats"><div class="stat"><b>${nd}<small>/9</small></b><span>obras estudadas</span></div><div class="stat"><b>${nr}<small>/${M.length}</small></b><span>módulos de redação</span></div><div class="stat"><b>${Math.max(dl,0)}</b><span>${dl===1?'dia':'dias'} até a prova</span></div></div>`;
  h+=`<details class="disc"><summary><span>🗓️</span><span>Ver plano até a prova</span></summary><div class="in"><ol class="sched">${PLAN.map((q,i)=>`<li class="${i===ti?'now':i<ti?'past':''}"><span class="d">${q[1]}</span><span><b>${q[3]}</b>${q[4]?`<small>✍️ ${q[4]}</small>`:''}</span></li>`).join('')}</ol></div></details>`;

/* OBRAS */

  const nd=ORDER.filter(id=>ST.done[id]).length;

  `<ul class="list">${ORDER.map((id,i)=>{const b=BY[id];return `<li><a href="#${id}"><span class="ic" style="background:${tint(b.c,.14)}">${b.e}</span><span class="tx"><b>${b.t}</b><small>${b.a} · ${b.y}</small></span>${ST.done[id]?'<span class="ck" aria-label="estudada">✓</span>':'<span class="chev" aria-hidden="true">›</span>'}</a></li>`}).join('')}</ul>`+
  `<details class="disc"><summary><span>⏳</span><span>Linha do tempo da lista</span></summary><div class="in"><ul class="tl">${[...ORDER].sort((x,y)=>BY[x].y-BY[y].y).map(id=>{const b=BY[id];return `<li style="--c:${b.c}"><span class="yr">${b.y}</span><span>${b.e} <b>${b.t}</b><small>${b.per}</small></span></li>`}).join('')}</ul></div></details>`;
}
/* OBRA */
const TABS=[['ficha','Ficha'],['aprof','Aprofundar'],['perto','De perto'],['quest','Questões']];
function bookTab(id){const t=ST.tab[id];return TABS.some(x=>x[0]===t)?t:'ficha';}
function book(id){
  const b=BY[id],tab=bookTab(id);
  return `<header class="bhead"><span class="bico" style="background:${tint(b.c,.15)}">${b.e}</span><div><span class="eyebrow">${b.a} · ${b.y}</span><h1>${b.t}</h1><div class="bper">${b.per}</div></div></header>
  <div class="stick" id="stick"><div class="seg" role="tablist" aria-label="Partes da obra">${TABS.map(([k,l])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div>
  <div class="chips" id="chips" ${tab==='ficha'?'':'hidden'}>${FICHA_SECS.map(([s,l])=>`<button type="button" data-s="${s}"><span>${l}</span></button>`).join('')}</div></div>
  <div id="panel" role="tabpanel">${tabHTML(b,tab)}</div>`;
}
const FICHA_SECS=[['s-30','30 s'],['s-id','Identidade'],['s-en','Enredo'],['s-pe','Personagens'],['s-te','Técnica'],['s-tm','Temas'],['s-cai','O que cai'],['s-pg','Pegadinhas'],['s-mn','Mnemônico'],['s-q','Questão']];
function arcHTML(a){const k=a.indexOf(': ');const who=k>0&&k<40?a.slice(0,k):'';const rest=who?a.slice(k+2):a;const parts=rest.split('→').map(s=>s.trim());
  if(parts.length<2)return `<p>${a}</p>`;
  return `${who?`<span class="who">${who}</span>`:''}${parts.map((s,i)=>`<span class="step"><i aria-hidden="true">${i?'↓':'•'}</i><span>${i?'<span class="sr">depois: </span>':''}${s}</span></span>`).join('')}`;}
function tabHTML(b,tab){
  if(tab==='aprof')return `<p class="sub" style="margin:0 2px 14px">Opcional, cerca de +10 min: contexto, crítica e conexões para responder além da ficha.</p>`+
    sec('s-ap','Contexto e cenas secundárias',b.ap)+
    sec('s-cx','Conexões com outras obras',`<ul class="tight">${b.cx.map(x=>`<li>${x}</li>`).join('')}</ul>`)+
    (b.critica?sec('s-cr','Crítica e contexto',b.critica):'')+
    sec('s-aq','Mais uma questão',qa(b.aq))+nextBox(b,false);
  if(tab==='perto'){const P=b.perto||[];if(!P.length)return '<p class="sub">Sem leitura de perto para esta obra.</p>';
    return `<p class="sub" style="margin:0 2px 14px">${P.length} cenas ou poemas lidos de perto: o que acontece, como está escrito, o que significa e como cairia. Toque para abrir.</p>`+
    P.map((x,i)=>{const m=/^(\d+)\.\s*(.*)$/.exec(x[0]);const n=m?m[1]:i+1;let t=m?m[2]:x[0],w='';const pm=/\s*\(([^()]*)\)\s*$/.exec(t);if(pm){w=pm[1];t=t.slice(0,pm.index);}
      return `<details class="disc pp" id="pp${i}"><summary><span class="num">${n}</span><span class="pt">${t}${w?`<small>${w}</small>`:''}</span></summary><section class="in" id="s-pp${i}"><div class="sayrow"><button class="say" type="button" data-say="s-pp${i}" data-label="${esc(strip(t))}" aria-pressed="false" aria-label="Ouvir esta cena"><span aria-hidden="true">▶</span></button></div>${x[1]}</section></details>`;}).join('')+nextBox(b,false);}
  if(tab==='quest'){const L=[['Questão no estilo Fuvest',b.q],['Mais uma questão',b.aq],...(b.qbank||[]).map((q,i)=>['Banco de questões · '+(i+1),q])];

    L.map(([l,q],i)=>`<section class="card qcard"><span class="eyebrow">${i+1} de ${L.length} · ${l}</span>${qa(q)}</section>`).join('')+nextBox(b,false);}
  /* ficha */
  let n=0;

  let h=`<div class="ficha-top"><span class="meta">Ficha · cerca de 10 min</span><button class="btn sm ghost" type="button" data-sayall="#panel section.book">▶ Ouvir a ficha inteira</button></div>`;
  h+=`<section class="card book intro" id="s-30"><span class="eyebrow">Em 30 segundos</span><p class="lead">${b.cola}</p></section>`;
  h+=sec('s-id','Cartão de identidade',b.idt+note('mn','Escola literária em 30 segundos',`<p>${b.esc} <a href="#escolas">Ver as escolas →</a></p>`),'book');

  h+=sec('s-pe','Personagens',`<dl class="people">${b.pers.map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join('')}</dl>`,'book');

  h+=sec('s-cai','O que mais cai',b.cai,'book tone cai');
  h+=sec('s-pg','Pegadinhas',`<ul class="pegs">${b.peg.map(x=>`<li>${x}</li>`).join('')}</ul>`,'book tone peg');
  h+=sec('s-mn','Mnemônico',b.mn,'book tone mn');
  h+=sec('s-q','Questão no estilo Fuvest',qa(b.q),'book');

}
function nextBox(b,withDone){
  const i=ORDER.indexOf(b.id),nx=ORDER[i+1];

  else{const k=TABS.findIndex(t=>t[0]===bookTab(b.id));if(k<TABS.length-1)h+=`<button class="btn ghost wide" type="button" data-tab="${TABS[k+1][0]}">Ir para ${TABS[k+1][1]} →</button>`;}
  if(nx){const n=BY[nx];h+=`<a class="nextc" href="#${nx}" data-replace="1"><span class="ic" style="background:${tint(n.c,.15)}">${n.e}</span><span class="tx"><small>Próxima obra</small><b>${n.t}</b></span><span class="go" aria-hidden="true">→</span></a>`;}
  else h+=`<a class="nextc" href="#obras"><span class="ic" style="background:var(--surface2)">📚</span><span class="tx"><small>Fim da lista</small><b>Ver todas as obras</b></span><span class="go" aria-hidden="true">→</span></a>`;

}
/* TREINAR */
function treinar(){
  const nq=QDAYS.reduce((s,d)=>s+d.q.length,0),dk=deck(),miss=dk.filter(c=>ST.cards[c.f]===0).length;
  const row=(id,sub)=>{const t=TOOLS[id];return `<li><a href="#${id}"><span class="ic" style="background:${tint(t[2],.14)}">${t[0]}</span><span class="tx"><b>${t[1]}</b><small>${sub}</small></span><span class="chev" aria-hidden="true">›</span></a></li>`;};
  return ph('','Treinar','Pratique como na prova e revise a teoria que a Fuvest cobra.')+
  `<h2 class="grp-t eyebrow">Praticar</h2><ul class="list">${row('questoes',`${nq} questões em 3 dias, com resposta-modelo`)}${row('cards',`${dk.length} cartões${miss?` · ${miss} para revisar`:''}`)}${row('cruzar','Temas e narradores em comum entre as obras')}</ul>`+
  `<h2 class="grp-t eyebrow">Revisar a teoria</h2><ul class="list">${row('figuras','As figuras que mais caem e como explicar o efeito')}${row('escolas','Cada estilo de época e onde cada obra se encaixa')}${row('metodo','Como a Fuvest cobra e o método em 3 passos')}</ul>`;

}
let cf={f:'todas',i:0,list:[]};
function deck(){const all=[];BOOKS.forEach(b=>b.cards.forEach(c=>all.push({id:b.id,e:b.e,c:b.c,t:b.short,f:c[0],b:c[1]})));XCARDS.forEach(c=>all.push({id:'x',e:'🔀',c:'#636366',t:'Cruzadas',f:c[0],b:c[1]}));(typeof REDACAO!=='undefined'?REDACAO:[]).forEach(m=>(m.cards||[]).forEach(c=>all.push({id:'red',e:'✍️',c:'#8A5300',t:'Redação',f:c[0],b:c[1]})));return all;}
function cards(){
  const all=deck();cf.list=all.filter(c=>cf.f==='todas'||(cf.f==='dificeis'?ST.cards[c.f]===0:c.id===cf.f));if(cf.i>=cf.list.length)cf.i=0;
  const c=cf.list[cf.i],miss=all.filter(x=>ST.cards[x.f]===0).length;
  const opts=[['todas','Todos os cartões ('+all.length+')'],['dificeis','Só os que errei ('+miss+')'],...ORDER.map(id=>[id,BY[id].e+' '+BY[id].short]),['x','🔀 Cruzadas'],['red','✍️ Redação']].map(([v,l])=>`<option value="${v}" ${cf.f===v?'selected':''}>${l}</option>`).join('');
  return ph('','Flashcards','Tente lembrar antes de tocar no cartão. Marque se sabia: os que você errar vão para “Só os que errei”.')+

const GL={fig:{list:()=>typeof FIGDEF!=='undefined'?FIGDEF:[],cls:'fg',re:null},esc:{list:()=>typeof ESCDEF!=='undefined'?ESCDEF:[],cls:'es',re:null},red:{list:()=>typeof REDDEF!=='undefined'?REDDEF:[],cls:'rd',re:null}};

  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{if(!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;const p=n.parentElement;if(!p||p.closest(skip))return NodeFilter.FILTER_REJECT;re.lastIndex=0;return re.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});

    const box=k==='red'?(n.parentElement.closest('.rmod')||root):null;
    while((m=re.exec(s))){const i=glFind(k,m[1]);if(i<0)continue;
      if(box){if(!seen.has(box))seen.set(box,new Set());const S=seen.get(box);if(S.has(i))continue;S.add(i);}if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const b=document.createElement('span');b.setAttribute('role','button');b.tabIndex=0;b.className=cls;b.dataset.k=k;b.dataset.i=i;b.textContent=m[1];
      b.setAttribute('aria-label',m[1]+(k==='fig'?': ver o que é esta figura':k==='esc'?': ver o que é esta escola':': ver explicação'));frag.appendChild(b);last=m.index+m[1].length;}

$('#aaPop').addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;
  if(b.dataset.fs){uiSet('fuv27fs',b.dataset.fs);applyUI();}
  if(b.dataset.th){uiSet('fuv27theme',b.dataset.th==='auto'?null:b.dataset.th);applyUI();}});
document.addEventListener('click',()=>aaClose());
window.addEventListener('resize',()=>{watchTitle();spy();});
applyUI();
window.addEventListener('hashchange',render);render();

</script>
<div id="bkBox" style="max-width:760px;margin:24px auto 40px;padding:0 16px;font-family:system-ui,sans-serif;font-size:14px;color:#6b7280">
<p><b>Backup do progresso</b> (guarde o código no app Notas):</p>
<p><button id="bkCopy" type="button">Copiar meu progresso</button> <button id="bkRest" type="button">Restaurar</button> <span id="bkMsg"></span></p>
<p>Áudios: <a href="podcast.xml">podcast</a> (no app Podcasts: Biblioteca → Seguir um programa por URL).</p>
<p id="bkVer"></p>
</div>
<script>
(function(){
 var K='fuv27lit',msg=document.getElementById('bkMsg');
 function say(t){msg.textContent=t;setTimeout(function(){msg.textContent='';},4000);}
 document.getElementById('bkCopy').onclick=function(){
  var v='';try{v=localStorage.getItem(K)||'';}catch(e){}
  if(!v){say('Nenhum progresso salvo ainda.');return;}
  var c='FUV27:'+btoa(unescape(encodeURIComponent(v)));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(function(){say('Copiado. Cole no app Notas.');},function(){prompt('Copie o código:',c);});}
  else prompt('Copie o código:',c);
 };
 document.getElementById('bkRest').onclick=function(){
  var c=prompt('Cole o código do progresso (começa com FUV27:)');
  if(!c)return;c=c.trim();
  try{if(c.indexOf('FUV27:')!==0)throw 0;var v=decodeURIComponent(escape(atob(c.slice(6))));JSON.parse(v);localStorage.setItem(K,v);say('Restaurado. Recarregando…');setTimeout(function(){location.reload();},800);}
  catch(e){say('Código inválido.');}
 };
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
 document.getElementById('bkVer').textContent='Versão: 26/11/2026 16:03';
})();
</script>
</body>

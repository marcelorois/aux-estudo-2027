perto:[
['1. A terceira perna e a mão inventada (seção 1)','<p><b>O que acontece.</b> Antes de contar qualquer fato, G. H. diz que perdeu algo como uma terceira perna, que a deixava estável mas não a deixava andar. Tem medo de se reorganizar depressa numa nova mentira. Para conseguir falar, inventa uma mão que segura a sua.</p><p><b>Como está escrito.</b> Começa no meio de uma frase, depois de travessões. Frases que se corrigem, perguntas sem resposta, paradoxos (a covardia como a maior aventura). A <b>metáfora</b> da terceira perna resume o livro: a identidade social é uma prótese.</p><p><b>O que significa.</b> O livro tenta dar forma a uma experiência sem forma, sabendo que contar é trair o vivido. A mão inventada (apóstrofe a um “tu”) transforma o monólogo em diálogo.</p><p><b>Como cairia.</b> Identifique a metáfora e explique; por que o romance começa com travessões e no meio da frase.</p>'],
['2. À mesa do café: a vida entre aspas (seção 2)','<p><b>O que acontece.</b> G. H. se descreve: escultora amadora, solteira, sem filhos, independente, mora numa cobertura que vê como criação artística, faz bolinhas de miolo de pão e monta com elas uma pirâmide. Nas fotos, vê um sorriso sobre um vazio. Suas iniciais estão no couro das malas.</p><p><b>Como está escrito.</b> Autorretrato irônico, com imagens de cópia, citação e réplica: a casa e ela vivem entre aspas. As iniciais funcionam como <b>metonímia</b> de uma pessoa reduzida à marca.</p><p><b>O que significa.</b> É o retrato da pessoa organizada que vai desabar: ela é o que os outros veem nela. O nome reduzido a iniciais anuncia a perda do nome no final.</p><p><b>Como cairia.</b> Transformação da personagem (antes e depois); sentido do título e das iniciais.</p>'],
['3. O quarto e o mural de Janair (seção 4)','<p><b>O que acontece.</b> G. H. chama o quarto dos fundos de <i>bas-fond</i> da casa. Esperando sujeira, ela encontra o quarto de empregada limpo, branco, seco, iluminado como deserto, alto como um minarete. Na parede, o contorno a carvão de um homem, uma mulher e um cão, nus, rígidos, de mãos espalmadas. Ela demora a lembrar o nome e o rosto da empregada; percebe que Janair a odiava (ou que ela, sem olhar, a odiara) e que Janair foi a primeira pessoa de fora do seu meio cujo olhar ela sentiu.</p><p><b>Como está escrito.</b> Descrição minuciosa do traço; comparações com múmias e autômatos; Janair vista como uma rainha africana, estrangeira dentro da casa. O desenho não é enfeite: é escrita, mensagem.</p><p><b>O que significa.</b> Centro da leitura social: o quarto dos fundos, herança da casa-grande, guardava uma mulher negra que a patroa não via. O mural é o julgamento de quem nunca teve voz. Janair nunca fala, e seu nome só aparece nesta seção.</p><p><b>Como cairia.</b> É o excerto mais provável: relação patroa e empregada, classe e raça, espaço simbólico (sala × quarto dos fundos).</p>'],
['4. O plano de “limpar” o quarto (seções 3 e 4)','<p><b>O que acontece.</b> G. H. planejava deixar o quarto pronto para a próxima empregada. Diante do mural, decide jogar baldes de água até o deserto virar lama, raspar o carvão com faca, apagar as figuras e cobrir o colchão com um lençol seu, de <b>iniciais bordadas</b>. Imagina a foto do quarto já transformado em coisa sua e se alivia. Ela mesma diz que queria matar alguma coisa ali.</p><p><b>Como está escrito.</b> <b>Gradação</b> de violência (lavar, encharcar, apodrecer, raspar, apagar), em contraste com a calma de antes. Detalhe social: ela diz que arrumar é sua única vocação e que, se não fosse rica, seria arrumadeira em casa de ricos.</p><p><b>O que significa.</b> Arrumar vira apagar a marca da outra e reocupar o espaço com o próprio nome. Cuidado: é um plano imaginado contra o quarto e o desenho, não uma agressão a Janair, com quem a relação foi de indiferença e invisibilidade. Essa cólera desemboca no golpe contra a barata.</p><p><b>Como cairia.</b> A casa como espaço de poder; relação com o desfecho (quem queria impor suas iniciais termina sem nome).</p>'],
['5. O golpe e a cara da barata (seções 5 e 6)','<p><b>O que acontece.</b> Ao abrir o guarda-roupa, a barata se move junto ao rosto de G. H. Ela tropeça entre a cama e o armário e fica encurralada. Com uma alegria de matar, fecha a porta sobre a barata, mas sem força: a barata fica viva, presa pela cintura, erguida como uma cariátide. Quando ergue a mão para o golpe final, vê a cara da barata e <b>desiste</b>.</p><p><b>Como está escrito.</b> Tempo desacelerado: segundos ocupam páginas. Comparações fazem a barata antiquíssima (fóssil, lenda, anterior aos dinossauros) e quase humana (rosto, olhos de noiva). A última imagem da seção 6 abre a seção 7 (encadeamento).</p><p><b>O que significa.</b> Ver a cara do bicho é o ponto sem volta: ela deixa de olhar uma coisa nojenta e passa a ver uma vida que a olha. A barata continua viva quase até o fim.</p><p><b>Como cairia.</b> Epifania; tempo psicológico; símbolo da barata. Pegadinha: ela não esmaga a barata de uma vez.</p>'],
['6. A mulher gravada na parede (seção 8)','<p><b>O que acontece.</b> A massa branca começa a sair da barata. G. H. se manda gritar e não grita; sente que sai do seu mundo para entrar no mundo. Recua dentro de si até a parede e se sente a mulher do desenho, como uma pintura de caverna de milhares de anos.</p><p><b>Como está escrito.</b> Imagens de arqueologia e pré-história; paradoxos (um silêncio luxuoso, uma eternidade que é danação).</p><p><b>O que significa.</b> Inverte a cena do mural: antes ela queria raspar o retrato feito por Janair; agora se reconhece nele, despida de tudo. A experiência pessoal vira experiência da espécie. A identificação com a mulher da parede volta nas seções 15 e 23.</p><p><b>Como cairia.</b> Relação entre o mural e o desfecho; transformação da personagem.</p>'],
['7. O imundo, a Ave-Maria às avessas e o aborto (seções 10 e 14)','<p><b>O que acontece.</b> G. H. se sente impura como os animais que a Bíblia proíbe comer (ela cita o Levítico). Lembra-se grávida, andando pelas ruas antes de um aborto já combinado com um médico, olhando manequins de vitrine. Depois fala com a mãe: confessa ter matado uma vida e reza na forma da Ave-Maria, bendizendo a barata.</p><p><b>Como está escrito.</b> <b>Intertextualidade e paródia</b>: versículos e oração católica aplicados ao que é nojento. Apóstrofes ao médico e à mãe.</p><p><b>O que significa.</b> O sagrado é procurado no imundo. A barata (fêmea, presa pela cintura, de olhos como ovários) liga-se à maternidade negada: a vida neutra que pulsa sem pedir licença.</p><p><b>Como cairia.</b> Religião às avessas; título como paródia da Paixão; corpo feminino.</p>'],
['8. A janela: o Rio como ruína antiga (seção 18)','<p><b>O que acontece.</b> Depois de dormir no colchão, como uma barata parada na parede, G. H. vai à janela. Os telhados viram planaltos da Ásia Menor e deserto; ela vê a favela no morro, uma cabra subindo, gente como mercadores antigos. Imagina-se arqueóloga escavando o Rio de Janeiro, cidade de ouro e pedra com multidões de mendigos.</p><p><b>Como está escrito.</b> Metáfora prolongada (alegoria) da escavação; tempos misturados (o presente como pré-história do futuro); enumerações e números exagerados (<b>hipérbole</b>).</p><p><b>O que significa.</b> Tempo e espaço se deformam: o quarto é um minarete fora da história. A cena também mostra a cidade desigual que a cobertura dominava sem enxergar.</p><p><b>Como cairia.</b> Tempo psicológico; espaço simbólico; leitura social pela vista do alto.</p>'],
['9. O ato: vômito, vertigem, cuspe (seção 30)','<p><b>O que acontece.</b> G. H. entende que a redenção teria de estar na própria coisa: pôr na boca a massa branca, o que ela chama de antipecado. Avança, vomita o leite e o pão do café, fica simples como uma menina, avança de novo e perde a consciência numa <b>vertigem</b>; ao voltar, sabe que o gesto aconteceu. Cospe com fúria, lembrando o Apocalipse sobre os mornos, até perceber que está se renegando.</p><p><b>Como está escrito.</b> Gradação (passo a passo), suspense físico (suor, dentes cerrados) e <b>elipse</b>: o momento de comer não é narrado.</p><p><b>O que significa.</b> É a comunhão invertida (a massa como hóstia às avessas). Mas o ato some na vertigem: nem aqui ela toca a coisa sem transcender.</p><p><b>Como cairia.</b> Clímax; paródia religiosa; ordem dos fatos.</p>'],
['10. A desistência e o verbo adorar (seções 31 a 33)','<p><b>O que acontece.</b> G. H. conclui que não precisava ter comido a massa: buscara um gesto de santa, um acréscimo. Fala em despersonalização e em desistir como escolha; diz que a condição humana é a paixão de Cristo. Planeja até jantar e dançar naquela noite. Sente confiança, sente-se batizada pelo mundo, chama o gesto de <b>ato ínfimo</b> (não heroico), aceita que o mundo independe dela e que não entende o que diz. Termina com o verbo adorar, no presente, e travessões.</p><p><b>Como está escrito.</b> Paradoxos em série (quanto menos é, mais vive), ritmo de oração, linguagem que confessa o próprio fracasso.</p><p><b>O que significa.</b> O final não é compreensão, é entrega. A mulher das iniciais termina sem nome, uma mulher qualquer. Os travessões finais ecoam os iniciais: a experiência continua fora do livro.</p><p><b>Como cairia.</b> Desfecho; epifania; limites da linguagem; comparação com a abertura.</p>']
],
critica:'<p><b>Duas leituras, sempre juntas.</b> A crítica lê G. H. pelo lado existencial e místico (a perda do eu, o neutro, Deus achado no imundo) e, cada vez mais, pelo lado social (Janair, o quarto de empregada, classe e raça). A Fuvest usou as duas: na <b>1ª fase de 2027 (questão 16 da V1, gabarito B)</b>, partiu de um fotograma do teaser (2024) do filme de Luiz Fernando Carvalho, com a bandeira do Brasil colada à porta do quarto da empregada (detalhe que não está no livro), e da frase em que G. H. diz que, ao ir da sala para aquele quarto, estava perto da descoberta de um “império”. A correta: a bandeira indica que esse “império” revela as fraturas da ordem familiar e social da classe patronal brasileira; Clarice leva para dentro do apartamento o drama do privilégio e do servilismo. Segundo a resolução do Objetivo, o quarto de Janair, que a narradora chama de <i>bas-fond</i>, oposto à cobertura, é um microcosmo da desigualdade. Alternativas erradas diziam que G. H. foi violenta e autoritária com Janair (o livro mostra indiferença, não maus-tratos), que ela chega a compreender Janair ou que o quarto é primitivo e sujo (ele é limpo). Fontes: Fuvest 2027, 1ª fase, questão 16 (V1); resoluções do Curso Objetivo e de O Tempo. No simulado oficial de 2027, a correta sobre a barata falava em jornada de despojamento do humano e das máscaras sociais.</p>'+
'<p><b>Benedito Nunes</b> (filósofo e crítico): leu o livro como experiência mística às avessas (ensaio “A experiência mística de G. H.”, em <i>O mundo de Clarice Lispector</i>) e, em <i>O drama da linguagem</i> (1995), mostrou o “fracasso da linguagem” como motor da obra: a palavra só se aproxima do vivido quando falha.</p>'+
'<p><b>Olga de Sá</b>: em <i>A escritura de Clarice Lispector</i> (1979) criou a ideia de “(anti)epifania”, a revelação que desmonta em vez de iluminar; em <i>A travessia do oposto</i> (1993) leu G. H. como paródia séria da Paixão de Cristo (imitação com desvio, sem deboche).</p>'+
'<p><b>Antonio Candido</b>, no ensaio “No raiar de Clarice Lispector” (sobre <i>Perto do coração selvagem</i>, 1943–44), viu na estreante uma tentativa ambiciosa de renovar a linguagem do romance brasileiro. G. H. radicaliza esse projeto.</p>'+
'<p><b>Biografias:</b> Benjamin Moser, <i>Clarice, uma biografia</i> (2009), destaca a origem judaica e a busca mística; Nádia Battella Gotlib, <i>Clarice: uma vida que se conta</i> (1995). Outros estudos aproximam a náusea de G. H. à de Roquentin, em <i>A náusea</i>, de Sartre.</p>'+
'<p><b>Leitura social:</b> artigos recentes (Francisco Pires, 2019; Natália Felix Amaral e Ravel Paz, 2018; Ludmilla Carvalho Fonseca, 2018) leem Janair como a mulher negra silenciada pela soma de raça, classe e gênero, e o quarto dos fundos como herança doméstica da escravidão.</p>'+
'<p><b>O filme</b> (Luiz Fernando Carvalho; Maria Fernanda Cândido como G. H. e Samira Nancassa, de Guiné-Bissau, como Janair) estreou no Festival do Rio em 2023 e nos cinemas em 2024 (a Fuvest o cita como 2024, pelo teaser oficial).</p>'+
'<p><b>Contexto:</b> publicado em 1964, ano do golpe militar, sem tratar de política diretamente. A crítica social vem pelo avesso: a cobertura que domina a cidade e não vê a favela, a empregada negra invisível.</p>'+
'<p><b>Escola:</b> confirma a prosa intimista da 3ª fase do Modernismo (fluxo de consciência, tempo psicológico, epifania) e a leva ao extremo: quase não há enredo, a epifania destrói a identidade, o romance vira ensaio filosófico e a narradora discute a própria escrita.</p>',
qbank:[
{p:'(Texto externo: filme) No teaser oficial do filme <i>A paixão segundo G. H.</i> (Luiz Fernando Carvalho, 2024), um plano mostra a bandeira do Brasil colada à porta do quarto de empregada, detalhe que não existe no livro. No romance, G. H. começa a narrar aquela manhã dizendo que, ao sair da sala para o quarto da empregada, estava a um passo da descoberta de um império. a) Que leitura do romance a bandeira propõe? b) Que elementos do livro sustentam essa leitura?',a:['A bandeira propõe ler o “império” descoberto no quarto de empregada também como o Brasil: a relação entre G. H. e Janair expõe as fraturas da ordem social da classe patronal, feita de privilégio de um lado e servilismo do outro.','No livro, o quarto é o <i>bas-fond</i> da cobertura, nos fundos; G. H. não entrava lá havia seis meses, mal lembra o nome e o rosto da empregada negra e percebe que a tratava como se ela não tivesse presença; Janair deixa na parede um desenho que funciona como julgamento silencioso da patroa.','A bandeira torna explícito o que Clarice deixa implícito: o espaço doméstico herdado da escravidão é uma imagem do Brasil, e a crise de G. H. começa quando ela é obrigada a ver a outra.']},
{p:'(Texto externo: crítica) Benedito Nunes fala em “fracasso da linguagem” na obra de Clarice: a palavra só se aproxima do vivido quando falha. a) Explique a ideia com um momento em que a narradora comenta a própria linguagem. b) Relacione-a ao final do romance.',a:['Em G. H., a narradora sabe que dizer é trair a experiência, e por isso o livro avança corrigindo e desdizendo o que diz.','Na abertura, ela teme inventar um sentido só para ser entendida e comemora ter perdido o medo de uma imagem feia; no fim, afirma que a palavra mentiria por ela, que não entende o que diz, e termina com o verbo adorar e travessões.','O fracasso da linguagem é método: só quando desiste de compreender G. H. chega ao indizível, e a última palavra é adoração, não explicação.']},
{p:'(Texto externo: epígrafe) O romance tem como epígrafe uma frase do crítico de arte Bernard Berenson que, em paráfrase, diz: uma vida completa talvez termine numa identificação tão plena com o não-eu que não reste um eu para morrer. a) Relacione a epígrafe à experiência de G. H. b) Mostre como o final retoma essa ideia.',a:['A epígrafe antecipa a jornada de despojamento de G. H.: perder as máscaras sociais e o próprio eu para se identificar com a vida impessoal.','A mulher das iniciais gravadas nas malas, que vivia entre aspas, passa pela barata, sente-se a mulher do mural e termina falando em despersonalização, dizendo que a vida nela não tem o seu nome e que o mundo independe dela.','O desfecho realiza a epígrafe: a completude não vem de se afirmar, mas de desistir de si, o que o livro chama de desistência e trata como revelação.']},
{p:'(Espaço) No início, G. H. planeja lavar o quarto de empregada, raspar o desenho da parede e cobrir o colchão com um lençol seu, de iniciais bordadas. a) O que o plano revela sobre a relação de G. H. com o espaço e com Janair? b) Como o desfecho inverte esse plano?',a:['O plano revela o desejo de apagar a marca da empregada e reocupar o quarto com o próprio nome, reafirmando a posse da patroa.','Ela quer encharcar o quarto-deserto, raspar com faca o homem, a mulher e o cão desenhados por Janair e imagina a foto do quarto já transformado em coisa sua; diz que queria matar alguma coisa ali, impulso que se descarrega no golpe contra a barata.','O desfecho inverte tudo: em vez de impor as iniciais ao quarto, G. H. se reconhece na mulher da parede, perde o nome e aceita que o mundo independe dela.']},
{p:'(Desfecho) a) Por que o momento em que G. H. põe na boca a massa da barata é narrado de modo indireto? b) Como ela reavalia esse gesto até a última seção?',a:['O gesto é elidido porque nem ali G. H. consegue tocar a coisa sem transcender: ela age numa vertigem e só sabe depois que o gesto aconteceu.','Ela vomita o café, avança, perde a consciência apoiada no guarda-roupa, volta a si e cospe com fúria lembrando o Apocalipse; depois conclui que buscara um gesto de santa, um acréscimo, e na seção final o chama de ato ínfimo, não heroico.','A transformação não está no gesto espetacular, mas na renúncia ao heroísmo: G. H. sai sem pose de heroína, confiante e sem entender, e planeja até voltar à vida comum naquela noite.']},
{p:'(Figuras) A narradora chama o inferno de tortura de uma alegria e diz que sua nova covardia é sua maior aventura. a) Identifique a figura de linguagem e explique o efeito. b) Por que ela é central no romance?',a:['É o paradoxo (oxímoro): termos opostos, como inferno e alegria, covardia e coragem, fundidos no mesmo ser.','Diante da barata, G. H. sente nojo e êxtase ao mesmo tempo, acha o horror bom e chama de antipecado o gesto de comer o que é imundo.','A figura é central porque a experiência do neutro não cabe nas oposições da lógica comum (bem e mal, belo e feio); só a contradição consegue apontar para ela.']},
{p:'(Figuras) Na abertura, G. H. diz ter perdido uma terceira perna que a mantinha estável, mas a impedia de andar. a) Identifique e explique o recurso. b) Relacione-o ao percurso da personagem até o final.',a:['É uma metáfora: a terceira perna é a identidade montada para os outros, um apoio artificial que dá segurança e imobiliza.','Antes, G. H. era a mulher realizada das iniciais nas malas, da casa como réplica artística e do sorriso vazio nas fotos; diante da barata essa montagem desaba, e ela teme criar outra perna depressa.','O final completa a metáfora: em vez de buscar novo apoio, ela desiste de se reorganizar numa nova verdade e aceita andar sem garantias, entregue ao que não entende.']},
{p:'(Escola) A paixão segundo G. H. é considerada exemplo extremo da prosa intimista da 3ª fase do Modernismo. a) Cite dois traços que confirmam essa filiação. b) Indique um aspecto em que o romance radicaliza ou rompe essa estética.',a:['A obra confirma a prosa intimista pelo fluxo de consciência em 1ª pessoa e pelo tempo psicológico.','Uma manhã no quarto de empregada ocupa 33 seções de reflexão, memória e delírio, encadeadas porque a frase final de cada uma reabre a seguinte; mas o livro quase não tem enredo, começa e termina com travessões e traz uma epifania que destrói a identidade em vez de confirmá-la.','G. H. leva a introspecção ao limite: a ação vira pensamento, e a própria linguagem se torna personagem ao confessar que não alcança o vivido.']},
{p:'(Comparação) Em <i>A paixão segundo G. H.</i> e em <i>A visão das plantas</i>, uma vida não humana (a barata, as plantas) é indiferente ao julgamento moral, e um espaço doméstico guarda uma violência histórica. a) Compare o efeito desse contato em G. H. e em Celestino. b) Compare o espaço da casa nas duas obras.',a:['Nas duas obras a natureza não julga, mas o efeito é oposto: G. H. é desmontada e se transforma; Celestino não se arrepende e morre em paz.','A barata que olha G. H. a faz perder a identidade e repensar moral, beleza e Deus; as plantas florescem para o velho negreiro sem gratidão nem condenação, e ele recusa a confissão ao padre Alfredo.','Na casa de G. H., o quarto de empregada guarda a herança da escravidão na figura de Janair; na de Celestino, casa e quintal repetem o navio e o porão: nos dois romances o espaço íntimo carrega a história que os protagonistas preferiam não ver.']},
{p:'(Comparação) Em <i>Memórias de Martha</i> e em <i>A paixão segundo G. H.</i>, uma narradora em 1ª pessoa lembra uma mulher negra ou mulata excluída, por quem sente algo próximo da culpa. a) Identifique essas personagens e o lugar social de cada narradora. b) Compare o modo como cada obra trata essa culpa.',a:['Em Martha, é Mathilde, a colega mulata e pobre acusada de roubo; em G. H., é Janair, a empregada negra. Martha narra de baixo, a pobre que sobe; G. H. narra de cima, a patroa que desce ao quarto dos fundos.','Martha abandona Mathilde como as outras e ainda sente essa mancha trinta e tantos anos depois; G. H. percebe que nunca viu Janair, mal lembra seu rosto e se pergunta se foi odiada ou se foi ela quem odiou sem olhar.','Nos dois livros a lembrança expõe o preconceito racial e de classe, mas Martha o vive como culpa moral individual, enquanto em G. H. o encontro com Janair abala a identidade inteira da narradora e revela o lugar estrutural da empregada na casa brasileira.']}
]
});

perto:[
['1. “Tenho uma ideia vaga”: memória e chegada ao cortiço (cap. I)','<p><b>O que acontece.</b> A narradora diz que lembra pouco da casa onde nasceu. Da infância guarda o despejo e o pai morto, que a mãe a obriga a beijar; ela foge para o quintal, com medo de um Deus que só castiga. Depois, mãe e filha vivem sós num cortiço de São Cristóvão: a mãe engoma de manhã à noite, e as crianças do pátio riem da menina: “Chamavam-me lesma! Mole! Palerma!”.</p><p><b>Como está escrito.</b> 1ª pessoa retrospectiva que admite falhas da memória (“Bem pouco!”). Lembranças sensoriais: o frio e o cheiro do cadáver, a luz forte do quintal. O cortiço junta descrição naturalista (corredor “comprido e infecto”, água das barrelas empoçada) e interioridade (os olhos da mãe sentidos “como brasas”).</p><p><b>O que significa.</b> O livro começa por uma queda (de casa própria para cortiço) e por uma menina que não se adapta ao meio. Quem conta é a adulta que entende o que a menina só sentia.</p><p><b>Como cairia.</b> Foi o trecho da 1ª fase de 2027 (Q14, gabarito A): Martha, narradora em 1ª pessoa, <b>inadaptada</b> e voltada para dentro, × Pombinha (<i>O cortiço</i>, 3ª pessoa), adaptada e querida por todos.</p>'],
['2. Lucinda, o espelho e o vestido encarnado (cap. I)','<p><b>O que acontece.</b> Na casa da freguesa rica, Lucinda exibe a boneca Mlle Rosa e leva Martha a um espelho do teto ao chão; Martha se vê “triste e feia”. A dona da casa lhe dá o vestido encarnado da filha, e Lucinda ri: “Parece um macaquinho!”. Quando a mãe agradece “a esmola”, Martha sente parar o coração.</p><p><b>Como está escrito.</b> Retrato em <b>antítese</b>: Lucinda “muito alva, corada” × Martha pálida, de meias engelhadas e sapatos rotos. Martha se presta à prova do vestido “como um autômato” (comparação que mostra a perda de vontade).</p><p><b>O que significa.</b> É a cena-matriz: a classe vista no espelho. O espelho volta na soirée (“Como há doze anos”). Logo depois, Martha usa o vestido com orgulho diante das vizinhas e repete o olhar de Lucinda. A humilhação planta a ambição (a inveja, “arbusto de negros frutos”).</p><p><b>Como cairia.</b> Identificar a antítese e o símbolo do espelho; explicar como a humilhação de classe move a trajetória.</p>'],
['3. Mathilde: a culpa que dura trinta anos (cap. II)','<p><b>O que acontece.</b> Mathilde, colega “mulata”, pobre, marcada de bexigas, ensina Martha a ler com paciência. Acusada de pequenos furtos, tem na caixa os sapatinhos de lã da adjunta. A mestra a humilha e a põe de castigo à vista de todas. Martha, como as outras, lhe vira as costas. Isolada, Mathilde fica agressiva e é expulsa.</p><p><b>Como está escrito.</b> A adulta interrompe a cena para se julgar: “no fim de trinta e tantos anos, sinto na minha consciência como uma grande nódoa imperecível!”. Repare que ela mesma descreve Mathilde com preconceito (“feia, escura”, “pouco inteligente”) e logo a troca por Clara Sylvestre, “alegre, bonita”.</p><p><b>O que significa.</b> O texto <b>não inocenta</b> Mathilde: a culpa de Martha é a ingratidão e a covardia diante do grupo. Raça e classe decidem quem merece segunda chance.</p><p><b>Como cairia.</b> Memória como acerto de contas; preconceito racial e de classe; comparação com Janair (<i>G. H.</i>).</p>'],
['4. A casa da ilhoa: Carolina e Maneco (cap. I a V)','<p><b>O que acontece.</b> A ilhoa espanca Carolina por ter dado a própria comida a Martha. Maneco, de oito anos, chega bêbado: o vendeiro Joaquim o viciou por diversão. O médico o dá por incurável; a ilhoa agride o vendeiro e vai presa. Carolina tem as pernas inchadas pela umidade e repete “Isto não é nada”. Maneco morre; a mãe o beija pela primeira vez.</p><p><b>Como está escrito.</b> Núcleo naturalista: vício, doença, violência, herança (a ilhoa lembra o avô que “morreu cozido” de bebida), vocabulário de meio (Carolina “estupidificada pelo meio”). Ao mesmo tempo, idealização: “Há flores nos pântanos, e refletem-se muitas vezes na lama os raios das estrelas”.</p><p><b>O que significa.</b> O cortiço destrói quem fica: no cap. XI, Carolina apanha do marido num cortiço da Gamboa e a ilhoa segue como “besta de carga”. Martha é a exceção.</p><p><b>Como cairia.</b> Onde o romance confirma o Naturalismo; contraste Martha × Carolina.</p>'],
['5. O segredo do pai (cap. IV)','<p><b>O que acontece.</b> A mãe para de engomar e conta o passado: órfã, filha de um jogador arruinado; casamento por amor; vida confortável num chalé; o marido caixeiro-viajante, roubado do dinheiro dos patrões Braga &amp; Torres; ninguém acreditou nele, e ele se envenenou.</p><p><b>Como está escrito.</b> Diálogo curto, quase interrogatório (“Que morte escolheu?” “O veneno.”). O ambiente acompanha: o ferro esfria, as crianças se calam. A conclusão vem como sentença: “A viúva de um ladrão não podia continuar na mesma classe”.</p><p><b>O que significa.</b> A queda é moral antes de ser econômica: “Não era só uma mulher pobre, era uma mulher vilipendiada”. Martha se culpa (o pai viajava para juntar o dote dela) e sonha ficar rica para devolver o dinheiro: a ambição nasce da honra da família.</p><p><b>Como cairia.</b> Por que mãe e filha estão no cortiço; classe e honra.</p>'],
['6. O primeiro ordenado e a saída do cortiço (cap. V e VI)','<p><b>O que acontece.</b> No dia seguinte ao enterro de Maneco, a mestra conta que Martha foi nomeada e vai “vencer ordenado”; ela já tem “discípulas”. Mãe e filha procuram “uma casa pequena, independente e clara” e acham um chalé “cor de pérola” quase em frente ao colégio; o aluguel come o salário inteiro. A decisão vem quando um rapaz as segue até o portão do cortiço. No chalé: “Um cantinho independente e asseado. Tinha-o”.</p><p><b>Como está escrito.</b> O portão é “aberto como uma goela esfaimada a todas as misérias e a todos os vícios”: <b>comparação</b> com <b>animalização</b>. No chalé, a luz entra “sem frouxidão”: o espaço passa da sombra à claridade.</p><p><b>O que significa.</b> É a resposta oficial da Fuvest 2026: o cortiço é <b>lugar de passagem</b>, e a força que muda a vida de Martha é a <b>educação</b>, convertida em emprego e salário. Depois virão o concurso e a cadeira própria no Engenho Novo.</p><p><b>Como cairia.</b> Antonio Candido e <i>O cortiço</i> (já caiu); trajetória espacial: cortiço → chalé → cadeira de professora → casa de casada.</p>'],
['7. A soirée de D. Anninha (cap. VI)','<p><b>O que acontece.</b> A mestra convida Martha, aos vinte anos, para uma festa. A mãe a leva e espera “embaixo, na sala da entrada, onde a não vissem senão os criados”. Martha se compara às moças no espelho, conhece Leonor (loura, de branco “como uma noiva”), dança mal uma quadrilha com um conselheiro, guarda doces no bolso para a mãe e só sai às duas da madrugada. No dia seguinte, ninguém notara sua ausência: “Decididamente, foi só para isto que eu nasci!”.</p><p><b>Como está escrito.</b> Enumeração de luxo; leques “como grandes borboletas”. <b>Ironia</b>: as rendas e o tapete da casa foram feitos pelas alunas na aula. A exclamação final é autoironia amarga.</p><p><b>O que significa.</b> A educação abre a porta da casa burguesa, mas não dá pertencimento. A mãe no vestíbulo dos criados marca a fronteira de classe.</p><p><b>Como cairia.</b> Ironia; espaços sociais (salão × entrada de criados); comparação com <i>G. H.</i>.</p>'],
['8. Palmeiras: Luiz, o castelo e “Do you love me?” (cap. VII e VIII)','<p><b>O que acontece.</b> O médico chama a doença nervosa de Martha de “histerismo” e receita casamento ou viagem; Miranda adianta o dinheiro. Em Palmeiras, ela conhece Luiz, primo de D. Anninha, estudante de medicina, que diz que ela tem “espírito por dez homens” e lhe dá versos. Na manhã da partida, ela o vê abraçado à filha de um paralítico norte-americano: “Do you love me?”. Só meses depois sabe que ele vai casar com Leonor.</p><p><b>Como está escrito.</b> Natureza romântica (vales, campânulas, framboesas) desmontada pela ironia da adulta: os versos eram “coisas banais”. O discurso de Luiz sobre o castelo que faria se fosse rico é <b>hipérbole</b> e <b>enumeração</b>. A descoberta vem em comparação: “como se me tivessem vestido de neve”.</p><p><b>O que significa.</b> O amor romântico é ilusão (traço realista). O “histerismo” mostra como a medicina do tempo lia o sofrimento feminino: a cura seria um marido.</p><p><b>Como cairia.</b> Realismo contra a idealização; ironia; condição feminina.</p>'],
['9. O pedido de Miranda e a noite dos versos (cap. X e XI)','<p><b>O que acontece.</b> Martha recebe a nomeação de professora pública no dia do casamento de Luiz. A mãe conta que Miranda, solicitador, freguês e vizinho, se apaixonou pelas cartas de Palmeiras. Martha recusa (“Alcancei uma posição independente, não precisarei do apoio de ninguém”), mas cede quando a mãe diz que não queria morrer sem vê-la casada. Na véspera do casamento, relê os versos de Luiz e queima todos os papéis.</p><p><b>Como está escrito.</b> Símile: a reputação da mulher é “como o cristal puro, o mínimo sopro a enturva”. Antítese alma × corpo: “O meu espírito; a minha pessoa não era nada”. A noite da queima é lírica (Via Láctea, jasmins) e fecha em ironia seca: os versos “não prestavam para nada”.</p><p><b>O que significa.</b> O casamento é acomodação: amparo e respeito, sem paixão; a mãe ensina que a esposa mais instruída deve disfarçar a superioridade. Martha conquista a independência econômica, mas a sociedade ainda exige o marido.</p><p><b>Como cairia.</b> Emancipação × conformismo; casamento como amparo.</p>'],
['10. A morte da mãe (cap. XII)','<p><b>O que acontece.</b> Casamento simples, com D. Anninha de madrinha. Uma semana tranquila; no oitavo dia, a mãe tem uma síncope. O médico diz que o coração estava arruinado havia anos e que ela “tem sido de aço”. Um dia, ela beija a filha, pede que saia e morre sozinha na poltrona. Martha passa a noite ajoelhada ao lado da morta, junto à janela aberta para a noite “semeada de estrelas”.</p><p><b>Como está escrito.</b> Antítese em forma de máxima: “A queixa é uma fraqueza (...). O silêncio sofredor é o voo no azul cândido do infinito”. Explicação quase científica (“Singular organização a sua!”) ao lado da santificação (“a minha santa”).</p><p><b>O que significa.</b> A mãe deixa de lutar quando a filha fica “amparada”: sua vida fora “só artifício, força de vontade”. A ascensão de Martha tem como preço o sacrifício materno. As estrelas do fim ecoam as estrelas refletidas na lama do começo.</p><p><b>Como cairia.</b> Desfecho e maternidade; trabalho feminino invisível; antítese.</p>']
],
critica:'<p><b>As datas.</b> Primeiro romance de Júlia Lopes de Almeida. Saiu em folhetim na <i>Tribuna Liberal</i> (Rio), entre dezembro de 1888 e janeiro de 1889, e em livro só em 1899 (data usada pela Fuvest). A ação se passa no Rio do <b>Segundo Reinado</b>: há um retrato do Imperador na sala de aula e um telegrama “da Corte”.</p><p><b>Lugares.</b> São Cristóvão (o cortiço), Gamboa (o cortiço de Carolina adulta), Engenho Novo (subúrbio do trem, onde Martha reencontra Clara Sylvestre e ganha sua cadeira de professora), a Escola Normal e Palmeiras, na serra fluminense.</p><p><b>Cortiços e higienismo.</b> Médicos e autoridades viam os cortiços como focos de epidemia e de vício; em 1893, já na República, o prefeito Barata Ribeiro mandou demolir o Cabeça de Porco (estudo clássico: Sidney Chalhoub, <i>Cidade febril</i>, 1996). O romance usa esse vocabulário (difteria, umidade, “linfática”, “infecto”), mas mostra também o senhorio que lucra com a miséria e só “maquia” o lugar com o nome de avenida.</p><p><b>Magistério.</b> Ensinar era uma das poucas profissões respeitáveis para a mulher. No livro, o emprego livra da dependência: a adjunta que agradece o ordenado inspira o sonho de Martha, que depois diz ter alcançado “uma posição independente”.</p><p><b>Candido e a Fuvest 2026.</b> No ensaio “De cortiço a cortiço” (<i>Novos Estudos CEBRAP</i>, 1991), Antonio Candido diz que em <i>O cortiço</i> o cortiço é o centro de tudo e a natureza é a força transformadora. Resposta oficial para Martha: o cortiço é <b>lugar de passagem</b> (elas se mudam para moradia “independente e asseada” com o primeiro emprego de Martha como professora) e a força é a <b>educação</b>.</p><p><b>Martha × Pombinha (1ª fase 2027).</b> Pombinha é adaptada ao cortiço e narrada em 3ª pessoa; Martha narra em 1ª pessoa, inadaptada, voltada para dentro, buscando outro caminho. Em <i>O cortiço</i>, Pombinha acaba corrompida pelo meio; em Martha, esse destino é sugerido para <b>Clara Sylvestre</b>, enquanto Martha escapa pelo estudo.</p><p><b>Leituras críticas (resumos).</b> Rosana Cássia dos Santos (<i>Graphos</i>, 2023) vê no livro uma “subversão possível”, entre conformidade e contestação. Fani Tabak e Alex Guimarães (<i>Diadorim</i>, 2011) leem as tensões entre ficção e contexto histórico. Eurídice Pessoa (2021) estuda a narradora em contexto de exclusão social.</p><p><b>A autora e a ABL.</b> O nome de Júlia constava de uma lista extraoficial de fundadores da Academia Brasileira de Letras e foi retirado; o marido, Filinto de Almeida, ficou entre os fundadores (ver Michele Fanini, <i>Estudos de Sociologia</i>).</p><p><b>Escola: confirma e rompe.</b> Confirma o Realismo/Naturalismo no cenário (sujeira, epidemias, vício, herança, vocabulário médico como “histerismo” e “neurose”) e na anti-idealização do amor. Rompe ao narrar em 1ª pessoa memorialista, ao manter traços românticos (a mãe “santa”, Carolina “flor no pântano”) e, sobretudo, ao <b>vencer o determinismo</b>: o meio pesa sobre Carolina, Maneco e Clara, mas Martha muda de destino pela educação.</p><p><b>Figuras típicas.</b> Antítese (flores no pântano, estrelas na lama; “hoje” × “então”); comparação com animalização (o portão como “goela esfaimada”); gradação; ironia (“Decididamente, foi só para isto que eu nasci!”); o símbolo do espelho.</p>',
qbank:[
{p:'(Texto externo: crítica) A pesquisadora Rosana Cássia dos Santos (revista <i>Graphos</i>, 2023) diz, em síntese, que em <i>Memórias de Martha</i> Júlia Lopes de Almeida se equilibra numa linha fina entre conformidade e contestação. a) Aponte um aspecto do romance que contesta os valores da época. b) Mostre como o desfecho revela também conformidade.',a:['O romance contesta ao dar a uma mulher pobre a conquista de emprego e salário pelo estudo, a ponto de ela dizer que alcançou “uma posição independente” e não precisa do apoio de ninguém.','Martha é nomeada e, com o ordenado, tira a mãe do cortiço (cap. V); depois passa no concurso e ganha a própria cadeira; mas aceita casar com Miranda, sem amor, porque a mãe não quer morrer sem vê-la casada, e a mãe ensina que a esposa mais instruída deve disfarçar a superioridade e “nivelar-se” ao marido.','A independência econômica convive com a acomodação ao casamento-amparo: o romance avança até onde a sociedade de 1899 permitia, e por isso a subversão é só “possível”.']},
{p:'(Texto externo: história) Em 26 de janeiro de 1893, por ordem do prefeito Barata Ribeiro, o cortiço Cabeça de Porco foi demolido no Rio, em nome da higiene pública; os cortiços eram vistos como focos de epidemias e de vícios. a) Que elementos do romance confirmam essa visão do cortiço? b) Que elementos situam a história no fim do Império e mostram o que a visão higienista esquece?',a:['O romance confirma a visão do cortiço como lugar de doença e vício: epidemia de difteria e sarampo, pernas de Carolina inchadas pela umidade, Maneco viciado em cachaça, brigas e até um assassinato (Giovanni mata Túlio para roubá-lo).','A ação se passa sob o Império (retrato do Imperador na escola, telegrama “da Corte”), e o livro mostra o senhorio que lucra com a miséria, rebatiza o cortiço de “avenida” e só o caia, e o vendeiro que embebeda crianças: a culpa não é só dos pobres.','Júlia partilha o vocabulário higienista da época, mas desloca a crítica para quem explora os moradores e mostra que a saída do cortiço vem do trabalho e da escola, não da demolição.']},
{p:'(Imagem descrita) Na tela <i>Mulheres passando roupa</i> (Degas, c. 1884–1886, Museu d’Orsay), duas trabalhadoras ocupam a cena: uma boceja e se espreguiça, a outra apoia todo o peso do corpo no ferro sobre a tábua. a) Relacione a imagem à mãe de Martha. b) Explique o papel desse trabalho na trajetória da protagonista e no desfecho.',a:['A pintura mostra o cansaço do trabalho repetitivo de engomar, o mesmo da mãe de Martha, que engoma roupa para fora de manhã à noite, com as mãos queimadas e o corpo de tísica.','É esse trabalho que paga o vestido do exame, os remédios e a viagem a Palmeiras; quando a filha se casa e fica “amparada”, a mãe adoece no oitavo dia e morre, e Martha conclui que aquela vida fora “só artifício, força de vontade”.','Como na tela, o romance torna visível um trabalho feminino que sustenta tudo e se gasta em silêncio: a ascensão de Martha pela educação tem como base o corpo exausto da mãe.']},
{p:'(Comparação com <i>Caminho de pedras</i>) Nos dois romances, o emprego é condição de dignidade para a mulher, mas a moral social pesa sobre ela. a) Compare o papel do emprego para Martha e para Noemi. b) Compare os desfechos.',a:['Para as duas, o salário dá autonomia: Martha sai do cortiço com o primeiro ordenado e diz que não precisa de ninguém; Noemi, retocadora de fotos, perde o emprego porque a freguesia “de família” condena seu comportamento e passa a depender de Roberto.','Martha reconhece que a reputação da mulher é frágil “como o cristal puro” e aceita o casamento seguro com Miranda; Noemi rompe o casamento, enfrenta o julgamento até dos camaradas e termina sozinha, grávida, costurando para viver e subindo a ladeira de pedras.','Martha negocia com a moral do século XIX (emprego mais casamento respeitável), Noemi a desafia e paga o preço: as duas obras mostram que o trabalho liberta a mulher só até onde a moral deixa.']},
{p:'(Comparação com <i>A paixão segundo G. H.</i>) Mathilde, em <i>Memórias de Martha</i>, e Janair, em <i>G. H.</i>, são mulheres negras que quase não falam e que a narradora só “vê” depois. a) Compare o modo como cada narradora reconhece essas personagens. b) O que essas cenas revelam sobre raça e classe no Brasil?',a:['Martha adulta reconhece que abandonou Mathilde, a colega “mulata” que a ensinou a ler, e chama isso de “nódoa imperecível” na consciência; G. H. percebe, ao entrar no quarto de empregada, que mal lembrava o nome e o rosto de Janair.','Mathilde, acusada de roubo, é humilhada, isolada e expulsa sem que Martha lhe diga uma palavra; Janair deixa no quarto dos fundos um desenho a carvão que funciona como julgamento silencioso da patroa.','Nos dois livros a memória expõe uma hierarquia em que a mulher negra e pobre é invisível ou descartável, e a narradora de classe superior (G. H.) ou em ascensão (Martha) só a enxerga tarde, quando já participou da exclusão.']},
{p:'(Comparação com <i>Opúsculo humanitário</i>) Em 1853, Nísia Floresta critica a educação de enfeite dada às meninas (um pouco de francês, piano tocado sem compreender a música) e defende uma instrução sólida para as mulheres. a) Como <i>Memórias de Martha</i> dialoga com essa defesa? b) Em que a educação de Martha vai além do que Nísia propunha?',a:['O romance realiza a tese de Nísia: a instrução é o que salva Martha da miséria e da vergonha herdada do pai.','Pobre demais até para ir à escola sem roupa decente, Martha estuda na escola pública, auxilia a mestra, frequenta a Escola Normal e passa no concurso; Nísia pensava sobretudo em formar boas mães de família, enquanto Martha transforma o estudo em profissão e salário.','Quase meio século depois do <i>Opúsculo</i>, a educação feminina deixa de ser só preparo para o lar e vira meio de sobrevivência e de ascensão social, embora Martha ainda termine casada.']},
{p:'(Figura e foco narrativo; comparação com <i>Canção</i>) “Aquele vestido, aquela fita, quantas horas de trabalho custaram à minha pobre mãe! Hoje os vejo através das lágrimas de saudade e reconhecimento; então via-os entre os risos da vaidade e da ignorância” (cap. II). a) Identifique o recurso que organiza o trecho e explique seu efeito. b) Compare essa memória com a da narradora de <i>Canção para ninar menino grande</i>.',a:['O trecho se organiza por uma antítese entre “hoje” e “então” (lágrimas × risos; reconhecimento × vaidade), que separa a narradora adulta da menina e permite que a adulta julgue a criança que foi.','O mesmo movimento aparece quando ela chama de “nódoa” o abandono de Mathilde e quando sorri da própria ingenuidade diante dos versos de Luiz; em <i>Canção</i>, a narradora recolhe e reconta histórias de outras mulheres ligadas a Fio Jasmim, e a memória é missão de testemunha, não exame de consciência.','Em Martha, lembrar é acertar contas com a própria vida; em <i>Canção</i>, é dar voz a vidas alheias: as duas obras fazem da memória em 1ª pessoa o eixo da narrativa, com funções diferentes.']},
{p:'(Desfecho) O romance termina não com o casamento de Martha, mas com a morte da mãe, poucos dias depois. a) Por que a mãe adoece justamente então? b) Que sentido esse desfecho dá à trajetória de Martha?',a:['A mãe adoece quando se sente dispensável: enquanto a filha dependia dela, trabalhava de madrugada à noite; vendo-a “amparada, com um auxílio certo e honrado”, deixa-se descansar, e no oitavo dia do casamento tem uma síncope.','O médico diz que o coração estava arruinado havia anos e que ela “tem sido de aço”; Martha conclui que aquela vida foi “só artifício, força de vontade”, e o livro fecha com a filha ajoelhada ao lado da morta, numa noite de estrelas.','As memórias são de Martha, mas o desfecho revela que sua ascensão (escola, emprego, casamento) foi sustentada pelo sacrifício materno: a vitória individual vem com perda, e o livro é também homenagem à mãe trabalhadora.']},
{p:'(Escola literária) Sobre Carolina, a filha mais velha da ilhoa, a narradora diz que ela, “estupidificada pelo meio, nem tinha consciência do sofrimento”. a) Que traço de estilo de época a frase revela? b) Explique por que, no conjunto, o romance não é um exemplo puro dessa estética.',a:['A frase é naturalista: atribui ao meio (miséria, trabalho, violência) o poder de embrutecer a personagem, como no determinismo científico do fim do século XIX.','O cortiço do livro tem vício e herança (Maneco viciado pelo vendeiro, o avô bêbado), doença (pernas inchadas pela umidade) e violência; mas a narração é em 1ª pessoa, centrada na consciência de Martha, com traços românticos (a mãe “santa”, Carolina “flor no pântano”), e a protagonista vence o meio pela educação.','O romance usa o cenário e o vocabulário naturalistas, mas recusa a tese determinista: o meio pesa sobre Carolina, Maneco e Clara Sylvestre, não sobre o destino de Martha.']},
{p:'(Figuras de linguagem) Leia: “Há flores nos pântanos, e refletem-se muitas vezes na lama os raios das estrelas” (cap. I) e “o medonho portão do cortiço, aberto como uma goela esfaimada a todas as misérias e a todos os vícios” (cap. V). a) Identifique a figura principal de cada trecho e explique o efeito. b) Mostre como essas duas visões do cortiço convivem no romance.',a:['No primeiro trecho há metáfora com antítese (flores e estrelas × pântano e lama), que mostra a bondade de Carolina nascendo na miséria; no segundo, comparação com animalização (prosopopeia), que faz do portão uma boca faminta que engole os moradores.','O cortiço é ao mesmo tempo lugar de gente boa (Carolina dá a própria comida a Martha e apanha por isso) e espaço que devora (Maneco morre de vício; Carolina repete a miséria num cortiço da Gamboa); Martha tem vergonha do portão e só se livra dele com o primeiro ordenado.','As duas imagens resumem o olhar duplo da narradora: compaixão por quem fica e horror ao espaço, que precisa ser deixado para trás pela educação.']}
]
});

perto:[
['1. “Nebulosas”: o poema-programa (1ª parte, p. 31–34)','<p><b>O que acontece.</b> A voz vê no infinito as nebulosas, “Alvos cisnes do mar da imensidade”. A multidão as toma por névoa (“densas caligens”), a ciência as resolve em grupos de estrelas, e o eu as vê como “visões gentis” que lhe roubam “instantes ao sofrer recôndito”. São obra de Deus: a lágrima dos anjos vira astro. Um dia o desalento cravou a garra no peito da voz; ela olhou o céu, subiu com as nebulosas às esferas e à poesia, voltou ao “deserto” da terra e cantou sozinha: “Assim nasceram os meus tristes versos, / Que do mundo falaz fogem às pompas!”. Esses versos não dormem sob os tetos dourados dos poderosos; voam “à luz da liberdade” até o trono de Deus.</p><p><b>Como está escrito.</b> Decassílabos brancos (sem rima), frases longas, inversões, vocabulário erudito. <b>Metáfora cósmica</b> em cadeia (cisnes, flores de ouro, lágrimas que viram astros), exclamações, movimento de subida e descida.</p><p><b>O que significa.</b> Três olhares sobre o céu: senso comum (névoa), ciência (estrelas), poesia (consolo e revelação). A poesia nasce da dor e não serve aos poderosos: é poética da liberdade. Os poemas do livro são “nebulosas”, luz difusa e distante.</p><p><b>Como cairia.</b> Já caiu em 2026 (com Carl Sagan): metáforas cósmicas e irmandade. Pode voltar com texto científico (a nebulosa visível pela luz de estrelas próximas, tema da Q56 da 1ª fase 2027) ou com a epígrafe do astrônomo Delaunay.</p>'],
['2. “Desengano”: a natureza como espelho do eu (2ª parte, p. 48–49)','<p><b>O que acontece.</b> Ao pôr do sol, na “hora dos mistérios”, a voz sente: “Me arqueja, treme e expira a lâmpada da vida!”. A esperança e o amor a feriram; seu último lamento foi ignorado: “E a multidão passou soberba, muda, fria!”. Ela despreza as pompas, quer um caminho de dores nas solidões, junto a palmeiras e nenúfares, e deseja, por fim, cantar a Deus e dormir num leito ignorado.</p><p><b>Como está escrito.</b> Alexandrinos rimados em parelhas. O fim do dia espelha o fim da vida (<b>metáfora</b> da lâmpada; <b>gradação</b> “arqueja, treme e expira”). <b>Antítese</b> entre o poeta e a multidão fria. <b>Comparação</b>: o inseto que palpita na flor da água é como a ideia no crânio da poeta.</p><p><b>O que significa.</b> É a 2ª geração romântica pura: a paisagem é extensão do eu, com desejo de morte e isolamento. O livro dialoga com essa dor: “Agonia” é respondida por “Consolação”, paródia de Ezequiel Freire que reescreve as mesmas imagens para dizer que a poeta não deve desesperar.</p><p><b>Como cairia.</b> Caiu na 1ª fase 2027 (Q57, gabarito C) com <i>Campo de trigo com corvos</i>, de Van Gogh: no poema romântico, a natureza é extensão do eu. Na 2ª fase: figuras, escola, comparação com a paisagem ética de Sophia.</p>'],
['3. “Invocação”: o voo cortado pela palavra “mulher” (2ª parte, p. 63–64)','<p><b>O que acontece.</b> Dedicado a Pessanha Póvoa. Uma série de “Quando...” (a noite, o pescador que canta, o trovador, a brisa, a lua, as cachoeiras) prepara a queixa: a voz quer voar até a pátria como cisne ou “condor, em um voo gigante”. Mas: “Mas, ó pátria, são frágeis as asas!”. A pátria dá louros aos bardos e a ela nem um ramo. E então: “Quando intento librar-me no espaço, / As rajadas em tétrico abraço / Me arremessam a frase – mulher!...”. Ela responde “Seja embora!” e pede à pátria ao menos um canto de ave, um raio de sol.</p><p><b>Como está escrito.</b> <b>Anáfora</b> de “Quando” (acumulação que adia a queixa), <b>apóstrofe</b> à pátria, travessão e <b>reticências</b> que isolam a palavra final como um golpe. O condor, símbolo da poesia de Castro Alves, é negado a uma mulher.</p><p><b>O que significa.</b> A voz feminina sabe que a sociedade barra o seu voo poético e público. Desmente a crítica de Wilson Martins de que a defesa dos direitos femininos “pouco transparece” na poesia de Narcisa. Em “Visão”, a Esperança beija a sua “fronte de mulher”.</p><p><b>Como cairia.</b> Voz feminina e lugar da poeta; comparação com Nísia (educação da mulher) e com Martha; figuras: metáfora do voo, apóstrofe, aposiopese.</p>'],
['4. “O Itatiaia” e “A Resende”: natureza como pátria (2ª parte, p. 69–73 e 80–83)','<p><b>O que acontece.</b> Em “O Itatiaia”, a voz se diz tímida diante do “gigante brasíleo” e descreve vales, abismos, florestas, cachoeiras e a flora que muda com a altura, até saudar: “Salve! brasílio Himalaia!”. Quem pisa a base da serra “Liberta seu pensamento / Das amarguras terrestres!”, e as nuvens vestem a montanha “Quais ligeiras nebulosas!”. Em “A Resende”, a peregrina cansada volta à cidade amada (“estrela da alvorada”, “filha de Tupã”, “garça gentil”) e pousa a cabeça no seu colo.</p><p><b>Como está escrito.</b> Redondilhas em oitavas (Itatiaia) e decassílabos em oitava-rima (Resende). <b>Hipotipose</b> (descrição viva, elogiada no prefácio), <b>hipérbole</b>, <b>prosopopeia</b> (a cidade tem colo e braços), <b>anáfora</b> (“Enfim te vejo”).</p><p><b>O que significa.</b> Nacionalismo romântico à maneira de Gonçalves Dias: a terra brasileira como grandeza e identidade. O sublime da montanha também liberta o eu da dor.</p><p><b>Como cairia.</b> Natureza e pátria; comparação com <i>Geografia</i> e com a “Canção do exílio”.</p>'],
['5. “Miragem”: a natureza livre e o povo acorrentado (2ª parte, p. 86–88)','<p><b>O que acontece.</b> O oceano se revolta contra a tempestade, a cordilheira rasga o céu, as aves sondam o ar: “Oh! tudo, tudo se expande / Às auras da liberdade!”. Mas o homem, “o rei da natureza”, beija o ferro que lhe esmaga o pulso. Os montes gritam: “Levanta-te, ó povo bravo, / Quebra as algemas de escravo”. A voz pergunta a Deus quando o povo ajoelhado se erguerá, invoca Mirabeau e Vergniaud (Revolução Francesa) e pede que se reanimem “as cinzas de Badaró” (Líbero Badaró, jornalista liberal assassinado em 1830).</p><p><b>Como está escrito.</b> Redondilhas em décimas, <b>interrogações retóricas</b>, <b>antítese</b> entre natureza livre e homem servil, <b>ironia</b> em “rei da natureza”, <b>prosopopeia</b> (os montes falam).</p><p><b>O que significa.</b> A natureza aqui não é refúgio: é modelo moral e político. Se tudo é livre na natureza, a servidão humana é antinatural. “Escravo” é o povo submetido ao poder; num país escravista, a metáfora pesa também no sentido literal.</p><p><b>Como cairia.</b> Comparação com <i>Geografia</i> (paisagem como verdade contra a opressão); discussão política ligada à irmandade.</p>'],
['6. “Vinte e cinco de março” e “Sete de setembro” (2ª parte, p. 74–76 e 93–95)','<p><b>O que acontece.</b> “Vinte e cinco de março” é a data do juramento da Constituição de 1824, outorgada por D. Pedro I depois de dissolver a Constituinte (as duas primeiras estrofes, diz a nota da autora, lembram o projeto liberal de 1823). A voz fala à data: “Roubaste ao povo a palma do triunfo, / Recompuseste a algema ao pó lançada”; grita “Maldição! Maldição!”, lembra os Andradas presos ou exilados e conclama: “Rasgai, rasgai a folha lutulenta”. Em “Sete de setembro”, o gigante Brasil acorda com a cadeia dos cativos no pulso, quebra a algema, e o Amazonas e os Andes dizem “Eis-nos livres, Senhor!”. Porém: “Mas não se cinge a escravidão à algema”: o povo ainda se curva “Ante um falso poder!”, e a liberdade deve velar o “mártir Xavier” (Tiradentes).</p><p><b>Como está escrito.</b> <b>Apóstrofe</b> a uma data personificada, <b>anáfora</b>, <b>metáfora</b> da algema, <b>prosopopeia</b> da pátria (gigante, “novo Prometeu”), <b>hipérbole</b>.</p><p><b>O que significa.</b> Independência incompleta: livre de Portugal, o país segue preso a um poder imposto e à escravidão. O prefaciador chamou “Vinte e cinco de março” de “um anátema, uma ameaça”.</p><p><b>Como cairia.</b> Contexto histórico (Constituinte, Constituição outorgada, Tiradentes); metáfora da escravidão política.</p>'],
['7. “Pesadelo”: da Revolução Francesa aos mártires brasileiros (fecha a 2ª parte, p. 101–106)','<p><b>O que acontece.</b> Dedicado ao pai, Jácome de Campos. Em três partes. <b>I:</b> à noite, a voz recolhe da história os exemplos de liberdade: gregos contra persas, Roma (Lucrécia vingada por Bruto), Tell, Cromwell, Rienzi, Kosciusko, a independência americana. <b>II:</b> “Salve! Oh! salve Oitenta-e-Nove”: caem privilégios, cetros e brasões; “No pedestal da igualdade / Firma o povo a liberdade, / Um canto à fraternidade / Entoa a voz da nação”; a Europa se arma, mas o povo marcha “Tendo por guia a razão!”. <b>III:</b> a voz fala à pátria: coroe Tiradentes; você viu os inconfidentes partirem acorrentados “E dormiste sorrindo – sempre escrava!...”; levou ao cadafalso o Padre Roma (1817); depois da “amesquinhada independência” deixou matar Nunes Machado e morrer Pedro Ivo (Revolução Praieira, 1848). Fim: o futuro revelará os erros “da majestade”, e a pátria “arrojarás ao pó cetros e tronos / Bradando ao mundo inteiro – liberdade!”.</p><p><b>Como está escrito.</b> Três metros (alexandrinos; redondilhas com a palavra “revolução” fechando as estrofes; decassílabos). <b>Enumeração</b> de heróis, <b>apóstrofe</b> à pátria, <b>personificação</b> da Revolução como “deusa”, <b>ironia</b> (“dormiste sorrindo”).</p><p><b>O que significa.</b> O pesadelo é a história dos oprimidos, e a visão noturna vira profecia. Liberdade, igualdade e fraternidade são a forma política da irmandade. É o poema mais <b>republicano</b> do livro.</p><p><b>Como cairia.</b> Melhor resposta para “irmandade” (Fuvest 2026, item b); pode vir com Delacroix, com texto sobre a Inconfidência ou a Praieira.</p>'],
['8. “Castro Alves”: elegia ao condor (abre a 3ª parte, p. 109–111)','<p><b>O que acontece.</b> A natureza inteira chora: morreu o “pálido cantor da liberdade”, nascido sob o sol do Dois de Julho baiano. O poema resume a vida dele: a criança sensível, o poeta-profeta, a lira que celebrava o herói Pedro Ivo, a ida ao Sul, a doença e a volta para morrer entre os seus. Fim: “Mas... não morreste, não, condor brasíleo”, porque seus versos atravessarão os tempos, como os de Homero.</p><p><b>Como está escrito.</b> Decassílabos brancos, perguntas iniciais, <b>prosopopeia</b> (o oceano emudece, a terra chora), <b>antítese</b> (“riso e pranto”, “mocidade e morte”), epíteto “condor”. Segundo a editora, ecoa versos de Castro Alves, morto em julho de 1871.</p><p><b>O que significa.</b> Narcisa se declara herdeira da poesia condoreira e social, justamente a do poeta a quem a crítica depois a subordinou.</p><p><b>Como cairia.</b> Escola (3ª geração); ligação com “O africano e o poeta” e com “Pesadelo” (Pedro Ivo aparece nos dois).</p>'],
['9. “O africano e o poeta”: o refrão da solidariedade (3ª parte, p. 130–132)','<p><b>O que acontece.</b> Seis estrofes. O cativo conta, em discurso direto, que deixou criança a terra natal, foi arrancado dos braços da família e atravessou o mar “Em rígidos laços”; trabalhou na mata com fome; foi castigado, “Coberto de chagas, / Sem lar, sem amigos”; e pergunta quem rezará na sua cova. Cada estrofe fecha com pergunta e resposta: “Quem pensa? – O poeta”, “Que sente? – O poeta”, “Quem quer? O poeta”, “Quem vê? – O poeta”, “Quem há como eu sou?!... / – Quem há?... O poeta”, “Quem há-de?... O poeta”.</p><p><b>Como está escrito.</b> Versos de cinco sílabas, ritmo de canção (virou modinha de João Gomes de Araújo). <b>Refrão</b>, <b>paralelismo</b>, <b>interrogação retórica</b>, voz do escravizado e voz do poeta (poema polifônico). Epígrafe de Lamartine.</p><p><b>O que significa.</b> O poeta é a única testemunha e o único irmão do cativo. Ao responder “o poeta” à pergunta “Quem há como eu sou?”, a poeta se iguala ao escravizado: é a forma mais forte de irmandade do livro. O poeta “deseja elevar” os mistérios da terra ao céu, como no poema “Nebulosas”. Dedicado a Celso de Magalhães, promotor que levou a júri uma senhora acusada de mandar matar um escravo.</p><p><b>Como cairia.</b> Abolicionismo, irmandade, refrão; comparação com Castro Alves, com o <i>Opúsculo</i> e com <i>A visão das plantas</i>.</p>'],
['10. “Os dois troféus”: Victor Hugo e a ironia final (fecha o livro, p. 147–155)','<p><b>O que acontece.</b> Sob o título vem “Victor Hugo”: é tradução livre de “Les deux trophées” (1871). A voz fala ao povo francês: lembra a glória da Revolução e de Napoleão, que deixou dois monumentos, a coluna (Vendôme) e o arco (do Triunfo). Agora, depois de Sedan e de Paris traída, franceses lutam contra franceses (“Tem Versalhes – a paróquia, / Paris ostenta – a comuna”). Hipótese final: se a Prússia vencedora mandasse derrubar a coluna e o arco, quem aceitaria? “Curvar-nos? Jamais! Jamais! / – E vós o fizeste, ó povo!...”.</p><p><b>Como está escrito.</b> Redondilhas em oitavas, ode heroica, <b>apóstrofe</b> ao povo, <b>enumeração</b> de batalhas, <b>ironia</b> no último verso.</p><p><b>O que significa.</b> O próprio povo, durante a Comuna de 1871, fez o que o inimigo exigiria. A liberdade aparece como causa universal, mas com crítica à violência entre irmãos. Cuidado: o poema não é exaltação simples do povo que não se curva.</p><p><b>Como cairia.</b> Pouco provável; serve para não errar o sentido e para mostrar o diálogo de Narcisa com a poesia política francesa.</p>']
],
critica:'<p><b>Recepção em 1872.</b> O livro saiu pela Garnier, sem que a autora pagasse a edição. O prefácio de Pessanha Póvoa chama Narcisa de “primeira poetisa desta nação” e diz que ela “não é um tipo, é uma heroína”; chama “Vinte e cinco de março” de “anátema” e vê “O baile” como sátira. Anna Faedrich (edição de 2017) lê esse prefácio como o <b>endosso masculino</b> exigido para uma mulher entrar nas letras. Machado de Assis (<i>Semana Ilustrada</i>, 29/12/1872) achou “sentimento verdadeiro e real inspiração”, mas confessou receio de abrir um livro de mulher. D. Pedro II quis conhecê-la e declamou estrofes do livro. Em 1873, Resende lhe ofereceu uma festa com lira de ouro, coroa de louros e pena de ouro.</p>'+
'<p><b>Apagamento.</b> Wilson Martins (1977) chamou o livro de “a estreia mais sensacional do ano”, mas disse que a defesa dos direitos femininos “pouco transparece” nos versos (“Invocação” permite discordar). Alfredo Bosi a põe entre os “Condores” menores; Antonio Candido a chama de “exemplo típico da pessoa de aptidões medianas”. Christina Ramalho (1999) e Anna Faedrich contestam: a exclusão veio do preconceito de gênero, não do valor dos poemas. <i>Todos esses juízos foram lidos nas citações da edição de 2017.</i></p>'+
'<p><b>A autora.</b> Narcisa Amália de Campos (1852–1924), filha de professores, criada em Resende. Casou-se aos 13 anos (1866) e se separou em 1870; casou-se de novo em 1880 e se separou em 1887, porque o marido a proibia de conviver com intelectuais. Professora no Rio a partir de 1889; jornalista, tradutora, republicana e abolicionista. Chegou a ser acusada, por um difamador, de não ser a autora dos próprios versos.</p>'+
'<p><b>História por trás dos poemas.</b> 1823–1824: Constituinte dissolvida e Constituição outorgada (“Vinte e cinco de março”). Tiradentes, Padre Roma (1817), Nunes Machado e Pedro Ivo (Revolução Praieira, 1848) em “Pesadelo”. Líbero Badaró, jornalista assassinado em 1830, em “Miragem”. Comuna de Paris (1871), via Victor Hugo, em “Os dois troféus”.</p>'+
'<p><b>Como a Fuvest já leu o livro.</b> 2ª fase 2026, Q1: Carl Sagan + primeira estrofe de “Nebulosas”. Resposta oficial: planetas e esferas; caligens e “alvos cisnes” (as nuvens, também no título) como metáforas delicadas e etéreas; contemplar o cosmos é fuga do “sofrer recôndito”; no item b, poemas de liberdade e abolição, com igualdade e fraternidade como irmandade entre povos e raças. 1ª fase 2027: Q56 (física: a nebulosa reflete a luz de estrelas próximas) e Q57 (“Desengano” × Van Gogh, <i>Campo de trigo com corvos</i>: a natureza como extensão do eu, gabarito C).</p>'+
'<p><b>Escola: confirma e rompe.</b> Confirma a 2ª geração (“Desengano”, “Sadness”, cujo anjo inspirador se chama Tristeza), a 1ª (natureza e pátria: “O Itatiaia”, “A Resende”) e a 3ª, condoreira (“Vinte e cinco de março”, “Pesadelo”, “O africano e o poeta”, elegia a Castro Alves). Rompe pela voz feminina pública e política (“a frase – mulher!”), pela ciência no lírico (epígrafe de um astrônomo) e porque a melancolia vira engajamento: os “tristes versos” voam “à luz da liberdade”. Não é parnasiano nem simbolista.</p>'+
'<p><b>Figuras típicas.</b> Metáfora cósmica (nebulosas como cisnes), prosopopeia (Amazonas e Andes falam; a Noite é “irmã da poesia”), apóstrofe (à pátria, à Noite, ao povo), anáfora (“Quando...”, “Maldição!”), refrão (“O poeta”), antítese e ironia (“o rei da natureza” beija o ferro), hipérbole (“brasílio Himalaia”), gradação (“arqueja, treme e expira”).</p>'+
'<p><b>Pegadinhas novas.</b> “Os dois troféus” é tradução livre de Victor Hugo e termina em ironia. “Perfil de escrava” (1879) não está em <i>Nebulosas</i>. “Consolação” é de Ezequiel Freire. O poema republicano que fecha a 2ª parte chama-se “Pesadelo”.</p>',
qbank:[
{p:'(Texto externo: ciência) A epígrafe de “Nebulosas”, do astrônomo Delaunay, diz que se chamam nebulosas as manchas esbranquiçadas vistas aqui e ali no céu. Um texto de divulgação explica que muitas nebulosas brilham porque refletem a luz de estrelas próximas. a) Que modos de ver as nebulosas aparecem no poema? b) Mostre, com outro poema do livro, que esse olhar se repete.',a:['O poema opõe três olhares: a multidão vê névoa (“densas caligens”), a ciência vê grupos de estrelas, e o eu lírico vê “visões gentis” e “Alvos cisnes do mar da imensidade”, luz que consola e inspira.','Em “Lembras-te?”, a amiga pergunta “Por que contemplas muda as tênues nebulosas?”, e a voz responde que vê o Criador na natureza; em “O Itatiaia”, as nuvens vestem a montanha “Quais ligeiras nebulosas”.','Narcisa não nega a ciência (cita um astrônomo), mas lhe acrescenta sentido poético e religioso: como a nebulosa que brilha com luz recebida, os versos nascem da dor iluminada pelo céu.']},
{p:'(Texto externo: crítica) Wilson Martins (1977) escreveu que Narcisa Amália “foi mulher emancipada e corajosa defensora dos direitos femininos, o que, de resto, pouco transparece na sua poesia”. a) Explique a afirmação. b) Discuta-a com base em um poema de <i>Nebulosas</i>.',a:['O crítico separa a vida (mulher emancipada, jornalista, separada duas vezes) da obra, que ele lê como lírica sentimental influenciada por Casimiro, Varela e Castro Alves.','Mas em “Invocação” a voz quer voar como condor até a pátria e diz que, ao tentar, os ventos lhe arremessam “a frase – mulher!...”; em “Visão” fala da própria “fronte de mulher”, e em “O baile” lamenta “As penas da mulher” calcadas sem piedade.','A condição feminina transparece, de forma velada: a poeta mostra que a sociedade corta o voo da mulher que escreve, ideia que ela tornará explícita numa carta de 1889 sobre as “frases convencionais” impostas às mulheres.']},
{p:'(Texto externo: prefácio) No prefácio de 1872, Pessanha Póvoa pede a escritores amigos “um lugar de honra” para “a autora das Nebulosas” e chama “Vinte e cinco de março” de “um anátema, uma ameaça”. a) Por que o livro de uma mulher vinha apresentado por um homem? b) Explique por que o poema seria uma “ameaça”.',a:['No século XIX, a entrada de uma mulher nas letras dependia do aval masculino: o prefácio funciona como endosso que autoriza a estreante, como observa Anna Faedrich na edição de 2017.','“Vinte e cinco de março” amaldiçoa a data da Constituição outorgada por D. Pedro I em 1824, depois da dissolução da Constituinte: a data “Roubaste ao povo a palma do triunfo, / Recompuseste a algema”, e a voz manda rasgar essa “folha lutulenta”.','É ameaça porque uma jovem poeta acusa a origem autoritária da monarquia em pleno Império; o mesmo tom republicano volta em “Pesadelo”, que profetiza a queda de “cetros e tronos”.']},
{p:'(Imagem descrita) No quadro <i>A Liberdade guiando o povo</i> (1830), de Delacroix, uma mulher de barrete frígio ergue a bandeira tricolor e um fuzil e conduz homens de várias classes sobre uma barricada com corpos. a) Que poema de <i>Nebulosas</i> personifica a liberdade ou a revolução de modo parecido? b) Como esse poema leva o tema para a história do Brasil?',a:['Em “Pesadelo”, parte II, a Revolução de 1789 é a “deusa” que o povo adora; o povo marcha “Tendo por guia a razão” e firma “No pedestal da igualdade” a liberdade, com “um canto à fraternidade”, como a figura alegórica de Delacroix que guia a multidão.','Na parte III, a voz se volta à pátria, que deve coroar Tiradentes, e a acusa: “E dormiste sorrindo – sempre escrava!”, enquanto deixava morrer o Padre Roma, Nunes Machado e Pedro Ivo; no fim, prevê que ela lançará “ao pó cetros e tronos” bradando “liberdade”.','Como o quadro, o poema faz da liberdade uma figura coletiva que une o povo; ao aplicar ao Brasil o ideal de liberdade, igualdade e fraternidade, torna-se poema republicano contra a monarquia.']},
{p:'(Comparação: <i>Opúsculo humanitário</i>) Nísia Floresta (1853) e Narcisa Amália (1872) escreveram no Segundo Reinado. a) Aponte um ponto comum entre as obras quanto à condição da mulher. b) Mostre uma diferença no modo como tratam a escravidão.',a:['As duas mostram que a mulher do século XIX é impedida de desenvolver a inteligência: Nísia pede educação feminina como medida da civilização; Narcisa, em “Invocação”, mostra a palavra “mulher” cortando o voo da poeta.','Nísia condena a escravidão sobretudo porque corrompe a família e a formação moral das crianças, sem campanha abolicionista; Narcisa dá voz ao próprio escravizado em “O africano e o poeta”, que narra o sequestro, a travessia acorrentado, o trabalho e o castigo, e faz do poeta seu único irmão.','O país escravista é o mesmo, mas Nísia fala como educadora preocupada com o lar, e Narcisa como poeta engajada que faz do cativo sujeito da fala, na linha abolicionista de Castro Alves.']},
{p:'(Comparação: <i>Geografia</i>) Em <i>Geografia</i> (1967), Sophia faz da paisagem luminosa uma medida de verdade e justiça contra a “noite” do regime salazarista. a) Mostre um poema de <i>Nebulosas</i> em que a natureza tem sentido ético ou político. b) Aponte uma diferença no uso da natureza pelas duas poetas.',a:['Em “Miragem”, o oceano, a montanha e as aves se expandem “Às auras da liberdade”, e os montes gritam “Levanta-te, ó povo bravo, / Quebra as algemas de escravo”: a natureza livre denuncia a servidão humana.','O contraste vem na ironia de que o homem, “o rei da natureza”, beija o ferro que lhe esmaga o pulso; em “Sete de setembro”, o Amazonas e os Andes dizem “Eis-nos livres, Senhor!”, mas o povo ainda se curva “Ante um falso poder”.','Nas duas, a paisagem é ética; mas Narcisa usa uma natureza grandiosa, personificada e oratória, típica do Romantismo condoreiro, enquanto Sophia faz da paisagem uma presença clara, concreta e contida, de linguagem moderna.']},
{p:'(Escola literária) Diz-se que <i>Nebulosas</i> reúne traços de diferentes gerações românticas. a) Identifique duas delas com exemplos. b) Explique em que o livro foge do que se esperava da poesia de uma mulher na época.',a:['Há a 2ª geração, ultrarromântica, em poemas de dor, noite e morte como “Desengano” e “Sadness” (o anjo inspirador “frio e triste” que se chama Tristeza), e a 3ª, condoreira, em “Vinte e cinco de março”, “Pesadelo”, “O africano e o poeta” e na elegia a Castro Alves, o “condor brasíleo”.','O tom condoreiro aparece na apóstrofe, na hipérbole e nas imagens grandiosas (o gigante Brasil acorrentado, o povo que deve quebrar “as algemas”), e a poeta ainda traduz Victor Hugo em “Os dois troféus”.','Ela rompe a expectativa de lirismo doméstico reservado à mulher: escreve sobre Constituição, revolução, república e escravidão, e até sobre os limites impostos a ela (“a frase – mulher!”), o que explica o espanto elogioso de 1872 e o apagamento posterior.']},
{p:'(Figuras) Leia o verso de “A noite”: “Ó Noite, meiga irmã da poesia”. a) Identifique duas figuras de linguagem e explique o efeito. b) Mostre outro poema em que a personificação da natureza ou da pátria tem sentido político.',a:['Há apóstrofe (a voz chama diretamente a Noite) e prosopopeia (a Noite é “irmã” da poesia): a noite vira confidente que consola a dor e acolhe o escravo exausto, o bardo e o pobre.','Em “Sete de setembro”, o Brasil é um gigante que acorda com a cadeia dos cativos no pulso, “novo Prometeu”, e quebra a algema, enquanto o Amazonas e os Andes falam; mas a voz adverte: “Mas não se cinge a escravidão à algema”.','A personificação dá à natureza e à pátria um corpo que sofre e luta: a lírica íntima e a poesia cívica usam o mesmo recurso, e o mundo inteiro participa do drama da liberdade.']},
{p:'(Figuras e irmandade) Em “O africano e o poeta”, cada estrofe termina com pergunta e resposta: “Quem pensa? – O poeta”, “Quem vê? – O poeta”, “Quem há como eu sou?!... / – Quem há?... O poeta”. a) Explique o efeito do refrão. b) Relacione o poema à ideia de irmandade em outro ponto do livro.',a:['O refrão, com paralelismo e interrogação, insiste que só o poeta escuta, vê e chora o escravizado numa sociedade indiferente; e, ao responder “o poeta” a “Quem há como eu sou?”, a voz se iguala ao cativo.','O africano conta em discurso direto a infância roubada, a travessia “Em rígidos laços”, o trabalho com fome, as chagas do castigo e a morte sem prece; e o poeta “deseja elevar” esses mistérios da terra ao céu, como os “tristes versos” do poema “Nebulosas” voam “à luz da liberdade”.','A irmandade volta em “Pesadelo”, que celebra o “canto à fraternidade” e a igualdade da Revolução, e em “A festa de S. João”, que abençoa a mão que liberta escravizados: em todo o livro, poesia é solidariedade com os oprimidos.']},
{p:'(Obra inteira) “Desengano” termina com o desejo de dormir “n’um leito ignoto e mudo”, e no livro “Agonia” é seguida por uma paródia de Ezequiel Freire que responde à poeta. a) Explique a relação entre natureza e eu lírico em “Desengano”. b) Mostre como o livro transforma essa dor em outra coisa.',a:['Em “Desengano”, o pôr do sol espelha a vida que se apaga (“Me arqueja, treme e expira a lâmpada da vida!”): a natureza é extensão do eu, como na 2ª geração romântica, e a multidão “soberba, muda, fria” ignora o poeta.','O livro dialoga com essa dor: “Consolação” reescreve “Agonia” para dizer que as açucenas também resistem; e o poema de abertura mostra a dor virando criação, pois do desalento a voz sobe às nebulosas e conclui “Assim nasceram os meus tristes versos”, que voam “à luz da liberdade”.','A tristeza é ponto de partida, não de chegada: o mesmo eu melancólico que deseja a morte faz da poesia, em “Pesadelo” e “O africano e o poeta”, uma missão pública de liberdade.']}
]
});

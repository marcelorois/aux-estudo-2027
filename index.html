['Saída do cortiço','Martha é nomeada na escola de D. Anninha e passa a receber ordenado. Com ele, mãe e filha alugam um chalé “cor de pérola”, “independente”, quase em frente ao colégio; a vergonha de um rapaz que as segue, na volta da Escola Normal, até o portão do cortiço apressa a mudança. Numa festa elegante, Martha sente-se feia e deslocada.'],
['Palmeiras e Luiz','Doente, Martha vai com D. Anninha passar férias no campo, em Palmeiras. Apaixona-se por Luiz, que lhe lê versos banais, mas o surpreende abraçado a uma hóspede norte-americana, a filha de um paralítico. Meses depois, no Rio, sabe que ele vai se casar com Leonor, sobrinha loura e muito alva da professora.'],
['Professora e casada','Martha passa no concurso e é nomeada professora no mesmo dia do casamento de Luiz. Aceita casar com Miranda, vizinho bom e sério que se encantou com as cartas dela, sem paixão. Queima os versos de Luiz. Oito dias após o casamento, a mãe, enfim aliviada, adoece; morre pouco depois, e Martha fica ao lado da morta.']],
pers:[['Martha','Narradora. Pobre, estudiosa, nervosa e insegura com a aparência. Sobe pela educação, mas paga em afetos.'],['A mãe','Viúva que engoma até se acabar para educar a filha. Mártir silenciosa: só desaba quando a filha está amparada.'],['D. Anninha','A professora: modelo de mulher instruída e porta de entrada de Martha para outro mundo.'],['Mathilde','Colega mulata que ensinava Martha e foi excluída. Símbolo do preconceito racial e da culpa da narradora.'],['Carolina e a família da ilhoa','A miséria do cortiço: doença, violência, resignação.'],['Lucinda','Menina rica que humilha Martha.'],['Luiz e Leonor','O amor idealizado e a moça loura e muito alva que ele escolhe.'],['Miranda','Solicitador (advogado prático) bondoso, marido sereno e sem paixão.']],
tec:`<p><b>Narrador:</b> 1ª pessoa, memorialista e retrospectiva. Martha adulta comenta a menina que foi, com reflexões e julgamentos.</p>
<p><b>Tempo:</b> dos 5 aos 24 anos e à morte da mãe, logo após o casamento, em ordem cronológica, com a distância de quem lembra trinta e tantos anos depois.</p>
<p><b>Espaço:</b> o cortiço de São Cristóvão (só na primeira parte), a escola, o chalé, o campo em Palmeiras, o Engenho Novo (onde ela terá a cadeira de professora). A trajetória espacial é de ascensão.</p>
<p><b>Estilo:</b> realista, com cenas naturalistas no cortiço (doença, sujeira, violência), mas com foco psicológico na narradora. Linguagem cuidada, do fim do século XIX.</p>`,
temas:[['Educação e ascensão feminina','o magistério como saída digna para a mulher pobre'],['Trabalho e sacrifício materno','a mãe engomadeira'],['Casamento','amparo econômico contra paixão romântica'],['Corpo e aparência','Martha se acha feia; a moça loura e muito alva é a escolhida'],['Preconceito','racial (Mathilde) e de classe (Lucinda)'],['Honra','a vergonha de ser filha de um suposto ladrão']],
cai:`<p>Caiu em 2026, a partir de Antonio Candido sobre <i>O Cortiço</i>: o cortiço é o centro de tudo em Martha? Não: é uma etapa da trajetória, e o centro é a consciência da narradora. A força transformadora não é a natureza, mas a educação (e o trabalho da mãe). Resposta oficial: o cortiço é lugar de passagem (mãe e filha se mudam para moradia “independente e asseada” quando Martha obtém o primeiro emprego como professora), e a força transformadora é a educação. Na 1ª fase 2027 (Q14): Martha, inadaptada e interiorizada (1ª pessoa), contra Pombinha, adaptada ao cortiço (3ª pessoa). Revise também a culpa em relação a Mathilde.</p>`,
peg:['Não é <i>O Cortiço</i>: aqui o cortiço aparece só no começo e não domina o romance.','Martha não se casa com Luiz, e sim com Miranda.','Quem conta é a Martha adulta, olhando para trás, não a menina.','A mãe não morre exatamente no casamento: adoece oito dias depois e morre pouco tempo após.'],
mn:`<p><b>E-S-C-O-L-A:</b> <b>E</b>ngomadeira (a mãe) · <b>S</b>ão Cristóvão (o cortiço) · <b>C</b>ulpa por Mathilde · <b>O</b> pai acusado de roubo · <b>L</b>uiz, a ilusão · <b>A</b>mparo de Miranda e adeus à mãe.</p>`,
q:{p:'Em certo ponto, Martha comenta que a viúva de um ladrão não podia continuar na mesma classe da qual a memória do marido a arrancara. a) Explique por que mãe e filha vão morar no cortiço. b) Que caminho Martha encontra para sair dessa condição?',
a:['O pai, acusado de roubar o dinheiro dos patrões, se matou; mãe e filha perderam os bens e, sobretudo, a honra social.','A mãe passa a engomar roupa para fora e as duas vão para o cortiço de São Cristóvão, lugar que a sociedade reservava a quem caiu: a pobreza vem junto com a vergonha.','Martha sai pela educação: estuda na escola pública, passa no concurso e vira professora. O magistério é a forma digna de ascensão para uma mulher pobre, completada pelo casamento com Miranda.']},
ap:`<p><b>Júlia e a educação:</b> em crônicas e livros, ela defendeu a instrução e o trabalho das mulheres. Martha é a personagem-tese: a escola salva quem o nome da família condenou.</p>
<p><b>Candido e o cortiço:</b> em <i>O Cortiço</i>, de Aluísio, o cortiço é o centro e a natureza brasileira é força poderosa que transforma as pessoas. Em Martha, o cortiço é ponto de partida a ser superado, e a transformação vem da vontade, do estudo e do sacrifício materno.</p>
<p><b>Frases da autora (domínio público) que ajudam:</b> Carolina repetindo, sobre a própria doença, “Isto não é nada”; Martha concluindo, depois da festa em que ninguém notou sua ausência, “Decididamente, foi só para isto que eu nasci!”.</p>
<p><b>Cenas secundárias úteis:</b> o senhorio que pinta o cortiço e o chama de avenida; o médico que diz que a doença nervosa de Martha seria resolvida com casamento; o rapaz de olhos negros na Escola Normal, que talvez seguisse a professora e não ela.</p>`,
cx:['<b>Opúsculo:</b> Nísia pede educação para as mulheres; Martha mostra, quase meio século depois, uma mulher salva pela escola.','<b>A paixão segundo G. H.:</b> classe social vista de baixo (Martha) e de cima (G. H.).','<b>Canção:</b> memória em 1ª pessoa contra memória ouvida e recontada.','<b>Caminho de pedras:</b> mulheres que dependem do emprego e são julgadas pela moral.'],
aq:{p:'Explique como o episódio de Mathilde revela preconceito racial e de classe e qual o papel da memória nessa cena.',
a:['Mathilde, menina mulata, pobre e marcada de bexigas, é acusada de roubo, humilhada pela professora e excluída por todas, até ser expulsa.','Martha, que devia a ela as primeiras lições, também lhe vira as costas e a troca por uma amiga bonita e alegre.','A narradora adulta, trinta e tantos anos depois, chama esse abandono de mancha na consciência: a memória funciona como acerto de contas com o preconceito que ela reproduziu.']},
cards:[['Onde Martha e a mãe vão morar depois da morte do pai?','Num cortiço em São Cristóvão, Rio de Janeiro.'],['Como a mãe de Martha sustenta a casa?','Engomando roupa para fora.'],['Por que o pai de Martha se matou?','Foi roubado do dinheiro dos patrões, acusado de ladrão, e se envenenou para não ser preso.'],['Quem é Mathilde?','Colega mulata que ajudava Martha e foi excluída sob acusação de roubo; Martha sente culpa.'],['Por quem Martha se apaixona em Palmeiras?','Por Luiz, que se casa com Leonor.'],['Com quem Martha se casa?','Com Miranda, solicitador vizinho, sem paixão.'],['Que profissão Martha conquista?','Professora, por concurso.'],['Qual a força transformadora em Martha?','A educação (e o sacrifício da mãe), não a natureza.']],
cola:'Filha de um “ladrão” suicida, Martha cresce num cortiço, estuda, vira professora por concurso, perde Luiz e casa com Miranda; a mãe morre logo depois. Memória em 1ª pessoa; educação como ascensão; culpa por Mathilde.'});

BOOKS.push({id:'opusculo',short:'Opúsculo',e:'📜',c:'#3B5BA9',t:'Opúsculo humanitário',a:'Nísia Floresta',y:1853,per:'Ensaio, Romantismo; primeiro feminismo brasileiro',
enT:'O argumento em 7 etapas',
idt:`<p><b>Nísia Floresta Brasileira Augusta</b>, pseudônimo de Dionísia Gonçalves Pinto (1810–1885), do Rio Grande do Norte, é considerada a primeira educadora feminista do Brasil. Fundou no Rio o Colégio Augusto (1838), com ensino para meninas parecido com o dos meninos. Em 1832 publicou <i>Direitos das mulheres e injustiça dos homens</i>. Viajou à Europa em 1849, voltou ao Brasil (de onde escreve este livro) e depois se fixou na Europa, onde foi amiga de Auguste Comte.</p>
<p><b>O livro (1853):</b> não é romance. É uma coletânea de <b>62 artigos</b>, publicados em parte no jornal, defendendo que a educação da mulher é a medida da civilização de um povo. O grito central do primeiro artigo: “educai as mulheres!”.</p>
<p><b>Contexto:</b> Segundo Reinado, escravidão em pleno vigor, pouquíssimas escolas para meninas. A lei de 1827 permitia escolas femininas, mas com ensino reduzido e voltado às prendas domésticas.</p>`,
cenas:[
['A tese','O artigo I abre com um apelo ao Brasil que se diz civilizado e ao governo que se diz liberal: onde está a educação das mulheres? Em todos os tempos, a educação feminina foi o maior sinal da civilização dos povos.'],
['A história','Ásia, Egito, Grécia, Roma, “bárbaros” e “selvagens”: onde a mulher foi escrava ou instrumento de prazer, a civilização parou. O cristianismo aparece como o que elevou a mulher.'],
['Os modelos','Alemanha (reflexão e maternidade), Inglaterra (virtudes domésticas), França (escritoras e beneficência) e Estados Unidos (respeito à mulher; elogio a Harriet Beecher Stowe, autora antiescravista).'],
['A herança portuguesa','O Brasil herdou de Portugal o desprezo pela educação feminina. Os colonos vinham pela sede de ouro; as escolas eram como casas penitenciárias, com palmatória e vara.'],
['O diagnóstico','Colégios particulares sem fiscalização, abertos como negócio. Dados de 1852: 55.500 alunos nas aulas públicas, apenas 8.443 meninas. Em Minas, de 209 escolas, só 24 eram femininas.'],
['Os costumes','Mães que entregam os filhos a amas escravizadas; a escravidão como escola de crueldade e vícios dentro de casa; a vaidade (uma menina de 6 anos morre apertada no espartilho); crianças sem infância; o clero mal preparado.'],
['Indígenas e conclusão','As mulheres indígenas foram as primeiras vítimas dos “civilizados”: escravizadas e vendidas em nome de Cristo. No fim, Nísia diz que a mulher já influencia os destinos públicos e que o Brasil, com natureza mais rica que a dos Estados Unidos, só precisa de uma coisa: “Educai para isto a mulher, e com ela marchai avante”.']],
pers:[['A ensaísta','Voz em 1ª pessoa do plural (“nós”), indignada e oratória, que fala como educadora experiente.'],['Os interlocutores','“Povos do Brasil”, o governo, os pais de família: Nísia se dirige a eles diretamente.'],['As mães','Responsáveis pela educação doméstica, criticadas pela vaidade e pela entrega dos filhos a amas.'],['Os escravizados','Vistos com compaixão, mas também com o preconceito da época: Nísia condena a escravidão como jugo anticristão e herança portuguesa e espera um futuro de braços livres, mas a trata pelos efeitos na educação das crianças livres, não propõe abolição e chama os cativos de raça desmoralizada pelo cativeiro.'],['As indígenas','Exaltadas pelas virtudes e apresentadas como vítimas da colonização “cristã”.']],
tec:`<p><b>Gênero:</b> ensaio jornalístico e argumentativo, dividido em artigos curtos numerados (I a LXII).</p>
<p><b>Argumentação:</b> exemplos históricos, autoridades citadas para apoiar (Platão, Chateaubriand, Fénelon, Michelet) ou para refutar (Montesquieu, Rousseau), estatísticas oficiais, casos concretos (a menina do espartilho) e comparação entre nações.</p>
<p><b>Estilo:</b> oratório e romântico: apóstrofes (“Povos do Brasil!”), exclamações, perguntas retóricas, imagens da natureza grandiosa do país.</p>
<p><b>Posição:</b> um feminismo moderado e cristão. Nísia não pede voto nem igualdade política: quer educação para que a mulher seja melhor mãe, esposa e cidadã moral, e recusa o “filosofismo dos socialistas”.</p>`,
temas:[['Educação feminina = civilização','o grau de instrução das mulheres mede o progresso de um povo'],['Crítica ao Estado','um governo “liberal” que não educa as meninas'],['Herança colonial','Portugal desprezou a instrução feminina'],['Escravidão','corrompe a educação doméstica e a moral das famílias'],['Indígenas','vítimas da colonização e da hipocrisia cristã'],['Corpo e vaidade','espartilho, moda, ociosidade das meninas ricas']],
cai:`<p>Caiu em 2026 com duas imagens (<i>O aluno novo</i>, 1854, do britânico Thomas Brooks, chegada de um aluno a uma escola rural; e foto de 1895 de aula de costura só de meninas na Escola Caetano de Campos, SP): as imagens reforçam Nísia, e a resposta oficial pede exclusão de gênero, etnia e classe. Na 1ª fase 2027: Q8 (gabarito D: Nísia defende a educação de mulheres brancas e indígenas, sem relacioná-la à abolição) e Q10 (a escravidão deforma moralmente as crianças). Saiba os dados de 1852, o papel da escravidão na educação doméstica e as indígenas.</p>`,
peg:['Não é romance nem tem enredo: é ensaio em 62 artigos.','Nísia não defende voto feminino nem igualdade total: defende educação, dentro de valores cristãos e familiares.','Ela condena a escravidão, mas reproduz preconceitos da época sobre os escravizados.','É de 1853, Império, antes da abolição (1888).'],
mn:`<p><b>E-D-U-C-A-I:</b> <b>E</b>xemplos da história · <b>D</b>ados de 1852 (8.443 meninas em 55.500) · <b>U</b>nião americana e Europa como modelos · <b>C</b>olonização portuguesa culpada · <b>A</b>mas e escravidão em casa · <b>I</b>ndígenas.</p>`,
q:{p:'Uma fotografia de 1895 mostra meninas brancas, uniformizadas, numa aula de costura em São Paulo. a) A imagem reforça ou refuta os argumentos de Nísia Floresta? b) Que traços de exclusão (de gênero, etnia e classe) a imagem revela?',
a:['A imagem reforça a crítica de Nísia: mesmo no fim do século, a educação das meninas aparece voltada às prendas domésticas, não ao desenvolvimento intelectual que ela defendia.','Nísia denunciava que as meninas eram educadas só para agradar e servir a casa, e mostrava a desproporção de escolas (em 1852, 8.443 meninas entre 55.500 alunos).','Exclusão de gênero (meninas preparadas para o lar), de etnia (só há meninas brancas: negras e indígenas ficavam fora) e de classe. No Opúsculo, Nísia pede educação para as indígenas (arts. LIX–LX), mas não para as escravizadas, que ficam fora do seu projeto (art. XIX).']},
ap:`<p><b>Frases da autora (domínio público):</b> “Povos do Brasil, que vos dizeis civilizados! Governo, que vos dizeis liberal!”; “educai as mulheres!”; e o fecho: “Educai para isto a mulher, e com ela marchai avante na imensa via do progresso”.</p>
<p><b>A menina do espartilho:</b> numa escola da Corte, uma menina de 6 anos desmaia e morre na sala de aula, apertada no espartilho pela vaidade da mãe. Nísia usa o caso para atacar uma educação feita de aparência.</p>
<p><b>A ama de leite:</b> Nísia critica as mães que não amamentam e mostra a menina que, ainda criança, chega a maltratar a própria ama que a amamentou, depois vendida ou alugada “como um fardo inútil” (caiu na 1ª fase 2027).</p>
<p><b>Na lista de 2028:</b> <i>Conselhos à minha filha</i> (1842), também de Nísia, substituirá este livro.</p>`,
cx:['<b>Memórias de Martha:</b> a educação como caminho da mulher pobre, já no fim do século.','<b>Nebulosas:</b> Narcisa, também educadora, mas abolicionista explícita (Nísia não liga a educação feminina à abolição), com a liberdade como ideal.','<b>A visão das plantas e Balada:</b> escravidão e colonização vistas de outros séculos e continentes.','<b>Caminho de pedras:</b> a emancipação feminina um século depois, com trabalho e militância.'],
aq:{p:'Explique por que, para Nísia Floresta, a educação da mulher é questão de interesse nacional e não apenas doméstico.',
a:['Para Nísia, a educação da mulher é o principal sinal de civilização de um povo.','Ela mostra que as nações que desprezaram as mulheres estagnaram, enquanto Alemanha, Inglaterra e Estados Unidos prosperaram; e lembra que a mulher educa os filhos e influencia os homens que governam.','Por isso, educar a mulher é preparar o Brasil para o progresso: no fecho, ela diz que o país, com natureza mais rica que a dos Estados Unidos, só precisa de educação para marchar avante.']},
cards:[['Quantos artigos tem o Opúsculo humanitário?','62.'],['Qual o grito central do livro?','“Educai as mulheres!”'],['Quantas meninas havia entre os 55.500 alunos das aulas públicas em 1852?','Apenas 8.443.'],['Que herança Nísia culpa pelo atraso?','A portuguesa, que desprezava a educação feminina.'],['Como Nísia vê a escravidão?','Como jugo anticristão que corrompe a educação doméstica e a moral das famílias; não propõe abolição e reproduz preconceitos da época.'],['Qual o caso trágico do espartilho?','Uma menina de 6 anos morre na escola, apertada pelo espartilho por vaidade da mãe.'],['Nísia defende o voto feminino?','Não. Defende educação, dentro de valores cristãos e familiares.'],['Que país é o grande modelo no fim do livro?','Os Estados Unidos.']],
cola:'Ensaio de 1853 em 62 artigos: “educai as mulheres!”. Educação feminina mede a civilização; culpa a herança portuguesa; dados de 1852; escravidão corrompe a família; indígenas vítimas; feminismo moderado e cristão.'});

BOOKS.push({id:'nebulosas',short:'Nebulosas',e:'🌌',c:'#4B3FA0',t:'Nebulosas',a:'Narcisa Amália',y:1872,per:'Poesia do Romantismo (lirismo íntimo e poesia social)',
enT:'O livro em 7 núcleos',
idt:`<p><b>Narcisa Amália</b> (1852–1924), fluminense de São João da Barra, criada em Resende. Primeira mulher jornalista profissional do Brasil, republicana e abolicionista. Publicou <i>Nebulosas</i> aos 20 anos, em 1872, seu único livro de poesia.</p>
<p><b>Recepção:</b> o livro foi elogiado por Machado de Assis; D. Pedro II quis conhecer a autora e declamou estrofes do livro. Tem prefácio entusiasmado de Pessanha Póvoa. Depois, a autora foi esquecida pela história literária.</p>
<p><b>O livro:</b> 44 poemas em três partes. Mistura a melancolia da segunda geração romântica (dor, saudade, desalento, noite) com o engajamento da terceira geração, a condoreira (liberdade, abolição, república), na linha de Castro Alves.</p>`,
cenas:[
['O poema “Nebulosas”','Abre o livro, sozinho na primeira parte. As nebulosas são sombras no infinito que a multidão julga névoas e que a ciência decompõe em grupos de estrelas. O eu lírico as contempla à noite e elas a consolam do sofrimento oculto. Na hora do desalento, elas a elevaram à poesia: “Assim nasceram os meus tristes versos”, que fogem das pompas do mundo e voam à luz da liberdade.'],
['Lírica íntima','Na segunda parte: “Saudades”, “Desengano”, “Desalento”, “Agonia”, “Consolação” (de Ezequiel Freire, único poema de outro autor), “Amargura”, “Resignação”, “Cisma”. Dor, solidão, desilusão e morte, ao gosto ultrarromântico.'],
['Natureza e terra natal','“A Resende” (a volta à cidade, com suas serras e cachoeiras), “O Itatiaia”, “Manhã de maio”, “À lua”, “A noite”. A natureza é refúgio e também pátria.'],
['Poesia cívica','“Vinte e cinco de março” condena a Constituição outorgada por D. Pedro I em 1824, depois de dissolver a Constituinte: o poder roubou ao povo a vitória e recompôs a algema. “Sete de setembro” celebra a Independência, mas lamenta que o país continue preso a erros e a um falso poder, e invoca o mártir Tiradentes. “Pesadelo” fecha a 2ª parte: da Revolução Francesa aos mártires brasileiros (Tiradentes, Padre Roma, Nunes Machado, Pedro Ivo), termina profetizando a queda de “cetros e tronos”.'],
['Homenagens','Na terceira parte: “Castro Alves” (elegia ao poeta da liberdade), um poema a Carlos Gomes, “O sacerdote”.'],
['“O africano e o poeta”','Diálogo em versos curtos: o cativo conta que foi arrancado da África, atravessou o mar acorrentado, trabalhou até a exaustão e foi castigado. A cada estrofe surge a pergunta “Quem...?”, e a resposta é sempre: o poeta. Só o poeta escuta, sente e chora o escravizado.'],
['“Os dois troféus”','Tradução livre de “Les deux trophées”, de Victor Hugo (1871), sobre a Comuna de Paris e a luta entre franceses depois da derrota para a Prússia. Os troféus são a coluna Vendôme e o Arco do Triunfo. Final irônico: o povo diria “Curvar-nos? Jamais!” à ordem de derrubá-los, mas foi ele mesmo quem derrubou a coluna.']],
pers:[['O eu lírico','Feminino, melancólico e ao mesmo tempo combativo. Faz da dor matéria poética e da poesia uma missão de liberdade.'],['O poeta','Figura recorrente: aquele que escuta os oprimidos e eleva os mistérios da terra ao céu.'],['O africano','O escravizado que fala de sua dor em “O africano e o poeta”.'],['A pátria','Personificada como gigante que acorda acorrentado (“Sete de setembro”).'],['Homenageados','Castro Alves, Carlos Gomes, um sacerdote, Celso de Magalhães (abolicionista a quem dedica o poema do africano).']],
tec:`<p><b>Forma:</b> metros variados: decassílabos brancos em “Nebulosas”, versos curtos e rimados (redondilhas) em “O africano e o poeta”, estrofes regulares nos poemas cívicos.</p>
<p><b>Recursos:</b> apóstrofes e exclamações, inversões sintáticas, vocabulário erudito, imagens grandiosas (cosmos, montanhas, oceano), muitas epígrafes de autores estrangeiros e brasileiros.</p>
<p><b>Metáfora central:</b> a nebulosa, luz difusa e distante, nasce da dor e aspira ao infinito, como a própria poesia da autora.</p>`,
temas:[['Poesia como missão','o poeta como voz de quem sofre'],['Cosmos, ciência e fé','as nebulosas entre o olhar científico e o religioso'],['Dor e consolação','a melancolia romântica'],['Liberdade política','republicanismo contra a Constituição imposta'],['Abolição','a escravidão como vergonha da pátria'],['Natureza e pátria','Resende, Itatiaia, a paisagem como identidade nacional']],
cai:`<p>Caiu em 2026: o poema “Nebulosas” comparado a um texto de Carl Sagan (estrelas, planetas e nebulosas como metáforas) e uma discussão de história ou política ligada à ideia de irmandade. As respostas mais fortes usam “O africano e o poeta” (abolição) e os poemas cívicos (liberdade, república). Na 1ª fase 2027 (Q57), “Desengano” com Van Gogh: a natureza como extensão do eu.</p>`,
peg:['Não é poesia parnasiana nem modernista: é romântica.','“Vinte e cinco de março” é a data da Constituição outorgada de 1824, não uma festa religiosa.','“A ciência reduz a grupos” significa decompor as nebulosas em aglomerados de estrelas, não diminuí-las.','Narcisa não é só “poeta triste”: o livro tem forte poesia social.','“Os dois troféus” é tradução livre de Victor Hugo, e o final é irônico, não uma exaltação.'],
mn:`<p><b>N-E-B-U-L-A:</b> <b>N</b>ebulosas (o poema-título, a poética) · <b>E</b>legias íntimas (desalento) · <b>B</b>rasil natural (Resende, Itatiaia) · <b>U</b>topia política (25 de março, 7 de setembro) · <b>L</b>iberdade do escravo (“O africano e o poeta”) · <b>A</b>plausos (Castro Alves, Carlos Gomes) e a Comuna de 1871, via Victor Hugo.</p>`,
q:{p:'No poema “Nebulosas”, o eu lírico diz que contempla as nebulosas à noite e que delas nasceram seus “tristes versos”. a) Explique o que as nebulosas simbolizam para o eu lírico. b) Relacione essa imagem a uma discussão política presente no livro.',
a:['As nebulosas são luzes difusas e misteriosas que consolam o eu lírico na dor e o elevam à poesia; simbolizam a própria inspiração e a poesia que nasce do sofrimento e aspira ao infinito.','O poema termina dizendo que esses versos fogem das pompas do mundo e voam à luz da liberdade: a poesia não serve aos poderosos.','Essa liberdade aparece nos poemas sociais: em “O africano e o poeta”, só o poeta escuta o escravizado; em “Vinte e cinco de março”, a autora condena a Constituição imposta ao povo. A poesia une contemplação do cosmos e irmandade entre os homens.']},
ap:`<p><b>Versos da autora (domínio público):</b> no poema de abertura, as nebulosas são “Alvos cisnes do mar da imensidade”, que “a multidão supõe densas caligens / E a ciência reduz a grupos validos”. No fim: “Assim nasceram os meus tristes versos, / Que do mundo falaz fogem às pompas!”.</p>
<p><b>O refrão do africano:</b> a estrutura pergunta-resposta (“Quem pensa? O poeta”, “Quem quer [escutar]? O poeta”) mostra o poeta como única testemunha solidária do escravizado, à maneira de Castro Alves.</p>
<p><b>Política:</b> “Vinte e cinco de março” traz nota da própria autora: as estrofes iniciais aludem ao projeto da Constituinte de 1823, que reconhecia grandes princípios de liberdade, antes de ser dissolvida.</p>
<p><b>Biografia:</b> Casou-se aos 13 anos (1866) com João Batista da Silveira, união desfeita em 1870; em 1880 casou-se com Francisco Cleto da Rocha e rompeu em 1887, porque ele a proibia de conviver com intelectuais. Enfrentou ataques e preconceito; foi jornalista e, a partir de 1889, professora no Rio.</p>`,
cx:['<b>Geografia:</b> duas poetas que leem a natureza e o cosmos como lugar de verdade e ligam poesia e liberdade.','<b>Opúsculo:</b> Nísia e Narcisa, educadoras do Império; Narcisa é abolicionista explícita, Nísia condena a escravidão sem ligá-la à educação feminina (gabarito da 1ª fase 2027).','<b>A visão das plantas:</b> o africano arrancado da terra e atravessado pelo mar, visto em 1872 e em 2019.','<b>Martha:</b> mulheres que escrevem num mundo masculino no século XIX.'],
aq:{p:'Explique como “O africano e o poeta” constrói uma ideia de irmandade entre o escravizado e o poeta.',
a:['O poema alterna a fala do cativo e uma pergunta que sempre recebe a mesma resposta: o poeta.','O africano conta a separação da terra natal, a travessia acorrentado, o trabalho exaustivo, o castigo e a morte sem prece; a cada dor, pergunta quem o escuta, e só o poeta sente, chora e reza por ele.','Assim, o poeta se põe como irmão do escravizado, num momento em que a sociedade o ignora: é poesia abolicionista, ligada à causa da liberdade defendida em todo o livro.']},
cards:[['Quantos poemas tem Nebulosas e quantas partes?','44 poemas, em três partes.'],['Que idade tinha Narcisa ao publicar o livro?','20 anos (1872).'],['Que escritor elogiou Nebulosas?','Machado de Assis (e D. Pedro II quis conhecê-la e declamou estrofes do livro).'],['O que as nebulosas simbolizam?','A inspiração e a poesia, luz difusa que nasce da dor e aspira ao infinito.'],['O que critica “Vinte e cinco de março”?','A Constituição outorgada por D. Pedro I em 1824, após dissolver a Constituinte.'],['Qual a estrutura de “O africano e o poeta”?','O cativo narra suas dores e pergunta “quem?”; a resposta é sempre “o poeta”.'],['A que geração romântica Narcisa se liga?','À 2ª (melancolia) e à 3ª, condoreira (liberdade, abolição).'],['De que trata “Os dois troféus”?','É tradução livre de Victor Hugo sobre a Comuna de Paris (1871) e a derrubada da coluna Vendôme pelos próprios franceses; o final é irônico.']],
cola:'Poesia romântica de 1872: o poema-título faz das nebulosas a imagem da poesia nascida da dor. Lírica íntima, natureza de Resende, poemas cívicos (contra a Constituição de 1824), abolicionismo (“O africano e o poeta”).'});

const METODO=`<h1>Como a Fuvest cobra literatura</h1><p class="sub">Análise das provas da 2ª fase de 2023 a 2026 (1º dia). Leia antes do Bloco 1 ou quando puder: 5 minutos.</p>
<section class="card"><h2>O que as provas mostram</h2><ul class="tight">
<li><b>4 a 5 das 10 questões</b> são sobre livros da lista. Em 2026 foram cinco: Nebulosas, As meninas comparado a Canção, A visão das plantas, Memórias de Martha e Opúsculo.</li>
<li><b>O trecho é só a porta de entrada.</b> A pergunta quase sempre exige a obra inteira: o desfecho, a transformação de um personagem, outro poema, outro conto.</li>
<li><b>Muito diálogo com textos de fora:</b> Carl Sagan, Antonio Candido, Marx, pinturas, fotos, a ilustração de uma capa. Você precisa ligar o texto externo à obra.</li>
<li><b>Comparação entre obras da lista</b> apareceu em 2026 (memória em As meninas e em Canção).</li>
<li><b>A Fuvest repete livros:</b> Romanceiro da Inconfidência caiu em 2023, 2024 e 2025. As cinco obras de 2026 podem voltar.</li>
<li><b>Resposta curta:</b> cerca de 5 a 8 linhas por item. Vale mais um fato preciso bem explicado do que um resumo.</li></ul></section>
<section class="card"><h2>Os eixos que se repetem</h2><div class="tblw"><table><tr><th>Eixo</th><th>Exemplos reais</th></tr>
<tr><td>Técnica narrativa</td><td>memória como recurso (2026), narrador, tempo</td></tr>
<tr><td>Personagem e transformação</td><td>Celestino jovem e velho (2026); Sinhá que vira Choquinha (2025); Rubião (2024, 2025)</td></tr>
<tr><td>Espaço simbólico</td><td>navio e casa (2026); cortiço (2026); engenho e usina (2025)</td></tr>
<tr><td>Contexto histórico</td><td>abolição (2025), educação feminina (2026), luta anticolonial (2025)</td></tr>
<tr><td>Estética de época</td><td>Arcadismo (2024), Expressionismo e Regionalismo de 30 (2025), Romantismo e Modernismo (2023)</td></tr>
<tr><td>Texto ou imagem externa</td><td>Sagan, Candido, fotografias de escola, pintura de Watteau</td></tr></table></div></section>
<section class="card"><h2>A resposta em 3 passos</h2>
<div class="note mn"><span class="lab">Fórmula</span><p><b>1. Afirme</b> a resposta numa frase, já usando as palavras do enunciado.<br><b>2. Prove com a obra:</b> um fato concreto (cena, personagem, verso, desfecho), não um resumo.<br><b>3. Ligue ao enunciado:</b> feche explicando o efeito, o sentido ou a relação pedida.</p></div>
<p>As respostas-modelo deste material seguem sempre esses 3 passos. Copie o formato.</p></section>
<section class="card"><h2>Verbos de comando</h2><ul class="tight">
<li><b>Identifique / aponte / cite:</b> nomeie com precisão e, se der, justifique em uma linha.</li>
<li><b>Explique:</b> diga o porquê, com causa e efeito.</li>
<li><b>Compare:</b> diga o que é igual e o que é diferente, nas duas obras, em paralelo.</li>
<li><b>Justifique / comente:</b> tome posição e prove com a obra.</li>
<li><b>Relacione:</b> mostre a ponte entre o texto dado e a obra; nunca analise os dois separados.</li></ul></section>
<section class="card"><h2>Erros que custam pontos</h2>
<div class="note peg"><span class="lab">Evite</span><p>Contar o enredo em vez de responder; responder só o item a e esquecer o b; falar do trecho sem ligar à obra inteira; trocar nomes de personagens; confundir obras da mesma autora (Sophia: Geografia × O Cristo Cigano); opinião sem prova.</p></div></section>
<section class="card"><h2>Exemplo resolvido: Fuvest 2026, questão 4</h2>
<p class="q">Celestino é retratado em dois momentos. a) Compare sua atitude diante da violência na juventude e seu estado psicológico na velhice. b) Explique a relação simbólica entre o navio e a casa.</p>
<details><summary>Ver como responder</summary><div class="in ans">
<p><span class="st">a) Afirme</span>Jovem, Celestino age com frieza calculada; velho, vive em tormento, entre esquecimento e delírio.</p>
<p><span class="st">Prove</span>Depois de sufocar os escravizados com cal, ele olha o horizonte e respira a maresia sem olhar os mortos. Na velhice, adormece de pé, sonha de olhos abertos, e seus braços repetem gestos de marinheiro.</p>
<p><span class="st">Ligue</span>A culpa não aparece como remorso, mas o passado volta pelo corpo e pela memória.</p>
<p><span class="st">b)</span>A casa repete o navio: na tempestade parece balsa à deriva ou porão de escravos. O silêncio do porão é trocado pelo barulho dos trovões. O quintal vira um “mar outro, sem homens e sem tempo”: espaço da consciência e do isolamento, onde ele é obrigado a confrontar a própria história (resposta esperada pela Fuvest).</p></div></details></section>`;

const CRUZAR=`<h1>Cruzar as obras</h1><p class="sub">A Fuvest já comparou duas obras da lista. Este quadro mostra as pontes mais prováveis. Cerca de 10 minutos.</p>
<section class="card"><h2>Pares com mais chance de cair</h2><ul class="tight">
<li><b>Memórias de Martha × Canção:</b> memória em 1ª pessoa. Martha lembra a própria vida, adulta, com culpa e reflexão; a narradora de Canção reconta o que ouviu de outra mulher, admitindo lacunas.</li>
<li><b>G. H. × A visão das plantas:</b> o contato com a vida não humana (barata, plantas) que não julga e desmonta o humano. Diferença: G. H. se transforma; Celestino não se arrepende.</li>
<li><b>Caminho de pedras × Balada:</b> mulheres julgadas por adultério, abandonadas, que terminam sustentando filhos. Noemi termina só e grávida; Sarnau aceita Mwando de volta.</li>
<li><b>Opúsculo × Memórias de Martha:</b> educação feminina. Nísia exige escolas em 1853; Martha vira professora por concurso no fim do século.</li>
<li><b>Nebulosas × Geografia:</b> poesia, natureza e liberdade. Narcisa contra a Constituição imposta e a escravidão; Sophia contra a ditadura salazarista.</li>
<li><b>A visão das plantas × Balada × Geografia:</b> o mar e o colonialismo. O porão negreiro, a deportação para Angola, e a celebração dos navegadores em “Descobrimento”.</li></ul></section>
<section class="card"><h2>Quadro de temas</h2><div class="tblw"><table>
<tr><th>Tema</th><th>Onde aparece</th></tr>
<tr><td>Memória</td><td>Martha (1ª pessoa retrospectiva), Balada (Sarnau velha), Canção (memória ouvida), G. H. (narra no dia seguinte), Visão (fantasmas do passado)</td></tr>
<tr><td>Escravidão e colonialismo</td><td>Opúsculo, Nebulosas, Visão, Balada, Geografia (“Descobrimento”), G. H. (Janair e o quarto dos fundos)</td></tr>
<tr><td>Educação</td><td>Opúsculo, Martha, Balada (missão), Canção (Angelina, primeira com curso superior)</td></tr>
<tr><td>Amor, casamento, autonomia</td><td>Caminho, Balada, Canção, Martha</td></tr>
<tr><td>Natureza e cosmos</td><td>Nebulosas, Geografia, Visão, Balada</td></tr>
<tr><td>Política e repressão</td><td>Caminho (Vargas), Geografia (Salazar), Nebulosas (Império), Balada (regime colonial)</td></tr>
<tr><td>Corpo</td><td>G. H. (comer a barata), Opúsculo (espartilho), Canção (desejo), Martha (feiura, nervos), Balada (violência)</td></tr>
<tr><td>Classe social</td><td>G. H. e Janair, Martha e o cortiço, Caminho (operários e intelectuais)</td></tr></table></div></section>
<section class="card"><h2>Narradores, num relance</h2><div class="tblw"><table>
<tr><th>Obra</th><th>Quem fala</th></tr>
<tr><td>Opúsculo</td><td>Ensaísta, “nós” oratório</td></tr><tr><td>Nebulosas</td><td>Eu lírico feminino</td></tr>
<tr><td>Martha</td><td>1ª pessoa, memória adulta</td></tr><tr><td>Caminho</td><td>3ª pessoa com discurso indireto livre</td></tr>
<tr><td>G. H.</td><td>1ª pessoa, fluxo de consciência</td></tr><tr><td>Geografia</td><td>Eu lírico voltado para o mundo</td></tr>
<tr><td>Balada</td><td>1ª pessoa (Sarnau) alternada com 3ª (Mwando)</td></tr><tr><td>Canção</td><td>Narradora-ouvinte que reconta</td></tr>
<tr><td>Visão</td><td>3ª pessoa, com o olhar das plantas e fragmentos de Celestino</td></tr></table></div></section>`;

const XQ=[
{src:'Cruzada: Memórias de Martha e Canção',p:'Nas duas obras, a narração depende da memória. Compare o modo como cada uma usa esse recurso.',a:['Nos dois livros a memória organiza a narrativa, mas de formas diferentes.','Martha lembra a própria vida, trinta e tantos anos depois, e julga a menina que foi (por exemplo, a culpa por ter abandonado Mathilde). Em Canção, a narradora lembra o que Juventina lhe contou e reconta a vida de outras mulheres, admitindo que a escrita trai o vivido.','Em Martha, memória é acerto de contas individual; em Canção, é memória coletiva e oral, a escrevivência.']},
{src:'Cruzada: G. H. e A visão das plantas',p:'Nas duas obras, um ser não humano (a barata; as plantas) tem papel central. Compare a função desses seres.',a:['Nos dois livros, a vida não humana é indiferente à moral humana.','A barata leva G. H. a perder a identidade organizada e a ver a vida “neutra”, até comer a massa branca. As plantas de Celestino não o julgam: florescem sobre um passado de mortes.','A diferença está no efeito: G. H. se transforma radicalmente; Celestino continua sem remorso, e a natureza apenas o acompanha até a morte.']},
{src:'Cruzada: Caminho de pedras e Balada',p:'Noemi e Sarnau rompem casamentos por amor. Compare o julgamento social que sofrem e o desfecho de cada uma.',a:['As duas são punidas socialmente pelo adultério e ficam sozinhas.','Noemi é condenada pelos camaradas e demitida pelo patrão, Seu Benevides, em nome da freguesia “de família”; perde filho, marido e companheiro. Sarnau perde os filhos e a posição de rainha, é abandonada e se prostitui.','No fim, Noemi segue sozinha e grávida, resistindo; Sarnau cobra o preço a Mwando, mas o aceita. Ambas sobrevivem pelo próprio trabalho.']},

<section class="card"><h2>Romantismo</h2>
<p><b>Contexto:</b> depois da Independência (1822), o Brasil quer uma literatura própria. Ascensão da burguesia e do público leitor, o romance em folhetim nos jornais. Marco: 1836.</p>
<p><b>Características:</b></p><ul class="tight">
<li><b>Subjetividade e sentimentalismo:</b> o “eu” e suas emoções no centro.</li>
<li><b>Idealização:</b> da mulher, do amor, da pátria, do indígena.</li>
<li><b>Nacionalismo:</b> natureza exuberante como orgulho nacional.</li>
<li><b>Fuga da realidade:</b> morte, noite, sonho, infância, saudade.</li>
<li><b>Religiosidade</b> cristã e liberdade de forma em relação às regras clássicas.</li></ul>
<p><b>As três gerações da poesia:</b></p><ul class="tight">
<li><b>1ª, nacionalista e indianista:</b> Gonçalves Dias, “Canção do exílio” (caiu em 2023).</li>
<li><b>2ª, ultrarromântica ou “mal do século”:</b> Álvares de Azevedo, Casimiro de Abreu. Tédio, morte, amor impossível, noite.</li>
<li><b>3ª, condoreira:</b> Castro Alves, “O navio negreiro”. Poesia social, abolição, república; tom grandioso, apóstrofes, exclamações, imagens do céu e do voo (o condor).</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Nebulosas</b> une a 2ª geração (“Desalento”, “Agonia”, a noite, a morte) e a 3ª (“O africano e o poeta”, a elegia a Castro Alves, os poemas cívicos). Natureza nacional (Itatiaia, Resende) e religiosidade também são românticas. <b>Opúsculo</b> é Romantismo em ensaio: apóstrofes (“Povos do Brasil!”), nacionalismo, natureza grandiosa, fé cristã; mas usa dados e razão, o que o afasta da pura emoção.</p></div></section>
<section class="card"><h2>Realismo</h2>
<p><b>Contexto:</b> crise do Império, campanha abolicionista (abolição em 1888), República (1889). Prestígio da ciência e do positivismo. Marco: 1881, <i>Memórias póstumas de Brás Cubas</i>, de Machado de Assis.</p>
<ul class="tight"><li><b>Objetividade:</b> retratar o mundo como ele é, sem idealizar.</li>
<li><b>Crítica social:</b> à burguesia, ao casamento por interesse, à hipocrisia, à Igreja.</li>
<li><b>Personagens comuns</b> e tempo presente; a cidade como cenário.</li>
<li><b>Análise psicológica</b> (sobretudo em Machado): motivações, contradições, ironia.</li></ul></section>
<section class="card"><h2>Naturalismo</h2>
<p><b>O que é:</b> o Realismo levado à ciência. O escritor trata personagens como “casos” a serem explicados. Obras-chave: <i>O mulato</i> (1881) e <i>O Cortiço</i> (1890), de Aluísio Azevedo.</p>
<ul class="tight"><li><b>Determinismo:</b> o ser humano é produto do meio, da hereditariedade e do momento histórico.</li>
<li><b>Animalização:</b> pessoas descritas como bichos, movidas por instintos.</li>
<li><b>Patologias, sexualidade, miséria</b> e vícios, sem pudor.</li>
<li><b>O coletivo</b> como personagem (o cortiço, a multidão) e descrição minuciosa.</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Memórias de Martha</b> é realista no retrato do cotidiano urbano, na crítica à desigualdade e ao casamento como amparo, e na recusa da idealização. Tem cenas naturalistas no cortiço: doença, sujeira, brutalidade da vizinha, pernas que incham pela umidade. Mas <b>foge do Naturalismo</b>: é narrado em 1ª pessoa, subjetivo, e Martha não é determinada pelo meio; ela sai do cortiço pela educação e pela vontade. Foi exatamente essa a questão de 2026, a partir de Antonio Candido sobre <i>O Cortiço</i>.</p></div>
<div class="note peg"><span class="lab">Pegadinha</span><p>Realismo e Naturalismo são parentes, não sinônimos: o Realismo critica a sociedade e analisa a psicologia; o Naturalismo explica as pessoas por leis “científicas” e determinismo.</p></div></section>
<section class="card"><h2>Modernismo brasileiro</h2>
<p><b>1ª fase (1922–1930):</b> Semana de Arte Moderna. Ruptura com o passado, verso livre, humor e paródia, linguagem coloquial, nacionalismo crítico (Mário e Oswald de Andrade).</p>
<p><b>2ª fase (1930–1945):</b> crise de 1929, Revolução de 30, Era Vargas. Na prosa, o <b>Romance de 30</b>: romance social, sobretudo nordestino (Graciliano Ramos, José Lins do Rego, Jorge Amado, Rachel de Queiroz). Denúncia da miséria e da exploração, linguagem regional e direta, engajamento político. Na poesia, Drummond e Cecília.</p>
<div class="note cai"><span class="lab">Na lista</span><p><b>Caminho de pedras</b> é Romance de 30 pelo compromisso social e político, pela linguagem seca e pela denúncia da repressão. Mas é <b>urbano</b> (Fortaleza), sem seca nem sertão, e dá peso à vida íntima de Noemi.</p></div>
<p><b>3ª fase (a partir de 1945):</b> a prosa se volta para dentro e para a linguagem. Clarice Lispector (introspecção) e Guimarães Rosa (invenção da língua, <i>Campo Geral</i> caiu em 2023). Traços: fluxo de consciência, monólogo interior, tempo psicológico, epifania, temas universais.</p>
<div class="note cai"><span class="lab">Na lista</span><p><b>A paixão segundo G. H.</b> é o exemplo extremo: uma manhã, um quarto, uma barata, e tudo acontece na consciência da narradora.</p></div></section>
<section class="card"><h2>Poesia portuguesa moderna</h2>
<p>Depois de Fernando Pessoa e do grupo de <i>Orpheu</i> (1915), a poesia portuguesa seguiu caminhos variados sob o Estado Novo (1933–1974; Salazar até 1968): poesia de intervenção, neorrealismo, surrealismo. Sophia de Mello Breyner (estreia em 1944) segue uma linha própria: clareza clássica, mito grego, luz e mar, atenção ao real e uma ética da justiça.</p>
<div class="note cai"><span class="lab">Na lista</span><p><b>Geografia</b>: verso livre, poemas em prosa, enumerações concretas; resistência à ditadura por imagens (“Procelária”, “Esta gente”) e não por panfleto.</p></div></section>
<section class="card"><h2>Literaturas africanas de língua portuguesa</h2>
<p><b>Contexto:</b> colonialismo português, guerras de libertação (1961–1974) e independências em 1975 (Moçambique e Angola). As literaturas desses países afirmam uma identidade própria contra o colonizador.</p>
<ul class="tight"><li>Valorização da <b>oralidade</b>, de provérbios, cantos e crenças.</li><li><b>Crítica ao colonialismo</b>: trabalho forçado, assimilação, violência.</li><li>Língua portuguesa misturada a termos locais.</li><li>Depois da independência, também crítica às próprias tradições e ao novo poder.</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Balada de amor ao vento</b>: oralidade, lobolo e poligamia, degredo colonial, e um olhar feminino que critica tanto o colonizador quanto o patriarcado. A Fuvest já cobrou <i>Nós matamos o cão tinhoso!</i> (2ª fase 2025) com esse eixo.</p></div></section>
<section class="card"><h2>Literatura contemporânea</h2>
<p>Do fim do século XX até hoje, não há uma escola única, mas tendências:</p>
<ul class="tight"><li><b>Novas vozes:</b> autoria negra, feminina, periférica (por exemplo, os <i>Cadernos Negros</i>, desde 1978).</li><li><b>Memória e testemunho.</b></li><li><b>Metaficção:</b> o texto discute a própria escrita.</li><li><b>Pós-colonialismo:</b> rever a história a partir dos colonizados e reescrever textos canônicos.</li><li>Mistura de gêneros e fragmentação.</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Canção para ninar menino grande</b>: escrevivência, memória oral, narradora que discute a escrita (metaficção). <b>A visão das plantas</b>: pós-colonial; reescreve Raul Brandão e expõe a violência escravista que Portugal esqueceu.</p></div></section>
<section class="card"><h2>Como usar numa resposta</h2>
<p class="q">Exemplo: “Memórias de Martha pode ser lido como romance naturalista?”</p>
<details><summary>Ver resposta-modelo</summary><div class="in ans"><p><span class="st">Afirme</span>Só em parte: há cenas naturalistas, mas o romance não aceita o determinismo.</p><p><span class="st">Prove com a obra</span>O cortiço de São Cristóvão aparece com doença, sujeira e violência, e o meio adoece os corpos (as pernas inchadas de Carolina). Porém Martha, narradora em 1ª pessoa, sai do cortiço pelo estudo e vira professora.</p><p><span class="st">Ligue ao enunciado</span>O Naturalismo explicaria as pessoas pelo meio; Júlia Lopes mostra uma mulher que vence o meio pela educação, o que aproxima a obra do Realismo psicológico e da defesa da instrução feminina.</p></div></details></section>`;

<div class="note cai"><span class="lab">Conclusão</span><p>Todo ano há pelo menos 2 ou 3 itens sobre recursos expressivos. Os campeões: <b>metáfora, ironia, polissemia, prosopopeia, gradação, antítese e repetição</b>. Nas questões de literatura, eles aparecem dentro da análise da obra.</p></div></section>
<section class="card"><h2>Como responder</h2><div class="note mn"><span class="lab">4 passos</span><p><b>1. Nomeie</b> a figura. <b>2. Aponte</b> onde ela está (as palavras exatas). <b>3. Explique o mecanismo:</b> o que foi transferido, trocado, repetido, invertido ou exagerado. <b>4. Diga o efeito</b> no texto: crítica, humor, ênfase, emoção, denúncia.</p></div>
<p>Só nomear vale pouco. Exemplo fraco: “é metáfora”. Exemplo bom: “Metáfora: ‘educação bancária’ transfere para a escola a lógica do banco, em que o professor deposita conteúdos no aluno passivo; o efeito é criticar um ensino que trata o saber como mercadoria”.</p></section>
<section class="card"><h2>As 10 que mais caem</h2>
<ul class="tight">
<li><b>Metáfora:</b> transferência de sentido por semelhança, sem conectivo (“A é B”). Efeito: condensar uma ideia numa imagem. Explique sempre <i>qual traço</i> passa de um termo ao outro.</li>
<li><b>Comparação:</b> semelhança explícita, com conectivo (como, tal qual, feito). Em 2026, “Catar feijão” comparava duas ações: aponte semelhança <i>e</i> diferença.</li>
<li><b>Metonímia:</b> troca por proximidade real (autor pela obra, lugar pelas pessoas, parte pelo todo). Ex.: “o estádio aplaudiu”.</li>
<li><b>Prosopopeia:</b> ações ou sentimentos humanos dados a coisas ou bichos. Efeito: dramatizar, aproximar, criticar.</li>
<li><b>Ironia:</b> dizer o contrário do que se quer dizer; o contexto (ou a imagem, nas charges) desmente as palavras. Explique o choque entre o dito e o mostrado.</li>
<li><b>Hipérbole:</b> exagero intencional. “Chorei rios”, “um milhão de vezes”. (Cuidado: na Fuvest 2026, “todo mundo” foi lido como <b>generalização retórica</b> que cria um falso consenso, não como hipérbole.)</li>
<li><b>Antítese:</b> ideias opostas lado a lado, sem absurdo lógico (riso e choro, dia e noite).</li>
<li><b>Paradoxo (oxímoro):</b> opostos fundidos no mesmo ser, com contradição lógica (“contentamento descontente”). Central em Clarice.</li>
<li><b>Gradação:</b> sequência em degraus, crescente (clímax) ou decrescente (anticlímax).</li>
<li><b>Repetição (anáfora, refrão):</b> mesma palavra no início de versos ou frases; cria ênfase, ritmo, insistência.</li></ul></section>
<section class="card"><h2>Parentes que também caem</h2><ul class="tight">
<li><b>Polissemia:</b> uma palavra com vários sentidos, explorada de propósito (“destino” de viagem e “destino” do lixo; “execução”). Diga os dois sentidos e o efeito (humor, crítica).</li>
<li><b>Ambiguidade:</b> frase com duas leituras possíveis (o “suas” do anúncio do Greenpeace, 2023: raízes da árvore ou do leitor).</li>
<li><b>Expressão idiomática:</b> sentido figurado fixo (“encher linguiça”, “cumprir tabela”, “pérolas aos porcos”). Explique o sentido literal e o figurado.</li>
<li><b>Símbolo:</b> imagem que carrega um sentido abstrato (o azul, a cal, a barata).</li>
<li><b>Neologismo:</b> palavra nova criada por derivação (“fluviante”, “flutual”, “volância”). Explique os elementos (radical + sufixo) e o sentido.</li></ul></section>

<div class="note mn"><span class="lab">Gatilhos pelo nome</span><p><b>meta-</b> = mudança (metáfora, metonímia) · <b>anti-</b> = contra (antítese) · <b>para-</b> = contra a lógica (paradoxo) · <b>hiper-</b> = excesso (hipérbole) · <b>eu-</b> = bom, suave (eufemismo) · <b>sin-</b> = junto (sinestesia, silepse) · <b>poli-</b> = muitos (polissíndeto) · <b>a-</b> = sem (assíndeto, anacoluto) · <b>ana-</b> = de novo (anáfora) · <b>peri-</b> = em volta (perífrase) · <b>pleo-</b> = cheio (pleonasmo) · <b>proso-</b> = rosto (prosopopeia).</p></div></section>
<section class="card"><h2>Pegadinhas</h2><div class="note peg list"><span class="lab">Pares que confundem</span><ul>
<li><b>Metáfora × comparação:</b> procure o conectivo (como, tal qual, feito). Com ele, é comparação.</li>
<li><b>Antítese × paradoxo:</b> faz sentido literal? Antítese. Contradiz a lógica no mesmo ser? Paradoxo.</li>
<li><b>Metonímia × metáfora:</b> metonímia troca por proximidade real (lugar, autor, parte); metáfora, por semelhança imaginada.</li>
<li><b>Metonímia × catacrese:</b> existe palavra própria? Se não existe (“braço da poltrona”), é catacrese.</li>
<li><b>Elipse × zeugma:</b> o termo omitido já apareceu antes? Então é zeugma.</li>
<li><b>Aliteração × assonância:</b> consoantes × vogais, pelo som, não pela letra.</li>
<li><b>Pleonasmo estilístico × vicioso:</b> intenção expressiva (literatura) × descuido (“subir para cima”).</li>
<li><b>Prosopopeia × metonímia:</b> em “o estádio aplaudiu”, quem aplaude são as pessoas (metonímia), não o prédio humanizado.</li></ul></div></section>
<section class="card"><h2>Figuras nas obras da lista</h2><ul class="tight">
<li><b>A paixão segundo G. H.:</b> paradoxo e oxímoro (alegria difícil, inferno como alegria); metáfora (terceira perna; o quarto = deserto; a massa = hóstia invertida); repetição encadeada das seções (a frase final de uma abre a seguinte, uma anadiplose em escala de livro); apóstrofe ao “tu” e à mão.</li>
<li><b>Geografia:</b> metáfora e alegoria (procelária, Minotauro); enumeração e assíndeto (cal, pedra, sal, luz); anáfora; prosopopeia (o mar, a casa que se reúne).</li>
<li><b>Nebulosas:</b> metáfora (nebulosas = “alvos cisnes do mar da imensidade”, sem “como”); apóstrofe e exclamação; hipérbato; refrão em “O africano e o poeta” (pergunta e resposta “o poeta”).</li>
<li><b>Opúsculo:</b> apóstrofe, ironia e interrogação retórica (“Povos do Brasil, que vos dizeis civilizados!”); gradação.</li>
<li><b>Memórias de Martha:</b> metáfora e antítese (“flores nos pântanos”, Carolina no cortiço).</li>

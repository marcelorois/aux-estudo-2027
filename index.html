['1. A Mafalala, o melão e o vulcão (cap. 1)','<p><b>O que acontece.</b> Sarnau, envelhecida, abre o livro com saudade do Save e se apresenta na Mafalala, bairro de miséria de Lourenço Marques. A filha que estuda lhe disse que a Terra é verde por fora e vermelha no centro, como um melão; Sarnau conclui que a terra é como a mulher: aguenta os golpes calada até explodir como vulcão. Duvida que sua história interesse, porque não tem nada de novo: muitas mulheres vivem assim.</p><p><b>Como está escrito.</b> Comparações em cadeia (terra, melão, mulher), metáfora do vulcão, perguntas retóricas e fala dirigida a ouvintes (ela pede que não a levem a mal). Diz estar dispersa entre o Save, a Mafalala e o ar.</p><p><b>O que significa.</b> A moldura define o romance: memória oral de uma mulher comum, cuja vida representa a de muitas. Por isso a violência que ela conta é estrutura, não caso isolado.</p><p><b>Como cairia.</b> Foco narrativo e memória; base para a leitura da Q78 (patriarcado que atravessa contextos).</p>'],
['2. O Éden à beira do Save (cap. 2)','<p><b>O que acontece.</b> Mwando é expulso do colégio da missão (o padre Ferreira flagra Salomão com a cozinheira, amante do próprio padre, e bate nos dois rapazes). Livre, passeia com Sarnau; do alto da figueira, descreve os campos como Deus os veria e a coroa de flores como rainha dos prados, descalça. Os dois se amam na relva; o Save lava o sangue da primeira vez. Ela pede que ele agradeça à defunta protetora com dinheiro, rapé e pano vermelho; ele promete cem escudos e nunca paga.</p><p><b>Como está escrito.</b> Intertexto bíblico (Adão, serpente, maçã verde) misturado às crenças locais. <b>Apóstrofe</b> e <b>prosopopeia</b>: ela manda o sol, a nuvem e o vento se esconderem. Repetição do verde como cor do amor.</p><p><b>O que significa.</b> O amor nasce na natureza e no sincretismo. A coroa de flores antecipa, com ironia, a coroa real; a promessa não paga volta no “paga-me” do cap. 19.</p><p><b>Como cairia.</b> Natureza cúmplice; ironia contra a moral da missão; ligação com o desfecho.</p>'],
['3. A recusa cristã e a lagoa (cap. 3)','<p><b>O que acontece.</b> Mwando some com desculpas. Sarnau anuncia a gravidez; ele revela que vai casar com a moça escolhida pelos pais. Ela aceita ser a segunda, a décima primeira, a centésima primeira; ele diz que é cristão e não aceita poligamia. Desesperada, Sarnau entra na lagoa para morrer; um pescador a salva; ela sangra e perde a gravidez. A curandeira prevê que ela morrerá do outro lado do mar, sem a família no funeral.</p><p><b>Como está escrito.</b> <b>Gradação</b> e <b>hipérbole</b> na súplica (dez, cem, cento e uma); a dor como tempestade interna; gradação da água subindo pelo corpo.</p><p><b>O que significa.</b> Primeira ironia do livro: a monogamia cristã serve de desculpa para abandonar a mulher grávida. A missão não protege Sarnau.</p><p><b>Como cairia.</b> Mwando não é herói romântico; crítica à missão; figuras de intensidade.</p>'],
['4. O lobolo de 36 vacas (cap. 4)','<p><b>O que acontece.</b> A velha rainha escolhe Sarnau para esposa do herdeiro porque ela lhe deu água na concha das mãos (a noiva prevista, Khedzi, fora rejeitada como feiticeira). O lobolo é de 36 vacas que ainda não pariram, o maior já visto. A avó reza dizendo, com os antepassados, que a filha é criada para ser dada de presente aos visitantes. Diante dos panos, colares e dinheiro, Sarnau pensa que aquilo é uma feira e ela está à venda. O tio diz que ela é a avó Sarnau renascida, que antigamente fora “comprada” com uma peneira de feijão.</p><p><b>Como está escrito.</b> Ritual minucioso (rapé, pano vermelho, culunguanes). Ambivalência: a mãe fala em escravatura, Sarnau em sorte e triunfo. No fim, ela defende a beleza do campo (pés rachados, mãos calosas) contra o padrão da cidade.</p><p><b>O que significa.</b> O lobolo é honra e compra ao mesmo tempo: a mulher é valor de troca entre famílias, ideia que o cap. 19 leva ao extremo.</p><p><b>Como cairia.</b> Lobolo como controle; personagem dividida entre orgulho e sujeição.</p>'],
['5. O casamento: pilões, conselhos e a roda (cap. 5)','<p><b>O que acontece.</b> Na semana de reclusão, as mulheres cantam ao ritmo dos pilões conselhos à noiva: o marido é senhor; se bater, é porque ama; aceite amantes e concubinas. Sarnau, vaidosa, manda as velhas calarem. Na festa, acha-se bela de branco ao lado do marido de preto; as mulheres dançam em roda batendo palmas. Uma tia velha põe um pilão aos pés dela: o lar é o pilão e a mulher, o cereal. A mãe chora e diz que nem toda lágrima é tristeza: a filha parte para a escravatura. Sarnau é entregue aos Zucula sentindo-se condenada a caminho do cadafalso; só a irmã Rindau a acompanha.</p><p><b>Como está escrito.</b> Os conselhos entram na narração sem aspas (<b>discurso indireto livre</b>, a voz coletiva das mulheres dentro da de Sarnau). <b>Refrão</b>, <b>metáfora</b> do pilão, <b>antíteses</b> (festa e funeral, noiva e escrava).</p><p><b>O que significa.</b> O rito ensina a submissão e, ao mesmo tempo, mostra que as mulheres conhecem o preço. A dança é <b>lúdica</b> (Q76 da 1ª fase de 2027) e também anestesia: as dançarinas se ausentam do mundo.</p><p><b>Como cairia.</b> É o trecho da Q76. Na 2ª fase: função do refrão, metáfora do pilão, festa e dor juntas.</p>'],
['6. A cama, a água do banho e o dente (cap. 6)','<p><b>O que acontece.</b> Cheia de desejo, Sarnau corre ao quarto e encontra o marido com outra esposa na própria cama, nas capulanas novas dela. Esquenta a água do banho dos dois, como mandavam os conselhos. Nguila percebe que ela chorou, dá-lhe um pontapé e uma bofetada que arranca um dente; a rival, grávida, ri. A velha rainha a consola: as duas foram pescadas em outros lagos e trazidas para o mesmo curral; aprenda a ser serva obediente. À noite, Nguila diz que a bofetada foi disciplina e que ela é sua flor.</p><p><b>Como está escrito.</b> <b>Metáfora</b> do fogo (ela faísca, ele lenha e petróleo) que se apaga (ela vira vento frio). Os conselhos do cap. 5 voltam dentro da cena como refrão irônico. <b>Hipérbole</b>: as lágrimas formam um lago.</p><p><b>O que significa.</b> A violência é naturalizada pelo agressor (disciplina, amor) e pela sogra, também vítima. No mesmo capítulo, Sarnau sonha a aldeia real como uma pocilga: o rei é o varrão, as esposas são porcas, e ela termina como mais uma.</p><p><b>Como cairia.</b> Violência de gênero e sua naturalização (versão discursiva da Q78); metáfora do fogo.</p>'],
['7. A consciência e a lenda dos canibais (caps. 8 e 9)','<p><b>O que acontece.</b> Desprezada (são sete esposas e Phati, a quinta, é a favorita), Sarnau vê o velho rei morrer entre presságios (borboletas negras, corujas, pangolim) e ser enterrado de cócoras; a rainha morre oito dias depois. Nguila vira rei. Mwando volta, pobre, e a chama de rainha e mãe; ela corre atrás dele e se entregam. No cap. 9, discute com a própria consciência: as outras esposas também têm amantes; ela não busca prazer, busca vida; não tem marido, tem um símbolo.</p><p><b>Como está escrito.</b> Monólogo em forma de diálogo com a consciência. Comparação com a lenda da guerra dos Ngunis: quem provou carne humana não consegue parar; ela provou um homem e não vive sem ele.</p><p><b>O que significa.</b> O adultério surge como reação à poligamia que a abandona, sem santificar Sarnau: ela também é vaidosa e calculista.</p><p><b>Como cairia.</b> Personagem vítima e agente; comparação/alegoria; presságios da natureza.</p>'],
['8. O herdeiro à lua e a fuga (caps. 11 e 12)','<p><b>O que acontece.</b> O filho de Mwando nasce num parto difícil; os adivinhos culpam Phati, que é amarrada e espancada (Sarnau sabe que ela é inocente). O menino, claro como o pai verdadeiro, é erguido à lua cheia como herdeiro ao grito de kenguelekezê, e todos atribuem a cor ao ódio entre Sarnau e Phati. Mwando promete levá-la para a cidade, onde cada homem teria uma só mulher. Sarnau decide ficar pelos filhos, mas Phati a flagra e conta a Nguila, que ameaça o julgamento pela wanga e chora abraçado a ela. À noite, ela foge com Mwando de barco pelo Save, deixando os três filhos.</p><p><b>Como está escrito.</b> Ritual com <b>refrão</b> sonoro; <b>ironia dramática</b> (o rei se orgulha do filho alheio); hesitação em vaivém (parto, não parto).</p><p><b>O que significa.</b> A mulher acusada de feitiço paga pelo que não fez; a linhagem real passa a carregar o adultério (esse menino, Zucula, será rei). A promessa da cidade monogâmica será desmentida.</p><p><b>Como cairia.</b> Ironia; acusação de feitiçaria como violência contra mulheres.</p>'],
['9. O porão, a destronca e o “padre Moçambique” (caps. 14 a 17)','<p><b>O que acontece.</b> Em Vilanculos, Mwando descobre que o rei mandou matá-lo e que Phati foi executada; culpa Sarnau, diz que só quis o orgulho de dormir com a mulher do rei e a deixa inconsciente com um golpe. Depois, em Lourenço Marques, é tramado por um sipaio cafetão: fala e escreve bem o português, mas a caderneta de indígena está sem carimbo, e ele é deportado. No porão, capatazes negros xingam negros. Em Angola, os presos derrubam a floresta para o café, que vira roça verde de sangue e dinheiro. Mwando vira o “padre Moçambique”: reza em latim e é usado pelos colonos para acalmar revoltas. Volta após quinze anos.</p><p><b>Como está escrito.</b> Narrador em <b>3ª pessoa</b> (o que Sarnau não viu). <b>Prosopopeia</b>: o navio dança a valsa da tempestade, a floresta resiste e é queimada. Provérbios sobre o poder (o escravo liberto vira tirano).</p><p><b>O que significa.</b> A violência colonial atinge o homem colonizado; e o cristianismo, de novo, serve ao poder. Ironia: o sonho da batina se realiza no degredo.</p><p><b>Como cairia.</b> Contexto histórico (indigenato, xibalo); comparação com <i>Caminho de pedras</i> (Roberto deportado) e <i>A visão das plantas</i> (porão de navio).</p>'],
['10. Vinte e quatro casamentos e o candeeiro (caps. 19 e 20)','<p><b>O que acontece.</b> Sob temporal, Mwando derruba o cesto de tomates de Sarnau e diz que a procurou a vida toda. Ela exige que pague: a oferenda à protetora, a virgindade, o resgate. Ele a chama de prostituta; ela responde que foi ele quem a fez assim e conta as doenças e o ovário perdido. Revela que ela mesma devolveu as 36 vacas: com elas a família fizera 24 lobolos, e seu preço agora é de 24 casamentos. Nguila casou com Rindau; o filho Zucula virou rei. Ela diz que cantou para ele baladas de amor ao vento e foge. Em casa, Phati e João o chamam de pai; ele diz que as crianças precisam de pai. Sarnau se diz vencida, decide sustentá-lo com sua casa e seu negócio e apaga o candeeiro.</p><p><b>Como está escrito.</b> Refrão “paga-me”; <b>prosopopeia</b> do Save como testemunha que já correu para o mar; frases curtas isoladas no fim; <b>paradoxo</b> da escuridão da paz.</p><p><b>O que significa.</b> Sarnau vira a lógica do lobolo em cobrança de dignidade: quem pagou foi ela. Mas o final é ambíguo: aceita Mwando por desejo e pelos filhos, já como dona da casa e provedora.</p><p><b>Como cairia.</b> Centro de qualquer item b) sobre trajetória, título e desfecho.</p>']
],
critica:'<p><b>A autora e o livro.</b> Paulina Chiziane (1955) estreou como romancista com este livro, em 1990; é apontado como o primeiro romance publicado por uma mulher em Moçambique. Em 2021 ganhou o Prêmio Camões, primeira mulher africana a recebê-lo (entregue em 2023, dedicado às mulheres). Ela costuma se dizer <b>contadora de histórias</b>, não romancista, pelo peso da tradição oral. A edição usada (Companhia das Letras) mantém a grafia de Moçambique.</p><p><b>Quando se passa.</b> No Moçambique <b>colonial</b>: escudos, administrador, sipaios, caderneta de indígena, deportação, e a capital ainda é Lourenço Marques. O Estatuto do Indigenato (caderneta, trabalho forçado ou xibalo) foi abolido em 1961, então a prisão de Mwando é anterior a isso; o livro não dá datas.</p><p><b>Como a Fuvest leu o livro.</b> <b>1ª fase 2027, Q78 (gabarito C):</b> a violência de gênero do romance, ligada a dados de estupro e feminicídio no Brasil, mostra <b>sistemas patriarcais que atravessam diferentes contextos históricos e geográficos</b> (Sarnau com Nguila e depois com Mwando); erradas: desvio individual, só efeito do colonialismo, fenômeno recente, conflito amoroso inevitável. <b>Q76 (gabarito E):</b> a dança das mulheres em roda no casamento (Sarnau bela de branco) e a malhação do Judas em <i>Canção para ninar menino grande</i> têm o <b>componente lúdico</b> como centro. <b>Simulado oficial 2027 (2ª ed., S3):</b> com um verbete sobre a balada (gênero medieval, oral, ligado ao canto e à dança, com refrões e autoria coletiva), a correta diz que o título se justifica porque o romance ressignifica a tradição por meio de uma narradora que <b>abandona a posição resignada</b> e reinterpreta os papéis da mulher no amor e na família; outra questão lê um trecho do cap. 18 como tensão entre a estabilidade do presente e as marcas do passado.</p><p><b>O que a crítica destaca</b> (títulos vistos em busca): a condição feminina e a passagem da balada à prosa poética (Sávio Roberto Fonseca de Freitas, UFPB); o lobolo como parte da tradição do sul de Moçambique, enquanto a poligamia é questionada (Rosilda Alves Bezerra, Univ. de Coimbra); a comparação com <i>Niketche</i> (2002), o romance da autora sobre poligamia; leituras pós-coloniais que veem no livro a crítica ao mesmo tempo da ideologia colonial e da hegemonia masculina.</p><p><b>Síntese para a prova.</b> O romance não opõe tradição má a modernidade boa. A tradição (lobolo, poligamia, conselhos, acusação de feitiço) oprime, mas também dá nome e lar aos filhos e cria redes de mulheres (a rainha, Rindau, as curandeiras). A modernidade cristã e colonial (missão, cidade, monogamia) promete libertar e não liberta: Mwando abandona em nome da monogamia, o pai de João não reconhece o filho por ser cristão, a cidade é a Mafalala. Sarnau resume: com poligamia, monogamia ou sozinha, a vida da mulher é dura.</p><p><b>Escola.</b> Confirma a literatura moçambicana pós-independência (oralidade, cantos, provérbios, rituais, termos locais, crítica ao colonialismo) e rompe com a literatura de afirmação nacional: voz feminina, crítica à própria tradição, nenhum herói da libertação, final sem redenção.</p><p><b>Fatos que mais confundem.</b> O “padre Moçambique” do velório em Angola é o próprio Mwando. Quem devolveu as 36 vacas foi Sarnau. Nguila casou com Rindau, irmã de Sarnau. A filha Phati se chamava Chivite e recebeu o nome da rival morta para acalmar seu espírito.</p>',
qbank:[
{p:'(Texto externo: Fuvest 2027 e dados do Brasil) A Fuvest afirmou que, no romance, as relações afetivas são atravessadas por hierarquias de gênero que naturalizam a desigualdade e a violência contra as mulheres, e o comparou a dados brasileiros de estupro e feminicídio. a) Cite duas cenas em que a violência contra Sarnau é tratada como normal pelos próprios personagens. b) Explique por que o romance permite ler essa violência como estrutural, e não como desvio de um homem.',a:['No romance, a violência contra a mulher é ensinada e justificada pela comunidade, o que a torna estrutura social, não exceção.','No casamento, as mulheres cantam que, se o marido bater, é sinal de amor, e no cap. 6 Nguila arranca um dente de Sarnau e chama a bofetada de disciplina, enquanto a rainha aconselha resignação; anos depois, Mwando, o cristão monogâmico, também a agride e a abandona (cap. 14) e a força no reencontro (cap. 19).','Como a violência vem do polígamo e do monogâmico, da aldeia e da cidade, e a narradora diz que sua história não é nova porque muitas mulheres vivem assim, o livro mostra um patriarcado que atravessa contextos, o que permite aproximá-lo dos dados brasileiros.']},
{p:'(Texto externo: verbete) Miguel Alarcão (E-Dicionário de Termos Literários) define a balada como gênero de origem medieval, ligado à dança, à música e ao canto, transmitido oralmente, com fórmulas repetidas e autoria coletiva. a) Aponte dois traços do romance que justificam o título. b) Mostre como a frase em que Sarnau diz ter cantado baladas de amor ao vento ganha sentido no desfecho.',a:['O romance retoma da balada a oralidade, o refrão e a voz coletiva, mas faz dela a história de uma mulher que reinterpreta o próprio papel.','Sarnau narra a ouvintes como quem conta em roda, e o texto repete refrões (os conselhos do casamento, o grito kenguelekezê, o “paga-me”); no cap. 19 ela diz que cantou baladas de amor ao vento, isto é, amou alguém que o vento levava (no cap. 14 já o chamara de nuvem e vento).','No desfecho, porém, ela já não é só a mulher que espera e canta: cobra o preço de 24 casamentos, sustenta a casa e decide aceitar Mwando, ressignificando a balada de espera e dor, ainda que o final seja ambíguo.']},
{p:'(Texto externo: história) Um texto histórico explica que, no Moçambique colonial, o Estatuto do Indigenato separava “indígenas” e “civilizados”, obrigava o africano a portar caderneta e o expunha ao trabalho forçado (xibalo), até ser abolido em 1961. a) Relacione o texto à prisão de Mwando. b) Explique a ironia do destino de Mwando em Angola, considerando sua formação na missão.',a:['A prisão de Mwando mostra que, no sistema colonial, saber português e escrever bem não fazia do africano um cidadão.','Acusado por um sipaio, cafetão da mulher com quem ele vivia, Mwando se defende em bom português e escreve com boa caligrafia, mas a caderneta de indígena está sem carimbo e ele é deportado para Angola (cap. 15); lá vira o “padre Moçambique”, reza em latim e é usado pelos colonos para pregar resignação e acalmar revoltas (cap. 17).','O rapaz que abandonou Sarnau em nome do cristianismo realiza o sonho da batina como instrumento do trabalho forçado, o que expõe a missão como parte do aparelho colonial descrito no texto.']},
{p:'(Imagem descrita para o exercício) Fotografia de um mercado de rua em Maputo: mulheres sentadas atrás de bancas de tomate, cebola e amendoim; uma delas tem um bebê amarrado às costas por uma capulana. a) Relacione a imagem ao cap. 18 do romance. b) Explique o que esse trabalho significa na trajetória de Sarnau, de “rainha” a vendedora.',a:['A imagem corresponde à Sarnau do presente da narração, vendedora no mercado da Mafalala, que sustenta sozinha os filhos.','No cap. 18 ela anuncia legumes aos gritos, com a filha Phati vendendo amêijoas e o filho João torrando amendoim, depois de ter sido criada de comerciantes indianos e de ter se prostituído; antes, como primeira esposa do rei, tinha braceletes de ouro e servas, mas era desprezada e agredida.','O mercado é pobreza e também autonomia: é com esse trabalho que ela devolve as 36 vacas e, no fim, pode dizer que tem casa, negócio e dinheiro para sustentar Mwando, invertendo o papel de provedor.']},
{p:'(Comparação: Canção para ninar menino grande) Na 1ª fase de 2027, a Fuvest aproximou a dança das mulheres no casamento de Sarnau da malhação do Judas em Canção para ninar menino grande, pelo componente lúdico. a) Que outra função a festa do casamento tem no romance de Chiziane? b) Compare a formação de Nguila ou de Mwando com a de Fio Jasmim quanto ao modelo de masculinidade.',a:['A festa do casamento é lúdica, mas também é rito de ensino da submissão feminina, e os dois romances mostram homens formados por uma comunidade que mede a virilidade pelo domínio sobre mulheres.','No cap. 5, entre danças e palmas, as mulheres cantam conselhos de obediência, a tia entrega o pilão e a mãe chora dizendo que a filha vai para a escravatura; no cap. 7, o conselho de anciãos condena Mwando por não dominar Sumbi, e o gosto de Nguila por mulheres orgulha o velho rei, assim como Fio Jasmim foi criado pelo pai e pelos homens mais velhos para provar a macheza conquistando mulheres.','Em Moçambique (poligamia oficial) e no interior do Brasil (casamento formal e amantes em cada cidade), a festa convive com uma educação masculina que deixa às mulheres a espera e a criação dos filhos.']},
{p:'(Comparação: Caminho de pedras) Noemi e Sarnau rompem o casamento por amor. a) Compare o modo como o poder atinge os homens que elas amam. b) Compare os desfechos das duas protagonistas.',a:['Nos dois romances o homem amado é preso e deportado pelo poder, e a mulher fica sozinha, grávida, tendo de se sustentar.','Roberto é preso distribuindo boletins e deportado para uma colônia numa ilha na repressão da Era Vargas, enquanto Mwando, tramado por um sipaio e sem caderneta, vai para o trabalho forçado em Angola; Noemi termina sozinha e grávida subindo a ladeira, e Sarnau, depois de dezesseis anos sustentando os filhos no mercado, recebe Mwando de volta.','Noemi termina sem o homem, mas com dignidade e esperança, e Sarnau o aceita sabendo que vai sustentá-lo e se declara vencida: por caminhos diferentes, as duas mostram o preço que a mulher paga por escolher o amor.']},
{p:'(Personagem e desfecho) No reencontro, Sarnau exige de Mwando o preço de vinte e quatro casamentos. a) Explique a conta que ela faz. b) Discuta se o desfecho representa vitória ou derrota da personagem.',a:['A conta transforma o lobolo em cobrança de dignidade: Sarnau mostra que seu valor circulou por toda a comunidade e que quem pagou a dívida foi ela.','Com as 36 vacas do seu lobolo, os irmãos casaram seis mulheres e os irmãos delas casaram outras, somando 24 lobolos; como ela fugiu, teve de juntar dinheiro, inclusive se prostituindo, para devolver o gado a Nguila e evitar 24 divórcios; no cap. 20, Mwando apela para os filhos e ela, dizendo-se vencida, apaga o candeeiro e o aceita.','O desfecho é ambíguo: ela cede ao desejo e à ideia de um pai para os filhos, mas aceita em posição nova, como dona da casa e do negócio, e não como mulher lobolada.']},
{p:'(Escola literária) O romance pertence à literatura moçambicana posterior à independência (1975), embora a ação se passe no período colonial. a) Aponte dois traços em que ele confirma essa literatura. b) Aponte um traço em que ele se afasta da literatura de afirmação nacional.',a:['O livro confirma a literatura moçambicana pós-independência pela oralidade e pela crítica ao colonialismo, mas se afasta dela ao criticar também a tradição africana a partir de uma voz feminina.','A narradora conta a ouvintes, com cantos, provérbios, rituais e termos locais, e os capítulos sobre Mwando denunciam caderneta, sipaio, deportação e trabalho forçado em Angola; ao mesmo tempo, lobolo, poligamia, conselhos de submissão e acusações de feitiço contra mulheres (Phati espancada no parto) aparecem como opressão.','Em vez de idealizar a África contra o colonizador, Chiziane mostra a mulher oprimida pelos dois sistemas, ponto de vista inédito no primeiro romance publicado por uma moçambicana.']},
{p:'(Figuras: metáfora e refrão) No casamento, uma velha tia põe um pilão aos pés da noiva e diz que o lar é um pilão e a mulher, o cereal, que será triturado para fazer a felicidade da família. a) Identifique a figura e explique seu sentido. b) Explique o efeito dos conselhos repetidos nos caps. 5 e 6.',a:['É uma metáfora: o casamento é o pilão que tritura, e a esposa é o milho que suporta tudo para alimentar a família.','A imagem vem do trabalho diário das mulheres e se soma aos conselhos cantados ao ritmo dos pilões (o marido é senhor; se bater, é amor; o homem não foi feito para uma só mulher), que voltam no cap. 6, quando Sarnau encontra o marido com outra na própria cama e é agredida.','A repetição faz o conselho funcionar como refrão de balada e mostra o rito cumprido na prática: o que era canto de festa vira a violência vivida pela personagem.']},
{p:'(Figuras: prosopopeia e paradoxo) No reencontro, Sarnau pensa que as águas do Save foram testemunhas do seu amor, mas que as águas que a viram já correram para o mar e só restam as árvores e o céu. No último parágrafo, ela apaga o candeeiro e mergulha com Mwando na escuridão da paz. a) Identifique e explique as duas figuras. b) Relacione-as ao sentido do final do romance.',a:['Na primeira passagem há prosopopeia (o rio, as algas e os peixes como testemunhas) e, na segunda, paradoxo (escuridão associada à paz).','O Save, que lavou o sangue da primeira noite (cap. 2), aparece como testemunha que já se foi, sinal de que o passado não pode ser provado nem devolvido; e a escuridão da paz, que já fechava o cap. 18 como descanso depois do trabalho, volta no fim como esquecimento, quando Sarnau enterra o passado e aceita Mwando.','As duas figuras mostram uma reconciliação feita de perda: a paz vem do apagamento da memória e da luz, e não da reparação que Sarnau tinha exigido.']}
]
});

Object.assign(BOOKS.find(b=>b.id==='caminho'),{
perto:[
['1. A chegada e “qual é a classe do camarada?” (cap. 1 e 2)','<p><b>O que acontece.</b> Roberto volta a Fortaleza depois de dez anos e não reconhece a cidade. No café, uma moça risonha derruba a bolsa e roça o ombro dele: é Noemi, ainda sem nome (o cap. 5 confirma). Na primeira reunião, numa salinha pobre com caixotes, Roberto, que sonhava uma conversa fraterna, acaba fazendo discurso. Vinte-e-Um pergunta, irônico, qual é a classe dele; um operário diz que estão fartos de seguir “doutores”. Filipe, o mocinho magro, defende Roberto. Ele sai magoado, sentindo-se tratado como impostor.</p><p><b>Como está escrito.</b> 3ª pessoa colada a Roberto, com <b>discurso indireto livre</b> (as perguntas finais, sem resposta, são dele). Comparações teatrais: ele espera como ator antes de entrar no palco; a reunião parece sessão fúnebre.</p><p><b>O que significa.</b> O conflito <b>intelectual × operário</b> abre o livro, sem lado simples: Roberto é sincero, mas a desconfiança dos operários é justa (Filipe dirá isso no cap. 3). E quem fica encarregado de “organizar as mulheres” é um homem, Rufino.</p><p><b>Como cairia.</b> Classe e militância; foco narrativo; comparação com G. H. e Janair (classe).</p>'],
['2. A rodinha e a reunião: mulher como “presa” (cap. 6 e 8)','<p><b>O que acontece.</b> Na Praça do Ferreira, operários e intelectuais combinaram não se cumprimentar na rua. A “rodinha” fala de mulheres: Samuel ri da “socialização de mulheres”; Nascimento diz que as boas mulheres são privilégio do burguês; Filipe responde que mulher não é presa de guerra e também deseja. Todos sonham com uma relação só de um homem e uma mulher, sem dinheiro nem preconceito. No cap. 8, a reunião acusa Roberto de cuidar de assuntos particulares, e Rufino afirma que revolucionário de verdade não pode ter vida particular.</p><p><b>Como está escrito.</b> Diálogo rápido, com tipos marcados. A <b>metáfora</b> da mulher como presa de guerra denuncia o modo de pensar dos próprios camaradas. <b>Metonímia</b>: os intelectuais são os “gravatas”; os operários, os “tamancos”.</p><p><b>O que significa.</b> O livro prepara o julgamento de Noemi: quando ela viver o amor livre que eles sonhavam, será condenada por eles. A organização quer controlar até a vida íntima.</p><p><b>Como cairia.</b> Machismo e moralismo da esquerda; o privado como político.</p>'],
['3. Angelita, a militante operária (cap. 4 e 7)','<p><b>O que acontece.</b> Angelita, costureira de paramentos de padre, mãe de muitos filhos, aceita sem hesitar entrar na nova organização, mesmo lembrando a fome e a prisão dos tempos do Bloco. Filipe repara nas pontas dos dedos picadas de agulha. Em casa, o marido, Assis, que apanhou na cadeia, recusa voltar à luta. Quando o filho Vladimir pede que ela não irrite o pai, Angelita o repreende por já ter medo e volta à máquina, sob um retrato de revista que, pela descrição, é Lênin.</p><p><b>Como está escrito.</b> <b>Metonímia</b>: as mãos picadas resumem a vida de trabalho (Filipe brinca que o mundo do futuro será feito com mãos assim). A <b>repetição</b>, no pensamento de Filipe, do “naturalmente que entro” mostra uma coragem sem pose de heroína.</p><p><b>O que significa.</b> Angelita é o contraponto de Noemi: operária, firme, sem drama amoroso, mas também esmagada (adoece de tanto pedalar e no fim vai embora com a família).</p><p><b>Como cairia.</b> Trabalho feminino; mulheres na militância; comparação com Martha.</p>'],
['4. Noemi desperta (cap. 9)','<p><b>O que acontece.</b> Voltando do curso político, Noemi sente-se uma alma livre: vêm à tona desejos e revoltas sufocados desde menina (aos dez anos, quis que o menino negro açoitado pelo pai reagisse, e depois confessou isso ao padre como pecado), a vontade de viajar, um amor por todos. Roberto pega sua mão; ela percebe que o “mundo novo” dele é outro. Em casa, João Jaques a espera bebendo, cercado de pontas de cigarro, e pede que ela não vá mais às reuniões; ela responde que quer aprender por si. Ela passa a noite com o Guri no colo, chorando no cabelo do filho.</p><p><b>Como está escrito.</b> <b>Discurso indireto livre</b> em estado puro: lembranças em frases soltas, reticências, <b>gradação</b> de sentimentos que vão de envergonhados a triunfantes. No fim do dia, ela sai do trabalho como um afogado que sobe à tona (<b>comparação</b>).</p><p><b>O que significa.</b> Virada da personagem: a política entra como libertação interior (moral, sexual, intelectual), não só como doutrina. A cena já reúne os três polos do conflito: militância, marido, filho.</p><p><b>Como cairia.</b> Transformação da personagem; foco narrativo.</p>'],
['5. O comício e a cavalaria (cap. 12): caiu na 1ª fase 2027','<p><b>O que acontece.</b> Na praça da estação, à saída dos ferroviários, Vinte-e-Um abre um comício contra a Caixa de Beneficência. Falam um velhinho que invoca Jesus Cristo, um intelectual de frase difícil e a mulher do padeiro Daniel, preso há quatro meses, que segura o filhinho apavorado e esquece o discurso decorado para gritar que o marido não é ladrão. Chega a cavalaria. Vinte-e-Um salva a mulher; Filipe foge com Vladimir no colo e Angelita (um guarda o toma por pai de família). Roberto protege Noemi, mas é preso e jogado na “madalena”, o carro de presos, com Samuel. No chão fica um negro enorme, ferido na cabeça, agonizando.</p><p><b>Como está escrito.</b> <b>Comparações</b>: a multidão estoura como boiada espavorida; os soldados avançam como remadores num mar de tempestade. A multidão vira um só grito e um só pavor (corpo coletivo). Os discursos formam uma <b>gradação</b> do ensaiado ao espontâneo: o momento mais verdadeiro é o que a polícia interrompe.</p><p><b>O que significa.</b> A repressão do Estado e a fragilidade do movimento (João Jaques chamará o comício de provocação sem massa). Mulheres e crianças estão no centro da cena.</p><p><b>Na Fuvest.</b> A Q77 da 1ª fase 2027 (V1, gabarito A) juntou <b>dois trechos</b>: a multidão em fuga (este capítulo) e a convulsão do Guri (cap. 25), e pediu o sistema do corpo envolvido: o <b>sistema nervoso autônomo</b>. A criança em convulsão não está no comício.</p><p><b>Como cairia.</b> Texto científico (medo, luta ou fuga) + item b ligando a violência pública à perda privada.</p>'],
['6. A primeira noite e o êxtase que falhou (cap. 18)','<p><b>O que acontece.</b> Depois de tanto exigir lealdade, Roberto se encontra com Noemi às escondidas no quarto dele. Depois do amor, ele dorme no colo dela como um menino. Ela lembra a véspera: João Jaques tentou recuperá-la pelo corpo, e os dois terminaram mais estranhos. Em dois dias, dois homens se aninharam nos braços dela. As palavras “amado”, “único”, “êxtase” lhe parecem só palavras: algo longamente sonhado, realizado, falhou.</p><p><b>Como está escrito.</b> Discurso indireto livre com frases nominais curtas e <b>repetição</b> irônica de “Palavras”. <b>Comparação</b>: o amante vira um menino farto do seio. O tempo se dobra (presente e lembrança) sem aviso.</p><p><b>O que significa.</b> Rachel desromantiza o adultério: o narrador não castiga nem exalta. A mulher avalia o próprio desejo. A imagem maternal anuncia o fim do livro, em que Noemi será de novo mãe.</p><p><b>Como cairia.</b> Desejo feminino; foco narrativo; comparação com Balada.</p>'],
['7. O monólogo a João Jaques (cap. 20)','<p><b>O que acontece.</b> O Guri conta que o pai fez a mala e partiu, chorando. Noemi vê as chinelas dele, o gancho do pijama; lembra que não cerziu a melhor camisa dele. Sente-se viúva de um homem vivo. Imagina-o no navio, talvez de terceira classe, também chorando. A comadre a chamou de malvada.</p><p><b>Como está escrito.</b> O capítulo passa do discurso indireto livre para a fala direta com o marido ausente (<b>apóstrofe</b>, <b>monólogo interior</b>), com <b>repetição</b> da culpa dividida e da saudade. <b>Metonímia</b>: os objetos representam o casamento desfeito. <b>Paradoxo</b>: viúva sem morte.</p><p><b>O que significa.</b> Noemi não é heroína fria nem vilã: sente culpa, pena e saudade, e ao mesmo tempo critica a ideia de que mulher que ama outro exige tragédia. O narrador nunca a condena; deixa que ela fale.</p><p><b>Como cairia.</b> Recurso expressivo (apóstrofe); julgamento moral.</p>'],
['8. O julgamento: camaradas, Guiomar e o patrão (cap. 21)','<p><b>O que acontece.</b> Na rodinha e no curso, quase todos condenam Noemi: querem ser livres, mas têm horror do adultério; falam em “cachorrices de pequeno-burguês” e repetem Samuel (as mulheres daqui confundem questão social com questão sexual). Guiomar espia Noemi procurando marcas do “amante”. Seu Benevides, que se diz sem ideias, a aconselha a cuidar do lar e depois a demite: a freguesia de primeiras comunhões e noivas reclamou. Sem chorar, Noemi exige o mês de salário que a lei trabalhista lhe garante. Depois pensa que vai depender de Roberto.</p><p><b>Como está escrito.</b> <b>Ironia</b>: a moral dos revolucionários coincide com a do patrão. O patrão que demite em nome das famílias é o mesmo que, no cap. 5, olhava as mocinhas com seu “golpe de vista”. Discurso indireto livre de Guiomar, que se pergunta como reconhecer uma mulher honesta.</p><p><b>O que significa.</b> Noemi é julgada pela esquerda, pelo comércio, pela colega e pela comadre. Enquanto isso, o Capitão Nonato namora às claras a mulher do faroleiro sem escândalo: o adultério do homem poderoso passa; o da mulher custa emprego e nome.</p><p><b>Como cairia.</b> Eixo mais provável: condição feminina, trabalho, moralismo da esquerda; comparação com Balada e Martha.</p>'],
['9. A morte do Guri (cap. 25 e 26): caiu na 1ª fase 2027','<p><b>O que acontece.</b> Noemi volta de uma tentativa frustrada de emprego e acha o Guri com febre. O médico simpatizante, que atende os camaradas de graça, chega rindo, fala de política e diz que o caso é suspeito. De manhã, a comadre grita: o menino tem uma convulsão (tremor, olhos vesgos, boca torcida, sem grito). Noemi o despe e dá banho, negando que ele vá morrer. Os ataques voltam e o Guri morre. Ela veste o filho com a roupinha branca de marinheiro, mas não consegue calçar-lhe os sapatos. Depois vive como afogada, amassando no bolso o telegrama de João Jaques. No cap. 26, as crianças vivas da casa de Angelita a enlouquecem; em casa, olha com rancor o próprio corpo jovem e são, e só então chora de verdade.</p><p><b>Como está escrito.</b> <b>Prosopopeia</b>: algo invisível parece lutar com a criança e arrancá-la do mundo; a morte é silenciosa e modesta, os vivos é que gritam. <b>Metáfora</b> do afogado que não grita porque não espera socorro. <b>Repetição</b> obsessiva de “vivos” no cap. 26. <b>Antítese</b> entre o corpo intacto e a destruição interior.</p><p><b>O que significa.</b> O fundo do poço: o médico do partido não salva, o mundo continua. A culpa não é dita, mas paira.</p><p><b>Na Fuvest.</b> A descrição da convulsão foi o segundo trecho da Q77 (sistema nervoso autônomo).</p><p><b>Como cairia.</b> Maternidade; figuras (prosopopeia, metáfora, repetição); comparação com Canção (Noemi canta para o filho doente).</p>'],
['10. A ladeira do Gasômetro (cap. 27)','<p><b>O que acontece.</b> Um ano depois, Noemi, grávida, sobe a ladeira com os pés machucados pelas pedras do calçamento. No muro, um letreiro de “Liberdade para...” escrito por Roberto se apaga, e já não se lê para quem. Todos se foram: João Jaques, o Guri, Roberto, Filipe (doente em Russas), Angelita, Samuel, Nascimento, Paulino. Ela lembra a noite dos boletins: a tarefa era dela, como prova de militante nova; Roberto insistiu em ir; um homem os denunciou e um carro escuro os levou. Ela foi solta por estar grávida; ele foi mandado para uma colônia, numa ilha, ao que se diz. Ela costura numa casa de roupas brancas e mora com a mãe de um camarada. Tropeça numa pedra solta, o bebê se mexe, e ela lhe pede que vá devagar, chamando-o de companheiro.</p><p><b>Como está escrito.</b> Flashback; <b>apóstrofe</b> a Roberto ausente; <b>repetição</b> de “um ano” e “só”. O letreiro é <b>símbolo</b> do protesto apagado. A última fala dá ao bebê a palavra “companheiro”, que no livro já foi camarada, marido e amante: <b>polissemia</b>.</p><p><b>O que significa.</b> O título se realiza nos dois sentidos (ladeira de pedras e vida dura). O fim não é castigo nem vitória: é resistência mínima, feita de trabalho e maternidade. E a prisão vem da “mania de proteção” de Roberto, que não deixou Noemi cumprir sozinha a própria tarefa.</p><p><b>Como cairia.</b> Título; balanço da trajetória; símbolo do letreiro; polissemia de “companheiro”.</p>']
],
critica:'<p><b>O que a Fuvest já fez.</b> Na 1ª fase de 2027 (Q77 da V1, gabarito A, segundo a resolução do Curso Objetivo), o romance apareceu numa questão de biologia: dois trechos, a multidão fugindo da cavalaria (cap. 12) e a convulsão do Guri (cap. 25), e a pergunta sobre o sistema do corpo que explica essas reações involuntárias: o sistema nervoso autônomo. Na 2ª fase de 2026 a obra não caiu; por isso é forte candidata em 2027.</p>'+
'<p><b>Rachel e a repressão.</b> Rachel de Queiroz entrou no Partido Comunista no início dos anos 1930 e depois rompeu com ele (Wikipédia). Segundo a Assembleia Legislativa de SP, com o Estado Novo (1937) ficou presa cerca de três meses no quartel do Corpo de Bombeiros de Fortaleza, e livros seus foram queimados em Salvador, com os de Jorge Amado e José Lins do Rego. A fogueira de Salvador, em novembro de 1937, é bem documentada (A Tarde); a inclusão de Rachel aparece só em parte das fontes. O livro é datado de “Fortaleza, outubro de 1936”: há reportagens que dizem que foi escrito na prisão, o que não bate com essa data.</p>'+
'<p><b>Depois de 1935.</b> Após o levante comunista de novembro de 1935 vieram prisões em massa. Graciliano Ramos, preso em 1936, foi levado no porão de um navio para a Colônia Correcional da Ilha Grande (<i>Memórias do cárcere</i>). É o horizonte do destino de Roberto, mandado numa leva para “uma colônia numa ilha”, e do medo que ele sente, no cap. 14, de ser embarcado num porão.</p>'+
'<p><b>Trabalho e lei.</b> Noemi cobra o mês de salário “pela lei do Ministério do Trabalho”. A Lei nº 62, de 1935, garantiu indenização ao empregado do comércio dispensado sem justa causa. O livro mostra o limite dessa proteção: a lei paga o mês, mas não impede que a moral tire o emprego de uma mulher.</p>'+
'<p><b>Leituras críticas.</b> Uma reportagem do <i>Jornal da USP</i> (série “Livros da Fuvest”) destaca que a força do romance está no cruzamento entre a luta política coletiva e a história de amor de Noemi, lê o corpo feminino como metáfora da perda e a nova gravidez como projeto de futuro, e nota a crítica a procedimentos do Partido Comunista. Um artigo da revista <i>Humanidades e Inovação</i> (Unitins, 2017) lê Noemi como representação política da mulher. Luís Bueno, em <i>Uma história do romance de 30</i> (2006), situa a década na “explosão do romance proletário”, gênero que Rachel pratica e ao mesmo tempo critica.</p>'+
'<p><b>Síntese para a prova.</b> Noemi sofre três opressões: a do <b>Estado</b> (polícia, delação, prisão, deportação), a do <b>mercado e da moral burguesa</b> (o patrão e a freguesia “de família”) e a da <b>própria esquerda</b> (os camaradas que condenam o adultério e querem controlar a vida particular). A resposta forte nomeia as três.</p>'+
'<p><b>Escola: confirma e rompe.</b> Confirma o Romance de 30: denúncia social, compromisso político, linguagem enxuta e coloquial, tipos sociais, Nordeste. Rompe: é <b>urbano</b>, sem seca (ao contrário de <i>O Quinze</i>, da própria Rachel); põe no centro a <b>intimidade feminina</b> (desejo, adultério, maternidade, luto) em discurso indireto livre; critica a moral da própria esquerda; e termina sem tese nem redenção.</p>'+
'<p><b>Estilo em uma linha.</b> Frases curtas, muito diálogo, regionalismos (bodega, cacimba, rede, comadre, “madalena” para o carro de presos), narrador em 3ª pessoa que muda de ponto de vista a cada capítulo (Roberto, Filipe, Noemi, e até Guiomar e João Jaques) e secura mesmo na dor. Figuras típicas: <b>polissemia</b> de “companheiro”; <b>símbolo</b> da ladeira e do letreiro; <b>antítese</b> areia × pedra (as “areias” pobres sem calçamento × as pedras do fim; o livro abre com unhas que parecem pedras de anel); <b>metáfora</b> do militante que vira máquina ou parafuso; <b>ironia</b> da “pequenina ilha” da vida particular (cap. 7) que vira a ilha-presídio de Roberto.</p>'+
'<p><b>Cuidado (não verificado).</b> A doença de Noemi no cap. 10 não é nomeada no texto: não afirme que foi aborto. A colônia de Roberto não é nomeada: a Ilha Grande é contexto, não dado do livro.</p>',
qbank:[
{p:'<b>Texto científico (modelo da Q77 da 1ª fase).</b> Em situações de perigo, o sistema nervoso autônomo dispara a reação de luta ou fuga: coração e respiração acelerados, tremor, adrenalina, sem controle da vontade. A Fuvest ilustrou isso com duas cenas do romance: a multidão que foge da cavalaria e a convulsão de uma criança. a) Identifique uma figura usada para descrever a multidão em fuga e explique seu efeito. b) Relacione as duas cenas de pânico à trajetória de Noemi.',a:['No comício (cap. 12), a multidão é comparada a uma boiada espavorida e a um mar de tempestade em que os soldados avançam como remadores: as comparações transformam as pessoas em força cega da natureza e traduzem o pânico coletivo.','O pânico público do comício, em que Roberto é preso e um homem negro fica agonizando no chão, corresponde ao pânico privado do cap. 25, quando o Guri tem convulsões e morre, sem que o médico do partido consiga salvá-lo.','As duas reações involuntárias marcam os dois golpes que Noemi sofre, a repressão política e a perda íntima, e mostram que no romance o corpo, coletivo ou individual, é onde a violência e a dor se inscrevem.']},
{p:'<b>Texto crítico.</b> Uma reportagem do Jornal da USP afirma, em síntese, que a força de “Caminho de pedras” está no cruzamento entre a história política coletiva e a história de amor da protagonista. a) Mostre esse cruzamento numa cena. b) Explique como o desfecho mantém juntos o político e o íntimo.',a:['Em “Caminho de pedras”, o amor de Noemi por Roberto nasce dentro da militância e é julgado por ela.','No cap. 9, voltando do curso político, Noemi se sente uma alma livre e Roberto toma sua mão; no cap. 21, os camaradas a condenam pelo adultério; no cap. 27, ela é presa com Roberto distribuindo boletins, solta por estar grávida, e ele é deportado.','O desfecho une os dois planos: o letreiro “Liberdade para...” que se apaga é a derrota política, e o bebê chamado de companheiro é ao mesmo tempo filho do amor e herdeiro da luta.']},
{p:'<b>Texto histórico.</b> Depois do levante comunista de 1935, Graciliano Ramos foi preso (1936), levado no porão de um navio e mandado para a Colônia Correcional da Ilha Grande, como narra em “Memórias do cárcere”. a) Que elementos do romance remetem a essa repressão? b) Explique a ironia da palavra “ilha” no livro.',a:['O romance registra a repressão da Era Vargas: polícia política, delação, prisões sem processo e deportação de presos para o Sul.','Roberto é preso no comício e, solto, conta que temia ser embarcado num porão para uma cadeia distante (cap. 14); no fim é delatado e mandado numa leva para uma colônia que se diz ser numa ilha (cap. 27); a mulher do padeiro denuncia o marido preso há quatro meses sem crime (cap. 12).','No cap. 7, Roberto via a vida particular de cada um como uma pequenina ilha; o militante de quem a organização exigia não ter vida particular termina numa ilha-presídio, e a palavra passa do refúgio íntimo ao isolamento imposto pelo Estado.']},
{p:'<b>Comparação com Memórias de Martha (com texto de apoio).</b> A Lei nº 62, de 1935, garantiu indenização ao empregado do comércio dispensado sem justa causa. a) Explique o papel do trabalho na vida de Noemi. b) Compare-o com o papel do trabalho em “Memórias de Martha”.',a:['Para Noemi, o emprego de retocadora de fotografias é a base da autonomia: ela ganha quase tanto quanto o marido e usa isso para disputar o filho (cap. 19).','Demitida por Seu Benevides por causa do adultério, ela exige o mês de salário que a lei garante, mas passa a depender de Roberto e só no fim sobrevive costurando numa casa de roupas brancas; Martha, ao contrário, sai do cortiço pelo estudo e conquista o lugar de professora.','Nas duas obras o trabalho é a porta da dignidade feminina, mas em Martha ele recompensa a mulher que segue a moral, enquanto Noemi o perde justamente quando decide sobre o próprio amor, mesmo com a lei a seu lado.']},
{p:'<b>Comparação com Balada de amor ao vento.</b> Noemi e Sarnau rompem casamentos por amor. a) Quem julga Noemi e por quê? b) Compare esse julgamento e o desfecho com os de Sarnau.',a:['Noemi é julgada por todos, camaradas, patrão, colega e até a comadre, porque o adultério feminino continua sendo, para todos, um escândalo.','Os militantes falam em “cachorrices de pequeno-burguês” e repetem que as mulheres confundem questão social com sexual (cap. 21), Seu Benevides a demite em nome das famílias e a comadre a chama de malvada; Sarnau, em Balada, é punida pela ordem patriarcal, perde os filhos e a posição de rainha e é abandonada por Mwando.','Em contextos diferentes (militância urbana no Brasil, tradição e colonialismo em Moçambique), o patriarcado castiga a mulher que deseja: Noemi termina só, grávida e trabalhando, Sarnau acaba aceitando Mwando de volta, e as duas sobrevivem pelo próprio trabalho.']},
{p:'<b>Comparação com Canção para ninar menino grande.</b> a) Explique o papel das canções de ninar em “Caminho de pedras”. b) Compare a maternidade de Noemi com a das mulheres de “Canção para ninar menino grande”.',a:['Em “Caminho de pedras”, a canção de ninar marca o laço físico entre Noemi e o Guri, que exige que a mãe cante e durma com ele (cap. 17), e volta quando ela canta para o filho doente, já mais para se consolar (cap. 25).','O filho é o centro afetivo de Noemi (a sala de retratos, a disputa com João Jaques, a morte) e no fim ela espera outro filho sem o pai, deportado; em Canção, Juventina compõe uma canção de ninar para um homem adulto, Fio Jasmim, e mulheres como Dalva criam filhos dele sem a presença dele.','Nas duas obras a maternidade é vivida por mulheres sós diante de homens que partem, pela política ou pela fuga afetiva, e a canção de ninar condensa ao mesmo tempo cuidado e solidão.']},
{p:'<b>Personagens.</b> a) Compare as posições de Roberto e de João Jaques diante da militância. b) Mostre que os dois, apesar das diferenças, limitam a liberdade de Noemi.',a:['Roberto é o militante entregue à causa, mandado do Rio para organizar a Região; João Jaques é o ex-militante, expulso no Rio, que chama o comício de provocação de aventureiros e prefere os livros.','Roberto exige lealdade e pressiona Noemi a contar tudo ao marido (cap. 14 e 16); João Jaques quer que ela pare de ir às reuniões e tenta levar o Guri por vingança (cap. 9 e 19); no fim, Roberto insiste em acompanhá-la na tarefa dos boletins, que era só dela, e os dois são presos (cap. 27).','Um pelo ciúme e pela posse, o outro pela proteção, os dois tratam Noemi como alguém a ser guardado: o romance mostra que a emancipação dela é barrada também dentro de casa e dentro do partido.']},
{p:'<b>Desfecho e título.</b> No último capítulo, Noemi sobe uma ladeira de pedras e vê apagar-se um letreiro que pedia liberdade. a) Explique o duplo sentido do título nessa cena. b) Faça um balanço da trajetória da protagonista.',a:['O caminho de pedras é a ladeira real, cujas pedras machucam os pés de Noemi grávida, e a vida dura que ela percorreu.','De retocadora casada e mãe, ela passou à militância, ao amor por Roberto, ao julgamento de todos, à demissão, à morte do Guri e à prisão do companheiro; agora costura numa casa de roupas brancas e mora com a mãe de um camarada, enquanto o letreiro de Roberto perde o nome do preso.','O fim não é castigo nem vitória: ela tropeça numa pedra solta, o bebê se mexe, ela o chama de companheiro e continua subindo, numa resistência mínima e sem idealização.']},
{p:'<b>Escola literária.</b> Em 2025, a Fuvest perguntou se “Os ratos” se aproximava do Regionalismo de 30. a) Que traços fazem de “Caminho de pedras” um romance de 30? b) Em que ele se afasta do modelo regionalista, como o de “O Quinze”?',a:['“Caminho de pedras” é romance de 30 pelo engajamento social e político, pela denúncia da repressão e da miséria operária e pela linguagem enxuta e coloquial.','O livro acompanha uma célula militante em Fortaleza, com operários desconfiados, prisões, delação e deportação; mas não há seca nem sertão, como em “O Quinze”, e o centro é a vida íntima de Noemi (desejo, adultério, maternidade, luto), contada em discurso indireto livre.','Ele confirma o compromisso social do período, mas o desloca para a cidade e para a experiência feminina, criticando inclusive a moral da própria esquerda.']},
{p:'<b>Figura: polissemia.</b> a) Explique os diferentes sentidos da palavra “companheiro” ao longo do romance. b) Que efeito tem a palavra ser dirigida ao bebê na última fala de Noemi?',a:['“Companheiro” é polissêmica no livro: é o camarada de partido, o marido, o amante e, no fim, o filho por nascer.','Os militantes se tratam por companheiros desde a primeira reunião (cap. 2); João Jaques é o velho companheiro na manhã de paz (cap. 15) e quer levar o Guri para ser seu companheiro (cap. 19); Roberto passa a ser o companheiro de Noemi (cap. 22), e é a ele que ela se dirige no fim; por último, ela pede ao bebê que vá devagar, chamando-o de companheiro (cap. 27).','Dirigida ao bebê, a palavra junta amor, luta e maternidade: os companheiros adultos se foram, e a continuidade da vida e da causa passa ao filho, o que dá ao desfecho ternura e esperança contida.']}
]
});

html:
'<section class="card"><h2>O que é uma tese</h2>'+
'<p>É <b>uma frase</b> que responde à frase temática com uma posição que alguém poderia contestar. Ela aparece na introdução e é sustentada pelo texto inteiro.</p>'+
'<p>Por que importa: o critério 1 (peso 3) avalia a abordagem do tema, e o critério 3 (peso 3) avalia se os argumentos estão “em prol do ponto de vista adotado”. Sem tese clara, os dois caem.</p>'+
'<div class="note peg"><span class="lab">Três teses fracas</span><p><b>Óbvia:</b> “A solidariedade é fundamental.” Ninguém discorda, então não há o que provar. <b>Em cima do muro:</b> “O perdão tem pontos positivos e negativos.” Não é posição. <b>Fora do recorte:</b> falar de perdão em geral quando o tema pede “condicionado ou limitado”.</p></div></section>'+

'<section class="card"><h2>Fórmula: afirmação + ressalva + critério</h2>'+
'<p><b>Afirmação:</b> a sua resposta. <b>Ressalva:</b> o “mas”, que mostra o limite. <b>Critério:</b> a condição que decide quando a afirmação vale.</p>'+
'<ul><li><b>Óbvia:</b> “A educação é muito importante.”<br><b>Com tensão:</b> “A escola prepara para o trabalho, <i>mas só forma</i> pessoas inteiras <i>quando protege</i> o tempo lento da reflexão contra a pressa da multitarefa.” (tema de 2024)</li>'+
'<li><b>Óbvia:</b> “Ajudar o próximo é bom.”<br><b>Com tensão:</b> “A solidariedade sustenta as relações sociais, <i>mas só</i> as transforma <i>quando trata</i> quem recebe como igual, e não como plateia ou devedor.” (tema de 2025)</li></ul>'+
'<p>Expressões que criam tensão: <b>mas só quando</b>, <b>desde que</b>, <b>embora</b>, <b>não… e sim</b>, <b>à medida que</b>, <b>o problema não é X, e sim Y</b>.</p>'+
'<div class="note cai"><span class="lab">Padrão de nota máxima</span><p>Num artigo sobre uma redação nota máxima de 2026, professores da USP destacam uma tese que situa o tema no presente (as redes sociais) e mostra um <b>paradoxo</b>: rigor sem perdão para pequenos deslizes e indulgência para atrocidades. Paradoxo é uma forma forte de tensão (Jornal da USP, fev. 2026).</p></div></section>'+

'<section class="card"><h2>Leia a frase temática palavra por palavra</h2>'+
'<ul><li><b>2025:</b> “As relações sociais por meio da solidariedade”. A banca disse ser “incontornável” relacionar o meio em que se vive e a solidariedade; tratar só de um lado pode ser tangência (Guia de Respostas 2025).</li>'+
'<li><b>2026, proposta 1:</b> “O perdão é um ato que pode ser condicionado ou limitado”. A tese precisa dizer <b>se</b> e <b>como</b> o perdão pode ter condição ou limite (abordagem 2026).</li></ul>'+
'<div class="note mn"><span class="lab">Teste rápido</span><p>Sublinhe os substantivos e verbos da frase temática. A sua tese precisa ter uma palavra ligada a cada um deles.</p></div></section>'+

'<section class="card"><h2>Modelos de 4 e 5 parágrafos</h2>'+
'<p>Nenhum documento oficial fixa o número de parágrafos. Os dois modelos funcionam; escolha antes da prova para não perder tempo. Proporção para cerca de 30 linhas (dica didática):</p>'+
'<h3>4 parágrafos</h3><ul><li><b>Introdução com tese:</b> 5 a 6 linhas</li><li><b>Desenvolvimento (argumento + coletânea + repertório):</b> 8 a 9 linhas</li><li><b>Contraponto e refinamento:</b> 9 a 10 linhas</li><li><b>Conclusão com a tese refinada:</b> 5 a 6 linhas</li></ul>'+
'<h3>5 parágrafos</h3><ul><li><b>Introdução com tese:</b> 5 linhas</li><li><b>Argumento 1:</b> 6 a 7 linhas</li><li><b>Argumento 2 (aprofunda ou muda de escala):</b> 6 a 7 linhas</li><li><b>Contraponto e refinamento:</b> 6 a 7 linhas</li><li><b>Conclusão:</b> 4 a 5 linhas</li></ul>'+
'<p>Conta útil: à mão, cabem cerca de 11 a 14 palavras por linha; 30 linhas dão cerca de 330 a 420 palavras. Confira com a sua letra copiando três linhas.</p>'+
'<div class="note peg"><span class="lab">Alerta</span><p>Introdução ou conclusão com mais de 6 linhas costuma ter enrolação. Desenvolvimento com menos de 6 costuma ficar raso.</p></div></section>'+

'<section class="card"><h2>Introdução em 3 movimentos</h2>'+
'<ol><li><b>Gancho:</b> um fato, uma obra, um conceito ou um texto da coletânea que já toca o tema.</li>'+
'<li><b>Recorte:</b> uma frase que leva do gancho para a frase temática.</li>'+
'<li><b>Tese:</b> a frase com afirmação, ressalva e critério.</li></ol>'+
'<p>A redação nota máxima comentada no Jornal da USP abriu com uma canção que já punha em jogo o perdão e dialogava com a coletânea. O gancho valeu porque estava a serviço do tema, não porque era raro.</p>'+
'<div class="note peg"><span class="lab">Evite</span><p>“Desde os primórdios da humanidade…”, definição de dicionário, fila de perguntas retóricas, anunciar “neste texto, falarei sobre…”. Antecipar os argumentos é opcional e gasta linhas.</p></div></section>'+

'<section class="card"><h2>Tópico frasal e conclusão</h2>'+
'<p><b>Tópico frasal</b> é a primeira frase de cada parágrafo de desenvolvimento: diz a ideia do parágrafo e a liga à tese, de preferência com um conectivo. Se alguém ler só os tópicos frasais, deve entender o seu raciocínio.</p>'+
'<p><b>Conclusão:</b></p>'+
'<ul><li>retoma a tese <b>já refinada</b> pelo contraponto, com outras palavras;</li>'+
'<li>fecha o fio aberto na introdução (a obra, a imagem, o caso);</li>'+
'<li>não traz argumento novo;</li>'+
'<li>proposta de intervenção <b>não é exigida</b> pela Fuvest (isso é do Enem).</li></ul>'+
'<div class="note cai"><span class="lab">Fecho com nuance</span><p>A redação nota máxima de 2026 terminou reconhecendo que é difícil “calibrar a régua” do perdão, sem abandonar a posição. Admitir a dificuldade e manter o ponto é sinal de autoria; slogan final não é.</p></div></section>',

'<h3>Outros desenhos de desenvolvimento</h3>'+
'<p>O primeiro argumento não precisa ser “a favor” e o segundo “contra”. Também funcionam: <b>por escalas</b> (individual → coletivo, como a abordagem de 2026 sugeriu para o perdão); <b>causa e consequência</b>; <b>problema e critério</b>; <b>contraponto primeiro</b>, para depois refinar; <b>contraponto dentro do parágrafo</b>, num texto de 4 parágrafos. O que vale para o critério 3 é que cada parágrafo acrescente algo.</p>'+
'<h3>A tese é uma só</h3>'+
'<p>Os parágrafos de desenvolvimento trazem <b>argumentos</b>, não novas teses. Se o §3 defende outra coisa, a coerência cai (critério 3).</p>'+
'<h3>Tese refinada</h3>'+
'<p>A tese da conclusão não é cópia da introdução. Exemplo: introdução, “o perdão pode ser condicionado, mas a condição legítima é o reconhecimento do erro”; conclusão, depois do contraponto, “condicionar o perdão ao reconhecimento do erro não o diminui: protege a vítima de ser esquecida”.</p>'+
'<h3>Banco de teses para temas possíveis (palpites, não previsões)</h3>'+
'<ul><li><b>Tempo livre e conexão:</b> “Estar sempre conectado parece liberdade, mas só há tempo livre de fato quando a atenção deixa de ser vendida.”</li>'+
'<li><b>Memória:</b> “Lembrar o passado é dever de uma sociedade, desde que a memória sirva para reparar, e não só para celebrar.”</li>'+
'<li><b>Trabalho:</b> “O trabalho dá identidade, mas deixa de dar quando ocupa todo o tempo em que a pessoa poderia ser outra coisa.”</li>'+
'<li><b>Informação:</b> “Nunca foi tão fácil se informar, mas informação sem tempo de reflexão produz opinião, não conhecimento.”</li>'+
'<li><b>Cuidado:</b> “Cuidar dos outros é base da vida em comum, mas vira injustiça quando recai sempre sobre as mesmas pessoas.”</li></ul>'+
'<p>Use como treino: reescreva cada tese trocando a ressalva. Se a nova ressalva também funciona, você entendeu a fórmula.</p>',

id:'coletanea',ord:4,ic:'📚',t:'Coletânea e autoria',min:7,
html:
'<section class="card"><h2>Por que a coletânea decide a nota</h2>'+
'<p>O critério 1 (peso 3) pede que você estabeleça “relações de intertextualidade e interdiscursividade para apropriar-se da coletânea e utilizá-la de forma referenciada” (Guia 2027). A escada é clara: nível 2, “paráfrase superficial”; nível 3, “utilização produtiva”; nível 4, “apropriação consistente”. E copiar, mesmo em parte, zera.</p>'+
'<ul><li><b>Intertextualidade:</b> diálogo com um texto específico (o trecho de Machado, a foto, a canção).</li>'+
'<li><b>Interdiscursividade:</b> diálogo com um discurso, sem citar texto: o discurso religioso, o jurídico, o científico, o filosófico.</li></ul>'+
'<div class="note mn"><span class="lab">Imagem</span><p>Pense numa mesa-redonda: a coletânea são os convidados que já estão sentados; o repertório são os que você traz. Você é o mediador: dá a palavra, resume e decide quem tem razão.</p></div></section>'+

'<section class="card"><h2>5 formas de usar um texto</h2>'+
'<ol><li><b>Paráfrase referenciada:</b> a ideia com as suas palavras e com o autor. É o padrão seguro.</li>'+
'<li><b>Citação curta:</b> entre aspas, com autor. Dica didática: até uma linha e só quando a expressão exata importa. O Guia não fixa limite; cópia parcial zera, então use pouco.</li>'+
'<li><b>Alusão:</b> uma referência rápida que o leitor reconhece (“como Rubião, que doa para ser visto…”).</li>'+
'<li><b>Contraponto:</b> usar um texto contra a tese ou contra outro texto (o samba que perdoa fácil × o filósofo que diz que só a vítima perdoa).</li>'+
'<li><b>Ampliação:</b> levar a ideia do texto para hoje ou para outro campo (a caridade-vitrine do século XIX → a doação filmada para redes sociais).</li></ol></section>'+

'<section class="card"><h2>A–I–F: Autor, Ideia, Função</h2>'+
'<p>Toda vez que usar um texto: <b>A</b>utor ou obra → <b>I</b>deia com as suas palavras → <b>F</b>unção, isto é, por que isso prova a sua tese. Sem a função, vira resumo (nível 2).</p>'+
'<p><b>Exemplo (2025, texto de Machado):</b> “Em <i>Quincas Borba</i>, de Machado de Assis (A), a comissão de caridade serve para que Sofia suba socialmente entre senhoras que mal a cumprimentavam (I). A ajuda, ali, é degrau de prestígio para quem doa, e não laço com quem recebe (F).”</p>'+
'<div class="note mn"><span class="lab">Teste da função</span><p>Cubra a paráfrase com o dedo. A frase seguinte, sozinha, mostra como a ideia sustenta a tese? Se não, falta a função.</p></div>'+
'<p>A função não precisa de “portanto”. Pode vir por causa (“porque…”), por oposição (“embora…”) ou por uma frase interpretativa curta (“A ajuda, ali, é degrau”).</p></section>'+

'<section class="card"><h2>Paráfrase: superficial, colada ou com função</h2>'+
'<p>Texto-base (2025): em <i>Água funda</i>, Ruth Guimarães diz que todo homem, por mais bruto, gosta de ser tratado como gente.</p>'+
'<ul><li><b>Superficial (nível 2):</b> “Ruth Guimarães diz que as pessoas gostam de ser bem tratadas.” Repete e não trabalha.</li>'+
'<li><b>Colada (risco de cópia):</b> manter a frase da autora trocando duas ou três palavras por sinônimos. Pode ser lida como “cópia parcial”, que zera.</li>'+
'<li><b>Com função (nível 3 ou 4):</b> “Ruth Guimarães lembra que até o mais bruto quer ser tratado como gente; por isso, a ajuda que humilha fracassa mesmo quando alimenta: resolve a fome e fere a dignidade.”</li></ul>'+
'<div class="note peg"><span class="lab">Armadilha</span><p>Mudar palavras não basta. Mude a estrutura da frase e acrescente o seu juízo.</p></div></section>'+

'<section class="card"><h2>Quantos textos usar</h2>'+
'<p>“Use 3 textos” é <b>dica didática, não regra</b>. O Guia de Respostas 2025 aceitou dois caminhos: argumentação ampla, com vários aspectos, ou um elemento só, numa linha de raciocínio “mais simples, mas que pode ser completa e bem direcionada”.</p>'+
'<p>Sugestão prática: 2 ou 3 textos com função, em parágrafos diferentes, mais 1 repertório seu. Relacionar dois textos entre si (um confirma, outro limita) já é “apropriação”.</p></section>'+

'<section class="card"><h2>Repertório próprio</h2>'+
'<p>Os níveis 2 a 4 do critério 1 falam em “mobilização de conhecimentos próprios”. Vale filosofia, história, ciência, arte, dados e as obras da lista de literatura. Regra de ouro: repertório só conta se for <b>explicado e ligado à tese</b>.</p>'+
'<div class="note cai"><span class="lab">Padrões de nota máxima</span><p>No artigo sobre a redação nota máxima de 2026 (Jornal da USP), o candidato usa Chico Buarque, Sartre, Fernando Pessoa e Lewis Carroll, sempre interpretados a favor do argumento, e leva a reflexão para exemplos do mundo atual. Os professores falam em “destreza de repertório” mobilizada “pela leitura atenta da coletânea”. O repertório conversa com a coletânea; não a substitui.</p></div>'+
'<p><b>Ponte com a lista (fatos conferidos):</b></p>'+
'<ul><li><b>Memórias de Martha:</b> a menina Martha ganha de uma freguesa da mãe um vestido quase novo que não ficava bem na filha da casa; é virada de um lado para outro enquanto a menina rica ri dela; quando a mãe agradece “a esmola”, ela sente o coração parar. Solidariedade × humilhação.</li>'+
'<li><b>A visão das plantas:</b> Celestino, ex-capitão negreiro, recusa a confissão até o fim e morre “sem uma dúvida na consciência”. Perdão, culpa, memória.</li>'+
'<li><b>Caminho de pedras:</b> os camaradas da organização condenam Noemi pelo adultério. Solidariedade seletiva.</li>'+
'<li><b>Balada de amor ao vento:</b> no casamento de Sarnau, uma tia lhe dá um pilão e diz que o lar é o pilão e a mulher, o cereal. Tradição e papel da mulher.</li></ul></section>'+

'<section class="card"><h2>Teste de autoria e 3 movimentos</h2>'+
'<p><b>Autoria</b> não é escrever “eu acho”, nem ser original a qualquer custo. É mostrar um sujeito que escolhe, interpreta, hierarquiza e se posiciona. Passe o seu texto por 5 perguntas:</p>'+
'<ol><li>A tese pode ser contestada?</li><li>Interpretei os textos ou só descrevi?</li><li>O repertório foi escolhido e explicado?</li><li>Considerei a objeção mais forte?</li><li>Liguei o tema ao presente?</li></ol>'+
'<p>Três movimentos que fabricam autoria:</p>'+
'<ul><li><b>“Mas e se…?”</b> levanta a objeção.</li><li><b>“Isso significa que…”</b> tira a consequência.</li><li><b>“Hoje, …”</b> atualiza o texto.</li></ul></section>',

html:
'<section class="card"><h2>O que é contraponto</h2>'+
'<p>É a <b>objeção mais forte</b> à sua tese, ou o limite dela, que você reconhece e responde. Ele não derruba a tese: <b>refina</b>. Mostra um autor que pensa contra si mesmo, o que conta para os “robustos indícios de autoria” (critério 1, peso 3) e para a progressão (critério 3, peso 3).</p>'+
'<p>Como achar: (1) em que caso a minha tese seria falsa ou insuficiente? (2) o que um crítico inteligente diria? (3) que texto da coletânea mostra o outro lado?</p>'+
'<div class="note mn"><span class="lab">Macete</span><p>A parte depois do “mas” na sua tese já anuncia o contraponto. Tese com tensão facilita o contraponto.</p></div></section>'+

'<section class="card"><h2>5 tipos de contraponto</h2>'+
'<ul><li><b>Interesse oculto:</b> o gesto bom esconde vantagem. Ex. (2025): a caridade de Sofia, em Machado, é vitrine social.</li>'+
'<li><b>Limite:</b> a tese vale até certo ponto. Ex. (2026): ninguém pode perdoar a ofensa feita a outro (texto 1).</li>'+
'<li><b>Efeito colateral:</b> a solução cria outro problema. Ex.: o perdão fácil pode virar impunidade.</li>'+
'<li><b>Condição:</b> a tese depende de algo. Ex.: a ajuda só funciona se não humilhar (Ruth Guimarães, 2025).</li>'+
'<li><b>Insuficiência:</b> a tese é certa, mas pequena para o problema. Ex.: doações não acabam com a fome se falta vontade política (G20, 2025).</li></ul></section>'+

'<section class="card"><h2>3 passos: reconhecer, provar, refinar</h2>'+
'<ol><li><b>Reconhecer:</b> apresente a objeção com honestidade, na versão mais forte. “É verdade que…”, “Pode-se objetar que…”.</li>'+
'<li><b>Provar:</b> sustente a objeção com coletânea ou repertório. Sim, você prova o lado contrário.</li>'+
'<li><b>Refinar:</b> diga o que muda na sua tese. “Isso não anula X; mostra que X só vale quando…”.</li></ol>'+
'<p><b>Exemplo (2026):</b> “Pode-se objetar que perdão com condição não é perdão, mas cobrança: para Derrida, perdoar de verdade seria perdoar o imperdoável. A pergunta de Venâncio, em <i>Tudo é rio</i>, vai no mesmo sentido. Isso não invalida as condições; mostra que o perdão incondicional é um horizonte pessoal, enquanto, na vida pública, a exigência de reconhecimento protege as vítimas.”</p>'+
'<div class="note peg"><span class="lab">Erros comuns</span><p>Contraponto vago (“alguns discordam”); contraponto que destrói a tese e deixa o texto sem posição; contraponto sem refinamento; mudar de assunto; “por outro lado” sem que exista outro lado.</p></div></section>'+

'<section class="card"><h2>Mapa de conectivos por relação lógica</h2>'+
'<p>O conectivo diz ao leitor qual relação existe entre as ideias. O errado cria lógica falsa (critério 3).</p>'+
'<ul><li><b>Adição:</b> além disso, ademais, também, não só… mas também</li><li><b>Oposição:</b> mas, porém, contudo, no entanto, todavia</li><li><b>Concessão:</b> embora, ainda que, mesmo que, apesar de</li><li><b>Causa:</b> porque, pois, já que, visto que, uma vez que</li><li><b>Consequência:</b> de modo que, por isso, assim, tanto que</li><li><b>Conclusão:</b> portanto, logo, dessa forma, em suma</li><li><b>Condição:</b> se, desde que, caso, contanto que</li><li><b>Exemplo:</b> por exemplo, como mostra, a exemplo de</li><li><b>Mudança de escala:</b> no plano individual, no plano coletivo, hoje</li></ul>'+
'<div class="note mn"><span class="lab">Teste</span><p>Troque o conectivo por outro de relação diferente. Se a frase ficar absurda, o original estava certo. Se continuar fazendo sentido, a relação não estava clara.</p></div></section>'+

'<section class="card"><h2>Retomar sem repetir</h2>'+
'<p>Repetir a mesma palavra cinco vezes empobrece o critério 3 e o vocabulário do critério 4. Formas de retomar:</p>'+
'<ul><li><b>Pronome:</b> “ela”, “isso”, “o qual”.</li>'+
'<li><b>Sinônimo ou equivalente:</b> solidariedade → essa ajuda, tal cooperação, esses laços.</li>'+
'<li><b>Palavra mais geral:</b> o samba, a fotografia → esses textos.</li>'+
'<li><b>Expressão-resumo:</b> “esse paradoxo”, “tal cenário”, “essa contradição” retomam um parágrafo inteiro.</li>'+
'<li><b>Elipse:</b> omitir o termo óbvio (“Sarnau exige o preço; depois, cede”).</li></ul>'+
'<p>“Esse” retoma o que já foi dito; “este” anuncia o que vem.</p></section>'+

'<section class="card"><h2>Progressão e períodos curtos</h2>'+
'<p><b>Progressão</b> é cada parágrafo acrescentar algo: um novo argumento, uma nova escala (do indivíduo à sociedade), uma objeção. Se dois parágrafos dizem a mesma coisa com exemplos diferentes, o texto anda em círculo.</p>'+
'<p>O artigo sobre a redação nota máxima de 2026 elogia exatamente isso: o candidato “não recua, vai adiante”, e leva a discussão da ficção para o mundo concreto.</p>'+
'<p><b>Período curto:</b> um sujeito, um verbo principal e no máximo uma ideia secundária. Passou de 3 linhas manuscritas, divida com ponto.</p>'+
'<ul><li><b>Longo:</b> “A solidariedade, que é importante desde sempre e que aparece nos textos da coletânea, os quais mostram várias formas de ajuda, é algo que precisa ser pensado, porque às vezes humilha, o que é um problema, já que as pessoas querem dignidade.”</li>'+
'<li><b>Curto:</b> “A coletânea mostra várias formas de ajuda. Nem todas, porém, respeitam quem recebe. Quando humilha, a solidariedade falha, porque todos querem ser tratados com dignidade.”</li></ul></section>',

'<p>Em 4 parágrafos, ele costuma ocupar o §3, o maior. Em 5, o §4. Também pode vir dentro de um parágrafo de desenvolvimento (“É verdade que…; no entanto…”), o que economiza linhas. Evite deixá-lo para a conclusão: ali não há espaço para provar e refinar.</p>'+

html:'<section class="card"><h2>1. A regra de escolha</h2>'+
'<p>A Fuvest pode trazer <b>duas propostas com a mesma coletânea</b>, cada uma de um gênero. Foi assim na prova de 2026 (dissertativo-argumentativo <i>ou</i> carta) e no Simulado 2027 (narrativo <i>ou</i> dissertativo-argumentativo). O Guia de Provas 2027 confirma que a proposta “poderá solicitar a produção de mais de um gênero textual”.</p>'+
'<div class="note mn"><span class="lab">Sua regra</span><p><b>Se a dissertação estiver entre as propostas, escolha a dissertação.</b> É o gênero que você treinou. O tema e a coletânea são os mesmos, então você não perde repertório. Critério 2 (modalidade, peso 2): é onde a escolha segura protege a nota.</p></div>'+
'<ol><li>Leia as duas propostas até o fim, palavra por palavra.</li><li>Ache a palavra do gênero (“dissertativo-argumentativo”, “carta”, “narrativo”).</li><li><b>Marque a proposta escolhida na folha de redação</b> antes de escrever a primeira linha.</li></ol>'+
'<div class="note peg"><span class="lab">Zero certo</span><p>Guia 2027: “Em caso de não escolher, a nota da redação será ZERO.” E nota zero na redação elimina do vestibular (Edital 2027).</p></div></section>'+

'<section class="card"><h2>2. O que zera e o que o critério 2 pune</h2>'+
'<p><b>Zero</b> (Guia 2027): não abordar o tema; “não atendimento à modalidade textual da proposta escolhida”; cópia integral ou parcial da coletânea; não marcar a proposta.</p>'+
'<p><b>Critério 2, peso 2</b> (Guia 2027): o nível 1 descreve “traços conflitantes de tipos e gêneros textuais distintos”; o nível 4 pede “evidente domínio da estrutura composicional” do gênero escolhido.</p>'+
'<ul><li><b>Misturar</b> gêneros derruba o critério 2.</li><li><b>Trocar</b> o gênero inteiro arrisca o zero.</li><li>Marcar uma proposta e escrever o gênero da outra também arrisca o zero, pela mesma regra (dedução nossa: o Guia não cita esse caso).</li></ul>'+
'<div class="note cai"><span class="lab">Vale para a dissertação</span><p>Na dissertação, nada de vocativo, “caro leitor”, assinatura ou longos trechos narrados. Um exemplo curto ajuda; uma história inteira mistura gêneros (critério 2, peso 2).</p></div></section>'+

'<section class="card"><h2>3. Carta: checklist</h2>'+
'<p><b>Oficial (prova de 2026, Proposta 2):</b> carta a uma <b>personagem hipotética</b> que o tenha acusado falsamente de um ato moralmente reprovável, explicando por que você concede ou não o perdão. A redação deve conter “as partes que compõem a estrutura de uma carta” e ser assinada com o termo “Nome”. A abordagem oficial acrescenta: a personagem não deve existir na realidade; a banca observou reflexão sobre o tema, definição de um contexto, elementos formais e clareza para o interlocutor.</p>'+
'<p><b>Inferência didática</b> (convenção escolar; a Fuvest não lista as partes):</p>'+
'<ol><li><b>Local e data</b> no alto.</li><li><b>Vocativo</b> com o nome inventado do destinatário.</li><li><b>Corpo argumentativo</b> dirigido a ele: situação (quem acusou, de quê), decisão e razões. Use 2ª pessoa sem misturar “você” e “tu”, e retome o vocativo ao longo do texto.</li><li><b>Coletânea</b> dentro da conversa, referenciada: algo que você leu e oferece ao destinatário.</li><li><b>Despedida</b> e assinatura: <b>“Nome”</b>. Nunca o seu nome real.</li></ol>'+
'<p>Registro: formal, na norma padrão; carta não é bilhete. Critério 4 (peso 2) avalia o vocabulário conforme o gênero.</p>'+
'<div class="note peg"><span class="lab">3 erros fatais</span><p>1. Assinar com o nome real ou se identificar (o Guia manda “Nunca se identifique”). 2. Dissertação de envelope: vocativo no topo e depois texto impessoal, sem falar com ninguém (critério 2). 3. Destinatário real ou situação trocada, como uma carta sobre perdão em geral, sem a acusação falsa (critérios 1 e 2).</p></div>'+
'<p><b>Abertura de treino (não oficial):</b></p>'+
'<p><i>São Paulo, 14 de dezembro de 2025.<br>Prezado Otávio,<br>recebi sua mensagem e li duas vezes o pedido de desculpas. Você me acusou, diante de toda a turma, de ter vendido as respostas da prova, e eu passei meses sendo visto como alguém que não sou. Respondo com calma, Otávio, porque você merece saber por que o meu perdão terá uma condição.</i></p></section>'+

'<section class="card"><h2>4. Narrativo: checklist</h2>'+
'<p><b>Oficial (Simulado 2027, Proposta 1):</b> “elabore um texto narrativo que descreva, de modo introspectivo, os pensamentos da personagem retratada” no quadro <i>Intérieur de cuisine</i> (1814), de Michel Grobon, “com base na coletânea” e ambientando a narração “conforme a época retratada”. A abordagem esperava “uma análise intimista e subjetiva”; a coletânea mostrava comida e cozinha como memória e afeto.</p>'+
'<p><b>Não está escrito:</b> foco obrigatório (1ª ou 3ª pessoa), se pode haver diálogo. O que segue é técnica.</p>'+
'<ol><li><b>Narrador e foco</b>: escolha um e mantenha. 3ª pessoa com discurso indireto livre (o narrador de <i>Caminho de pedras</i> entra na cabeça de Noemi) ou 1ª pessoa (Martha narra a própria vida; G. H., em monólogo interior).</li><li><b>Personagem</b> com um <b>conflito</b> pequeno e concreto.</li><li><b>Tempo e espaço</b> do enunciado (em 1814: fogão a lenha, sem geladeira nem celular).</li><li><b>Progressão</b>: algo muda do começo ao fim (uma lembrança, uma decisão). Critério 3 (peso 3) fala em “fatos e/ou argumentos”.</li><li><b>Tema e coletânea</b> entram por objetos, lembranças e pensamentos, nunca por teses (critério 1, peso 3).</li></ol>'+
'<div class="note peg"><span class="lab">3 erros fatais</span><p>1. Dissertação disfarçada: personagem que “conclui” que a culinária é cultura, em parágrafos de tese (critério 2). 2. Ignorar a instrução formal: só ação, sem pensamentos, ou época trocada (critério 2). 3. História solta do tema e da coletânea (critério 1).</p></div>'+
'<p><b>Abertura de treino (não oficial):</b></p>'+
'<p><i>A luz da janela chegava primeiro aos nabos, depois às mãos de Jeanne. Ela descascava devagar, do jeito que a mãe ensinara no campo, e pensava que ninguém naquela casa sabia o que comia. Para os patrões, sopa era só sopa. Para ela, cada caldo guardava um inverno inteiro.</i></p></section>',

id:'modelos',ord:9,ic:'📝',t:'Redações-modelo comentadas',min:12,
html:
'<section class="card"><h2>Como usar estes modelos</h2>'+
'<p>São <b>modelos de treino, não oficiais</b>, escritos para este material. Nenhum é redação de candidato. Cada um tem entre 330 e 420 palavras, o que cabe em cerca de 30 linhas manuscritas.</p>'+
'<p>Leia assim: primeiro a tese (em negrito), depois os tópicos frasais, depois o comentário. Não decore frases: copie o <b>movimento</b>. Os textos da coletânea aparecem só em paráfrase, com autor e função.</p>'+
'<div class="note peg"><span class="lab">Sem promessa de nota</span><p>A estimativa no fim de cada comentário é “pela grade”, feita por nós. A nota real depende de duas correções independentes, da letra e da folha definitiva.</p></div></section>'+

'<section class="card"><h2>Modelo 1: Fuvest 2025</h2>'+
'<p class="sub">Tema: “As relações sociais por meio da solidariedade”. Dissertação. Modelo de treino, não oficial.</p>'+
'<p>Em <i>Memórias de Martha</i>, de Júlia Lopes de Almeida, a menina Martha ganha o vestido de uma filha rica e, sob risadas, sente o coração parar quando a mãe agradece “a esmola”. A cena mostra que a ajuda tanto aproxima quanto pode rebaixar. <b>A solidariedade fortalece os laços sociais, mas só quando trata quem recebe como igual; quando vira vitrine ou favor, reforça a hierarquia que dizia combater.</b></p>'+
'<p>Em certo sentido, ajudar é condição da vida em comum. Edgar Morin lembra que a própria vida se organiza em simbioses, associações duráveis que beneficiam os dois lados, e Durkheim mostrou que, na sociedade moderna, a divisão do trabalho torna cada um dependente de muitos outros. Ninguém se basta. Por isso, a solidariedade não é enfeite moral: é a forma pela qual essa interdependência se torna consciente e escolhida.</p>'+
'<p>No entanto, nem toda ajuda é simbiose. Em <i>Quincas Borba</i>, de Machado de Assis, a comissão de caridade serve sobretudo para que Sofia ganhe prestígio entre senhoras que mal a cumprimentavam: quem recebe desaparece, e quem doa sobe. Hoje, a doação filmada para as redes repete o gesto, e o necessitado vira cenário. Essa ajuda não é inútil, pois alimenta alguém; contudo, como lembra Ruth Guimarães, até o mais bruto quer ser tratado como gente. Resolve-se a fome e fere-se a dignidade, o que Kant chamaria de usar o outro apenas como meio.</p>'+
'<p>Além disso, a boa vontade individual tem limite de escala. A Declaração do G20 de 2024 reconhece que o mundo já produz alimento suficiente para acabar com a fome e que falta vontade política. Se é assim, a caridade, por mais sincera, apenas administra uma falta que poderia ser eliminada. A solidariedade madura é a que se converte em compromisso coletivo, isto é, em direitos e políticas públicas.</p>'+
'<p>Portanto, a solidariedade sustenta as relações sociais apenas quando nivela. A própria Martha encontra essa medida: no mesmo dia, o beijo da irmã mais velha da menina rica apaga sua tristeza, e ela o chama de “nivelador”. Ajudar sem rebaixar, no gesto pessoal ou na política, é o que separa o laço da esmola.</p></section>'+

'<section class="card"><h2>Comentário do modelo 1</h2>'+
'<ul><li><b>Critério 1 (peso 3):</b> a tese liga os dois polos da frase temática (relações sociais e solidariedade), o que o Guia 2025 chamou de “incontornável”. Quatro textos da coletânea (Morin, Machado, Ruth Guimarães, G20) entram com função, um a favor e três como limite. Repertório próprio: Durkheim, Kant e uma obra da lista. Isso aponta para “apropriação consistente”.</li>'+
'<li><b>Critério 2 (peso 2):</b> introdução com tese, três parágrafos de desenvolvimento (base, limite moral, limite político) e conclusão que retoma a tese refinada. Estrutura dissertativa completa.</li>'+
'<li><b>Critério 3 (peso 3):</b> progressão por escalas: base (interdependência) → limite moral (vitrine) → limite político (escala) → síntese. Conectivos variados (“No entanto”, “Além disso”, “Portanto”) e retomadas (“essa ajuda”, “essa medida”). O fio Martha abre e fecha.</li>'+
'<li><b>Critério 4 (peso 2):</b> períodos curtos, registro formal, vocabulário preciso (“simbiose”, “interdependência”, “nivelador”).</li>'+
'<li><b>Estimativa pela grade:</b> níveis 3 a 4 nos quatro critérios. O que mais o aproxima do 4 é o contraponto em dois tipos (interesse oculto e insuficiência) e o fio literário que volta na conclusão.</li></ul></section>'+

'<section class="card"><h2>Modelo 2: Fuvest 2026, proposta 1</h2>'+
'<p class="sub">Tema: “O perdão é um ato que pode ser condicionado ou limitado”. Texto dissertativo-argumentativo. Modelo de treino, não oficial.</p>'+
'<p>Em <i>A visão das plantas</i>, de Djaimilia Pereira de Almeida, o velho Celestino, ex-capitão de navio negreiro, recusa até o fim a confissão e morre sem nenhuma dúvida na consciência, enquanto a vila passa a lembrá-lo como herói. Ninguém o perdoou, mas é como se tivesse sido. <b>O perdão pode ter condições e limites; mas a única condição que não o corrompe é o reconhecimento do erro, e o único limite que não o anula é que ele pertence ao ofendido.</b></p>'+
'<p>Condicionar o perdão não é, por si, mesquinharia. No samba de Arlindo Cruz, o eu lírico perdoa a amada desde que ela volte: a condição é afetiva e leve. Em <i>Balada de amor ao vento</i>, de Paulina Chiziane, Sarnau, abandonada duas vezes por Mwando, cobra dele o preço que pagou sozinha pela fuga dos dois antes de aceitá-lo. Nos dois casos, a condição não humilha: obriga quem errou a ouvir o tamanho do dano. Sem isso, o perdão vira esquecimento conveniente.</p>'+
'<p>Há, além disso, um limite que nenhuma boa vontade supera. No relato trazido por Juliana de Albuquerque, um rabino recusa as desculpas de quem o humilhara sem saber quem ele era, porque o ofendido fora “um homem comum”, e só a este caberia perdoar. Ninguém perdoa em nome de outro. Por isso a vila de Celestino não podia convertê-lo em lenda: as vítimas do porão já não podem falar. No plano coletivo, a Comissão da Verdade e Reconciliação da África do Sul condicionou a anistia à confissão completa dos crimes, reconhecendo que a paz não dispensa a verdade.</p>'+
'<p>Pode-se objetar que perdão com condição é troca, e não perdão: para Derrida, perdoar de verdade seria perdoar o imperdoável, pergunta que Venâncio também faz em <i>Tudo é rio</i>. A objeção vale no plano íntimo, em que alguém pode perdoar sem nada pedir. Quando o dano é coletivo, porém, o perdão incondicional serve mais ao culpado do que às vítimas.</p>'+
'<p>Portanto, condicionar o perdão ao reconhecimento do erro e limitá-lo à voz do ofendido não o diminui. Ao contrário: impede que ele se confunda com o silêncio que, como no jardim de Celestino, deixa florescer o crime sem julgamento. Perdoar continua sendo um gesto livre, mas não pode ser um modo de esquecer.</p></section>'+

'<section class="card"><h2>Comentário do modelo 2</h2>'+
'<ul><li><b>Critério 1 (peso 3):</b> a tese responde às duas palavras da frase temática: diz qual <b>condição</b> é legítima e qual <b>limite</b> é intransponível. A coletânea trabalha em pares: samba (condição leve) × relato do rabino (limite); Venâncio no contraponto. Repertório próprio: duas obras da lista, Derrida e a Comissão sul-africana. A abordagem de 2026 sugeria pensar o perdão nos planos particular e coletivo; o texto faz os dois.</li>'+
'<li><b>Critério 2 (peso 2):</b> dissertativo-argumentativo completo, com ponto de vista explícito desde a introdução.</li>'+
'<li><b>Critério 3 (peso 3):</b> cada parágrafo cumpre uma promessa da tese: condição (§2), limite (§3), objeção (§4). “Ninguém perdoa em nome de outro” é frase-síntese curta que amarra o §3. Celestino abre, volta no meio e fecha.</li>'+
'<li><b>Critério 4 (peso 2):</b> registro formal, sem gíria; a citação “um homem comum” tem três palavras, entre aspas e com fonte. O resto é paráfrase.</li>'+
'<li><b>Estimativa pela grade:</b> níveis 3 a 4. Ponto de atenção: o contraponto é curto (3 períodos); com mais linhas, valeria provar melhor a objeção antes de refiná-la.</li></ul></section>'+

'<section class="card"><h2>Modelo 3: Simulado Fuvest 2027, proposta 2</h2>'+
'<p class="sub">Tema: “Cultura e culinária”. Texto dissertativo-argumentativo. Modelo de treino, não oficial.</p>'+
'<p>Na nota de abertura de um livro de receitas caipiras inspirado em Chico Bento, os editores dizem que rever o personagem traz ar fresco às salas fechadas da cidade. Uma receita, afinal, nunca é só receita: guarda um lugar, uma infância, um modo de viver. <b>A culinária é uma das formas mais densas de cultura, mas só continua sendo cultura quando o ato de cozinhar e quem cozinha não são reduzidos a uma função, seja nutrir, vender ou servir.</b></p>'+
'<p>Cozinhar é, desde a origem, um gesto cultural. Lévi-Strauss, em <i>O cru e o cozido</i>, mostrou que muitos mitos tratam o cozimento como passagem da natureza à cultura. Sophie Dahl, ao descrever sua cozinha ideal como o centro afetivo da casa, feito de memórias de família e de conversa, confirma em escala íntima o que o antropólogo viu em escala coletiva: à mesa, aprende-se quem somos e de onde viemos.</p>'+
'<p>Por isso, preocupa a moda, criticada por Josimar Melo, de chamar carne de “proteína” nos cardápios. A palavra parece neutra, mas reduz o alimento a nutriente e apaga a origem, o preparo e a história do prato. O <i>Guia Alimentar para a População Brasileira</i>, do Ministério da Saúde, vai no sentido oposto, ao recomendar que se desenvolvam e partilhem habilidades culinárias. Quando a comida vira número, perde-se exatamente o que a tornava cultura.</p>'+
'<p>É verdade, porém, que a cozinha afetiva tem um avesso. O quadro de Michel Grobon mostra uma mulher sozinha numa cozinha rústica, cercada de legumes e utensílios; e, em <i>Balada de amor ao vento</i>, de Paulina Chiziane, uma tia entrega a Sarnau, no casamento, um pilão, dizendo que o lar é o pilão e a mulher, o cereal. Por muito tempo, a tradição culinária também foi trabalho imposto às mulheres. Isso não anula seu valor cultural; mostra que preservá-la exige reconhecer e dividir o trabalho de quem cozinha.</p>'+
'<p>Assim, a culinária é cultura porque une memória, território e afeto, mas permanece viva apenas quando não se reduz a nutriente nem a obrigação de poucos. Como o ar fresco prometido pelo livro de Chico Bento, ela só renova a casa se todos puderem entrar na cozinha.</p></section>'+

'<section class="card"><h2>Comentário do modelo 3</h2>'+
'<ul><li><b>Critério 1 (peso 3):</b> os quatro textos do Simulado entram com função: livro de Chico Bento e Sophie Dahl (cultura e afeto), Josimar Melo (redução), quadro de Grobon (avesso). A imagem é lida, não só citada. Repertório: Lévi-Strauss, o Guia Alimentar e uma obra da lista.</li>'+
'<li><b>Critério 2 (peso 2):</b> dissertativo completo. Note que o tema é amplo (“Cultura e culinária”): a tese cria o recorte (redução a função).</li>'+
'<li><b>Critério 3 (peso 3):</b> progressão por oposição: valor (§2) → ameaça (§3) → avesso da própria tradição (§4) → síntese. O fio “ar fresco” abre e fecha.</li>'+
'<li><b>Critério 4 (peso 2):</b> vocabulário do campo (“nutriente”, “preparo”, “território”) sem jargão.</li>'+
'<li><b>Estimativa pela grade:</b> níveis 3 a 4. O contraponto é o ponto mais forte: usa a imagem da coletânea contra a idealização da cozinha e refina a tese em vez de abandoná-la.</li></ul></section>'+

'<section class="card"><h2>O que os três têm em comum</h2>'+
'<ul><li>Abrem com um fato concreto (uma cena, uma frase de livro) que já toca o tema.</li>'+
'<li>Tese com “mas só quando” ou “a única condição”: afirmação, ressalva e critério.</li>'+
'<li>Um parágrafo de contraponto que reconhece, prova e refina.</li>'+
'<li>Coletânea em paráfrase com função; repertório próprio explicado em uma frase.</li>'+
'<li>Conclusão que volta à imagem do início, sem argumento novo.</li></ul>'+
'<div class="note cai"><span class="lab">Padrões de nota máxima</span><p>São os mesmos que professores da USP apontaram numa redação nota máxima de 2026: abertura com repertório ligado ao tema, tese que mostra um paradoxo do presente, progressão que “vai adiante” e fecho com nuance (Jornal da USP, fev. 2026).</p></div></section>',

html:
'<section class="card"><h2>O que está em jogo</h2>'+
'<ul><li>O 1º dia (<b>6/12/2026</b>) junta as 10 questões de Português e a redação, em <b>até 4 horas</b> no total. Não há tempo separado para a redação (Guia de Provas 2027, p. 6).</li>'+
'<li>A redação vale <b>50 pontos</b>; as 10 questões, outros 50 (Edital 2027, Art. 13).</li>'+
'<li><b>Nota zero na redação elimina</b> do vestibular (Edital 2027, Art. 13, §2º).</li></ul>'+
'<div class="note mn"><span class="lab">Macete</span><p>Toda dica deste material está ligada a um dos 4 critérios. Quando estiver em dúvida sobre o que priorizar, olhe o peso.</p></div></section>'+

'<section class="card"><h2>Os 4 critérios e os pesos</h2>'+
'<p>Cada critério recebe um nível de <b>1 a 4</b>. Depois, cada nível é multiplicado pelo peso (Guia 2027, p. 10–12).</p>'+
'<ul><li><b>1. Tema, coletânea e autoria:</b> peso 3</li><li><b>2. Modalidade textual (tipo e gênero):</b> peso 2</li><li><b>3. Coesão, coerência e progressão:</b> peso 3</li><li><b>4. Norma, convenções da escrita e vocabulário:</b> peso 2</li></ul>'+
'<p>Conta nossa: a soma ponderada vai de 10 (tudo no nível 1) a 40 (tudo no nível 4). <b>A Fuvest não publica</b> como essa soma vira os 50 pontos. Por isso, aqui só falamos em “estimativa pela grade”.</p>'+
'<div class="note cai"><span class="lab">O que mais pesa</span><p>Os critérios 1 e 3 somam 6 dos 10 pesos (60%). Ideias, uso da coletânea e encadeamento valem mais do que a gramática sozinha.</p></div></section>'+

'<section class="card"><h2>Critério 1: tema, coletânea e autoria (peso 3)</h2>'+
'<p>Nome oficial: “Compreensão e desenvolvimento do tema, uso da coletânea e autoria”. A banca quer que você entenda a <b>frase temática</b>, use a coletânea “de forma referenciada”, com “intertextualidade e interdiscursividade”, e assuma “seu lugar de autor”, pensando no “leitor pretendido”. Também avalia a “efetiva progressão do tema”.</p>'+
'<ul><li><b>Nível 1:</b> abordagem “tangencial” do tema, “sem indícios de autoria e/ou com indicação de plágio da coletânea”. Em português claro: rodeou o tema ou copiou.</li>'+
'<li><b>Nível 2:</b> abordagem “razoável”, com “paráfrase superficial da coletânea” e “algum indício de autoria”. Resumiu os textos sem pôr os textos para trabalhar.</li>'+
'<li><b>Nível 3:</b> abordagem “adequada”, com “utilização produtiva da coletânea” e “fortes indícios de autoria”. Os textos sustentam a sua tese.</li>'+
'<li><b>Nível 4:</b> abordagem “aprimorada”, com “apropriação consistente da coletânea” e “robustos indícios de autoria”. Você interpreta, relaciona os textos entre si, traz conhecimento próprio e se posiciona.</li></ul></section>'+

'<section class="card"><h2>Critério 2: modalidade textual (peso 2)</h2>'+
'<p>Verifica se tipo e gênero estão adequados e se você domina a “estrutura composicional” da modalidade escolhida.</p>'+
'<ul><li><b>Nível 1:</b> “Atendimento parcial”, com “traços conflitantes” de outros tipos e gêneros.</li>'+
'<li><b>Nível 2:</b> “Atendimento satisfatório”: dá para identificar o gênero, “ainda que apresente traços de outras modalidades”.</li>'+
'<li><b>Nível 3:</b> “Atendimento adequado”: gênero identificado “nitidamente”, “ainda que lhe falte algum traço específico”.</li>'+
'<li><b>Nível 4:</b> “Atendimento completo”, com “evidente domínio da estrutura composicional”.</li></ul>'+
'<div class="note mn"><span class="lab">As 4 perguntas</span><p>Dois professores da USP resumiram o critério 2, para a dissertação, em quatro perguntas: é uma dissertação? Tem introdução com tese? O desenvolvimento sustenta a tese? Tem fechamento? (Jornal da USP, fev. 2026; artigo de opinião, não documento da Fuvest.)</p></div></section>'+

'<section class="card"><h2>Critério 3: coesão, coerência e progressão (peso 3)</h2>'+
'<p>Avalia se você relaciona “fatos e/ou argumentos” com recursos coesivos, “em prol do ponto de vista adotado”.</p>'+
'<ul><li><b>Nível 1:</b> “Razoável articulação formal e de sentido”, “poucos recursos” e “muitas falhas na composição textual”.</li>'+
'<li><b>Nível 2:</b> “Satisfatória articulação”, “poucos recursos” e “algumas falhas”.</li>'+
'<li><b>Nível 3:</b> “Boa articulação”, “adequados recursos” e “raras falhas”.</li>'+
'<li><b>Nível 4:</b> “Ótima articulação”, “aprimorados recursos” e “composição textual consistente”.</li></ul></section>'+

'<section class="card"><h2>Critério 4: norma e vocabulário (peso 2)</h2>'+
'<p>Examina morfologia, sintaxe, pontuação, ortografia e acentuação, e o vocabulário “adequado e expressivo” para o gênero escolhido.</p>'+
'<ul><li><b>Nível 1:</b> “Rompe frequentemente” as convenções; domínio “elementar”.</li>'+
'<li><b>Nível 2:</b> “Rompe algumas vezes”; domínio “satisfatório”.</li>'+
'<li><b>Nível 3:</b> “Rompe raramente”; “bom domínio”.</li>'+
'<li><b>Nível 4:</b> “Rompe mínima e pontualmente”; “ótimo domínio”.</li></ul>'+
'<div class="note mn"><span class="lab">Macete</span><p>O nível 4 admite desvios “mínimos e pontuais”. Não trave com medo de errar uma vírgula: frase curta e clara erra menos.</p></div></section>'+

'<section class="card"><h2>As 4 situações de nota zero</h2>'+
'<ol><li><b>Tema:</b> “Não abordagem” do tema proposto.</li>'+
'<li><b>Tipo e gênero:</b> “Não atendimento à modalidade textual da proposta escolhida”.</li>'+
'<li><b>Anulação:</b> “Cópia integral ou parcial da coletânea”.</li>'+
'<li><b>Não marcar a proposta escolhida</b> na folha de redação (Guia 2027, p. 7 e 10).</li></ol>'+
'<p>Nos três primeiros casos, “a prova SEMPRE é levada à coordenação” (Guia 2027, p. 10).</p>'+
'<div class="note peg"><span class="lab">Armadilha</span><p>Tangenciar o tema <b>não</b> zera: é o nível 1 do critério 1. Zero é não abordar. Mas tangenciar custa caro, porque derruba o critério de peso 3.</p></div>'+
'<div class="note peg"><span class="lab">Cópia</span><p>Copiar “parcialmente” já anula. O Guia não diz se uma citação curta, entre aspas e com autor, conta como cópia. Padrão seguro: <b>paráfrase com autor e função</b>.</p></div></section>'+

'<section class="card"><h2>Proposta, gênero, título e linhas</h2>'+
'<ul><li><b>Marcar a proposta:</b> a prova manda “Escolha uma das propostas e marque, na folha de redação, a opção selecionada” (prova de 2026; Simulado 2027). Sem marcação, zero (Guia 2027). Como é o campo na folha de 2027: não confirmado.</li>'+
'<li><b>Gêneros:</b> a proposta pode pedir “mais de um gênero textual” (Guia e Edital 2027). Já caiu: só dissertação (2023 a 2025); dissertação <b>ou</b> carta (2026); narrativo <b>ou</b> dissertação (Simulado 2027). Não há lista fechada.</li>'+
'<li><b>Título:</b> pedido só em 2023. De 2024 em diante, nenhum documento pede título, e ele não está em nenhum critério. Não gaste linha com isso.</li>'+
'<li><b>Linhas:</b> desde 2025 não há mínimo; a regra é “não ultrapasse a quantidade de linhas disponíveis”. O rascunho do Simulado 2027 tem 30 linhas. Treine para cerca de 30. O número de linhas da folha definitiva de 2027 não foi confirmado.</li></ul></section>'+

'<section class="card"><h2>Rascunho, correção e anonimato</h2>'+
'<ul><li><b>Rascunho</b> não é corrigido: só vale a folha definitiva. “Não haverá tempo adicional para transcrição” (capa das provas 2023–2026).</li>'+
'<li><b>Folha definitiva:</b> caneta azul ou preta; ela “não será substituída em caso de rasura” (provas 2024–2026).</li>'+
'<li><b>Correção:</b> as bancas fazem uma correção-teste que é descartada (uniformização). Depois, cada resposta recebe “no mínimo, duas avaliações independentes”; se elas divergirem, há terceira correção, e casos duvidosos vão à coordenação (Guia 2027, p. 9).</li>'+
'<li><b>Anonimato:</b> “Nunca se identifique nas respostas” (Guia 2027). Nada de nome, assinatura, escola ou cidade. Se uma carta pedir assinatura, use só a palavra que o enunciado mandar (em 2026, “Nome”).</li>'+
'<li><b>Depois:</b> não há revisão de nota, só vista da redação pelo site (Edital, Art. 44).</li></ul></section>',

'<section class="card"><h2>Por que usar as obras da lista</h2>'+
'<p>O critério 1 (<b>peso 3</b>, o maior, empatado com o critério 3) pede “mobilização de conhecimentos próprios” e “indícios de autoria” (Guia de Provas 2027). Você leu nove livros para a prova de Português: eles também servem na redação.</p>'+

'<div class="note mn"><span class="lab">Regra de ouro (A–I–F)</span><p><b>A</b>utora e obra → <b>I</b>deia, com um fato concreto, em paráfrase → <b>F</b>unção: por que isso prova a sua tese. Sem a função, vira resumo de livro.</p></div>'+

'<li><b><i>Memórias de Martha</i></b> (Júlia Lopes de Almeida): trinta e tantos anos depois, a narradora ainda sente culpa por ter abandonado Mathilde, a colega pobre que a ajudara e foi acusada de roubo. <i>Encaixe:</i> há culpas que ninguém pode perdoar por nós, porque a vítima já não está.</li>'+
'<li><b><i>Canção para ninar menino grande</i></b> (Conceição Evaristo): Dolores transforma o amor por Fio em ódio e planeja vingança, mas desiste da arma. <i>Encaixe:</i> renunciar à vingança não é o mesmo que perdoar; a distinção refina a tese.</li>'+
'</ul><div class="note peg"><span class="lab">Armadilha</span><p><i>A paixão segundo G. H.</i> não é sobre perdão: G. H. não é violenta com Janair (a relação foi de indiferença) e não pede perdão. Use G. H. para culpa de classe e reconhecimento: ela percebe que nunca tinha visto a empregada.</p></div></section>'+

'<section class="card"><h2>2. Solidariedade</h2><ul>'+
'<li><b><i>Caminho de pedras</i></b> (Rachel de Queiroz): Noemi leva à viúva de Mendonça, operário tuberculoso, o dinheiro de uma coleta feita entre os companheiros. Mas, antes, os camaradas condenaram Noemi pelo adultério. <i>Encaixe:</i> a solidariedade de grupo ampara e também pune quem foge da moral do grupo.</li>'+

'</ul></section>'+

'<section class="card"><h2>6. Desigualdade e racismo</h2><ul>'+
'<li><b><i>A paixão segundo G. H.</i></b> (Clarice Lispector): a patroa da cobertura entra no quarto da empregada, que imaginava sujo, e o encontra limpo, com um desenho a carvão na parede; percebe que nunca tinha realmente visto Janair. <i>Encaixe:</i> a invisibilidade do trabalho doméstico na casa brasileira.</li>'+
'<li><b><i>Memórias de Martha</i></b>: Mathilde, pobre e mulata, é a acusada e excluída; Leonor, “muito alva”, é a escolhida por Luiz. <i>Encaixe:</i> raça e classe decidem quem merece segunda chance.</li>'+
'<li><b><i>Opúsculo</i></b>: Nísia descreve a menina rica que, ainda criança, chega a maltratar a ama escravizada que a amamentou; a ama pode ser vendida ou alugada “como um fardo inútil” quando deixa de ser necessária. <i>Encaixe:</i> a escravidão corrompe também a casa de quem escraviza.</li>'+
'<li><b><i>Nebulosas</i></b> (Narcisa Amália, 1872): em “O africano e o poeta”, só o poeta escuta e chora o escravizado. <i>Encaixe:</i> literatura como testemunho e denúncia.</li>'+
'</ul></section>'+

'<section class="card"><h2>7. Violência de gênero</h2><ul>'+
'<li><b><i>Balada</i></b>: Sarnau é dada ao herdeiro do rei pelo lobolo de 36 vacas; o marido a agride, e depois Mwando a agride e a abandona grávida. <i>Encaixe:</i> casamento como negócio entre homens.</li>'+
'<li><b><i>Caminho de pedras</i></b>: os camaradas que pregam a revolução condenam a mulher adúltera. <i>Encaixe:</i> o machismo atravessa até quem luta por igualdade.</li>'+
'<li><b><i>Canção</i></b>: Fio, a conselho dos maquinistas, finge ser o noivo que Angelina esperava; ao descobrir, ela se joga de uma ribanceira. <i>Encaixe:</i> uma masculinidade educada para conquistar, sem responsabilidade.</li>'+
'</ul></section>'+

'<section class="card"><h2>8. Colonialismo</h2><ul>'+
'<li><b><i>A visão das plantas</i></b>: Celestino sufocou com cal escravizados revoltados no porão do navio e morre sem ser punido. <i>Encaixe:</i> a violência colonial naturalizada e sem reparação.</li>'+
'<li><b><i>Balada</i></b>: caderneta de indígena, sipaios e a deportação de Mwando para Angola. <i>Encaixe:</i> o colonialismo como controle de corpos e deslocamentos.</li>'+
'<li><b><i>Opúsculo</i></b>: Nísia culpa a herança portuguesa pelo desprezo à educação feminina e lembra as indígenas, primeiras vítimas dos colonizadores, escravizadas e vendidas por quem dizia levar a fé cristã.</li>'+
'<li><b><i>Geografia</i></b> (Sophia de Mello Breyner Andresen): em “Descobrimento”, os navegadores veem um povo recém-criado, cor de barro. <i>Cuidado:</i> não é poema de denúncia; use para falar do olhar deslumbrado de quem chega.</li>'+
'</ul></section>'+

'<section class="card"><h2>9. Natureza</h2><ul>'+
'<li><b><i>A visão das plantas</i></b>: as plantas veem o jardineiro sem gratidão e sem julgamento e florescem sobre um passado de mortes. <i>Encaixe:</i> a natureza não é juiz moral; a responsabilidade é humana.</li>'+
'<li><b><i>Geografia</i></b>: luz, mar e cal funcionam como verdade e justiça; em “Eu me perdi”, o eu se perde na sujeira do mundo e se salva na limpidez da terra. <i>Encaixe:</i> a paisagem como medida ética.</li>'+
'<li><b><i>Nebulosas</i></b>: a ciência decompõe as nebulosas em estrelas, mas a poeta busca nelas consolo e liberdade. <i>Encaixe:</i> natureza entre explicação e sentido.</li>'+
'</ul></section>'+

'<section class="card"><h2>10. Liberdade e repressão</h2><ul>'+
'<li><b><i>Caminho de pedras</i></b>: na Era Vargas, a polícia dissolve um comício; mais tarde, Roberto é deportado para uma colônia numa ilha, e Noemi, sozinha e grávida, vê apagar-se o letreiro “Liberdade para...”.</li>'+
'<li><b><i>Geografia</i></b>: a procelária, ave que voa na tempestade, é o poeta que canta sob o salazarismo; “Túmulo de Lorca” lembra o poeta fuzilado em 1936.</li>'+
'<li><b><i>Nebulosas</i></b>: “Vinte e cinco de março” condena a Constituição outorgada em 1824. <i>Encaixe:</i> poesia como intervenção política já no século XIX.</li>'+
'<li><b><i>Canção</i></b>: Eleonora é expulsa de casa aos 17 anos por amar uma moça. <i>Encaixe:</i> a repressão também é doméstica.</li>'+
'</ul></section>'+

'<section class="card"><h2>11. Tecnologia e o humano</h2><ul>'+
'<li><b><i>Geografia</i></b>: em “Os aviões”, um avião passa sobre a casa como prodígio; noutro lugar, voos de terror deixam ovos de morte. <i>Encaixe:</i> a técnica que maravilha aqui pode matar longe, e a distância anestesia.</li>'+
'<li><b><i>Nebulosas</i></b>: ciência e fé convivem no olhar sobre o céu; a Fuvest pôs o poema ao lado de um texto de Carl Sagan (2ª fase de 2026). <i>Encaixe:</i> conhecimento científico e sentido humano não se excluem.</li>'+
'<li><b><i>G. H.</i></b>: ao perder a “terceira perna”, G. H. descobre que a pessoa montada para os outros cobre uma vida neutra e bruta. <i>Encaixe:</i> em temas sobre o que nos torna humanos, o humano não é só eficiência.</li>'+
'</ul><div class="note peg"><span class="lab">Atenção</span><p>Nenhuma obra da lista fala de internet ou inteligência artificial. Use como analogia e diga que é analogia: “se a técnica, em Sophia, já matava a distância...”.</p></div></section>',

html:
'<section class="card"><h2>Como usar filosofia na redação</h2>'+
'<p>Repertório próprio conta no critério 1 (<b>peso 3</b>): o nível 4 pede “mobilização de conhecimentos próprios que demonstrem robustos indícios de autoria” (Guia 2027). Mas autor citado sem função é enfeite.</p>'+
'<div class="note mn"><span class="lab">Fórmula</span><p>Autor + ideia em uma frase, com suas palavras + o que ela prova no seu texto. Datas e títulos só se tiver certeza. <b>Nunca invente citação</b>: paráfrase bem feita vale mais que aspas duvidosas.</p></div>'+
'<div class="note peg"><span class="lab">Atenção</span><p>Vários autores já estiveram em coletâneas da Fuvest: Benjamin (2019), Sagan (2020), Dardot e Laval (2021), Bergson (2022), Krenak (2023), Byung-Chul Han (2024), Morin (2025). Se o autor estiver na coletânea, ele conta como coletânea; repertório próprio é o que você traz de fora e explica.</p></div>'+
'<h3>Mapa: eixo → autores</h3><ul>'+
'<li><b>Perdão e culpa</b>: Arendt, Derrida.</li>'+
'<li><b>Solidariedade</b>: Aristóteles, Durkheim, Mauss.</li>'+
'<li><b>Memória</b>: Benjamin, Arendt.</li>'+
'<li><b>Educação</b>: Paulo Freire, bell hooks, Kant.</li>'+
'<li><b>Trabalho</b>: Marx, Byung-Chul Han, Durkheim.</li>'+
'<li><b>Desigualdade, racismo e colonialismo</b>: Mbembe, bell hooks.</li>'+
'<li><b>Gênero</b>: Beauvoir, bell hooks.</li>'+
'<li><b>Natureza</b>: Krenak, Hans Jonas.</li>'+
'<li><b>Liberdade e repressão</b>: Foucault, Kant.</li>'+
'<li><b>Tecnologia e o humano</b>: Hans Jonas, Han, Foucault.</li></ul></section>'+

'<section class="card"><h2>Aristóteles (século IV a.C.)</h2><p><b>Ideia:</b> o ser humano é um animal político: só se realiza plenamente vivendo na cidade, em comunidade (<i>Política</i>).</p><p><b>Use para:</b> solidariedade, vida em comum, educação como formação do cidadão.</p><p><b>Cuidado:</b> ele aceitava a escravidão e a submissão das mulheres; não diga que defendia igualdade.</p></section>'+

'<section class="card"><h2>Immanuel Kant (1724–1804)</h2><p><b>Ideia:</b> trate a humanidade, em você e nos outros, sempre como fim, nunca apenas como meio (<i>Fundamentação da metafísica dos costumes</i>, 1785). E o Esclarecimento é a saída da menoridade: ter coragem de pensar por si (texto de 1784).</p><p><b>Use para:</b> dignidade (ajuda que humilha usa o outro como meio), educação para a autonomia, liberdade de pensamento.</p><p><b>Cuidado:</b> é “nunca <i>apenas</i> como meio”: todos usamos os outros como meio (o motorista, o professor); o erro é reduzir a pessoa a isso.</p></section>'+

'<section class="card"><h2>Hannah Arendt (1906–1975)</h2><p><b>Ideia 1:</b> “banalidade do mal” (<i>Eichmann em Jerusalém</i>, 1963): grandes crimes podem ser cometidos por pessoas comuns que obedecem sem pensar. <b>Ideia 2:</b> em <i>A condição humana</i> (1958), o perdão é o que liberta da irreversibilidade dos atos, e a promessa dá alguma segurança diante do futuro incerto.</p><p><b>Use para:</b> perdão, culpa, obediência, burocracia, memória de crimes coletivos.</p><p><b>Cuidado:</b> “banal” não quer dizer pequeno ou desculpável; quer dizer sem profundidade, sem reflexão. Historiadores depois contestaram o retrato de Eichmann como simples burocrata.</p></section>'+

'<section class="card"><h2>Jacques Derrida (1930–2004)</h2><p><b>Ideia:</b> nos textos sobre o perdão do fim dos anos 1990, ele sustenta que o perdão puro seria incondicional e perdoaria justamente o imperdoável; o perdão que exige condições (arrependimento, reparação) se aproxima de uma troca.</p><p><b>Use para:</b> perdão condicionado × incondicional (o tema de 2026; o texto 2 da coletânea perguntava se o perdão não existe para o imperdoável).</p><p><b>Cuidado:</b> ele não diz que devemos perdoar tudo; mantém a tensão entre os dois polos. Use para mostrar o dilema, não para resolvê-lo.</p></section>'+

'<section class="card"><h2>Walter Benjamin (1892–1940)</h2><p><b>Ideia:</b> em <i>Sobre o conceito de história</i> (1940), ele pede que a história seja contada também do ponto de vista dos vencidos, porque todo monumento de cultura carrega também a barbárie de quem foi esmagado.</p><p><b>Use para:</b> memória, colonialismo, reescrita da história (combina com <i>A visão das plantas</i>).</p><p><b>Cuidado:</b> caiu na coletânea de 2019 (outro trecho); traga a ideia com sua função, não como frase de efeito.</p></section>'+

'<section class="card"><h2>Émile Durkheim (1858–1917)</h2><p><b>Ideia:</b> em <i>Da divisão do trabalho social</i> (1893), separa a solidariedade mecânica (por semelhança, em sociedades simples) da orgânica (por interdependência, nas modernas). Quando as normas se enfraquecem, há anomia.</p><p><b>Use para:</b> solidariedade, trabalho, coesão social.</p><p><b>Cuidado:</b> em Durkheim, “solidariedade” é coesão social, não bondade; e anomia é falta de normas que regulem, não “caos” genérico.</p></section>'+

'<section class="card"><h2>Marcel Mauss (1872–1950)</h2><p><b>Ideia:</b> no <i>Ensaio sobre a dádiva</i> (1925), mostra que dar, receber e retribuir formam um ciclo de obrigações: o presente cria vínculo e também dívida.</p><p><b>Use para:</b> solidariedade e caridade interessada (como a de Rubião, de Machado, na coletânea de 2025).</p><p><b>Cuidado:</b> não diga que toda ajuda é egoísta; diga que toda ajuda cria laço, e que o laço pode ser de igualdade ou de dependência.</p></section>'+

'<section class="card"><h2>Karl Marx (1818–1883)</h2><p><b>Ideia:</b> nos <i>Manuscritos econômico-filosóficos</i> (1844), o trabalho alienado: o trabalhador não se reconhece no que produz nem na própria atividade, que pertence a outro.</p><p><b>Use para:</b> trabalho, desigualdade, trabalho precarizado.</p><p><b>Cuidado:</b> “alienação” aqui é conceito técnico (estranhamento do trabalho), não “pessoa desinformada”.</p></section>'+

'<section class="card"><h2>Paulo Freire (1921–1997)</h2><p><b>Ideia:</b> na <i>Pedagogia do oprimido</i> (escrita no exílio, fim dos anos 1960), critica a educação “bancária”, que deposita conteúdo no aluno, e defende uma educação dialógica, que parte da realidade do educando e o torna sujeito.</p><p><b>Use para:</b> educação, desigualdade, autonomia. É o Patrono da Educação Brasileira (lei de 2012).</p><p><b>Cuidado:</b> para Freire, nenhuma educação é neutra; não o use para defender uma escola “sem política”.</p></section>'+

'<section class="card"><h2>bell hooks (1952–2021)</h2><p><b>Ideia:</b> em <i>Ensinando a transgredir</i> (1994), retoma Freire: a sala de aula pode ser prática da liberdade, se reconhecer raça, gênero e classe de quem aprende. Em <i>Tudo sobre o amor</i> (2000), trata o amor como ação e escolha, não só sentimento.</p><p><b>Use para:</b> educação, racismo, gênero, amor e cuidado (combina com <i>Canção</i>).</p><p><b>Cuidado:</b> o nome é escrito em minúsculas, por escolha da autora.</p></section>'+

'<section class="card"><h2>Simone de Beauvoir (1908–1986)</h2><p><b>Ideia:</b> em <i>O segundo sexo</i> (1949): “Ninguém nasce mulher: torna-se mulher”. A condição feminina é construída pela sociedade, que faz da mulher o “Outro” do homem.</p><p><b>Use para:</b> violência de gênero, casamento, trabalho feminino (<i>Balada</i>, <i>Caminho de pedras</i>, <i>Martha</i>).</p><p><b>Cuidado:</b> não é negar o corpo; é dizer que o destino social da mulher não é natural.</p></section>'+

'<section class="card"><h2>Michel Foucault (1926–1984)</h2><p><b>Ideia:</b> em <i>Vigiar e punir</i> (1975), mostra a sociedade disciplinar: prisão, escola, fábrica e quartel fabricam “corpos dóceis” por vigilância constante, como no panóptico.</p><p><b>Use para:</b> repressão, controle, escola, vigilância (com cuidado, tecnologia).</p><p><b>Cuidado:</b> o panóptico é um projeto de Bentham que Foucault analisa; e, para Foucault, o poder não só reprime: também produz comportamentos.</p></section>'+

'<section class="card"><h2>Achille Mbembe (1957–)</h2><p><b>Ideia:</b> no ensaio “Necropolítica” (2003), o poder soberano decide quem pode viver e quem pode morrer; a colônia e a plantation são laboratórios dessa lógica.</p><p><b>Use para:</b> colonialismo, racismo, violência de Estado (<i>A visão das plantas</i>, <i>Balada</i>).</p><p><b>Cuidado:</b> não aplique a qualquer morte; o conceito trata de poder que distribui desigualmente a morte.</p></section>'+

'<section class="card"><h2>Byung-Chul Han (1959–)</h2><p><b>Ideia:</b> em <i>Sociedade do cansaço</i> (2010), passamos da sociedade disciplinar à do desempenho: o sujeito se explora a si mesmo, acreditando ser livre, e adoece de esgotamento.</p><p><b>Use para:</b> trabalho, tecnologia, educação, saúde mental.</p><p><b>Cuidado:</b> esteve na coletânea de 2024 (multitarefa). É ensaísta e generaliza; use como lente, não como dado.</p></section>'+

'<section class="card"><h2>Ailton Krenak (1953–)</h2><p><b>Ideia:</b> em <i>Ideias para adiar o fim do mundo</i> (2019), critica a ideia de uma humanidade separada da Terra, que trata a natureza como recurso.</p><p><b>Use para:</b> natureza, clima, colonialismo, povos indígenas.</p><p><b>Cuidado:</b> esteve na coletânea de 2023. Não fale dos povos indígenas como se fossem todos iguais.</p></section>'+

'<section class="card"><h2>Hans Jonas (1903–1993)</h2><p><b>Ideia:</b> em <i>O princípio responsabilidade</i> (1979), propõe uma ética para a civilização tecnológica: agir de modo que os efeitos da ação não destruam a possibilidade de vida humana futura.</p><p><b>Use para:</b> tecnologia, inteligência artificial, clima, ciência.</p><p><b>Cuidado:</b> ele não é contra a técnica; defende prudência proporcional ao poder que ela ganhou.</p></section>',

'<h3>Três jeitos de encaixar um autor (modelos de treino, não oficiais)</h3><ul>'+
'<li><b>Como chave de leitura:</b> “O caso lembra o que Hannah Arendt chamou de banalidade do mal: crimes feitos por quem obedece sem pensar.”</li>'+

'<p>Para cada tema: a proposta, a ideia de cada texto da coletânea em uma linha (paráfrase), o que a banca esperou e uma tese com tensão para <b>dissertação</b>, que é o seu gênero. As teses e os contrapontos são <b>modelos de treino, não oficiais</b>.</p>'+

'<section class="card"><h2>Para que serve este módulo</h2>'+
'<p>O critério 4 (<b>peso 2</b>) avalia “correção gramatical, convenção da escrita e adequação vocabular”; o nível 4 “rompe mínima e pontualmente” as convenções (Guia 2027). Conectivos e pontuação também pesam no critério 3 (<b>peso 3</b>, coesão). Aqui estão os erros que mais aparecem em redações de vestibular, com exercícios. O gabarito está no Aprofundar.</p></section>'+

'<section class="card"><h2>1. Crase</h2>'+
'<p>Crase é a fusão da preposição <b>a</b> com o artigo <b>a</b> (ou com o “a” de aquele, aquela, aquilo, a qual).</p>'+
'<div class="note mn"><span class="lab">Três truques</span><p><b>Masculino:</b> troque por palavra masculina; se virar “ao”, há crase (vou à escola → vou ao colégio). <b>Voltar:</b> “vou a/à X” → “volto da X” tem crase; “volto de X”, não (vou à Bahia, volto da Bahia; vou a Brasília, volto de Brasília). <b>A qual:</b> “ao qual” no masculino → “à qual”.</p></div>'+
'<p><b>Sempre:</b> horas (às 15h); locuções femininas (à noite, às vezes, à medida que, à custa de); “à moda de”, mesmo oculta (bife à milanesa); “àquele”, quando o verbo pede “a” (assisti àquele filme).</p>'+
'<p><b>Nunca:</b> antes de masculino; de verbo (começou a entender); de artigo indefinido (retornar a um estado); de pronome pessoal e da maioria dos de tratamento (a ela, a Vossa Excelência); entre palavras repetidas (cara a cara); “a” no singular antes de plural (a pessoas pobres).</p>'+
'<p><b>Facultativa:</b> antes de possessivo feminino singular (à/a minha mãe), de nome de mulher (à/a Juliana) e depois de “até” (até à/a praia).</p>'+
'<p><b>Exercício 1.</b> Crase ou não? a) Assisti ___ palestra. b) Refiro-me ___ uma questão antiga. c) Chegou ___ 8h. d) Começou ___ chover. e) A obra ___ qual me refiro. f) Entregou o prêmio ___ cada aluna.</p></section>'+

'<section class="card"><h2>2. Regência dos verbos que mais caem</h2><ul>'+
'<li><b>Assistir a</b> (ver): assistir ao jogo. Sem “a” é ajudar: o médico assistiu o paciente.</li>'+
'<li><b>Visar a</b> (ter como objetivo): a lei visa à proteção. Sem “a” é mirar ou pôr visto.</li>'+
'<li><b>Aspirar a</b> (desejar): aspirar a um cargo. Sem “a” é inalar.</li>'+
'<li><b>Preferir</b> uma coisa <b>a</b> outra: prefiro ler a ver TV (nunca “do que”, nunca “mais”).</li>'+
'<li><b>Obedecer a</b>, <b>responder a</b>, <b>proceder a</b> (realizar): obedecer às regras.</li>'+
'<li><b>Implicar</b> (acarretar) é direto: a decisão implica riscos (evite “implica em”).</li>'+
'<li><b>Chegar a</b> e <b>ir a</b>: chegou ao fim (não “chegou no fim”).</li>'+
'<li><b>Lembrar</b> algo / <b>lembrar-se de</b> algo; <b>esquecer</b> algo / <b>esquecer-se de</b> algo. Não misture: “lembrei do” é coloquial.</li>'+
'<li><b>Perdoar</b> e <b>pagar</b>: a coisa sem preposição, a pessoa com “a”: perdoou a ofensa ao amigo; perdoou-lhe.</li>'+
'<li><b>Simpatizar com</b> (não é pronominal): simpatizo com a ideia.</li></ul>'+
'<p><b>Exercício 2.</b> Corrija: a) Prefiro mais estudar do que trabalhar. b) A medida implica em gastos. c) Os jovens aspiram uma vaga. d) Não lembrei do prazo.</p></section>'+

'<section class="card"><h2>3. Concordância</h2><ul>'+
'<li><b>Haver</b> (existir, acontecer) e <b>fazer</b> (tempo) não vão para o plural: houve protestos; faz dois anos. O auxiliar também fica no singular: deve haver soluções.</li>'+
'<li><b>Existir</b>, <b>ocorrer</b>, <b>surgir</b> concordam: existem problemas; surgiram dúvidas (cuidado com o sujeito depois do verbo).</li>'+
'<li><b>Passiva com “se”:</b> vendem-se casas (casas são vendidas). Com preposição, singular: precisa-se de professores.</li>'+
'<li><b>Mais de um</b> pede singular: mais de um aluno faltou.</li>'+
'<li><b>É necessário paciência</b> (sem artigo, invariável); <b>é necessária a paciência</b> (com artigo, concorda).</li>'+
'<li><b>Meio</b> e <b>menos</b>: “meio cansada” (advérbio, invariável); “menos pessoas” (nunca “menas”). <b>Anexo</b>, <b>mesmo</b>, <b>obrigado</b> concordam: elas mesmas; seguem anexas as fotos.</li></ul>'+
'<p><b>Exercício 3.</b> Corrija: a) Haviam muitas causas. b) Fazem dez anos que... c) Vende-se apartamentos. d) Deve existir soluções.</p></section>'+

'<section class="card"><h2>4. “Onde” × “em que”</h2>'+
'<p><b>Onde</b> só para lugar físico: a cidade onde nasci. Para tempo, situação, sistema ou ideia, use <b>em que</b> ou <b>no qual</b>: uma sociedade em que a ajuda humilha; o período em que...; um contexto no qual...</p>'+
'<p><b>Aonde</b> com verbo de movimento que pede “a”: aonde você vai?</p>'+
'<div class="note peg"><span class="lab">Armadilha</span><p>“Onde” como conectivo genérico (“a fome cresceu, onde o governo...”) é erro de coesão: escolha a relação certa (“e, por isso”, “o que mostra que”).</p></div>'+
'<p><b>Exercício 4.</b> Corrija: a) Vivemos uma época onde tudo é rápido. b) Há situações onde o perdão é impossível.</p></section>'+

'<section class="card"><h2>5. Pontuação de período longo</h2><ul>'+
'<li><b>Nunca</b> separe sujeito e verbo nem verbo e complemento com vírgula: “Os refugiados ambientais, são...” está errado.</li>'+
'<li>Intercalações vão entre <b>duas</b> vírgulas: “A escola, segundo Freire, não é neutra.”</li>'+
'<li>Adjunto adverbial no início: vírgula recomendada se for longo (“Nas grandes cidades brasileiras, ...”).</li>'+
'<li>Vírgula antes de <b>mas</b>, <b>porém</b>, <b>contudo</b>; “porém” e “contudo” no meio da oração ficam entre vírgulas.</li>'+
'<li>Oração explicativa (com vírgulas) × restritiva (sem): “Os alunos, que estudaram, passaram” (todos estudaram) × “Os alunos que estudaram passaram” (só esses).</li>'+
'<li><b>Regra prática:</b> passou de umas três linhas manuscritas, divida com ponto. Um período, uma ideia principal.</li></ul>'+
'<p><b>Exercício 5.</b> Divida e pontue: “A solidariedade é importante porque as pessoas precisam umas das outras e sem ela a sociedade não funciona o que se vê na pandemia quando muitos ajudaram e outros não mas isso mostra que é preciso educação.”</p></section>'+

'<section class="card"><h2>6. Hífen e maiúsculas</h2>'+
'<p><b>Hífen (Acordo Ortográfico):</b></p><ul>'+
'<li>Prefixo terminado em vogal + vogal <b>igual</b>: hífen (micro-ondas, anti-inflamatório). Vogal <b>diferente</b>: junto (autoestima, infraestrutura).</li>'+
'<li>Prefixo terminado em vogal + <b>r</b> ou <b>s</b>: dobra a letra (antissocial, autorretrato, contrarregra).</li>'+
'<li>Prefixo + <b>h</b>: hífen (anti-higiênico, super-homem).</li>'+
'<li><b>Ex-</b>, <b>pós-</b>, <b>pré-</b>, <b>pró-</b> (tônicos): hífen (ex-presidente, pós-guerra). <b>Co-</b>: junto (coautor, cooperar).</li>'+
'<li><b>Super-</b>, <b>hiper-</b>, <b>inter-</b> + r: hífen (inter-racial, super-resistente).</li></ul>'+
'<p><b>Maiúsculas:</b> minúscula para meses (dezembro), dias da semana, idiomas e gentílicos (português, grego), adjetivos de origem (filosofia grega). Maiúscula para nomes próprios, instituições (a Fuvest, a Igreja como instituição), períodos históricos (Era Vargas, Estado Novo) e a primeira palavra de títulos de obras.</p>'+
'<p><b>Exercício 6.</b> Escreva certo: auto + estima; anti + social; micro + ondas; inter + racial; co + autor.</p></section>'+

'<section class="card"><h2>7. Conectivos: a relação lógica certa</h2>'+
'<p>Critério 3 (<b>peso 3</b>): conectivo errado cria lógica falsa.</p><ul>'+
'<li><b>Adição:</b> além disso, ademais, também.</li>'+
'<li><b>Oposição:</b> mas, porém, contudo, no entanto, todavia.</li>'+
'<li><b>Concessão:</b> embora, ainda que, mesmo que, conquanto (com subjuntivo: embora <i>seja</i>).</li>'+
'<li><b>Causa:</b> porque, pois, já que, visto que, uma vez que.</li>'+
'<li><b>Consequência:</b> de modo que, por isso, tanto que.</li>'+
'<li><b>Conclusão:</b> portanto, logo, assim.</li>'+
'<li><b>Condição:</b> se, caso, desde que.</li>'+
'<li><b>Exemplo:</b> como mostra, a exemplo de, em <i>Obra</i>.</li></ul>'+
'<div class="note peg"><span class="lab">Armadilhas clássicas</span><p><b>Posto que</b> é concessão (= embora), não causa. <b>Em vez de</b> é substituição; <b>ao invés de</b> é oposição (ao invés de subir, desceu). <b>A fim de</b> é finalidade; <b>afim</b> é semelhante. <b>Há</b> dois anos (passado) × daqui <b>a</b> dois anos (futuro). Evite “sendo que” como conectivo e “a nível de”.</p></div>'+
'<p><b>Exercício 7.</b> Escolha: a) ___ a escola seja essencial, ela não resolve tudo (porque / embora). b) O mundo produz comida suficiente; ___, a fome persiste (portanto / no entanto). c) ___ tivesse documentos, não conseguiu votar (posto que / porque).</p></section>',

'<p><b>Exercício 1:</b> a) à palestra (assistir a + a palestra). b) a uma (artigo indefinido). c) às 8h. d) a chover (verbo). e) à qual (ao qual). f) a cada aluna (“cada” não aceita artigo).</p>'+
'<p><b>Exercício 2:</b> a) Prefiro estudar a trabalhar. b) A medida implica gastos. c) aspiram a uma vaga. d) Não me lembrei do prazo (ou: não lembrei o prazo).</p>'+
'<p><b>Exercício 3:</b> a) Havia muitas causas. b) Faz dez anos que... c) Vendem-se apartamentos. d) Devem existir soluções (existir concorda; quem concorda é o auxiliar).</p>'+

'<p><b>Exercício 5 (uma solução):</b> “A solidariedade é importante porque as pessoas precisam umas das outras. Sem ela, a sociedade não funciona. A pandemia mostrou isso: muitos ajudaram, e outros não. Esse contraste revela que a solidariedade também precisa ser ensinada.” (Repare: o “o que se vê” e o “mas isso mostra” viraram frases com relação lógica clara.)</p>'+
'<p><b>Exercício 6:</b> autoestima; antissocial; micro-ondas; inter-racial; coautor.</p>'+
'<p><b>Exercício 7:</b> a) Embora (concessão, com subjuntivo “seja”). b) no entanto (oposição: há comida, mas a fome continua; “portanto” criaria uma conclusão absurda). c) Posto que (= embora: concessão). “Porque” não combina com o subjuntivo nem com o sentido. Moral: confira a relação antes de escolher o conectivo.</p>'+

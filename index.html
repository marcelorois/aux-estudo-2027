['Poesia cívica','“Vinte e cinco de março” condena a Constituição outorgada por D. Pedro I em 1824, depois de dissolver a Constituinte: o poder roubou ao povo a vitória e recompôs a algema. “Sete de setembro” celebra a Independência, mas lamenta que o país continue preso a erros e a um falso poder, e invoca o mártir Tiradentes. “Pesadelo” fecha a 2ª parte: da Revolução Francesa aos mártires brasileiros (Tiradentes, Padre Roma, Nunes Machado, Pedro Ivo), termina profetizando a queda de “cetros e tronos”.'],
['Homenagens','Na terceira parte: “Castro Alves” (elegia ao poeta da liberdade), um poema a Carlos Gomes, “O sacerdote”.'],
['“O africano e o poeta”','Diálogo em versos curtos: o cativo conta que foi arrancado da África, atravessou o mar acorrentado, trabalhou até a exaustão e foi castigado. A cada estrofe surge a pergunta “Quem...?”, e a resposta é sempre: o poeta. Só o poeta escuta, sente e chora o escravizado.'],
['“Os dois troféus”','Tradução livre de “Les deux trophées”, de Victor Hugo (1871), sobre a Comuna de Paris e a luta entre franceses depois da derrota para a Prússia. Os troféus são a coluna Vendôme e o Arco do Triunfo. Final irônico: o povo diria “Curvar-nos? Jamais!” à ordem de derrubá-los, mas foi ele mesmo quem derrubou a coluna.']],
pers:[['O eu lírico','Feminino, melancólico e ao mesmo tempo combativo. Faz da dor matéria poética e da poesia uma missão de liberdade.'],['O poeta','Figura recorrente: aquele que escuta os oprimidos e eleva os mistérios da terra ao céu.'],['O africano','O escravizado que fala de sua dor em “O africano e o poeta”.'],['A pátria','Personificada como gigante que acorda acorrentado (“Sete de setembro”).'],['Homenageados','Castro Alves, Carlos Gomes, um sacerdote, Celso de Magalhães (abolicionista a quem dedica o poema do africano).']],
tec:`<p><b>Forma:</b> metros variados: decassílabos brancos em “Nebulosas”, versos curtos e rimados (redondilhas) em “O africano e o poeta”, estrofes regulares nos poemas cívicos.</p>
<p><b>Recursos:</b> apóstrofes e exclamações, inversões sintáticas, vocabulário erudito, imagens grandiosas (cosmos, montanhas, oceano), muitas epígrafes de autores estrangeiros e brasileiros.</p>
<p><b>Metáfora central:</b> a nebulosa, luz difusa e distante, nasce da dor e aspira ao infinito, como a própria poesia da autora.</p>`,
temas:[['Poesia como missão','o poeta como voz de quem sofre'],['Cosmos, ciência e fé','as nebulosas entre o olhar científico e o religioso'],['Dor e consolação','a melancolia romântica'],['Liberdade política','republicanismo contra a Constituição imposta'],['Abolição','a escravidão como vergonha da pátria'],['Natureza e pátria','Resende, Itatiaia, a paisagem como identidade nacional']],
cai:`<p>Caiu em 2026: o poema “Nebulosas” comparado a um texto de Carl Sagan (estrelas, planetas e nebulosas como metáforas) e uma discussão de história ou política ligada à ideia de irmandade. As respostas mais fortes usam “O africano e o poeta” (abolição) e os poemas cívicos (liberdade, república). Na 1ª fase 2027 (Q57), “Desengano” com Van Gogh: a natureza como extensão do eu.</p>`,
peg:['Não é poesia parnasiana nem modernista: é romântica.','“Vinte e cinco de março” é a data da Constituição outorgada de 1824, não uma festa religiosa.','“A ciência reduz a grupos” significa decompor as nebulosas em aglomerados de estrelas, não diminuí-las.','Narcisa não é só “poeta triste”: o livro tem forte poesia social.','“Os dois troféus” é tradução livre de Victor Hugo, e o final é irônico, não uma exaltação.'],
mn:`<p><b>N-E-B-U-L-A:</b> <b>N</b>ebulosas (o poema-título, a poética) · <b>E</b>legias íntimas (desalento) · <b>B</b>rasil natural (Resende, Itatiaia) · <b>U</b>topia política (25 de março, 7 de setembro) · <b>L</b>iberdade do escravo (“O africano e o poeta”) · <b>A</b>plausos (Castro Alves, Carlos Gomes) e a Comuna de 1871, via Victor Hugo.</p>`,
q:{p:'No poema “Nebulosas”, o eu lírico diz que contempla as nebulosas à noite e que delas nasceram seus “tristes versos”. a) Explique o que as nebulosas simbolizam para o eu lírico. b) Relacione essa imagem a uma discussão política presente no livro.',
a:['As nebulosas são luzes difusas e misteriosas que consolam o eu lírico na dor e o elevam à poesia; simbolizam a própria inspiração e a poesia que nasce do sofrimento e aspira ao infinito.','O poema termina dizendo que esses versos fogem das pompas do mundo e voam à luz da liberdade: a poesia não serve aos poderosos.','Essa liberdade aparece nos poemas sociais: em “O africano e o poeta”, só o poeta escuta o escravizado; em “Vinte e cinco de março”, a autora condena a Constituição imposta ao povo. A poesia une contemplação do cosmos e irmandade entre os homens.']},
ap:`<p><b>Versos da autora (domínio público):</b> no poema de abertura, as nebulosas são “Alvos cisnes do mar da imensidade”, que “a multidão supõe densas caligens / E a ciência reduz a grupos validos”. No fim: “Assim nasceram os meus tristes versos, / Que do mundo falaz fogem às pompas!”.</p>
<p><b>O refrão do africano:</b> a estrutura pergunta-resposta (“Quem pensa? O poeta”, “Quem quer [escutar]? O poeta”) mostra o poeta como única testemunha solidária do escravizado, à maneira de Castro Alves.</p>
<p><b>Política:</b> “Vinte e cinco de março” traz nota da própria autora: as estrofes iniciais aludem ao projeto da Constituinte de 1823, que reconhecia grandes princípios de liberdade, antes de ser dissolvida.</p>
<p><b>Biografia:</b> Casou-se aos 13 anos (1866) com João Batista da Silveira, união desfeita em 1870; em 1880 casou-se com Francisco Cleto da Rocha e rompeu em 1887, porque ele a proibia de conviver com intelectuais. Enfrentou ataques e preconceito; foi jornalista e, a partir de 1889, professora no Rio.</p>`,
cx:['<b>Geografia:</b> duas poetas que leem a natureza e o cosmos como lugar de verdade e ligam poesia e liberdade.','<b>Opúsculo:</b> Nísia e Narcisa, educadoras do Império; Narcisa é abolicionista explícita, Nísia condena a escravidão sem ligá-la à educação feminina (gabarito da 1ª fase 2027).','<b>A visão das plantas:</b> o africano arrancado da terra e atravessado pelo mar, visto em 1872 e em 2019.','<b>Martha:</b> mulheres que escrevem num mundo masculino no século XIX.'],
aq:{p:'Explique como “O africano e o poeta” constrói uma ideia de irmandade entre o escravizado e o poeta.',
a:['O poema alterna a fala do cativo e uma pergunta que sempre recebe a mesma resposta: o poeta.','O africano conta a separação da terra natal, a travessia acorrentado, o trabalho exaustivo, o castigo e a morte sem prece; a cada dor, pergunta quem o escuta, e só o poeta sente, chora e reza por ele.','Assim, o poeta se põe como irmão do escravizado, num momento em que a sociedade o ignora: é poesia abolicionista, ligada à causa da liberdade defendida em todo o livro.']},
cards:[['Quantos poemas tem Nebulosas e quantas partes?','44 poemas, em três partes.'],['Que idade tinha Narcisa ao publicar o livro?','20 anos (1872).'],['Que escritor elogiou Nebulosas?','Machado de Assis (e D. Pedro II quis conhecê-la e declamou estrofes do livro).'],['O que as nebulosas simbolizam?','A inspiração e a poesia, luz difusa que nasce da dor e aspira ao infinito.'],['O que critica “Vinte e cinco de março”?','A Constituição outorgada por D. Pedro I em 1824, após dissolver a Constituinte.'],['Qual a estrutura de “O africano e o poeta”?','O cativo narra suas dores e pergunta “quem?”; a resposta é sempre “o poeta”.'],['A que geração romântica Narcisa se liga?','À 2ª (melancolia) e à 3ª, condoreira (liberdade, abolição).'],['De que trata “Os dois troféus”?','É tradução livre de Victor Hugo sobre a Comuna de Paris (1871) e a derrubada da coluna Vendôme pelos próprios franceses; o final é irônico.']],
cola:'Poesia romântica de 1872: o poema-título faz das nebulosas a imagem da poesia nascida da dor. Lírica íntima, natureza de Resende, poemas cívicos (contra a Constituição de 1824), abolicionismo (“O africano e o poeta”).'});

const METODO=`<h1>Como a Fuvest cobra literatura</h1><p class="sub">Análise das provas da 2ª fase de 2023 a 2026 (1º dia). Leia antes do Bloco 1 ou quando puder: 5 minutos.</p>
<section class="card"><h2>O que as provas mostram</h2><ul class="tight">
<li><b>4 a 5 das 10 questões</b> são sobre livros da lista. Em 2026 foram cinco: Nebulosas, As meninas comparado a Canção, A visão das plantas, Memórias de Martha e Opúsculo.</li>
<li><b>O trecho é só a porta de entrada.</b> A pergunta quase sempre exige a obra inteira: o desfecho, a transformação de um personagem, outro poema, outro conto.</li>
<li><b>Muito diálogo com textos de fora:</b> Carl Sagan, Antonio Candido, Marx, pinturas, fotos, a ilustração de uma capa. Você precisa ligar o texto externo à obra.</li>
<li><b>Comparação entre obras da lista</b> apareceu em 2026 (memória em As meninas e em Canção).</li>
<li><b>A Fuvest repete livros:</b> Romanceiro da Inconfidência caiu em 2023, 2024 e 2025. As cinco obras de 2026 podem voltar.</li>
<li><b>Resposta curta:</b> cerca de 5 a 8 linhas por item. Vale mais um fato preciso bem explicado do que um resumo.</li></ul></section>
<section class="card"><h2>Os eixos que se repetem</h2><div class="tblw"><table><tr><th>Eixo</th><th>Exemplos reais</th></tr>
<tr><td>Técnica narrativa</td><td>memória como recurso (2026), narrador, tempo</td></tr>
<tr><td>Personagem e transformação</td><td>Celestino jovem e velho (2026); Sinhá que vira Choquinha (2025); Rubião (2024, 2025)</td></tr>
<tr><td>Espaço simbólico</td><td>navio e casa (2026); cortiço (2026); engenho e usina (2025)</td></tr>
<tr><td>Contexto histórico</td><td>abolição (2025), educação feminina (2026), luta anticolonial (2025)</td></tr>
<tr><td>Estética de época</td><td>Arcadismo (2024), Expressionismo e Regionalismo de 30 (2025), Romantismo e Modernismo (2023)</td></tr>
<tr><td>Texto ou imagem externa</td><td>Sagan, Candido, fotografias de escola, pintura de Watteau</td></tr></table></div></section>
<section class="card"><h2>A resposta em 3 passos</h2>
<div class="note mn"><span class="lab">Fórmula</span><p><b>1. Afirme</b> a resposta numa frase, já usando as palavras do enunciado.<br><b>2. Prove com a obra:</b> um fato concreto (cena, personagem, verso, desfecho), não um resumo.<br><b>3. Ligue ao enunciado:</b> feche explicando o efeito, o sentido ou a relação pedida.</p></div>
<p>As respostas-modelo deste material seguem sempre esses 3 passos. Copie o formato.</p></section>
<section class="card"><h2>Verbos de comando</h2><ul class="tight">
<li><b>Identifique / aponte / cite:</b> nomeie com precisão e, se der, justifique em uma linha.</li>
<li><b>Explique:</b> diga o porquê, com causa e efeito.</li>
<li><b>Compare:</b> diga o que é igual e o que é diferente, nas duas obras, em paralelo.</li>
<li><b>Justifique / comente:</b> tome posição e prove com a obra.</li>
<li><b>Relacione:</b> mostre a ponte entre o texto dado e a obra; nunca analise os dois separados.</li></ul></section>
<section class="card"><h2>Erros que custam pontos</h2>
<div class="note peg"><span class="lab">Evite</span><p>Contar o enredo em vez de responder; responder só o item a e esquecer o b; falar do trecho sem ligar à obra inteira; trocar nomes de personagens; confundir obras da mesma autora (Sophia: Geografia × O Cristo Cigano); opinião sem prova.</p></div></section>
<section class="card"><h2>Exemplo resolvido: Fuvest 2026, questão 4</h2>
<p class="q">Celestino é retratado em dois momentos. a) Compare sua atitude diante da violência na juventude e seu estado psicológico na velhice. b) Explique a relação simbólica entre o navio e a casa.</p>
<details><summary>Ver como responder</summary><div class="in ans">
<p><span class="st">a) Afirme</span>Jovem, Celestino age com frieza calculada; velho, vive em tormento, entre esquecimento e delírio.</p>
<p><span class="st">Prove</span>Depois de sufocar os escravizados com cal, ele olha o horizonte e respira a maresia sem olhar os mortos. Na velhice, adormece de pé, sonha de olhos abertos, e seus braços repetem gestos de marinheiro.</p>
<p><span class="st">Ligue</span>A culpa não aparece como remorso, mas o passado volta pelo corpo e pela memória.</p>
<p><span class="st">b)</span>A casa repete o navio: na tempestade parece balsa à deriva ou porão de escravos. O silêncio do porão é trocado pelo barulho dos trovões. O quintal vira um “mar outro, sem homens e sem tempo”: espaço da consciência e do isolamento, onde ele é obrigado a confrontar a própria história (resposta esperada pela Fuvest).</p></div></details></section>`;

const CRUZAR=`<h1>Cruzar as obras</h1><p class="sub">A Fuvest já comparou duas obras da lista. Este quadro mostra as pontes mais prováveis. Cerca de 10 minutos.</p>
<section class="card"><h2>Pares com mais chance de cair</h2><ul class="tight">
<li><b>Memórias de Martha × Canção:</b> memória em 1ª pessoa. Martha lembra a própria vida, adulta, com culpa e reflexão; a narradora de Canção reconta o que ouviu de outra mulher, admitindo lacunas.</li>
<li><b>G. H. × A visão das plantas:</b> o contato com a vida não humana (barata, plantas) que não julga e desmonta o humano. Diferença: G. H. se transforma; Celestino não se arrepende.</li>
<li><b>Caminho de pedras × Balada:</b> mulheres julgadas por adultério, abandonadas, que terminam sustentando filhos. Noemi termina só e grávida; Sarnau aceita Mwando de volta.</li>
<li><b>Opúsculo × Memórias de Martha:</b> educação feminina. Nísia exige escolas em 1853; Martha vira professora por concurso no fim do século.</li>
<li><b>Nebulosas × Geografia:</b> poesia, natureza e liberdade. Narcisa contra a Constituição imposta e a escravidão; Sophia contra a ditadura salazarista.</li>
<li><b>A visão das plantas × Balada × Geografia:</b> o mar e o colonialismo. O porão negreiro, a deportação para Angola, e a celebração dos navegadores em “Descobrimento”.</li></ul></section>
<section class="card"><h2>Quadro de temas</h2><div class="tblw"><table>
<tr><th>Tema</th><th>Onde aparece</th></tr>
<tr><td>Memória</td><td>Martha (1ª pessoa retrospectiva), Balada (Sarnau velha), Canção (memória ouvida), G. H. (narra no dia seguinte), Visão (fantasmas do passado)</td></tr>
<tr><td>Escravidão e colonialismo</td><td>Opúsculo, Nebulosas, Visão, Balada, Geografia (“Descobrimento”), G. H. (Janair e o quarto dos fundos)</td></tr>
<tr><td>Educação</td><td>Opúsculo, Martha, Balada (missão), Canção (Angelina, primeira com curso superior)</td></tr>
<tr><td>Amor, casamento, autonomia</td><td>Caminho, Balada, Canção, Martha</td></tr>
<tr><td>Natureza e cosmos</td><td>Nebulosas, Geografia, Visão, Balada</td></tr>
<tr><td>Política e repressão</td><td>Caminho (Vargas), Geografia (Salazar), Nebulosas (Império), Balada (regime colonial)</td></tr>
<tr><td>Corpo</td><td>G. H. (comer a barata), Opúsculo (espartilho), Canção (desejo), Martha (feiura, nervos), Balada (violência)</td></tr>
<tr><td>Classe social</td><td>G. H. e Janair, Martha e o cortiço, Caminho (operários e intelectuais)</td></tr></table></div></section>
<section class="card"><h2>Narradores, num relance</h2><div class="tblw"><table>
<tr><th>Obra</th><th>Quem fala</th></tr>
<tr><td>Opúsculo</td><td>Ensaísta, “nós” oratório</td></tr><tr><td>Nebulosas</td><td>Eu lírico feminino</td></tr>
<tr><td>Martha</td><td>1ª pessoa, memória adulta</td></tr><tr><td>Caminho</td><td>3ª pessoa com discurso indireto livre</td></tr>
<tr><td>G. H.</td><td>1ª pessoa, fluxo de consciência</td></tr><tr><td>Geografia</td><td>Eu lírico voltado para o mundo</td></tr>
<tr><td>Balada</td><td>1ª pessoa (Sarnau) alternada com 3ª (Mwando)</td></tr><tr><td>Canção</td><td>Narradora-ouvinte que reconta</td></tr>
<tr><td>Visão</td><td>3ª pessoa, com o olhar das plantas e fragmentos de Celestino</td></tr></table></div></section>`;

const XQ=[
{src:'Cruzada: Memórias de Martha e Canção',p:'Nas duas obras, a narração depende da memória. Compare o modo como cada uma usa esse recurso.',a:['Nos dois livros a memória organiza a narrativa, mas de formas diferentes.','Martha lembra a própria vida, trinta e tantos anos depois, e julga a menina que foi (por exemplo, a culpa por ter abandonado Mathilde). Em Canção, a narradora lembra o que Juventina lhe contou e reconta a vida de outras mulheres, admitindo que a escrita trai o vivido.','Em Martha, memória é acerto de contas individual; em Canção, é memória coletiva e oral, a escrevivência.']},
{src:'Cruzada: G. H. e A visão das plantas',p:'Nas duas obras, um ser não humano (a barata; as plantas) tem papel central. Compare a função desses seres.',a:['Nos dois livros, a vida não humana é indiferente à moral humana.','A barata leva G. H. a perder a identidade organizada e a ver a vida “neutra”, até comer a massa branca. As plantas de Celestino não o julgam: florescem sobre um passado de mortes.','A diferença está no efeito: G. H. se transforma radicalmente; Celestino continua sem remorso, e a natureza apenas o acompanha até a morte.']},
{src:'Cruzada: Caminho de pedras e Balada',p:'Noemi e Sarnau rompem casamentos por amor. Compare o julgamento social que sofrem e o desfecho de cada uma.',a:['As duas são punidas socialmente pelo adultério e ficam sozinhas.','Noemi é condenada pelos camaradas e demitida pelo patrão, Seu Benevides, em nome da freguesia “de família”; perde filho, marido e companheiro. Sarnau perde os filhos e a posição de rainha, é abandonada e se prostitui.','No fim, Noemi segue sozinha e grávida, resistindo; Sarnau cobra o preço a Mwando, mas o aceita. Ambas sobrevivem pelo próprio trabalho.']},
{src:'Cruzada: Opúsculo e Memórias de Martha',p:'Relacione a defesa da educação feminina no Opúsculo com a trajetória de Martha.',a:['Martha encarna o que Nísia defendia: a educação como caminho de dignidade para a mulher.','Nísia denunciava a falta de escolas para meninas (8.443 em 55.500 alunos em 1852). Martha, pobre e filha de um suposto ladrão, sobe pela escola pública e passa no concurso de professora.','Mas a obra também mostra limites: Martha ainda precisa do casamento como amparo, e Mathilde, a colega mulata, fica fora.']},
{src:'Cruzada: Nebulosas e Geografia',p:'Explique como as duas poetas ligam a contemplação da natureza a uma posição política.',a:['Nas duas, olhar a natureza leva a pensar a liberdade.','Narcisa vê nas nebulosas a origem de versos que voam à luz da liberdade, e escreve contra a Constituição imposta e a escravidão. Sophia faz da luz e do mar símbolos de justiça e, em “Procelária”, compara o poeta à ave que canta na tempestade, sob Salazar.','Em ambas, a poesia não foge do mundo: transforma a paisagem em compromisso ético.']},
{src:'Cruzada: A visão das plantas e Geografia',p:'“Descobrimento”, de Sophia, e A visão das plantas olham para a expansão marítima portuguesa. Compare as perspectivas.',a:['As duas obras olham o mar português, mas por lados opostos.','Em “Descobrimento”, o “nós” dos navegantes vê o mar ficar novo e antigo e um povo recém-criado, cor de barro e deslumbrado: o deslumbramento é projetado em quem é visto, e a expansão aparece como descoberta. Em Djaimilia, o mar é o do navio negreiro, com escravizados sufocados com cal.','O romance mostra o que a celebração dos navegadores deixava de fora: a violência colonial e seu esquecimento.']}];

<section class="card"><h2>Romantismo</h2>
<p><b>Contexto:</b> depois da Independência (1822), o Brasil quer uma literatura própria. Ascensão da burguesia e do público leitor, o romance em folhetim nos jornais. Marco: 1836.</p>
<p><b>Características:</b></p><ul class="tight">
<li><b>Subjetividade e sentimentalismo:</b> o “eu” e suas emoções no centro.</li>
<li><b>Idealização:</b> da mulher, do amor, da pátria, do indígena.</li>
<li><b>Nacionalismo:</b> natureza exuberante como orgulho nacional.</li>
<li><b>Fuga da realidade:</b> morte, noite, sonho, infância, saudade.</li>
<li><b>Religiosidade</b> cristã e liberdade de forma em relação às regras clássicas.</li></ul>
<p><b>As três gerações da poesia:</b></p><ul class="tight">
<li><b>1ª, nacionalista e indianista:</b> Gonçalves Dias, “Canção do exílio” (caiu em 2023).</li>
<li><b>2ª, ultrarromântica ou “mal do século”:</b> Álvares de Azevedo, Casimiro de Abreu. Tédio, morte, amor impossível, noite.</li>
<li><b>3ª, condoreira:</b> Castro Alves, “O navio negreiro”. Poesia social, abolição, república; tom grandioso, apóstrofes, exclamações, imagens do céu e do voo (o condor).</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Nebulosas</b> une a 2ª geração (“Desalento”, “Agonia”, a noite, a morte) e a 3ª (“O africano e o poeta”, a elegia a Castro Alves, os poemas cívicos). Natureza nacional (Itatiaia, Resende) e religiosidade também são românticas. <b>Opúsculo</b> é Romantismo em ensaio: apóstrofes (“Povos do Brasil!”), nacionalismo, natureza grandiosa, fé cristã; mas usa dados e razão, o que o afasta da pura emoção.</p></div></section>
<section class="card"><h2>Realismo</h2>
<p><b>Contexto:</b> crise do Império, campanha abolicionista (abolição em 1888), República (1889). Prestígio da ciência e do positivismo. Marco: 1881, <i>Memórias póstumas de Brás Cubas</i>, de Machado de Assis.</p>
<ul class="tight"><li><b>Objetividade:</b> retratar o mundo como ele é, sem idealizar.</li>
<li><b>Crítica social:</b> à burguesia, ao casamento por interesse, à hipocrisia, à Igreja.</li>
<li><b>Personagens comuns</b> e tempo presente; a cidade como cenário.</li>
<li><b>Análise psicológica</b> (sobretudo em Machado): motivações, contradições, ironia.</li></ul></section>
<section class="card"><h2>Naturalismo</h2>
<p><b>O que é:</b> o Realismo levado à ciência. O escritor trata personagens como “casos” a serem explicados. Obras-chave: <i>O mulato</i> (1881) e <i>O Cortiço</i> (1890), de Aluísio Azevedo.</p>
<ul class="tight"><li><b>Determinismo:</b> o ser humano é produto do meio, da hereditariedade e do momento histórico.</li>
<li><b>Animalização:</b> pessoas descritas como bichos, movidas por instintos.</li>
<li><b>Patologias, sexualidade, miséria</b> e vícios, sem pudor.</li>
<li><b>O coletivo</b> como personagem (o cortiço, a multidão) e descrição minuciosa.</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Memórias de Martha</b> é realista no retrato do cotidiano urbano, na crítica à desigualdade e ao casamento como amparo, e na recusa da idealização. Tem cenas naturalistas no cortiço: doença, sujeira, brutalidade da vizinha, pernas que incham pela umidade. Mas <b>foge do Naturalismo</b>: é narrado em 1ª pessoa, subjetivo, e Martha não é determinada pelo meio; ela sai do cortiço pela educação e pela vontade. Foi exatamente essa a questão de 2026, a partir de Antonio Candido sobre <i>O Cortiço</i>.</p></div>
<div class="note peg"><span class="lab">Pegadinha</span><p>Realismo e Naturalismo são parentes, não sinônimos: o Realismo critica a sociedade e analisa a psicologia; o Naturalismo explica as pessoas por leis “científicas” e determinismo.</p></div></section>
<section class="card"><h2>Modernismo brasileiro</h2>
<p><b>1ª fase (1922–1930):</b> Semana de Arte Moderna. Ruptura com o passado, verso livre, humor e paródia, linguagem coloquial, nacionalismo crítico (Mário e Oswald de Andrade).</p>
<p><b>2ª fase (1930–1945):</b> crise de 1929, Revolução de 30, Era Vargas. Na prosa, o <b>Romance de 30</b>: romance social, sobretudo nordestino (Graciliano Ramos, José Lins do Rego, Jorge Amado, Rachel de Queiroz). Denúncia da miséria e da exploração, linguagem regional e direta, engajamento político. Na poesia, Drummond e Cecília.</p>
<div class="note cai"><span class="lab">Na lista</span><p><b>Caminho de pedras</b> é Romance de 30 pelo compromisso social e político, pela linguagem seca e pela denúncia da repressão. Mas é <b>urbano</b> (Fortaleza), sem seca nem sertão, e dá peso à vida íntima de Noemi.</p></div>
<p><b>3ª fase (a partir de 1945):</b> a prosa se volta para dentro e para a linguagem. Clarice Lispector (introspecção) e Guimarães Rosa (invenção da língua, <i>Campo Geral</i> caiu em 2023). Traços: fluxo de consciência, monólogo interior, tempo psicológico, epifania, temas universais.</p>
<div class="note cai"><span class="lab">Na lista</span><p><b>A paixão segundo G. H.</b> é o exemplo extremo: uma manhã, um quarto, uma barata, e tudo acontece na consciência da narradora.</p></div></section>
<section class="card"><h2>Poesia portuguesa moderna</h2>
<p>Depois de Fernando Pessoa e do grupo de <i>Orpheu</i> (1915), a poesia portuguesa seguiu caminhos variados sob o Estado Novo (1933–1974; Salazar até 1968): poesia de intervenção, neorrealismo, surrealismo. Sophia de Mello Breyner (estreia em 1944) segue uma linha própria: clareza clássica, mito grego, luz e mar, atenção ao real e uma ética da justiça.</p>
<div class="note cai"><span class="lab">Na lista</span><p><b>Geografia</b>: verso livre, poemas em prosa, enumerações concretas; resistência à ditadura por imagens (“Procelária”, “Esta gente”) e não por panfleto.</p></div></section>
<section class="card"><h2>Literaturas africanas de língua portuguesa</h2>
<p><b>Contexto:</b> colonialismo português, guerras de libertação (1961–1974) e independências em 1975 (Moçambique e Angola). As literaturas desses países afirmam uma identidade própria contra o colonizador.</p>
<ul class="tight"><li>Valorização da <b>oralidade</b>, de provérbios, cantos e crenças.</li><li><b>Crítica ao colonialismo</b>: trabalho forçado, assimilação, violência.</li><li>Língua portuguesa misturada a termos locais.</li><li>Depois da independência, também crítica às próprias tradições e ao novo poder.</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Balada de amor ao vento</b>: oralidade, lobolo e poligamia, degredo colonial, e um olhar feminino que critica tanto o colonizador quanto o patriarcado. A Fuvest já cobrou <i>Nós matamos o cão tinhoso!</i> (2ª fase 2025) com esse eixo.</p></div></section>
<section class="card"><h2>Literatura contemporânea</h2>
<p>Do fim do século XX até hoje, não há uma escola única, mas tendências:</p>
<ul class="tight"><li><b>Novas vozes:</b> autoria negra, feminina, periférica (por exemplo, os <i>Cadernos Negros</i>, desde 1978).</li><li><b>Memória e testemunho.</b></li><li><b>Metaficção:</b> o texto discute a própria escrita.</li><li><b>Pós-colonialismo:</b> rever a história a partir dos colonizados e reescrever textos canônicos.</li><li>Mistura de gêneros e fragmentação.</li></ul>
<div class="note cai"><span class="lab">Na lista</span><p><b>Canção para ninar menino grande</b>: escrevivência, memória oral, narradora que discute a escrita (metaficção). <b>A visão das plantas</b>: pós-colonial; reescreve Raul Brandão e expõe a violência escravista que Portugal esqueceu.</p></div></section>
<section class="card"><h2>Como usar numa resposta</h2>
<p class="q">Exemplo: “Memórias de Martha pode ser lido como romance naturalista?”</p>
<details><summary>Ver resposta-modelo</summary><div class="in ans"><p><span class="st">Afirme</span>Só em parte: há cenas naturalistas, mas o romance não aceita o determinismo.</p><p><span class="st">Prove com a obra</span>O cortiço de São Cristóvão aparece com doença, sujeira e violência, e o meio adoece os corpos (as pernas inchadas de Carolina). Porém Martha, narradora em 1ª pessoa, sai do cortiço pelo estudo e vira professora.</p><p><span class="st">Ligue ao enunciado</span>O Naturalismo explicaria as pessoas pelo meio; Júlia Lopes mostra uma mulher que vence o meio pela educação, o que aproxima a obra do Realismo psicológico e da defesa da instrução feminina.</p></div></details></section>`;

{p:'(Modelo 2025) Num jogo de futebol, o narrador diz que a bola “beijou a trave” e que “foi morrer na bochecha da rede”. Explique os processos conotativos dessas expressões.',a:['As duas expressões dão à bola e à rede características de seres vivos: é prosopopeia (personificação), combinada com metáfora.','A bola “beija” (toque leve e afetuoso) e “morre” (perde força e para); a rede ganha “bochecha”, parte do rosto humano, por semelhança com o pano que estufa.','O efeito é dramatizar e tornar mais vivo o lance, transformando um fato técnico numa pequena cena humana.']},
{p:'(Modelo 2024) Numa charge, as palavras “acusação”, “julgamento”, “condenação” e “execução” aparecem em sequência, ligadas a um mesmo policial. Identifique a figura e explique a polissemia da última palavra.',a:['A sequência forma uma gradação: as etapas de um processo judicial aparecem em ordem crescente até o desfecho.','A última palavra, “execução”, tem dois sentidos: no Direito, cumprir uma sentença; no uso comum, matar alguém. A imagem ativa o segundo sentido: execução sumária, assassinato.','A charge critica o abuso de poder: o mesmo policial acusa, julga, condena e executa, contrariando o Estado de Direito, em que cada etapa cabe a uma instância e a Justiça deve proteger a vida.']},
{p:'Em “A paixão segundo G. H.”, a narradora fala em “alegria difícil” e numa experiência que é ao mesmo tempo inferno e alegria. Identifique o recurso e explique sua função no romance.',a:['É o paradoxo (oxímoro, quando os termos opostos estão juntos): qualidades que se excluem atribuídas à mesma coisa.','G. H. vive algo que a lógica comum não explica: a perda da identidade é dolorosa e libertadora, o nojo leva à adoração.','O paradoxo mostra o limite da linguagem: para dizer o que escapa à razão, a narradora precisa juntar contrários. É a figura central do livro.']},
{p:'No poema “Procelária”, de Sophia, a ave que voa na tempestade representa o poeta. Explique a figura e seu efeito considerando o contexto de 1967.',a:['É uma metáfora (ou alegoria, se desenvolvida ao longo do poema): o poeta é apresentado como a ave das tempestades.','Os traços da ave (fazer ninho no temporal, voar firme, tirar força do risco) são transferidos para quem escreve sob a ditadura salazarista.','O efeito é falar de resistência política sem nomeá-la, o que também escapava à censura: a imagem diz o que não podia ser dito diretamente.']},

const FIGURAS=`<h1>Figuras de linguagem</h1><p class="sub">Como a Fuvest cobra, como responder e as figuras mais prováveis. Cerca de 12 minutos. Base: seu material “Figuras de Linguagem” e as provas de 2023 a 2026.</p>
<section class="card"><h2>Como caiu nas provas (2023–2026)</h2><p>Na 2ª fase, figura de linguagem nunca aparece como “marque a alternativa”. A pergunta pede para <b>identificar o recurso e explicar o efeito de sentido</b>, quase sempre em charges, crônicas, propagandas e poemas.</p>

<div class="note cai"><span class="lab">Conclusão</span><p>Todo ano há pelo menos 2 ou 3 itens sobre recursos expressivos. Os campeões: <b>metáfora, ironia, polissemia, prosopopeia, gradação, antítese e repetição</b>. Nas questões de literatura, eles aparecem dentro da análise da obra.</p></div></section>
<section class="card"><h2>Como responder</h2><div class="note mn"><span class="lab">4 passos</span><p><b>1. Nomeie</b> a figura. <b>2. Aponte</b> onde ela está (as palavras exatas). <b>3. Explique o mecanismo:</b> o que foi transferido, trocado, repetido, invertido ou exagerado. <b>4. Diga o efeito</b> no texto: crítica, humor, ênfase, emoção, denúncia.</p></div>
<p>Só nomear vale pouco. Exemplo fraco: “é metáfora”. Exemplo bom: “Metáfora: ‘educação bancária’ transfere para a escola a lógica do banco, em que o professor deposita conteúdos no aluno passivo; o efeito é criticar um ensino que trata o saber como mercadoria”.</p></section>
<section class="card"><h2>As 10 que mais caem</h2>
<ul class="tight">
<li><b>Metáfora:</b> transferência de sentido por semelhança, sem conectivo (“A é B”). Efeito: condensar uma ideia numa imagem. Explique sempre <i>qual traço</i> passa de um termo ao outro.</li>
<li><b>Comparação:</b> semelhança explícita, com conectivo (como, tal qual, feito). Em 2026, “Catar feijão” comparava duas ações: aponte semelhança <i>e</i> diferença.</li>
<li><b>Metonímia:</b> troca por proximidade real (autor pela obra, lugar pelas pessoas, parte pelo todo). Ex.: “o estádio aplaudiu”.</li>
<li><b>Prosopopeia:</b> ações ou sentimentos humanos dados a coisas ou bichos. Efeito: dramatizar, aproximar, criticar.</li>
<li><b>Ironia:</b> dizer o contrário do que se quer dizer; o contexto (ou a imagem, nas charges) desmente as palavras. Explique o choque entre o dito e o mostrado.</li>
<li><b>Hipérbole:</b> exagero intencional. “Chorei rios”, “um milhão de vezes”. (Cuidado: na Fuvest 2026, “todo mundo” foi lido como <b>generalização retórica</b> que cria um falso consenso, não como hipérbole.)</li>
<li><b>Antítese:</b> ideias opostas lado a lado, sem absurdo lógico (riso e choro, dia e noite).</li>
<li><b>Paradoxo (oxímoro):</b> opostos fundidos no mesmo ser, com contradição lógica (“contentamento descontente”). Central em Clarice.</li>
<li><b>Gradação:</b> sequência em degraus, crescente (clímax) ou decrescente (anticlímax).</li>
<li><b>Repetição (anáfora, refrão):</b> mesma palavra no início de versos ou frases; cria ênfase, ritmo, insistência.</li></ul></section>
<section class="card"><h2>Parentes que também caem</h2><ul class="tight">
<li><b>Polissemia:</b> uma palavra com vários sentidos, explorada de propósito (“destino” de viagem e “destino” do lixo; “execução”). Diga os dois sentidos e o efeito (humor, crítica).</li>
<li><b>Ambiguidade:</b> frase com duas leituras possíveis (o “suas” do anúncio do Greenpeace, 2023: raízes da árvore ou do leitor).</li>
<li><b>Expressão idiomática:</b> sentido figurado fixo (“encher linguiça”, “cumprir tabela”, “pérolas aos porcos”). Explique o sentido literal e o figurado.</li>
<li><b>Símbolo:</b> imagem que carrega um sentido abstrato (o azul, a cal, a barata).</li>
<li><b>Neologismo:</b> palavra nova criada por derivação (“fluviante”, “flutual”, “volância”). Explique os elementos (radical + sufixo) e o sentido.</li></ul></section>

<div class="note mn"><span class="lab">Gatilhos pelo nome</span><p><b>meta-</b> = mudança (metáfora, metonímia) · <b>anti-</b> = contra (antítese) · <b>para-</b> = contra a lógica (paradoxo) · <b>hiper-</b> = excesso (hipérbole) · <b>eu-</b> = bom, suave (eufemismo) · <b>sin-</b> = junto (sinestesia, silepse) · <b>poli-</b> = muitos (polissíndeto) · <b>a-</b> = sem (assíndeto, anacoluto) · <b>ana-</b> = de novo (anáfora) · <b>peri-</b> = em volta (perífrase) · <b>pleo-</b> = cheio (pleonasmo) · <b>proso-</b> = rosto (prosopopeia).</p></div></section>
<section class="card"><h2>Pegadinhas</h2><div class="note peg list"><span class="lab">Pares que confundem</span><ul>
<li><b>Metáfora × comparação:</b> procure o conectivo (como, tal qual, feito). Com ele, é comparação.</li>
<li><b>Antítese × paradoxo:</b> faz sentido literal? Antítese. Contradiz a lógica no mesmo ser? Paradoxo.</li>
<li><b>Metonímia × metáfora:</b> metonímia troca por proximidade real (lugar, autor, parte); metáfora, por semelhança imaginada.</li>
<li><b>Metonímia × catacrese:</b> existe palavra própria? Se não existe (“braço da poltrona”), é catacrese.</li>
<li><b>Elipse × zeugma:</b> o termo omitido já apareceu antes? Então é zeugma.</li>
<li><b>Aliteração × assonância:</b> consoantes × vogais, pelo som, não pela letra.</li>
<li><b>Pleonasmo estilístico × vicioso:</b> intenção expressiva (literatura) × descuido (“subir para cima”).</li>
<li><b>Prosopopeia × metonímia:</b> em “o estádio aplaudiu”, quem aplaude são as pessoas (metonímia), não o prédio humanizado.</li></ul></div></section>
<section class="card"><h2>Figuras nas obras da lista</h2><ul class="tight">
<li><b>A paixão segundo G. H.:</b> paradoxo e oxímoro (alegria difícil, inferno como alegria); metáfora (terceira perna, o quarto como deserto, a massa como hóstia invertida); repetição encadeada das seções (a frase final de uma abre a seguinte, uma anadiplose em escala de livro); apóstrofe ao “tu” e à mão.</li>
<li><b>Geografia:</b> metáfora e alegoria (procelária, Minotauro); enumeração e assíndeto (cal, pedra, sal, luz); anáfora; prosopopeia (o mar, a casa que se reúne).</li>
<li><b>Nebulosas:</b> metáfora (nebulosas como “alvos cisnes do mar da imensidade”); apóstrofe e exclamação; hipérbato; refrão em “O africano e o poeta” (pergunta e resposta “o poeta”).</li>
<li><b>Opúsculo:</b> apóstrofe, ironia e interrogação retórica (“Povos do Brasil, que vos dizeis civilizados!”); gradação.</li>
<li><b>Memórias de Martha:</b> metáfora e antítese (“flores nos pântanos”, Carolina no cortiço).</li>
<li><b>Caminho de pedras:</b> o título é metáfora e também literal (a ladeira de pedras do final).</li>
<li><b>Balada de amor ao vento:</b> prosopopeia da natureza, comparações com o mundo rural, provérbios.</li>
<li><b>Canção para ninar menino grande:</b> o título é metáfora irônica (o homem adulto como “menino grande”).</li>
<li><b>A visão das plantas:</b> prosopopeia (as plantas “veem” o jardineiro); antítese entre beleza do jardim e horror do crime; enumeração (a queima das roupas das mulheres; caiu na 1ª fase 2027); ironia (a frase final de Brandão, “sem uma dúvida na consciência”).</li></ul></section>`;

['1. A Mafalala, o melão e o vulcão (cap. 1)','<p><b>O que acontece.</b> Sarnau, envelhecida, abre o livro com saudade do Save e se apresenta na Mafalala, bairro de miséria de Lourenço Marques. A filha que estuda lhe disse que a Terra é verde por fora e vermelha no centro, como um melão; Sarnau conclui que a terra é como a mulher: aguenta os golpes calada até explodir como vulcão. Duvida que sua história interesse, porque não tem nada de novo: muitas mulheres vivem assim.</p><p><b>Como está escrito.</b> Comparações em cadeia (terra, melão, mulher), metáfora do vulcão, perguntas retóricas e fala dirigida a ouvintes (ela pede que não a levem a mal). Diz estar dispersa entre o Save, a Mafalala e o ar.</p><p><b>O que significa.</b> A moldura define o romance: memória oral de uma mulher comum, cuja vida representa a de muitas. Por isso a violência que ela conta é estrutura, não caso isolado.</p><p><b>Como cairia.</b> Foco narrativo e memória; base para a leitura da Q78 (patriarcado que atravessa contextos).</p>'],
['2. O Éden à beira do Save (cap. 2)','<p><b>O que acontece.</b> Mwando é expulso do colégio da missão (o padre Ferreira flagra Salomão com a cozinheira, amante do próprio padre, e bate nos dois rapazes). Livre, passeia com Sarnau; do alto da figueira, descreve os campos como Deus os veria e a coroa de flores como rainha dos prados, descalça. Os dois se amam na relva; o Save lava o sangue da primeira vez. Ela pede que ele agradeça à defunta protetora com dinheiro, rapé e pano vermelho; ele promete cem escudos e nunca paga.</p><p><b>Como está escrito.</b> Intertexto bíblico (Adão, serpente, maçã verde) misturado às crenças locais. <b>Apóstrofe</b> e <b>prosopopeia</b>: ela manda o sol, a nuvem e o vento se esconderem. Repetição do verde como cor do amor.</p><p><b>O que significa.</b> O amor nasce na natureza e no sincretismo. A coroa de flores antecipa, com ironia, a coroa real; a promessa não paga volta no “paga-me” do cap. 19.</p><p><b>Como cairia.</b> Natureza cúmplice; ironia contra a moral da missão; ligação com o desfecho.</p>'],
['3. A recusa cristã e a lagoa (cap. 3)','<p><b>O que acontece.</b> Mwando some com desculpas. Sarnau anuncia a gravidez; ele revela que vai casar com a moça escolhida pelos pais. Ela aceita ser a segunda, a décima primeira, a centésima primeira; ele diz que é cristão e não aceita poligamia. Desesperada, Sarnau entra na lagoa para morrer; um pescador a salva; ela sangra e perde a gravidez. A curandeira prevê que ela morrerá do outro lado do mar, sem a família no funeral.</p><p><b>Como está escrito.</b> <b>Gradação</b> e <b>hipérbole</b> na súplica (dez, cem, cento e uma); a dor como tempestade interna; gradação da água subindo pelo corpo.</p><p><b>O que significa.</b> Primeira ironia do livro: a monogamia cristã serve de desculpa para abandonar a mulher grávida. A missão não protege Sarnau.</p><p><b>Como cairia.</b> Mwando não é herói romântico; crítica à missão; figuras de intensidade.</p>'],
['4. O lobolo de 36 vacas (cap. 4)','<p><b>O que acontece.</b> A velha rainha escolhe Sarnau para esposa do herdeiro porque ela lhe deu água na concha das mãos (a noiva prevista, Khedzi, fora rejeitada como feiticeira). O lobolo é de 36 vacas que ainda não pariram, o maior já visto. A avó reza dizendo, com os antepassados, que a filha é criada para ser dada de presente aos visitantes. Diante dos panos, colares e dinheiro, Sarnau pensa que aquilo é uma feira e ela está à venda. O tio diz que ela é a avó Sarnau renascida, que antigamente fora “comprada” com uma peneira de feijão.</p><p><b>Como está escrito.</b> Ritual minucioso (rapé, pano vermelho, culunguanes). Ambivalência: a mãe fala em escravatura, Sarnau em sorte e triunfo. No fim, ela defende a beleza do campo (pés rachados, mãos calosas) contra o padrão da cidade.</p><p><b>O que significa.</b> O lobolo é honra e compra ao mesmo tempo: a mulher é valor de troca entre famílias, ideia que o cap. 19 leva ao extremo.</p><p><b>Como cairia.</b> Lobolo como controle; personagem dividida entre orgulho e sujeição.</p>'],
['5. O casamento: pilões, conselhos e a roda (cap. 5)','<p><b>O que acontece.</b> Na semana de reclusão, as mulheres cantam ao ritmo dos pilões conselhos à noiva: o marido é senhor; se bater, é porque ama; aceite amantes e concubinas. Sarnau, vaidosa, manda as velhas calarem. Na festa, acha-se bela de branco ao lado do marido de preto; as mulheres dançam em roda batendo palmas. Uma tia velha põe um pilão aos pés dela: o lar é o pilão e a mulher, o cereal. A mãe chora e diz que nem toda lágrima é tristeza: a filha parte para a escravatura. Sarnau é entregue aos Zucula sentindo-se condenada a caminho do cadafalso; só a irmã Rindau a acompanha.</p><p><b>Como está escrito.</b> Os conselhos entram na narração sem aspas (<b>discurso indireto livre</b>, a voz coletiva das mulheres dentro da de Sarnau). <b>Refrão</b>, <b>metáfora</b> do pilão, <b>antíteses</b> (festa e funeral, noiva e escrava).</p><p><b>O que significa.</b> O rito ensina a submissão e, ao mesmo tempo, mostra que as mulheres conhecem o preço. A dança é <b>lúdica</b> (Q76 da 1ª fase de 2027) e também anestesia: as dançarinas se ausentam do mundo.</p><p><b>Como cairia.</b> É o trecho da Q76. Na 2ª fase: função do refrão, metáfora do pilão, festa e dor juntas.</p>'],
['6. A cama, a água do banho e o dente (cap. 6)','<p><b>O que acontece.</b> Cheia de desejo, Sarnau corre ao quarto e encontra o marido com outra esposa na própria cama, nas capulanas novas dela. Esquenta a água do banho dos dois, como mandavam os conselhos. Nguila percebe que ela chorou, dá-lhe um pontapé e uma bofetada que arranca um dente; a rival, grávida, ri. A velha rainha a consola: as duas foram pescadas em outros lagos e trazidas para o mesmo curral; aprenda a ser serva obediente. À noite, Nguila diz que a bofetada foi disciplina e que ela é sua flor.</p><p><b>Como está escrito.</b> <b>Metáfora</b> do fogo (ela faísca, ele lenha e petróleo) que se apaga (ela vira vento frio). Os conselhos do cap. 5 voltam dentro da cena como refrão irônico. <b>Hipérbole</b>: as lágrimas formam um lago.</p><p><b>O que significa.</b> A violência é naturalizada pelo agressor (disciplina, amor) e pela sogra, também vítima. No mesmo capítulo, Sarnau sonha a aldeia real como uma pocilga: o rei é o varrão, as esposas são porcas, e ela termina como mais uma.</p><p><b>Como cairia.</b> Violência de gênero e sua naturalização (versão discursiva da Q78); metáfora do fogo.</p>'],
['7. A consciência e a lenda dos canibais (caps. 8 e 9)','<p><b>O que acontece.</b> Desprezada (são sete esposas e Phati, a quinta, é a favorita), Sarnau vê o velho rei morrer entre presságios (borboletas negras, corujas, pangolim) e ser enterrado de cócoras; a rainha morre oito dias depois. Nguila vira rei. Mwando volta, pobre, e a chama de rainha e mãe; ela corre atrás dele e se entregam. No cap. 9, discute com a própria consciência: as outras esposas também têm amantes; ela não busca prazer, busca vida; não tem marido, tem um símbolo.</p><p><b>Como está escrito.</b> Monólogo em forma de diálogo com a consciência. Comparação com a lenda da guerra dos Ngunis: quem provou carne humana não consegue parar; ela provou um homem e não vive sem ele.</p><p><b>O que significa.</b> O adultério surge como reação à poligamia que a abandona, sem santificar Sarnau: ela também é vaidosa e calculista.</p><p><b>Como cairia.</b> Personagem vítima e agente; comparação/alegoria; presságios da natureza.</p>'],
['8. O herdeiro à lua e a fuga (caps. 11 e 12)','<p><b>O que acontece.</b> O filho de Mwando nasce num parto difícil; os adivinhos culpam Phati, que é amarrada e espancada (Sarnau sabe que ela é inocente). O menino, claro como o pai verdadeiro, é erguido à lua cheia como herdeiro ao grito de kenguelekezê, e todos atribuem a cor ao ódio entre Sarnau e Phati. Mwando promete levá-la para a cidade, onde cada homem teria uma só mulher. Sarnau decide ficar pelos filhos, mas Phati a flagra e conta a Nguila, que ameaça o julgamento pela wanga e chora abraçado a ela. À noite, ela foge com Mwando de barco pelo Save, deixando os três filhos.</p><p><b>Como está escrito.</b> Ritual com <b>refrão</b> sonoro; <b>ironia dramática</b> (o rei se orgulha do filho alheio); hesitação em vaivém (parto, não parto).</p><p><b>O que significa.</b> A mulher acusada de feitiço paga pelo que não fez; a linhagem real passa a carregar o adultério (esse menino, Zucula, será rei). A promessa da cidade monogâmica será desmentida.</p><p><b>Como cairia.</b> Ironia; acusação de feitiçaria como violência contra mulheres.</p>'],
['9. O porão, a destronca e o “padre Moçambique” (caps. 14 a 17)','<p><b>O que acontece.</b> Em Vilanculos, Mwando descobre que o rei mandou matá-lo e que Phati foi executada; culpa Sarnau, diz que só quis o orgulho de dormir com a mulher do rei e a deixa inconsciente com um golpe. Depois, em Lourenço Marques, é tramado por um sipaio cafetão: fala e escreve bem o português, mas a caderneta de indígena está sem carimbo, e ele é deportado. No porão, capatazes negros xingam negros. Em Angola, os presos derrubam a floresta para o café, que vira roça verde de sangue e dinheiro. Mwando vira o “padre Moçambique”: reza em latim e é usado pelos colonos para acalmar revoltas. Volta após quinze anos.</p><p><b>Como está escrito.</b> Narrador em <b>3ª pessoa</b> (o que Sarnau não viu). <b>Prosopopeia</b>: o navio dança a valsa da tempestade, a floresta resiste e é queimada. Provérbios sobre o poder (o escravo liberto vira tirano).</p><p><b>O que significa.</b> A violência colonial atinge o homem colonizado; e o cristianismo, de novo, serve ao poder. Ironia: o sonho da batina se realiza no degredo.</p><p><b>Como cairia.</b> Contexto histórico (indigenato, xibalo); comparação com <i>Caminho de pedras</i> (Roberto deportado) e <i>A visão das plantas</i> (porão de navio).</p>'],
['10. Vinte e quatro casamentos e o candeeiro (caps. 19 e 20)','<p><b>O que acontece.</b> Sob temporal, Mwando derruba o cesto de tomates de Sarnau e diz que a procurou a vida toda. Ela exige que pague: a oferenda à protetora, a virgindade, o resgate. Ele a chama de prostituta; ela responde que foi ele quem a fez assim e conta as doenças e o ovário perdido. Revela que ela mesma devolveu as 36 vacas: com elas a família fizera 24 lobolos, e seu preço agora é de 24 casamentos. Nguila casou com Rindau; o filho Zucula virou rei. Ela diz que cantou para ele baladas de amor ao vento e foge. Em casa, Phati e João o chamam de pai; ele diz que as crianças precisam de pai. Sarnau se diz vencida, decide sustentá-lo com sua casa e seu negócio e apaga o candeeiro.</p><p><b>Como está escrito.</b> Refrão “paga-me”; <b>prosopopeia</b> do Save como testemunha que já correu para o mar; frases curtas isoladas no fim; <b>paradoxo</b> da escuridão da paz.</p><p><b>O que significa.</b> Sarnau vira a lógica do lobolo em cobrança de dignidade: quem pagou foi ela. Mas o final é ambíguo: aceita Mwando por desejo e pelos filhos, já como dona da casa e provedora.</p><p><b>Como cairia.</b> Centro de qualquer item b) sobre trajetória, título e desfecho.</p>']
],
critica:'<p><b>A autora e o livro.</b> Paulina Chiziane (1955) estreou como romancista com este livro, em 1990; é apontado como o primeiro romance publicado por uma mulher em Moçambique. Em 2021 ganhou o Prêmio Camões, primeira mulher africana a recebê-lo (entregue em 2023, dedicado às mulheres). Ela costuma se dizer <b>contadora de histórias</b>, não romancista, pelo peso da tradição oral. A edição usada (Companhia das Letras) mantém a grafia de Moçambique.</p><p><b>Quando se passa.</b> No Moçambique <b>colonial</b>: escudos, administrador, sipaios, caderneta de indígena, deportação, e a capital ainda é Lourenço Marques. O Estatuto do Indigenato (caderneta, trabalho forçado ou xibalo) foi abolido em 1961, então a prisão de Mwando é anterior a isso; o livro não dá datas.</p><p><b>Como a Fuvest leu o livro.</b> <b>1ª fase 2027, Q78 (gabarito C):</b> a violência de gênero do romance, ligada a dados de estupro e feminicídio no Brasil, mostra <b>sistemas patriarcais que atravessam diferentes contextos históricos e geográficos</b> (Sarnau com Nguila e depois com Mwando); erradas: desvio individual, só efeito do colonialismo, fenômeno recente, conflito amoroso inevitável. <b>Q76 (gabarito E):</b> a dança das mulheres em roda no casamento (Sarnau bela de branco) e a malhação do Judas em <i>Canção para ninar menino grande</i> têm o <b>componente lúdico</b> como centro. <b>Simulado oficial 2027 (2ª ed., S3):</b> com um verbete sobre a balada (gênero medieval, oral, ligado ao canto e à dança, com refrões e autoria coletiva), a correta diz que o título se justifica porque o romance ressignifica a tradição por meio de uma narradora que <b>abandona a posição resignada</b> e reinterpreta os papéis da mulher no amor e na família; outra questão lê um trecho do cap. 18 como tensão entre a estabilidade do presente e as marcas do passado.</p><p><b>O que a crítica destaca</b> (títulos vistos em busca): a condição feminina e a passagem da balada à prosa poética (Sávio Roberto Fonseca de Freitas, UFPB); o lobolo como parte da tradição do sul de Moçambique, enquanto a poligamia é questionada (Rosilda Alves Bezerra, Univ. de Coimbra); a comparação com <i>Niketche</i> (2002), o romance da autora sobre poligamia; leituras pós-coloniais que veem no livro a crítica ao mesmo tempo da ideologia colonial e da hegemonia masculina.</p><p><b>Síntese para a prova.</b> O romance não opõe tradição má a modernidade boa. A tradição (lobolo, poligamia, conselhos, acusação de feitiço) oprime, mas também dá nome e lar aos filhos e cria redes de mulheres (a rainha, Rindau, as curandeiras). A modernidade cristã e colonial (missão, cidade, monogamia) promete libertar e não liberta: Mwando abandona em nome da monogamia, o pai de João não reconhece o filho por ser cristão, a cidade é a Mafalala. Sarnau resume: com poligamia, monogamia ou sozinha, a vida da mulher é dura.</p><p><b>Escola.</b> Confirma a literatura moçambicana pós-independência (oralidade, cantos, provérbios, rituais, termos locais, crítica ao colonialismo) e rompe com a literatura de afirmação nacional: voz feminina, crítica à própria tradição, nenhum herói da libertação, final sem redenção.</p><p><b>Fatos que mais confundem.</b> O “padre Moçambique” do velório em Angola é o próprio Mwando. Quem devolveu as 36 vacas foi Sarnau. Nguila casou com Rindau, irmã de Sarnau. A filha Phati se chamava Chivite e recebeu o nome da rival morta para acalmar seu espírito.</p>',
qbank:[
{p:'(Texto externo: Fuvest 2027 e dados do Brasil) A Fuvest afirmou que, no romance, as relações afetivas são atravessadas por hierarquias de gênero que naturalizam a desigualdade e a violência contra as mulheres, e o comparou a dados brasileiros de estupro e feminicídio. a) Cite duas cenas em que a violência contra Sarnau é tratada como normal pelos próprios personagens. b) Explique por que o romance permite ler essa violência como estrutural, e não como desvio de um homem.',a:['No romance, a violência contra a mulher é ensinada e justificada pela comunidade, o que a torna estrutura social, não exceção.','No casamento, as mulheres cantam que, se o marido bater, é sinal de amor, e no cap. 6 Nguila arranca um dente de Sarnau e chama a bofetada de disciplina, enquanto a rainha aconselha resignação; anos depois, Mwando, o cristão monogâmico, também a agride e a abandona (cap. 14) e a força no reencontro (cap. 19).','Como a violência vem do polígamo e do monogâmico, da aldeia e da cidade, e a narradora diz que sua história não é nova porque muitas mulheres vivem assim, o livro mostra um patriarcado que atravessa contextos, o que permite aproximá-lo dos dados brasileiros.']},
{p:'(Texto externo: verbete) Miguel Alarcão (E-Dicionário de Termos Literários) define a balada como gênero de origem medieval, ligado à dança, à música e ao canto, transmitido oralmente, com fórmulas repetidas e autoria coletiva. a) Aponte dois traços do romance que justificam o título. b) Mostre como a frase em que Sarnau diz ter cantado baladas de amor ao vento ganha sentido no desfecho.',a:['O romance retoma da balada a oralidade, o refrão e a voz coletiva, mas faz dela a história de uma mulher que reinterpreta o próprio papel.','Sarnau narra a ouvintes como quem conta em roda, e o texto repete refrões (os conselhos do casamento, o grito kenguelekezê, o “paga-me”); no cap. 19 ela diz que cantou baladas de amor ao vento, isto é, amou alguém que o vento levava (no cap. 14 já o chamara de nuvem e vento).','No desfecho, porém, ela já não é só a mulher que espera e canta: cobra o preço de 24 casamentos, sustenta a casa e decide aceitar Mwando, ressignificando a balada de espera e dor, ainda que o final seja ambíguo.']},
{p:'(Texto externo: história) Um texto histórico explica que, no Moçambique colonial, o Estatuto do Indigenato separava “indígenas” e “civilizados”, obrigava o africano a portar caderneta e o expunha ao trabalho forçado (xibalo), até ser abolido em 1961. a) Relacione o texto à prisão de Mwando. b) Explique a ironia do destino de Mwando em Angola, considerando sua formação na missão.',a:['A prisão de Mwando mostra que, no sistema colonial, saber português e escrever bem não fazia do africano um cidadão.','Acusado por um sipaio, cafetão da mulher com quem ele vivia, Mwando se defende em bom português e escreve com boa caligrafia, mas a caderneta de indígena está sem carimbo e ele é deportado para Angola (cap. 15); lá vira o “padre Moçambique”, reza em latim e é usado pelos colonos para pregar resignação e acalmar revoltas (cap. 17).','O rapaz que abandonou Sarnau em nome do cristianismo realiza o sonho da batina como instrumento do trabalho forçado, o que expõe a missão como parte do aparelho colonial descrito no texto.']},
{p:'(Imagem descrita para o exercício) Fotografia de um mercado de rua em Maputo: mulheres sentadas atrás de bancas de tomate, cebola e amendoim; uma delas tem um bebê amarrado às costas por uma capulana. a) Relacione a imagem ao cap. 18 do romance. b) Explique o que esse trabalho significa na trajetória de Sarnau, de “rainha” a vendedora.',a:['A imagem corresponde à Sarnau do presente da narração, vendedora no mercado da Mafalala, que sustenta sozinha os filhos.','No cap. 18 ela anuncia legumes aos gritos, com a filha Phati vendendo amêijoas e o filho João torrando amendoim, depois de ter sido criada de comerciantes indianos e de ter se prostituído; antes, como primeira esposa do rei, tinha braceletes de ouro e servas, mas era desprezada e agredida.','O mercado é pobreza e também autonomia: é com esse trabalho que ela devolve as 36 vacas e, no fim, pode dizer que tem casa, negócio e dinheiro para sustentar Mwando, invertendo o papel de provedor.']},
{p:'(Comparação: Canção para ninar menino grande) Na 1ª fase de 2027, a Fuvest aproximou a dança das mulheres no casamento de Sarnau da malhação do Judas em Canção para ninar menino grande, pelo componente lúdico. a) Que outra função a festa do casamento tem no romance de Chiziane? b) Compare a formação de Nguila ou de Mwando com a de Fio Jasmim quanto ao modelo de masculinidade.',a:['A festa do casamento é lúdica, mas também é rito de ensino da submissão feminina, e os dois romances mostram homens formados por uma comunidade que mede a virilidade pelo domínio sobre mulheres.','No cap. 5, entre danças e palmas, as mulheres cantam conselhos de obediência, a tia entrega o pilão e a mãe chora dizendo que a filha vai para a escravatura; no cap. 7, o conselho de anciãos condena Mwando por não dominar Sumbi, e o gosto de Nguila por mulheres orgulha o velho rei, assim como Fio Jasmim foi criado pelo pai e pelos homens mais velhos para provar a macheza conquistando mulheres.','Em Moçambique (poligamia oficial) e no interior do Brasil (casamento formal e amantes em cada cidade), a festa convive com uma educação masculina que deixa às mulheres a espera e a criação dos filhos.']},
{p:'(Comparação: Caminho de pedras) Noemi e Sarnau rompem o casamento por amor. a) Compare o modo como o poder atinge os homens que elas amam. b) Compare os desfechos das duas protagonistas.',a:['Nos dois romances o homem amado é preso e deportado pelo poder, e a mulher fica sozinha, grávida, tendo de se sustentar.','Roberto é preso distribuindo boletins e deportado para uma colônia numa ilha na repressão da Era Vargas, enquanto Mwando, tramado por um sipaio e sem caderneta, vai para o trabalho forçado em Angola; Noemi termina sozinha e grávida subindo a ladeira, e Sarnau, depois de dezesseis anos sustentando os filhos no mercado, recebe Mwando de volta.','Noemi termina sem o homem, mas com dignidade e esperança, e Sarnau o aceita sabendo que vai sustentá-lo e se declara vencida: por caminhos diferentes, as duas mostram o preço que a mulher paga por escolher o amor.']},
{p:'(Personagem e desfecho) No reencontro, Sarnau exige de Mwando o preço de vinte e quatro casamentos. a) Explique a conta que ela faz. b) Discuta se o desfecho representa vitória ou derrota da personagem.',a:['A conta transforma o lobolo em cobrança de dignidade: Sarnau mostra que seu valor circulou por toda a comunidade e que quem pagou a dívida foi ela.','Com as 36 vacas do seu lobolo, os irmãos casaram seis mulheres e os irmãos delas casaram outras, somando 24 lobolos; como ela fugiu, teve de juntar dinheiro, inclusive se prostituindo, para devolver o gado a Nguila e evitar 24 divórcios; no cap. 20, Mwando apela para os filhos e ela, dizendo-se vencida, apaga o candeeiro e o aceita.','O desfecho é ambíguo: ela cede ao desejo e à ideia de um pai para os filhos, mas aceita em posição nova, como dona da casa e do negócio, e não como mulher lobolada.']},
{p:'(Escola literária) O romance pertence à literatura moçambicana posterior à independência (1975), embora a ação se passe no período colonial. a) Aponte dois traços em que ele confirma essa literatura. b) Aponte um traço em que ele se afasta da literatura de afirmação nacional.',a:['O livro confirma a literatura moçambicana pós-independência pela oralidade e pela crítica ao colonialismo, mas se afasta dela ao criticar também a tradição africana a partir de uma voz feminina.','A narradora conta a ouvintes, com cantos, provérbios, rituais e termos locais, e os capítulos sobre Mwando denunciam caderneta, sipaio, deportação e trabalho forçado em Angola; ao mesmo tempo, lobolo, poligamia, conselhos de submissão e acusações de feitiço contra mulheres (Phati espancada no parto) aparecem como opressão.','Em vez de idealizar a África contra o colonizador, Chiziane mostra a mulher oprimida pelos dois sistemas, ponto de vista inédito no primeiro romance publicado por uma moçambicana.']},
{p:'(Figuras: metáfora e refrão) No casamento, uma velha tia põe um pilão aos pés da noiva e diz que o lar é um pilão e a mulher, o cereal, que será triturado para fazer a felicidade da família. a) Identifique a figura e explique seu sentido. b) Explique o efeito dos conselhos repetidos nos caps. 5 e 6.',a:['É uma metáfora: o casamento é o pilão que tritura, e a esposa é o milho que suporta tudo para alimentar a família.','A imagem vem do trabalho diário das mulheres e se soma aos conselhos cantados ao ritmo dos pilões (o marido é senhor; se bater, é amor; o homem não foi feito para uma só mulher), que voltam no cap. 6, quando Sarnau encontra o marido com outra na própria cama e é agredida.','A repetição faz o conselho funcionar como refrão de balada e mostra o rito cumprido na prática: o que era canto de festa vira a violência vivida pela personagem.']},
{p:'(Figuras: prosopopeia e paradoxo) No reencontro, Sarnau pensa que as águas do Save foram testemunhas do seu amor, mas que as águas que a viram já correram para o mar e só restam as árvores e o céu. No último parágrafo, ela apaga o candeeiro e mergulha com Mwando na escuridão da paz. a) Identifique e explique as duas figuras. b) Relacione-as ao sentido do final do romance.',a:['Na primeira passagem há prosopopeia (o rio, as algas e os peixes como testemunhas) e, na segunda, paradoxo (escuridão associada à paz).','O Save, que lavou o sangue da primeira noite (cap. 2), aparece como testemunha que já se foi, sinal de que o passado não pode ser provado nem devolvido; e a escuridão da paz, que já fechava o cap. 18 como descanso depois do trabalho, volta no fim como esquecimento, quando Sarnau enterra o passado e aceita Mwando.','As duas figuras mostram uma reconciliação feita de perda: a paz vem do apagamento da memória e da luz, e não da reparação que Sarnau tinha exigido.']}
]

perto:[
['1. O brado de abertura e o fecho (arts. I, XVII e LXII)','<p><b>O que acontece.</b> Enquanto no “velho e novo mundo” se fala em “emancipação da mulher”, a “débil voz” da autora clama “educai as mulheres!” e interpela: “Povos do Brasil, que vos dizeis civilizados! Governo, que vos dizeis liberal!”. A mesma apóstrofe volta no art. XVII, quando o livro chega ao Brasil. O art. LXII fecha com “Pais, governo, povos do Brasil!”, a natureza tropical e “Educai para isto a mulher, e com ela marchai avante na imensa via do progresso”.</p><p><b>Como está escrito.</b> <b>Apóstrofe</b> e <b>ironia</b> (eles <i>se dizem</i> civilizados e liberais); <b>interrogação retórica</b> (onde está a “doação mais importante” dessa civilização?); falsa modéstia (“débil voz”), recurso de oratória. Estrutura circular: o grito do início é a moral do fim.</p><p><b>O que significa.</b> A tese: a educação da mulher mede a civilização, e o Império liberal não cumpre o que diz ser. A emancipação aceita é a cristã, “não conforme o filosofismo dos socialistas”.</p><p><b>Como cairia.</b> Identifique e explique apóstrofe e ironia; relacione abertura e fecho; diferencie “emancipação” de “educação”.</p>'],
['2. O barômetro e o limite da tese (arts. V e X)','<p><b>O que acontece.</b> O art. V fixa o princípio: o lugar da mulher é “o barômetro” do progresso de um povo. No art. X, Nísia contesta Montesquieu (a mulher só teria atrativos, que acabam) e Rousseau (a mulher feita para agradar ao homem), mas declara que deixa a Wollstonecraft, Condorcet e outros “a defesa dos direitos do sexo; a nossa tarefa é outra”: a educação.</p><p><b>Como está escrito.</b> Metáfora científica (barômetro; no art. XXIX, a França é o “termômetro” das ideias); citação de autoridades <b>para refutá-las</b>; argumento por contraste.</p><p><b>O que significa.</b> É o feminismo possível em 1853: forte na denúncia do machismo dos filósofos, prudente no pedido. Nada de voto ou cargos: educação e dignidade, dentro da moral cristã e do papel de mãe.</p><p><b>Como cairia.</b> “Nísia é feminista radical?” Não: defende educação, não “direitos do sexo” (art. X).</p>'],
['3. Mrs. Stowe, “moderno Evangelho” (arts. XV e XVI)','<p><b>O que acontece.</b> Harriet Beecher Stowe é o “mais perfeito modelo” de mulher: religiosa, culta, trabalhadora, mãe e corajosa por escrever <i>A cabana do Pai Tomás</i> contra a escravidão de seu país. Os brasileiros leem o livro “corando do opróbrio que igualmente pesa sobre a nossa terra”; Nísia propõe que os filhos decorem páginas dele, para que o futuro apague os crimes cometidos “sobre a mísera raça africana”.</p><p><b>Como está escrito.</b> <b>Hipérbole</b> religiosa (“moderno Evangelho”, “apóstolo feminino”), exemplo de autoridade, enumeração de virtudes.</p><p><b>O que significa.</b> A escravidão entra pela porta de um <b>modelo de mulher educada</b>: Stowe prova o que a educação feminina produz. O remédio é moral e educativo (ler, sentir, decorar), não uma campanha política.</p><p><b>Como cairia.</b> Ponte com Nebulosas (“O africano e o poeta”); cuidado: o livro não liga a educação feminina à abolição (1ª fase 2027).</p>'],
['4. Herança portuguesa e escola-prisão (arts. XIX a XXV)','<p><b>O que acontece.</b> Nísia declara o recorte: vai tratar das mulheres “não indígenas, que nascem de famílias livres” (art. XIX). Para os portugueses, a mulher só precisava ser “a primeira e mais útil servente de sua casa” (art. XX). Na colônia, as moças faziam renda, fiavam, faziam doces (art. XXIII); as “escolas” eram meninas sentadas em esteiras, com a almofada de renda no colo (art. XXIV). As escolas primárias tinham “o aspecto de casas penitenciárias”, com palmatória, vara e açoite (art. XXV). A escravidão também é herança portuguesa (art. XXII).</p><p><b>Como está escrito.</b> <b>Comparação</b> (escolas como prisões; ensino em “sistema inquisitorial”); <b>enumeração</b> dos ofícios domésticos; <b>antítese</b> Portugal “pigmeu” × Brasil “gigante” (art. XXIV); ironia (mestres que sabem “assassinar pacificamente” os clássicos latinos).</p><p><b>O que significa.</b> O atraso feminino tem causa histórica: a colonização. Portugal é o <b>antimodelo</b>, nunca o modelo.</p><p><b>Como cairia.</b> Explique a comparação com a prisão; ligue à foto de 1895 (aula de costura) da Fuvest 2026.</p>'],
['5. Os números de 1852: instrução não é educação (arts. XXXI, XXXVI e XXXVII)','<p><b>O que acontece.</b> Pelo quadro oficial de 1852, 55.500 alunos nas aulas públicas, “apenas 8.443 alunas”. Minas tem 24 escolas femininas em 209; Bahia, 26 em 184; a Corte, só nove aulas de meninas (art. XXXVI). Um presidente de Minas queria ensinar às meninas só o que convém a quem “tem de ser criada de si e de seu marido”. Professoras públicas são nomeadas por “patronato” (art. XXXI). Os otimistas citam bailes, línguas e teatro como progresso: confundem “a instrução com a educação, a licença com a civilização” (art. XXXVII).</p><p><b>Como está escrito.</b> <b>Estatística</b> e relatório oficial como prova (raro na lista); ironia na voz dos otimistas; exclamações.</p><p><b>O que significa.</b> Retórica romântica com método ilustrado: dados provam a tese. Educação, para Nísia, é formação moral; instrução é saber. Ela quer as duas, com a moral na base.</p><p><b>Como cairia.</b> Use os números como prova; diferença instrução × educação; comparação com Martha (concurso de professora).</p>'],
['6. A ama de leite e a menina que maltrata a ama (arts. XLI e XLII)','<p><b>O que acontece.</b> Mães ricas não amamentam e entregam o filho a “míseras africanas” que passam “do açoite” ao berço; a criança aprende “quero” junto com “mamã” e “papá”. A casa é toda servida por escravos, e a menina vê os cativos, raça “condenada à educação do chicote”; chega a maltratar a “própria ama que a amamentou”, depois vendida ou alugada “como um fardo inútil”. Ela passará esse exemplo aos filhos. A escravidão é “jugo anticristão, sancionado pela mais tirânica das leis”.</p><p><b>Como está escrito.</b> <b>Gradação</b> da corrupção (berço → palavra “quero” → gesto de mando → maus-tratos); <b>antítese</b> senhor × escravo (“De um lado... do outro...”); metáforas de contágio (“leite impuro”, “sutil veneno”); a alma como cera; a planta com a haste de cima enfeitada e a raiz mal nutrida.</p><p><b>O que significa.</b> A escravidão é escola de crueldade dentro de casa e corrompe quem manda. Mas o foco é a criança livre, e o texto também rebaixa a escravizada (“desmoralizada pelo cativeiro”, “leite impuro”).</p><p><b>Como cairia.</b> Trecho da Q10 da 1ª fase 2027 (correta: crítica à naturalização do escravismo e ao seu impacto na formação moral). Na 2ª fase: o efeito moral e a contradição no retrato dos cativos.</p>'],
['7. A menina do espartilho (art. XLVI)','<p><b>O que acontece.</b> Num colégio da Corte, diante de oitenta alunas, uma menina de 6 anos respira mal; a diretora afrouxa o espartilho e avisa a mãe, em vão. Depois de uma noite no teatro, apertada para render elogios à mãe, ela é apertada de novo de manhã; na classe vacila, a diretora a toma nos braços, desabotoa o vestido: “era já tarde!”. A mãe chega “muito tarde” para o último beijo, “porém muito cedo” para ver a obra de sua vaidade. As mães se horrorizam, mas logo os espartilhos voltam.</p><p><b>Como está escrito.</b> O trecho mais <b>narrativo</b> do livro, com clímax. <b>Antítese</b> tarde × cedo; <b>metáfora</b> “triste florzinha, ceifada”; comparação da cintura com a das “vítimas do Santo Ofício”; ironia final (a moda “reconquistava” seus excessos).</p><p><b>O que significa.</b> A educação de aparência sacrifica o corpo e a vida. O desfecho mostra que um caso isolado não muda o costume: é preciso reforma geral (art. XLVII).</p><p><b>Como cairia.</b> Identifique a antítese e o efeito; ligue o caso à crítica da educação de vitrine.</p>'],
['8. O que se chama “dar boa educação a uma menina” (art. XLVII)','<p><b>O que acontece.</b> Nísia pergunta e responde: dançar para brilhar nos salões; ler e escrever mal o português; falar “um pouco o francês, o inglês” sem conhecer a literatura; cantar e tocar piano “sem gosto, sem estilo”; noções de desenho, geografia e história abandonadas ao sair do colégio; bordados e crochê para enfeitar a sala dos pais. O essencial (raciocinar, pesar as palavras, distinguir o bem do mal) fica para depois: “ela é tão criança!”. Conclusão: o sistema de educação, “quer doméstica, quer pública”, precisa ser “radicalmente reformado”.</p><p><b>Como está escrito.</b> Pergunta retórica + <b>enumeração</b> irônica; a hidra de Lerna para os erros que renascem.</p><p><b>O que significa.</b> Não é contra o francês ou o piano (o colégio dela ensinava línguas e música), mas contra o ensino como enfeite para o casamento.</p><p><b>Como cairia.</b> Ligue à foto da aula de costura (1895) e a Martha, que estuda para trabalhar.</p>'],
['9. “Deus que nenhuma raça fez” e os “braços livres” (arts. XLIX e LIV)','<p><b>O que acontece.</b> No art. XLIX, Nísia condena as mães que xingam e castigam escravizados e até incitam as filhas a castigá-los; lembra que entre eles há “mães, filhos, irmãos” que sofrem em silêncio; cita seus versos (“Deus que nenhuma raça fez / Para sobre uma outra ter / Revoltante primazia”) e pede às “Mães brasileiras” que ensinem os filhos a vê-los “como nossos semelhantes”. No art. LIV, vislumbra o povo “regenerado da negra mancha” e um porvir “em que todo o trabalho será feito por braços livres”.</p><p><b>Como está escrito.</b> <b>Apóstrofe</b> às mães; <b>antítese</b> “invólucro grosseiro do preto” × “coração nobre”; metáfora denunciada (o senhor pensa comprar “um animal de carga”); metáfora médica (“cancro moral”).</p><p><b>O que significa.</b> É o ponto máximo do antiescravismo do livro: compaixão cristã, igualdade das raças diante de Deus, esperança de trabalho livre. Mas o pedido concreto é “comiseração”, não libertação, e não há proposta de escola para os escravizados.</p><p><b>Como cairia.</b> Compare com Nabuco (1883, abolicionismo militante) e com Narcisa (“O africano e o poeta”).</p>'],
['10. As indígenas, “primeiras vítimas” (arts. LVIII a LXI)','<p><b>O que acontece.</b> Abre com versos do poema dela <i>A lágrima de um Caeté</i>: os indígenas perderam tudo, menos “de covarde o nome infame”. Apostrofa a “Pobre raça infeliz”. As indígenas foram “as primeiras vítimas” dos civilizados, escravizadas e vendidas por cristãos que desmentiam o que pregavam (art. LIX). Galeria de exemplos: a mãe que não larga os filhos, Paraguaçu, Moema, a esposa de Camarão (posta acima de Joana d’Arc). Denúncia atual com Theophilo Ottoni (castigos, mulheres tomadas, veneno, sarampo). Pede ação ao governo e ao clero (art. LXI).</p><p><b>Como está escrito.</b> <b>Anáfora</b> (“Quereis ver a mãe... Quereis ver a esposa... Quereis admirar...”); idealização romântica (indianismo) ao lado de documento.</p><p><b>O que significa.</b> Aqui Nísia defende <b>educação</b> para um grupo não branco: as indígenas são “dignas” de “educação moral e intelectual”. É o que a Fuvest 2026 chamou de educação igualitária de etnia. Mas há hierarquia: seriam “mais íntegras que as africanas” e boas criadas (art. LX).</p><p><b>Como cairia.</b> “Que grupo étnico Nísia inclui no direito à educação?” Indígenas. Ligação com o indianismo romântico.</p>']
],
critica:'<p><b>A posição de Nísia sobre a escravidão (o ponto que a Fuvest cobra).</b> Ela condena a escravidão como “jugo anticristão” (art. XLII), herança de Portugal (art. XXII), “negra mancha” e “cancro moral” (art. LIV), e espera um porvir “em que todo o trabalho será feito por braços livres” (art. LIV). Mas, no <i>Opúsculo</i>, ela trata a escravidão pelo <b>efeito na formação moral das crianças livres</b>: a menina criada entre escravos aprende a mandar e chega a maltratar a ama que a amamentou (arts. XLI–XLII). O recorte é declarado no art. XIX: as “brasileiras” de que ela fala são as mulheres “não indígenas, que nascem de famílias livres”. Ela <b>não</b> propõe abolição, <b>não</b> liga a educação feminina à abolição e <b>não</b> pede escola para mulheres negras ou escravizadas; ainda descreve os cativos com preconceito (“desmoralizada pelo cativeiro”, “leite impuro”) e os põe abaixo das indígenas (“mais íntegras que as africanas”, art. LX). A palavra “abolicionismo” não aparece no texto dela.</p>'+
'<p><b>Como a Fuvest cobrou.</b> 2ª fase de 2026 (Q8): pintura de Thomas Brooks, <i>O aluno novo</i> (1854), e foto de meninas em aula de costura na Escola Caetano de Campos, São Paulo (1895). Resposta oficial: as imagens <b>reforçam</b> Nísia (separação de gêneros; estudo feminino voltado ao lar); mostram privilégios de <b>gênero, etnia</b> (não há alunos negros ou indígenas) e <b>classe</b>; Nísia defende educação igualitária para os dois sexos e de etnia, “por exemplo, em relação aos indígenas”. 1ª fase de 2027: Q8 (texto de Isadora Moura Mota sobre letramento em revoltas escravas, 1864–65), correta D: o livro defende a educação de mulheres <b>brancas e indígenas</b>, “sem relacioná-lo aos ideais da abolição”; erradas: relatar lutas de escravizados, narrar trajetórias de personagens, propor modelo português, fazer apologia abolicionista. Q10, correta E: o trecho da ama critica a naturalização do escravismo entre as crianças e avalia seu impacto na formação.</p>'+
'<p><b>Indígenas.</b> Quatro artigos próprios (LVIII–LXI): vítimas da colonização “cristã”, dignas de educação moral e intelectual, exemplos de mãe, esposa e guerreira (Paraguaçu, Moema, a esposa de Camarão); denúncia de violências atuais com o relato de Theophilo Ottoni. Defesa forte, mas paternalista (“civilizar os selvagens”, catequese, indígenas como criadas fiéis).</p>'+
'<p><b>Clero e religião.</b> Nísia é católica e quer a religião como base da educação da mulher (arts. IX, LV). Critica a Igreja quando trai o Evangelho: Cruzadas e Inquisição (art. V), ensino “inquisitorial” de jesuítas severos (art. XXV), cristãos que escravizaram as indígenas (art. LIX) e o clero brasileiro ignorante e desregrado, “filho póstumo” do português (arts. LV–LVII). Modelos: o clero francês, as irmãs de caridade, Nóbrega e Anchieta. <b>Não</b> há crítica a conventos brasileiros; só ao “claustro” português como barreira às ideias (art. XX).</p>'+
'<p><b>Modelos estrangeiros.</b> Alemanha (reflexão, maternidade), Inglaterra (moral religiosa, altivez), França (mulheres de espírito, caridade) e Estados Unidos (escolas, respeito à mulher, Mrs. Stowe). Mesmo nelas há críticas: galanteio e Rousseau na França, operárias miseráveis na Inglaterra, a lei da escravidão nos EUA. Regra do art. XLIV: copiar o “útil, belo e grande”, não o ridículo. <b>Portugal é o antimodelo.</b></p>'+
'<p><b>Mães educadoras.</b> No Brasil, as mães são “o árbitro exclusivo da educação das filhas” (art. XLVIII), mas sem preparo. Nísia prefere a educação doméstica feita por mãe instruída (art. XL) e ataca as que não amamentam, brigam diante dos filhos, apertam as filhas no espartilho ou castigam escravos diante delas. Educar a mulher é preparar quem educa os filhos e influi nos homens que governam (art. LXII).</p>'+
'<p><b>Escola literária.</b> Romantismo no tom (apóstrofes, exclamações), no nacionalismo, na natureza grandiosa e no indianismo; Ilustração no método (estatísticas, relatórios, relatos de viajantes) e na ideia de progresso; cristianismo no limite (recusa o “filosofismo dos socialistas” e os “direitos do sexo”). Rompe com o gosto romântico ao condenar os “inflamantes e perigosos romances” (art. LXII) e a moda da melancolia (art. L).</p>'+
'<p><b>Contexto.</b> Os 62 artigos saíram em parte no <i>Diário do Rio de Janeiro</i> (1852) e foram reunidos em 1853, assinados B. A. (Brasileira Augusta). A Fuvest apresenta Nísia como “a primeira educadora e jornalista feminista do Brasil”, que “denunciou também as injustiças cometidas contra os negros escravizados e os indígenas”: isso vale para a obra toda; no <i>Opúsculo</i>, a denúncia da escravidão é subordinada à educação doméstica. O prefácio da edição do Senado (Maria da Conceição Lima Alves, 2019) diz que o livro apenas tangencia a escravidão e a indígena; para a indígena, é exagero, pois há quatro artigos sobre ela. Em 2028 e 2029, a obra cobrada de Nísia será <i>Conselhos à minha filha</i> (1842).</p>'+
'<p><b>Fontes.</b> Nísia Floresta, <i>Opúsculo humanitário</i>, Senado Federal, 2019. Fuvest, prova e “Respostas esperadas” da 2ª fase 2026 (fuvest.br). Curso Objetivo, resolução da 1ª fase Fuvest 2027 (curso-objetivo.br). Fuvest, lista de leituras 2026–2029 (fuvest.br). Constância Lima Duarte, <i>Nísia Floresta: vida e obra</i> (biografia de referência). Artigo “Uma voz feminina na luta antiescravista: Nísia Floresta”, <i>Nau Literária</i>, UFRGS, 2022 (só o resumo foi consultado).</p>',
qbank:[
{p:'(Texto externo: história) Em 1883, Joaquim Nabuco escreveu que a luta entre o abolicionismo e a escravidão marcaria a época e que o Brasil seria o último dos países se, tendo a escravidão, não tivesse um partido abolicionista. a) O <i>Opúsculo humanitário</i> (1853) pode ser lido como texto abolicionista no sentido de Nabuco? b) Como a escravidão aparece no argumento de Nísia sobre a educação?',a:['Não no sentido de Nabuco: Nísia condena a escravidão como “jugo anticristão” e espera um futuro de “braços livres”, mas não propõe a abolição nem a liga à educação feminina.','Nos arts. XLI–XLII e XLIX, a escravidão aparece pelos efeitos dentro de casa: a criança livre aprende a mandar, vê o chicote e chega a maltratar a ama que a amamentou; o remédio pedido é afastar os filhos dos cativos e ensinar-lhes compaixão, e o recorte declarado do livro (art. XIX) é a mulher livre.','Nabuco, trinta anos depois, faz da abolição uma causa política; Nísia faz da escravidão um problema de formação moral das crianças livres, por isso a Fuvest diz que ela defende a educação de mulheres brancas e indígenas sem relacioná-la aos ideais da abolição.']},
{p:'(Imagem descrita) Uma fotografia de cerca de 1860, feita no Recife, mostra um menino branco bem-vestido, de pé, apoiado no ombro de uma mulher negra sentada, identificada como sua ama de leite. a) Que aspecto do <i>Opúsculo</i> a imagem ilustra? b) Que consequência desse costume Nísia aponta para a formação das meninas?',a:['A foto ilustra o costume que Nísia ataca no art. XLI: mães ricas que não amamentam e entregam os filhos a amas escravizadas.','Para ela, a criança “bebe” com esse leite a primeira lição de mando e aprende “quero” antes de falar; no art. XLII, a menina criada entre escravos chega a maltratar a própria ama, depois vendida ou alugada “como um fardo inútil”, e transmitirá o exemplo aos filhos.','A intimidade da foto esconde a hierarquia que Nísia denuncia: a escravidão corrompe a formação moral de quem manda, embora o texto também trate a escravizada com o preconceito da época (“leite impuro”).']},
{p:'(Texto externo: crítica) No prefácio da edição do Senado (2019), Maria da Conceição Lima Alves afirma, em resumo, que no <i>Opúsculo</i> Nísia apenas tangencia a escravidão e a mulher indígena para se dedicar à educação das mulheres, embora em vida fosse abolicionista e indigenista. a) A afirmação vale para a escravidão? b) Vale para a mulher indígena?',a:['Vale em parte para a escravidão, que aparece em vários artigos mas sempre subordinada à educação doméstica; para a indígena, a afirmação é imprecisa.','A escravidão surge nos arts. XVI, XXII, XLI–XLIII, XLIX e LIV, quase sempre como causa da má formação das crianças livres; a indígena ganha quatro artigos próprios (LVIII–LXI), com versos, exemplos (Paraguaçu, a esposa de Camarão), denúncia de violências e a defesa de que é “digna” de educação moral e intelectual.','Por isso a Fuvest (2026 e 2027) apresenta Nísia como defensora da educação de mulheres brancas e indígenas, e não das escravizadas: a biografia da autora é mais radical que o livro.']},
{p:'(Comparação: <i>Memórias de Martha</i>) a) Que semelhança há entre o projeto de Nísia e a trajetória de Martha? b) Aponte uma diferença entre a educação que Nísia propõe e a que transforma a vida de Martha.',a:['As duas obras fazem da educação o caminho de dignidade da mulher: Nísia a reivindica em 1853, Martha a vive no fim do século.','Nísia mostra que só 8.443 dos 55.500 alunos das aulas públicas de 1852 eram meninas e ataca a educação de enfeite (art. XLVII); Martha, pobre e moradora de cortiço, estuda, passa no concurso e vira professora, saindo da pobreza.','A diferença: Nísia prefere a educação moral feita pela mãe instruída e desconfia das professoras públicas nomeadas por “patronato” (art. XXXI), enquanto Martha sobe justamente pela escola pública e pelo concurso, filha de uma mãe que engoma roupa para fora.']},
{p:'(Comparação: <i>Nebulosas</i>) a) Compare a voz que fala no <i>Opúsculo</i> e a do livro de Narcisa Amália. b) Compare o modo como as duas tratam a escravidão.',a:['As duas são vozes femininas que ocupam o espaço público no século XIX, mas Nísia fala como ensaísta, num “nós” oratório, e Narcisa como eu lírico romântico.','Nísia argumenta com história, dados e apelos (“Povos do Brasil!”); Narcisa faz poesia da dor íntima e da causa social, e em “O africano e o poeta” dá voz ao cativo, que só encontra no poeta quem o escute.','Na escravidão, Narcisa é antiescravista explícita, na linha condoreira; Nísia condena o cativeiro, mas o trata pelo efeito na educação das crianças livres e deixa os “braços livres” para o futuro.']},
{p:'(Comparação: <i>Balada de amor ao vento</i> ou <i>Canção para ninar menino grande</i>) Nísia diz que, em vários povos, a mulher foi “instrumento do prazer material do homem” ou “sua mais submissa escrava” e chama a poligamia de “aviltante lei” (arts. I e II). a) Que relação há com a condição de Sarnau em <i>Balada</i>? b) Que diferença de perspectiva separa as autoras?',a:['As duas obras denunciam a mulher reduzida a objeto e serva no casamento.','Nísia mostra a mulher educada só para servir a casa e agradar ao homem (arts. XX e LXII, a “boneca dos salões”); em <i>Balada</i>, Sarnau vive o lobolo e a poligamia como esposa de Nguila, com violência e submissão.','Mas Nísia julga a partir de uma hierarquia cristã e europeia de “civilização”, e Chiziane narra por dentro, na voz de uma africana; frente a <i>Canção</i>, a diferença é maior: as mulheres negras que Evaristo põe no centro da memória ficavam fora do projeto educacional do <i>Opúsculo</i>.']},
{p:'(Obra inteira: estrutura e conclusão) a) Explique por que o <i>Opúsculo</i> percorre a Antiguidade e as nações estrangeiras antes de falar do Brasil. b) Qual o argumento final do art. LXII?',a:['O percurso histórico prova a tese do art. V: o lugar da mulher é “o barômetro” da civilização de um povo.','Povos que desprezaram a mulher (Babilônia, Egito, Roma) decaíram; Alemanha, Inglaterra, França e EUA, que a educam, prosperam; depois vem o Brasil, herdeiro de Portugal, o antimodelo; no fim, Nísia lembra que a mulher já governa os homens pelo afeto e precisa ser educada para não abusar desse poder.','O fecho retoma a apóstrofe inicial (“Pais, governo, povos do Brasil!”) e conclui que o país, mais rico em natureza que os Estados Unidos, só precisa da “mola principal”, a educação: “Educai para isto a mulher”.']},
{p:'(Espaço e figura) a) No art. XXV, as escolas primárias têm “o aspecto de casas penitenciárias”. Identifique a figura e explique o efeito. b) Que outros espaços o <i>Opúsculo</i> critica como lugares de má educação?',a:['É uma comparação (metáfora, se lida sem o termo comparativo) que faz a escola parecer prisão.','O efeito é denunciar o método da palmatória, da vara e do açoite, que transformava o ensino em castigo, como o próprio art. XXV descreve.','Os outros espaços são a casa servida por escravos, onde a menina aprende o mando e a crueldade (arts. XLI–XLII), os salões, bailes e teatros da educação de aparência (arts. XLVII–XLVIII) e a igreja, onde o catecismo é desprezado e os jovens namoram durante o ofício (arts. LV–LVII).']},
{p:'(Escola literária) O <i>Opúsculo</i> costuma ser associado ao Romantismo. a) Aponte dois traços românticos. b) Aponte um aspecto em que ele se afasta dessa estética.',a:['O livro é romântico no tom e nas imagens: apóstrofes e exclamações, nacionalismo, natureza grandiosa e idealização da indígena.','Ele interpela os “Povos do Brasil”, exalta a “vasta terra de Santa Cruz” e a “perene pomposa vegetação” e faz de Paraguaçu e Moema modelos de esposa e de amor; mas argumenta com estatísticas de 1852, relatórios oficiais e relatos de viajantes, e condena os “inflamantes e perigosos romances”.','É um ensaio que une o Romantismo à herança da Ilustração (razão, progresso, civilização), sem aceitar a Ilustração radical: o progresso que defende é cristão e moral.']},
{p:'(Figuras) Na morte da menina do espartilho, a mãe “correu muito tarde para receber o derradeiro ósculo de sua filha, porém muito cedo para contemplar a obra de seu louco desvanecimento” (art. XLVI). a) Identifique a figura e explique o efeito. b) Que tese do livro o episódio sustenta?',a:['É uma antítese (“muito tarde” × “muito cedo”), que opõe o tempo do afeto ao tempo da culpa.','A mãe chega tarde para a despedida, mas cedo demais para não ver o resultado da própria vaidade: o espartilho, usado para render-lhe elogios no teatro, matou a filha de 6 anos diante de oitenta alunas, e pouco depois as outras mães voltaram a apertar as filhas.','O caso prova que a educação de aparência, que cuida do físico “em preferência ao moral”, corrompe e até mata, e que exemplos isolados não bastam: é preciso reformar a educação doméstica e pública (art. XLVII).']}
]
});

Object.assign(BOOKS.find(b=>b.id==='visao'),{
perto:[
['1. A queima das roupas das mulheres (início do livro)','<p><b>O que acontece.</b> Um mês depois de voltar, Celestino se livra dos móveis velhos (ficam duas cadeiras, a mesa, o camiseiro e os retratos). Abre as arcas das mulheres da casa, cava uma vala, joga nela vestidos, roupa de cama, xales e toucas e põe fogo. Rendas e bordados queimam. Ele dorme na cama em que a mãe morreu sem notícias dele e não sente saudade.</p><p><b>Como está escrito.</b> <b>Enumeração</b> longa, em assíndeto, que acumula a vida doméstica de gerações (do cueiro do bebê à touca da velha). Logo depois, o narrador diz que não houve drama nenhum: contraste entre o tamanho do que se destrói e a frieza do gesto.</p><p><b>O que significa.</b> Apaga o <b>trabalho feminino</b> (os lavores das mulheres que ficavam em terra) e a memória da mãe. Duas ligações que valem ponto: menino, ele <b>sonhava</b> ser dono da casa e queimar as roupas das mulheres (na história que conta às crianças); velho, diz ao padre que ainda guarda a <b>queimadura</b> da fogueira da roupa da mãe. O gesto frio deixou marca.</p><p><b>Como cairia.</b> Já caiu na 1ª fase 2027 (enumeração + destruição = apagamento do trabalho). Na 2ª fase: ligar a queima à mãe e à infância, à condição feminina ou ao despojamento de G. H.</p>'],
['2. O padre Alfredo: da confissão à cobiça (do início ao fim)','<p><b>O que acontece.</b> Na primeira visita, o padre vem pregar e se cala diante das rosas; quer levar Celestino a confessar-se, lembrando a mãe dele. Na igreja, o capitão se senta, mas não se ajoelha, e finge não entender a oferta de escuta. Mais tarde, quando o padre diz que nunca é tarde, ele responde falando de ameixas e compara Deus a um caroço de pêssego venenoso. Doente, com febre, recusa a confissão balançando a cabeça com força. O peixe que o padre lhe dá no Natal apodrece esquecido. No fim, o padre benze o corpo, chama-o de “meu pequeno pirata” e olha o jardim com cobiça; nas mãos dele, todas as plantas morriam.</p><p><b>Como está escrito.</b> Diálogos desencontrados: o padre fala de alma, Celestino responde com jardinagem. <b>Ironia</b> final: as mãos piedosas do padre matam as plantas; as mãos de assassino de Celestino as fazem florir.</p><p><b>O que significa.</b> A confissão seria o caminho da culpa ao perdão, e Celestino o recusa até o fim. A Igreja não nomeia o crime (sozinho com ele, o padre não ousa falar do passado) e acaba interessada no jardim. Não há castigo nem redenção.</p><p><b>Como cairia.</b> Ausência de remorso; ironia do desfecho; religião e culpa.</p>'],
['3. O espantalho e a vila: medo e fascínio','<p><b>O que acontece.</b> A vila recebe o velho de pala com boatos cada vez mais absurdos (cortou cabeças, queimou um elefante no Congo, ou um bisonte em Salvador). Ele faz um espantalho com o veludo das cortinas da sala; a vizinha o toma por fantasma e conta ao padre que o capitão adora o diabo e fala a língua dos pretos. As avós ameaçam os netos com ele. Mas o cheiro de rosas e jasmim atrai todos, e quem espia pela hera vê ali a vida que não viveu: viagens, florestas, desejos de sangue. As crianças Raul, Pedro e Luzia acham no muro um pires com marmelada e queijo.</p><p><b>Como está escrito.</b> Vozes da vila em <b>discurso indireto livre</b>, sem aspas; <b>hipérboles</b> dos rumores; imagens de olhar através (sebes, hera, frestas): a vila vê sombra, nunca o homem.</p><p><b>O que significa.</b> A vila teme o diabo e a magia, não o crime contra africanos, que ninguém lamenta. Numa terra de homens do mar, histórias terríveis se dissolvem no cotidiano; no fim, os rumores viram cantigas de pescadores e ele, um herói distante. É assim que a memória portuguesa transforma o tráfico em lenda, como faz o parágrafo de Raul Brandão.</p><p><b>Como cairia.</b> Espaço (dentro e fora do muro); memória coletiva e esquecimento; texto externo sobre memória colonial.</p>'],
['4. A cantilena às crianças: infância, mãe e crimes','<p><b>O que acontece.</b> Celestino chama os meninos e conta: a mãe e as tias bordavam, o pai, capitão Nuno, morreu no mar, ele tinha medo à noite. Partiu para a África; na febre, holandeses e uma menina cuidaram dele; ele os degolou e deixou a menina <b>vendada, amarrada a um tronco</b>. Segue a lista: matou bichos, dez mulheres, centenas de homens, um amigo, um albino. Fecha com a mãe trazendo leite morno na hora de dormir. As crianças, comendo amoras, pedem mais sangue; a vizinha ouve e reza a noite toda. Mais tarde, ao mostrar as tatuagens, ele repete a mesma fala, quase palavra por palavra.</p><p><b>Como está escrito.</b> Imita a fala bíblica (Jesus chamando as crianças) e a <b>canção de ninar</b>. <b>Enumeração</b> e <b>anáfora</b> do verbo matar; <b>antítese</b> entre o horror do conteúdo e a doçura da forma (amoras, leite, melodia).</p><p><b>O que significa.</b> A doçura da infância portuguesa e a violência na África saem da mesma boca, no mesmo tom. O crime vira doce para crianças: é <b>naturalizado</b> e passado adiante como aventura.</p><p><b>Como cairia.</b> Infância e mãe; comparação com a cantiga de ninar de <i>Canção para ninar menino grande</i>; com o <i>Opúsculo</i> (crianças e escravidão).</p>'],
['5. Os fragmentos: “sangue e luz”','<p><b>O que acontece.</b> Quatro séries de anotações em 1ª pessoa, separadas por travessões (em itálico no original), cortam a narração. Misturam horta (sementes de Espinho, dálias, cravos), vila (o barbeiro, a vizinha com bolo), mortes do passado (a menina holandesa, “Rota da Índia”, a data 1833, uma madrugada “feliz” com vinte e três mortos em volta da fogueira) e vontades de matar (o padre, um mendigo, uma fornada de pão envenenada). No fim, o caderno vira sílabas que ele não entende.</p><p><b>Como está escrito.</b> Frases nominais curtíssimas, <b>assíndeto</b>, sem ligação entre uma linha e outra. O refrão “sangue e luz” volta como tique: <b>repetição</b> que funciona como sintoma.</p><p><b>O que significa.</b> É a única voz direta de Celestino sobre o passado sem plateia, e mesmo aí não há culpa: o crime aparece ao lado do feijão de debulhar, no mesmo nível. A forma quebrada imita a memória que volta sem virar arrependimento; a letra que se desfaz acompanha a dissolução do homem.</p><p><b>Como cairia.</b> Foco narrativo (3ª pessoa e fragmentos em 1ª); recurso da repetição; memória sem remorso.</p>'],
['6. A visão das plantas e a cal no porão (cerca de um terço do livro)','<p><b>O que acontece.</b> O narrador passa ao ponto de vista das plantas: elas veem o jardineiro como veem a chuva, não agradecem, não sentem falta, não julgam; tanto lhes faz serem cuidadas por um assassino. Se ele morrer, “alforriadas”, invadirão a casa. Nenhuma flor lamenta os escravos, e então vem o massacre: os homens despejam a cal no porão, Celestino fecha a porta, há gemidos e depois silêncio; morrem os sessenta e poucos africanos que restavam da revolta; ele sorri, vai à proa sem olhar os mortos e respira a maresia. Fecho: ele e as plantas são da mesma seiva sem piedade; no lugar do coração, ele tem uma planta.</p><p><b>Como está escrito.</b> <b>Prosopopeia</b> (as plantas olham e vigiam); <b>comparações</b> (como um olho de vidro vê as nuvens); <b>anáfora</b> de “tanto lhes fazia”; o massacre em frases curtas e objetivas, sem adjetivos de condenação. “Alforriadas” aplica às plantas a palavra da escravidão.</p><p><b>O que significa.</b> É a origem do título: o olhar <b>sem julgamento</b> da natureza. O crime aparece no meio do capítulo das flores para mostrar que nada no mundo natural o pune. A indiferença das plantas espelha a de Celestino e a da sociedade que nunca o julgou: o leitor fica sozinho com o julgamento.</p><p><b>Como cairia.</b> Título; foco narrativo; natureza indiferente contra a natureza romântica (<i>Nebulosas</i>); comparação com a barata de G. H.</p>'],
['7. A floresta e o móvel de mogno (meio do livro)','<p><b>O que acontece.</b> Em delírio, Celestino volta à floresta africana, abrindo caminho a faca, querendo ser engolido por ela, mas Deus não o engole. A narração salta para os retratos dos avós (o avô morreu no mar) e para o <b>camiseiro de mogno vindo do Pará</b>, encomendado pela mãe: o carpinteiro sente a floresta pulsar na madeira; os troncos cruzaram o mar deitados como nem aos homens se permitia; a mãe, viúva e sozinha, limpa o móvel sem saber que ele conta a história do filho.</p><p><b>Como está escrito.</b> <b>Metáforas</b> fortes (a floresta como estômago de Deus; a mata como tecido de séculos que ele rasga com as pernas); <b>prosopopeia</b> da madeira que conta histórias; salto brusco entre África e Portugal.</p><p><b>O que significa.</b> O conforto da casa portuguesa é feito de matéria colonial: o móvel da mãe é floresta arrancada e transportada pelo mar, como os africanos no porão. A mãe representa a inocência doméstica que convive, sem ver, com a violência que a sustenta.</p><p><b>Como cairia.</b> Colonialismo e casa; a mãe; texto externo sobre comércio colonial.</p>'],
['8. A cova e o espelho','<p><b>O que acontece.</b> Vendo um brilho num canteiro, Celestino cava com a pá até a noite, sem conseguir parar, destruindo o canteiro. Não há tesouro nem cadáver, só terra. Cai de costas, olha as estrelas e desmaia. No dia seguinte acorda mais velho e mais cego; olha-se no espelho pela primeira vez em anos, corta a barba, esquece a pala e, na porta, sob a chuva, vive seu último momento “ao leme”.</p><p><b>Como está escrito.</b> <b>Repetição</b> e <b>gradação</b> (cavou, cavou, mais fundo) que imitam o ritmo da pá; frases que negam (nem segredo, nem saudade, nem lamento).</p><p><b>O que significa.</b> É o mais perto que o livro chega de um exame de consciência, e ele sai vazio: Celestino cava como quem procura o passado enterrado, mas a terra não devolve culpa. A cena marca a virada para a decadência e anuncia a sepultura; sem barba e sem pala, desmonta-se a figura lendária do pirata de Brandão.</p><p><b>Como cairia.</b> Transformação do personagem; símbolos (cova, espelho, barba, pala); recurso da repetição.</p>'],
['9. As tatuagens e o “supremo castigo”','<p><b>O que acontece.</b> Às crianças, Celestino mostra o peito tatuado (caveira, cruz de ossos, uma mulher, um facão, um veleiro, nomes e datas) e repete a lista de crimes. Percebe o espanto misturado com nojo do corpo velho e se cala. Pensa que a vida não lhe deu a nobreza de morrer jovem e que o jardim o domesticou, o enjaulou. O narrador chama isso de supremo castigo: ele se deixou <b>escravizar</b> pelo cuidado com as flores, cuja revolta foi silenciosa; foi ele mesmo quem se acorrentou.</p><p><b>Como está escrito.</b> O corpo como <b>mapa</b> e testamento da viagem (metáfora). <b>Ironia</b>: o traficante fica “cativo” do jardim; as plantas fazem uma revolta que vence, ao contrário da revolta no porão.</p><p><b>O que significa.</b> É o único “castigo” do livro, e é irônico e brando: nenhuma justiça humana, só a prisão afetiva a um jardim. A inversão de senhor e escravo não repara nada; o leitor percebe a ironia, Celestino não a transforma em culpa.</p><p><b>Como cairia.</b> Ironia e metáfora; “Celestino é punido?”; comparação com obras sobre escravidão.</p>'],
['10. Relâmpagos, fantasmas e morte (último quarto)','<p><b>O que acontece.</b> O esquecimento avança. Sonâmbulo, Celestino encontra na cozinha uma <b>velha negra</b> que lhe serve comida; depois ela aparece de dia, lava-o, segue-o pela floresta e o leva no colo para casa, adiando a morte. A <b>menina holandesa</b>, vendada, dorme no peito dele como uma neta. Nos relâmpagos do último outono, a casa parece porão de navio negreiro à deriva, os braços dele fazem gestos de marinhar e, no quintal, ele se sente num <b>mar outro, sem homens e sem tempo</b>. Revê o porão e a velha negra jogada ao mar e atira farinha nas flores, numa dança dos mortos. Manuel o leva à praia, onde ele vê a menina sair da água. Morre numa noite de inverno, sem uma dúvida na consciência.</p><p><b>Como está escrito.</b> Real e alucinação sem fronteira. <b>Antítese</b>: as vítimas aparecem como amas e anjos sem rancor; a velha negra é chamada de “mãe morte”. A venda que ele não consegue desatar é <b>símbolo</b>: não pode ver os olhos da menina nem ser visto por ela, e por isso não pode curar-se. A última frase repete Brandão.</p><p><b>O que significa.</b> As vítimas voltam não para vingar, mas para cuidar: de novo, o trabalho de mulheres (uma delas escravizada) serve a ele. A casa como porão mostra o passado guardado sob a pele (leitura oficial: <b>tormento</b> e espaço da <b>consciência</b>). Repetida no fim, a “consciência tranquila” de Brandão vira ironia e horror.</p><p><b>Como cairia.</b> Já caiu (relâmpagos, Fuvest 2026). Novos ângulos: os fantasmas como cuidadoras; a venda; o desfecho circular.</p>']
],
critica:'<p><b>De onde vem o livro.</b> Djaimilia Pereira de Almeida (Luanda, 1982; cresceu em Portugal; doutora em teoria da literatura pela Universidade de Lisboa) parte de um parágrafo de <i>Os pescadores</i> (1923), de <b>Raul Brandão</b> (1867–1930), escritor nascido na Foz do Douro. Ali, o narrador lembra o capitão Celestino, que começou pirata e acabou “como um santo”, cultivando cravos; o massacre com cal no porão aparece como boato, e o que ele diz saber com certeza é que ninguém fazia alporques de cravos como ele. O romance inverte essa hierarquia: põe o crime no centro e termina com a mesma frase de Brandão (morreu sem uma dúvida na consciência), agora irônica.</p><p><b>Prêmios e edições.</b> Edição portuguesa: Relógio D’Água, 2019. No Brasil: Todavia, 2021, com a grafia de Portugal (por isso “facto”, “acção”, “xailes”). Ficou em <b>2º lugar no Prêmio Oceanos 2020</b> (o 1º foi <i>Torto arado</i>); a autora já tinha vencido o Oceanos 2019 com <i>Luanda, Lisboa, Paraíso</i>.</p><p><b>Contexto histórico.</b> Portugal proibiu por decreto a exportação de escravizados em 1836, sob pressão inglesa, mas o tráfico continuou ilegalmente; em 1842 os dois países fizeram acordo para aboli-lo. No romance, um fragmento traz a data 1833 e a “Rota da Índia”, e a epígrafe fala de africanos levados para o Brasil. A velhice de Celestino se passa no fim do século XIX (“vem aí o novo século”).</p><p><b>O que a crítica diz.</b></p><ul><li><b>Mônica Genelhu Fagundes</b> (“Paisagem com a queda de Celestino”, revista <i>Metamorfoses</i>, UFRJ, 2022) lê o livro com o ensaio “A nau de Ícaro”, de Eduardo Lourenço, e a tela <i>Paisagem com a queda de Ícaro</i>, atribuída a Bruegel, em que a paisagem segue indiferente à queda.</li><li><b>Nicola Biasio</b> (revista <i>Abril</i>, 2021) faz leitura <b>ecocrítica</b> e descolonizadora, com foco na <b>culpa</b>.</li><li><b>Sandra Sousa</b> (“Ecocumplicidade em A visão das plantas”, Universidade do Minho) discute Biasio e recusa ver no livro uma conciliação entre dominador e dominado.</li><li><b>Cristina Arena Forli e Gustavo Rückert</b> (“O que fazer com o passado colonial?”, <i>Via Atlântica</i>, USP, 2025) tratam da memória colonial portuguesa.</li></ul><p><i>Esses estudos foram localizados por busca; não foi possível abrir os textos completos.</i></p><p><b>Três eixos para a prova.</b> (1) <b>Reescrita pós-colonial</b> de um clássico que tratou o massacre como detalhe. (2) <b>Ecocrítica</b>: as plantas como olhar não humano, indiferente ou cúmplice. (3) <b>Memória e culpa</b>: não há confissão, castigo nem redenção; o julgamento fica com o leitor.</p><p><b>Como a Fuvest já leu o livro.</b> <b>2ª fase 2026 (Q4):</b> a resposta oficial pede, na juventude, frieza calculada (o silêncio depois do massacre, o olhar no horizonte); na velhice, <b>tormento</b> (os trovões, a casa como porão de navio à deriva); a casa como <b>projeção do passado traumático</b>; o “mar outro, sem homens e sem tempo” como espaço da <b>consciência e do isolamento</b>, onde ele é forçado a confrontar a própria história. <b>1ª fase 2027 (Q80, gabarito A):</b> na queima das roupas das mulheres, a enumeração somada à destruição cria acumulação e liga a queima ao <b>apagamento do trabalho</b> que os objetos representam.</p><p><b>Escola.</b> Confirma o contemporâneo pós-colonial (revisão da história, intertexto, fragmentos, memória). Rompe com a denúncia direta: o foco é o perpetrador, as vítimas não falam e o narrador quase não julga (embora chame Celestino de “monstro” uma vez). Rompe com o Romantismo: a natureza não espelha nem consola o eu, é indiferente.</p>',
qbank:[
{p:'(Texto externo: Raul Brandão) Na epígrafe, tirada de <i>Os pescadores</i> (1923), o narrador diz que o capitão Celestino começou a vida como pirata e a acabou “como um santo”, que dele se diziam coisas piores, mas que o que sabia com exatidão é que ninguém o igualava nos alporques de cravos; e termina dizendo que morreu “sem uma dúvida na consciência tranquila”. a) Que lugar o massacre ocupa no texto de Brandão? b) Como o romance reescreve esse texto, sobretudo no desfecho?',a:['Em Brandão, o massacre com cal é um boato secundário e o centro é a admiração pelo jardineiro “santo”; Djaimilia inverte essa hierarquia e põe o crime no centro.','O romance narra o massacre em detalhe (a cal, a porta fechada por Celestino, os sessenta e poucos mortos, o sorriso e o olhar no horizonte) e termina com a mesma frase de Brandão, depois que o leitor viu a confissão recusada, os fantasmas das vítimas e os rumores virando cantigas de pescadores.','A repetição literal da frase final cria ironia: o que em Brandão era elogio vira sinal de horror diante da impunidade, e o livro mostra como a memória portuguesa transformou o tráfico em lenda pitoresca.']},
{p:'(Imagem descrita) A tela <i>Paisagem com a queda de Ícaro</i>, atribuída a Pieter Bruegel, o Velho, mostra em primeiro plano um lavrador arando, um pastor e um pescador; um navio segue viagem; num canto, quase invisíveis, as pernas de Ícaro afundam no mar, e ninguém nota. A crítica Mônica Genelhu Fagundes usa a tela para ler o romance. a) Que relação há entre a tela e o olhar das plantas? b) Quem, além das plantas, mantém essa indiferença?',a:['Como a paisagem de Bruegel, que segue seu curso diante da queda, as plantas olham Celestino sem julgamento: tanto lhes faz serem cuidadas por um assassino.','O narrador diz que elas tratam o regador como chuva, não lamentam os escravos sufocados com cal e, no fim, nem sabem que o amigo morreu; a vila também segue a vida: os rumores se dissolvem nas novidades, o padre não ousa falar do passado e a memória do capitão vira cantiga de pescadores.','A indiferença da paisagem, na tela e no livro, não absolve: ela deixa ao leitor a tarefa de ver a queda, isto é, o crime colonial que ninguém em volta quis ver.']},
{p:'(Texto externo: história) Em 1836, um decreto do governo português proibiu a exportação de escravizados de seus territórios, sob pressão britânica; historiadores mostram que o tráfico continuou ilegalmente nos anos seguintes. a) Que indícios do romance ligam Celestino a esse comércio? b) Como o romance mostra a relação de Portugal com essa memória?',a:['O passado de Celestino é o tráfico atlântico: a epígrafe diz que ele levava africanos para vender no Brasil, e os fragmentos de diário trazem a data 1833 e a “Rota da Índia”.','A vila conhece as histórias, mas as transforma em boatos sobre diabo e magia, em ameaça para crianças e, no fim, em cantigas de pescadores sobre um herói distante; o padre quer confissão, mas nunca fala do crime; até o móvel de mogno da mãe veio do Pará, atravessando o mar.','O romance mostra uma sociedade que conviveu com o tráfico e o converteu em lenda e esquecimento, em vez de responsabilidade, o contrário do que a proibição legal deveria significar.']},
{p:'(Comparação: G. H.) Em <i>A paixão segundo G. H.</i>, a narradora, diante da barata, vive uma experiência de despojamento do humano. a) Compare o contato com o não humano nas duas obras. b) Compare o resultado dessa experiência para G. H. e para Celestino.',a:['Nas duas obras, um ser não humano (a barata, as plantas) aparece como vida neutra, sem moral, que não julga; e as duas começam despojando a casa: G. H. quer limpar o quarto de Janair, Celestino se livra dos móveis e queima as roupas das mulheres.','G. H. se transforma: perde a identidade social, prova a massa da barata e sai mudada; Celestino, ao contrário, se reconhece da mesma seiva sem piedade das plantas e não muda: recusa a confissão, e o despojamento final (sem barba, sem pala, sem memória) é decadência, não revelação.','O não humano desmonta G. H. e a obriga a ver o outro (Janair); em Celestino, só confirma a indiferença, e ele morre sem uma dúvida na consciência.']},
{p:'(Comparação: Opúsculo humanitário) Nísia Floresta critica a criação de crianças brancas entre escravizados, que naturaliza a escravidão e deforma a formação moral (a menina que maltrata a ama que a amamentou). a) Que cena do romance mostra a naturalização da violência diante de crianças? b) Compare o papel das mulheres negras nas duas obras.',a:['Em <i>A visão das plantas</i>, Celestino conta às crianças da vila, como cantiga doce, que matou mulheres, homens, um amigo e um albino; elas, comendo amoras, pedem mais sangue: a violência vira diversão e é naturalizada.','Em Nísia, a ama negra cuida e é maltratada; no romance, a velha negra que Celestino jogou ao mar volta como fantasma e cuida dele como ama (alimenta, lava, leva no colo), sem rancor, enquanto ele nunca se arrepende.','As duas obras mostram o cuidado de mulheres negras sustentando quem as violentou e denunciam uma formação moral que naturaliza a escravidão: Nísia em 1853, Djaimilia olhando esse passado do século XXI.']},
{p:'(Comparação: Geografia) Em <i>Geografia</i>, Sophia associa o mar à limpidez e à verdade, por contraste com a “noite” moral do regime salazarista. a) Como é o mar para Celestino? b) Compare o sentido do mar nas duas obras.',a:['Para Celestino o mar não é limpidez: ele o envernizou e o degradou, é o espaço do porão e do massacre; na velhice, volta como tormento (a casa vira porão à deriva) e, no quintal, como um mar outro, sem homens e sem tempo.','O narrador diz que o mar nunca lhe trouxe a vida; nos fragmentos ele não suporta o cheiro do mar e, ao fechar o olho, vê sangue; na praia, levado por Manuel perto da morte, vê a menina holandesa sair das águas.','Em Sophia, o mar é medida de verdade contra a opacidade do regime; em Djaimilia, o mar português é lugar de crime e de memória que retorna: as duas usam o mar para julgar Portugal, uma pela pureza, a outra pelo que ia no porão.']},
{p:'(Personagem e recurso) No início do romance, Celestino abre as arcas das mulheres, queima roupas e bordados numa vala, e o narrador comenta que não houve nisso drama nenhum. a) Identifique o recurso entre o gesto e o comentário e explique o efeito. b) Relacione a cena à infância e à mãe de Celestino, em outras partes do livro.',a:['Há contraste (antítese) entre a acumulação dos objetos destruídos e o comentário seco sobre a falta de drama: o narrador imita a frieza do personagem e faz o leitor sentir o peso que ele recusa.','Ao contar sua vida às crianças, Celestino lembra que a mãe e as tias bordavam e que ele, menino, sonhava ser dono da casa e queimar as roupas das mulheres; ao padre, diz ainda guardar a queimadura da fogueira da roupa da mãe, que morreu sem notícias dele, na cama em que ele agora dorme sem saudade.','A queima realiza um desejo infantil de poder e apaga o trabalho e a memória das mulheres da família; a queimadura lembrada mostra que o gesto frio deixou marca, como o passado que ele nunca confessa.']},
{p:'(Desfecho e polissemia) Na última cena, o padre Alfredo sai da casa do morto e a visão das plantas lhe parece uma aleluia; ele diz “meu pequeno pirata” com cobiça, e nas mãos dele todas as plantas morriam. a) Explique o duplo sentido da expressão que dá título ao livro nesse trecho. b) Explique o papel do padre no romance e a ironia do desfecho.',a:['“A visão das plantas” significa o olhar das plantas sobre Celestino (sem julgamento, como o narrador mostra no meio do livro) e também a visão que os outros têm delas: no fim, o jardim visto pelo padre como aleluia.','O padre tentou várias vezes levar Celestino à confissão, inclusive em nome da mãe dele, e foi recusado até no leito de febre; nunca falou do passado do pirata e agora cobiça o jardim, embora mate as plantas que toca.','A ironia opõe as mãos de assassino que fazem florir às mãos piedosas que matam: nem a religião julga nem redime Celestino, que morre sem uma dúvida na consciência, e a beleza do jardim sobrevive ao crime.']},
{p:'(Escola) Em <i>Nebulosas</i>, a natureza é extensão do eu romântico: reflete e consola a dor do sujeito. a) Como a natureza aparece em <i>A visão das plantas</i>? b) Em que o romance confirma e em que rompe com a literatura pós-colonial contemporânea?',a:['Em Djaimilia, a natureza não espelha nem consola: as plantas são indiferentes, tratam Celestino como tratam a chuva e nem sabem que ele morreu; o vento e as folhas não respondem ao desafio dele.','O romance confirma o pós-colonial ao reescrever Raul Brandão e expor o tráfico que Portugal esqueceu, com fragmentos, intertexto e memória; mas rompe com a denúncia direta, porque o foco é o perpetrador, as vítimas (a velha negra, a menina vendada) não falam e o narrador evita condenar.','Ao contrário da natureza romântica de Narcisa, confidente do eu, a natureza indiferente de Djaimilia obriga o leitor a fazer o julgamento que nem as plantas, nem a vila, nem o padre fazem.']},
{p:'(Figura típica) O narrador diz que, se Celestino morresse, as plantas, “alforriadas”, tomariam a casa; mais tarde, chama de “supremo castigo” o fato de ele ter se deixado escravizar pelo jardim, cuja revolta foi silenciosa. a) Identifique e explique o recurso. b) Por que esse castigo não equivale a punir o crime?',a:['É ironia construída por metáfora: palavras da escravidão (alforria, escravo, revolta, correntes) passam para a relação entre o jardineiro e as plantas, invertendo os papéis de senhor e escravo.','O traficante que sufocou com cal uma revolta no porão vê as plantas fazerem uma revolta silenciosa que vence: ele fica cativo do cuidado com elas e teme mais a destruição do jardim do que a própria morte.','O castigo é só simbólico e afetivo: Celestino não sente culpa, recusa a confissão e morre tranquilo, e a ironia mostra ao leitor que não houve justiça real para as vítimas.']}
]
});

</script>
<script>
const $=s=>document.querySelector(s);
const ORDER=['gh','geografia','caminho','balada','cancao','visao','martha','opusculo','nebulosas'];
const BY=Object.fromEntries(BOOKS.map(b=>[b.id,b]));
const PLAN=[
 ['2026-11-26','qui 26/11',['gh','geografia'],'A paixão segundo G. H. e Geografia'],
 ['2026-11-27','sex 27/11',['caminho','balada'],'Caminho de pedras e Balada de amor ao vento'],
 ['2026-11-28','sáb 28/11',['cancao','visao'],'Canção para ninar menino grande e A visão das plantas'],
 ['2026-11-29','dom 29/11',['martha','opusculo'],'Memórias de Martha e Opúsculo humanitário'],
 ['2026-11-30','seg 30/11',['nebulosas','escolas'],'Nebulosas e as escolas literárias'],
 ['2026-12-01','ter 1/12',['figuras'],'Figuras de linguagem'],
 ['2026-12-02','qua 2/12',['questoes'],'Questões, dia 1'],
 ['2026-12-03','qui 3/12',['questoes'],'Questões, dia 2'],
 ['2026-12-04','sex 4/12',['questoes','cruzar'],'Questões, dia 3, e cruzar obras'],
 ['2026-12-05','sáb 5/12',['cards','cola'],'Flashcards e a cola de uma tela'],
 ['2026-12-06','dom 6/12',['cola'],'Dia da prova: só a cola, com calma']];
let ST={done:{},cards:{}};
try{const r=localStorage.getItem('fuv27lit');if(r)ST=Object.assign(ST,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem('fuv27lit',JSON.stringify(ST));}catch(e){}}
function todayIdx(){const d=new Date();const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let i=PLAN.findIndex(p=>p[0]>=iso);if(i<0)i=PLAN.length-1;return i;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const NAVS=[['inicio','Início'],...ORDER.map(id=>[id,BY[id].e+' '+BY[id].short]),['metodo','Como responder'],['escolas','Escolas literárias'],['figuras','Figuras de linguagem'],['cruzar','Cruzar obras'],['questoes','Questões'],['cards','Flashcards'],['cola','Cola']];
function nav(cur){$('#nav').innerHTML=NAVS.map(([h,l])=>`<a href="#${h}" class="${h===cur?'on':''}">${l}</a>`).join('');const on=$('#nav .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});}
function sec(id,title,inner,extra=''){return `<section class="card ${extra}" id="${id}"><div class="sechead"><h2>${title}</h2><button class="say" data-say="${id}" aria-pressed="false" aria-label="Ouvir ${esc(title)}">▶ ouvir</button></div><div class="body">${inner}</div></section>`;}
function qa(q,i){return `<p class="q">${q.p}</p><details><summary>Ver resposta-modelo</summary><div class="in ans">${q.a.map((s,k)=>`<p><span class="st">${['Afirme','Prove com a obra','Ligue ao enunciado'][k]||''}</span>${s}</p>`).join('')}</div></details>`;}
function note(cls,lab,html){return `<div class="note ${cls}"><span class="lab">${lab}</span>${html}</div>`;}
function home(){
  const ti=todayIdx(),p=PLAN[ti];
  const LB={figuras:'Figuras de linguagem',cruzar:'Cruzar obras',escolas:'Escolas literárias',questoes:'Questões',cards:'Flashcards',cola:'A cola'};const links=p[2].map(id=>BY[id]?`<a class="btn" href="#${id}">${BY[id].e} ${BY[id].short}</a>`:`<a class="btn" href="#${id}">${LB[id]||'Abrir'}</a>`).join(' ');
  const nd=ORDER.filter(id=>ST.done[id]).length;
  return `<h1>Literatura em 20 minutos por dia</h1><p class="sub">Uma ficha de cerca de 10 minutos por obra, duas por dia. O “Aprofundar” de cada obra é opcional (+10 min). Toque em “ouvir” para escutar qualquer parte.</p>
  <section class="card today"><p class="sub">Hoje, ${p[1]}</p><h2>${p[3]}</h2><div class="row2">${links}</div></section>
  <section class="card"><h2>Seu progresso</h2><div class="prog"><i style="width:${nd/9*100}%"></i></div><p class="sub">${nd} de 9 obras marcadas como estudadas</p></section>
  <h2 style="margin-top:22px">As 9 obras</h2><div class="grid">${ORDER.map(id=>{const b=BY[id];return `<a class="bk" href="#${id}" style="--c:${b.c}"><span class="em">${b.e}</span><span><b>${b.t}</b><span>${b.a}, ${b.y}</span></span>${ST.done[id]?'<span class="ck">✓</span>':''}</a>`}).join('')}</div>
  <section class="card"><h2>Linha do tempo da lista</h2><ul class="tl">${[...ORDER].sort((x,y)=>BY[x].y-BY[y].y).map(id=>{const b=BY[id];return `<li style="--c:${b.c}"><span class="yr">${b.y}</span><span>${b.e} <b>${b.t}</b><small>${b.per}</small></span></li>`}).join('')}</ul></section>
  <section class="card"><h2>Plano até a prova</h2><ul class="sched">${PLAN.map((q,i)=>`<li class="${i===ti?'now':''}"><span class="d">${q[1]}</span><span>${q[3]}</span></li>`).join('')}</ul></section>`;
}
function book(id){
  const b=BY[id];document.documentElement.style.setProperty('--accent',b.c);
  let h=`<p class="sub">${b.e} ${b.a} · ${b.y} · ficha de ~10 min</p><h1>${b.t}</h1><div class="row2"><button class="btn" data-sayall="1">▶ Ouvir a ficha inteira</button></div>`;
  h+=sec('s-id','Cartão de identidade',b.idt+note('mn','Escola literária em 30 segundos',`<p>${b.esc} <a href="#escolas">Ver todas as escolas</a></p>`),'book');
  h+=sec('s-en',b.enT||'Enredo em 7 cenas',`<ol class="scenes">${b.cenas.map(c=>`<li><b>${c[0]}</b>${c[1]}</li>`).join('')}</ol>`,'book');
  h+=sec('s-pe','Personagens',`<dl class="people">${b.pers.map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join('')}</dl>`,'book');
  h+=sec('s-te','Técnica: narrador, tempo, espaço, linguagem',b.tec,'book');
  h+=sec('s-tm','Temas e símbolos',`<ul class="tight">${b.temas.map(t=>`<li><b>${t[0]}.</b> ${t[1]}</li>`).join('')}</ul>`+note('cai','O que mais cai',b.cai),'book');
  h+=sec('s-pg','Pegadinhas e mnemônico',b.peg.map(x=>note('peg','Pegadinha',x)).join('')+note('mn','Mnemônico',b.mn),'book');
  h+=sec('s-q','Questão no estilo Fuvest',qa(b.q),'book');
  h+=`<details class="deep" id="deep"><summary>Aprofundar (+10 min, opcional)</summary><div class="in">`+
     sec('s-ap','Contexto e cenas secundárias',b.ap)+
     sec('s-cx','Conexões com outras obras',`<ul class="tight">${b.cx.map(x=>`<li>${x}</li>`).join('')}</ul>`)+
     sec('s-aq','Mais uma questão',qa(b.aq))+`</div></details>`;
  if(b.perto&&b.perto.length)h+=`<details class="deep"><summary>Leitura de perto (${b.perto.length} cenas ou poemas)</summary><div class="in">`+b.perto.map((x,i)=>sec('s-pp'+i,x[0],x[1])).join('')+`</div></details>`;
  if(b.critica)h+=`<details class="deep"><summary>Crítica e contexto</summary><div class="in">`+sec('s-cr','O que a crítica diz',b.critica)+`</div></details>`;
  if(b.qbank&&b.qbank.length)h+=`<details class="deep"><summary>Banco de questões (${b.qbank.length})</summary><div class="in">`+b.qbank.map((q,i)=>`<section class="card"><p class="sub">Questão ${i+1}</p>${qa(q)}</section>`).join('')+`</div></details>`;
  h+=`<div class="row2"><button class="btn ${ST.done[id]?'done':''}" id="doneBtn">${ST.done[id]?'✓ Estudada':'Marcar como estudada'}</button>`;
  const i=ORDER.indexOf(id); if(i<ORDER.length-1)h+=`<a class="btn ghost" href="#${ORDER[i+1]}">Próxima: ${BY[ORDER[i+1]].short}</a>`;
  return h+'</div>';
}
function metodo(){return METODO;}
function cruzar(){return CRUZAR;}
function questoes(){
  return `<h1>Questões para treinar</h1><p class="sub">Leia, responda de cabeça (ou em 5 linhas no papel) e só então abra o modelo. Seis por dia.</p>`+
  QDAYS.map((d,k)=>`<h2 style="margin-top:22px">${d.t}</h2>`+d.q.map((q,j)=>`<section class="card"><p class="sub">${q.src}</p>${qa(q)}</section>`).join('')).join('');
}
let cf={f:'todas',i:0,list:[]};
function deck(){const all=[];BOOKS.forEach(b=>b.cards.forEach(c=>all.push({id:b.id,e:b.e,c:b.c,t:b.short,f:c[0],b:c[1]})));XCARDS.forEach(c=>all.push({id:'x',e:'🔀',c:'#586173',t:'Cruzadas',f:c[0],b:c[1]}));return all;}
function cards(){
  const all=deck();cf.list=all.filter(c=>cf.f==='todas'||(cf.f==='dificeis'?ST.cards[c.f]===0:c.id===cf.f));if(cf.i>=cf.list.length)cf.i=0;
  const c=cf.list[cf.i];
  const opts=[['todas','Todas'],['dificeis','Só as que errei'],...ORDER.map(id=>[id,BY[id].e+' '+BY[id].short]),['x','🔀 Cruzadas']].map(([v,l])=>`<option value="${v}" ${cf.f===v?'selected':''}>${l}</option>`).join('');
  return `<h1>Flashcards</h1><p class="sub">Tente lembrar antes de tocar no cartão. Marque se sabia ou não: os que você errar ficam no filtro “Só as que errei”.</p>
  <div class="row2"><select id="cfSel" aria-label="Filtrar cartões">${opts}</select><button class="btn ghost" id="cfShuf">Embaralhar</button></div>
  ${c?`<div class="fc" id="fc" style="--accent:${c.c}" role="button" tabindex="0" aria-label="Virar cartão"><span class="k">${c.e} ${c.t} · ${cf.i+1} de ${cf.list.length}</span><div class="f">${c.f}</div><div class="b">${c.b}</div></div>
  <div class="row2"><button class="btn ghost" id="cfNo">Não sabia</button><button class="btn" id="cfYes">Sabia</button></div>`:'<p>Nenhum cartão neste filtro ainda. Marque “Não sabia” em algum cartão para ele aparecer aqui.</p>'}`;
}
function cola(){return COLA;}
function render(){
  stopSpeech();
  let r=(location.hash||'#inicio').slice(1)||'inicio';
  document.documentElement.style.setProperty('--accent','#3B5BA9');
  let h;
  if(BY[r])h=book(r);else if(r==='metodo')h=metodo();else if(r==='cruzar')h=cruzar();else if(r==='escolas')h=ESCOLAS;else if(r==='figuras'){const fx=FIGQ.slice(FIGQ_N0);h=FIGURAS+'<h2 style="margin-top:22px">Questões discursivas para treinar</h2>'+FIGQ.slice(0,FIGQ_N0).map(q=>`<section class="card">${qa(q)}</section>`).join('')+((FIG_EXTRA||fx.length)?`<details class="deep"><summary>Treino e banco de figuras (opcional)</summary><div class="in">${FIG_EXTRA}${fx.length?'<h2 style="margin-top:22px">Banco de questões de figuras</h2>'+fx.map(q=>`<section class="card">${qa(q)}</section>`).join(''):''}</div></details>`:'');}else if(r==='questoes')h=questoes();else if(r==='cards')h=cards();else if(r==='cola')h=cola();else{r='inicio';h=home();}
  $('#app').innerHTML=h;nav(r);window.scrollTo(0,0);bind(r);
}
function bind(r){
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const s=document.getElementById(b.dataset.say);speakEls([s],s.querySelector('h2').textContent,b);});
  const all=document.querySelector('[data-sayall]');if(all)all.onclick=()=>{const els=[...document.querySelectorAll('main section.book')];speakEls(els,'Ficha inteira',all);};
  const d=$('#doneBtn');if(d)d.onclick=()=>{ST.done[r]=!ST.done[r];save();d.className='btn '+(ST.done[r]?'done':'');d.textContent=ST.done[r]?'✓ Estudada':'Marcar como estudada';};
  if(r==='cards'){const fc=$('#fc');if(fc){const flip=()=>fc.classList.toggle('open');fc.onclick=flip;fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};}
    $('#cfSel').onchange=e=>{cf.f=e.target.value;cf.i=0;render();};
    $('#cfShuf').onclick=()=>{BOOKS.forEach(b=>b.cards.sort(()=>Math.random()-.5));XCARDS.sort(()=>Math.random()-.5);cf.i=0;render();};
    const mark=v=>{const c=cf.list[cf.i];ST.cards[c.f]=v;save();cf.i=(cf.i+1)%Math.max(1,cf.list.length);render();};
    if($('#cfYes')){$('#cfYes').onclick=()=>mark(1);$('#cfNo').onclick=()=>mark(0);}}
}
/* voz */
const synth=window.speechSynthesis;let queue=[],speaking=false,paused=false,curBtn=null,wake=null;
function voice(){const v=synth.getVoices();return v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}
function chunks(t){t=t.replace(/\s+/g,' ').replace(/▶ ouvir|Ver resposta-modelo/g,'').trim();const out=[];t.split(/(?<=[.!?;:])\s+/).forEach(s=>{while(s.length>220){let k=s.lastIndexOf(',',220);if(k<80)k=220;out.push(s.slice(0,k+1));s=s.slice(k+1);}if(s.trim())out.push(s);});return out;}
function speakEls(els,label,btn){
  if(!synth){alert('Seu navegador não tem leitura em voz alta. Tente pelo Chrome ou Safari.');return;}
  if(curBtn===btn&&speaking){stopSpeech();return;}
  stopSpeech();
  els.forEach(e=>e.querySelectorAll('details').forEach(d=>d.open=true));
  queue=chunks(els.map(e=>e.innerText).join('. '));speaking=true;paused=false;curBtn=btn;btn.setAttribute('aria-pressed','true');
  $('#pNow').textContent='Ouvindo: '+label;$('#player').classList.add('show');$('#pToggle').textContent='Pausar';next();
}
function next(){if(!speaking)return;if(!queue.length){stopSpeech();return;}const u=new SpeechSynthesisUtterance(queue.shift());const v=voice();if(v)u.voice=v;u.lang='pt-BR';u.rate=parseFloat($('#pRate').value);u.onend=next;u.onerror=next;synth.speak(u);}
function stopSpeech(){speaking=false;queue=[];try{synth&&synth.cancel();}catch(e){}if(curBtn)curBtn.setAttribute('aria-pressed','false');curBtn=null;$('#player').classList.remove('show');}
$('#pToggle').onclick=()=>{if(!speaking)return;if(paused){synth.resume();paused=false;$('#pToggle').textContent='Pausar';}else{synth.pause();paused=true;$('#pToggle').textContent='Continuar';}};
$('#pStop').onclick=stopSpeech;
$('#pWake').onchange=async e=>{try{if(e.target.checked&&'wakeLock'in navigator){wake=await navigator.wakeLock.request('screen');}else if(wake){await wake.release();wake=null;}}catch(err){e.target.checked=false;}};
if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=()=>{};
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('fuv27theme',r.dataset.theme);}catch(e){}};
try{const t=localStorage.getItem('fuv27theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
window.addEventListener('hashchange',render);render();

</script>
<div id="bkBox" style="max-width:760px;margin:24px auto 40px;padding:0 16px;font-family:system-ui,sans-serif;font-size:14px;color:#6b7280">
<p><b>Backup do progresso</b> (guarde o código no app Notas):</p>
<p><button id="bkCopy" type="button">Copiar meu progresso</button> <button id="bkRest" type="button">Restaurar</button> <span id="bkMsg"></span></p>
<p>Áudios: <a href="podcast.xml">podcast</a> (no app Podcasts: Biblioteca → Seguir um programa por URL).</p>
<p id="bkVer"></p>
</div>
<script>
(function(){
 var K='fuv27lit',msg=document.getElementById('bkMsg');
 function say(t){msg.textContent=t;setTimeout(function(){msg.textContent='';},4000);}
 document.getElementById('bkCopy').onclick=function(){
  var v='';try{v=localStorage.getItem(K)||'';}catch(e){}
  if(!v){say('Nenhum progresso salvo ainda.');return;}
  var c='FUV27:'+btoa(unescape(encodeURIComponent(v)));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(function(){say('Copiado. Cole no app Notas.');},function(){prompt('Copie o código:',c);});}
  else prompt('Copie o código:',c);
 };
 document.getElementById('bkRest').onclick=function(){
  var c=prompt('Cole o código do progresso (começa com FUV27:)');
  if(!c)return;c=c.trim();
  try{if(c.indexOf('FUV27:')!==0)throw 0;var v=decodeURIComponent(escape(atob(c.slice(6))));JSON.parse(v);localStorage.setItem(K,v);say('Restaurado. Recarregando…');setTimeout(function(){location.reload();},800);}
  catch(e){say('Código inválido.');}
 };
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
 document.getElementById('bkVer').textContent='Versão: 26/11/2026 13:54';
})();
</script>

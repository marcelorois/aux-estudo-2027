// Percurso, vozes e aprofundar de Nebulosas. Domínio público: citações curtas conferidas em textos/nebulosas_ocr.txt e em saida/aprofundamento-nebulosas.md (conferido na imagem).
Object.assign(BOOKS.find(b=>b.id==='nebulosas'),{
  enT:'O percurso do livro em 3 partes',
  fio:'Do céu noturno à praça pública: diante das nebulosas, a dor da poeta vira poesia, e a poesia vira luta pela liberdade, contra a Constituição imposta, a monarquia e a escravidão. A natureza é espelho do eu e modelo do que é livre.',
  cenas:[
    ['#Primeira parte: o poema-título (1 poema)'],
    ['“Nebulosas” (abre o livro, sozinho)','Nebulosas são nuvens de gás e poeira no espaço. A multidão vê nelas névoa, a ciência, estrelas, e o eu lírico vê “Alvos cisnes do mar da imensidade”, que o consolam da dor. No desânimo, sobe com elas à poesia: “Assim nasceram os meus tristes versos”, que fogem dos poderosos e voam “à luz da liberdade”.','Caiu na 2ª fase 2026 (Q1, com um texto do astrônomo Carl Sagan): nebulosas = cisnes (algo leve e delicado); olhar o cosmos = fugir do sofrimento.',1],
    ['#Segunda parte: dor, terra e pátria (27 poemas)'],
    ['A dor: “Desengano”','Ao pôr do sol, a voz sente a “lâmpada da vida” se apagar (lâmpada = vida), e a multidão passa fria pelo seu lamento. Adiante, “Consolação”, de outro poeta, Ezequiel Freire, responde a “Agonia”: é o único poema que não é de Narcisa.','Caiu na 1ª fase 2027 (Q57, com o pintor Van Gogh): o fim do dia espelha o fim da vida: a natureza é extensão do eu.',1],
    ['A voz feminina: “Invocação”','A voz queria voar até a pátria qual cisne ou condor (ave gigante dos Andes, símbolo da poesia social). Mas as asas são frágeis: quando tenta, o vento lhe atira “a frase – mulher!...”.','Ser mulher corta o voo de quem escreve.',0],
    ['A terra: “O Itatiaia” e “A Resende”','Diante do pico do Itatiaia, na serra entre Rio e Minas, que ela chama de “brasílio Himalaia” (o Himalaia do Brasil), quem sobe a serra esquece as amarguras. Em “A Resende”, cansada de andar pelo mundo, a voz volta à cidade onde cresceu e descansa a cabeça no seu colo.','Natureza = pátria e refúgio: é o nacionalismo da 1ª geração romântica, que exaltava a paisagem do Brasil para celebrar o país.',0],
    ['A pátria acorrentada: “Vinte e cinco de março”, “Sete de setembro”, “Miragem”','A voz amaldiçoa a Constituição de 1824, imposta por D. Pedro I depois de fechar a assembleia que a escrevia. Celebra a Independência, mas o país ainda não é livre. Em “Miragem”, mar, montanhas e aves são livres; só o homem beija o ferro que o prende.','A algema vale para as duas escravidões: a do povo submetido ao poder e a dos africanos. É poesia condoreira: a da 3ª geração romântica, de Castro Alves, que trata de causas sociais como a abolição.',0],
    ['“Pesadelo” (fecha a 2ª parte)','À noite, a voz lembra heróis da liberdade e saúda a Revolução Francesa de 1789 (liberdade, igualdade, “fraternidade”). Depois acusa a pátria de dormir “sempre escrava” enquanto morriam os que lutavam por liberdade, como Tiradentes, e profetiza a queda de “cetros e tronos”, isto é, da monarquia.','É o poema que defende a República. Em 2026, o item b) pediu um tema político ligado à irmandade (fraternidade) entre as pessoas: este poema é o melhor exemplo.',0],
    ['#Terceira parte: homenagens, abolição e o mundo (16 poemas)'],
    ['“Castro Alves” (abre a 3ª parte)','Lamento pela morte do poeta baiano Castro Alves (1871), o “condor brasíleo”, cantor dos escravos. Seguem homenagens ao compositor Carlos Gomes e a um padre.','Narcisa se apresenta como herdeira de Castro Alves: é a prova de que ela pertence à 3ª geração romântica, a da poesia social.',0],
    ['“O africano e o poeta” (3ª parte)','O escravizado conta que foi arrancado criança da família, cruzou o mar acorrentado, trabalhou com fome e foi castigado. Cada estrofe fecha com uma pergunta (quem pensa, quem vê?) e a mesma resposta: o poeta.','Só o poeta fica ao lado do cativo. A resposta oficial de 2026 pediu poemas de abolição.',1],
    ['“Os dois troféus” (fecha o livro)','Tradução livre de Victor Hugo. Em 1871, na revolta da Comuna de Paris, franceses lutaram entre si e derrubaram a coluna das vitórias de Napoleão. O poema diz que o povo nunca se curvaria ao inimigo, mas ele mesmo fez o que o inimigo exigiria.','Final irônico, não elogio: o povo que se dizia invencível destrói sozinho a própria glória.',0]
  ],
  pers:[
    ['O eu lírico feminino','<b>Antes:</b> melancólico, ferido, deseja a morte (“Desengano”). <b>Depois:</b> faz da dor poesia e da poesia missão pública (“Pesadelo”). Sabe que é mulher: em “Invocação”, a palavra “mulher” corta seu voo; em “Visão”, a Esperança, em forma de figura que desce à noite, beija sua “fronte de mulher” (fronte = testa).'],
    ['O poeta','Figura que volta em vários poemas: a testemunha que escuta os oprimidos e leva as dores da terra até o céu. Em “O africano e o poeta”, é a única resposta às perguntas do cativo.'],
    ['O africano','Fala em primeira pessoa: sequestro, travessia, trabalho e castigo. Representa o escravizado como sujeito que narra a própria dor.'],
    ['A pátria','O Brasil personificado: gigante que acorda acorrentado (“Sete de setembro”) e escrava que dorme sorrindo (“Pesadelo”). Representa um país que se separou de Portugal, mas continua sem liberdade.'],
    ['A multidão','Vê névoa onde a poeta vê cisnes e passa “soberba, muda, fria” diante do lamento: o mundo indiferente ao poeta.'],
    ['Heróis e mártires','Brasileiros que morreram ou sofreram lutando contra o poder: Tiradentes (Inconfidência Mineira, executado em 1792), Padre Roma (revolta de 1817 em Pernambuco), Nunes Machado e Pedro Ivo (Revolução Praieira, Pernambuco, 1848). O livro os opõe ao trono.'],
    ['O povo francês','Em “Os dois troféus”, derruba seus próprios monumentos numa guerra entre franceses: quando o povo se divide, a luta pela liberdade se volta contra ele mesmo.']
  ],
  ap:'<p><b>Contexto:</b> o livro sai em novembro de 1872, dois anos depois do Manifesto Republicano (1870), documento que pedia o fim da monarquia, e um ano depois da Lei do Ventre Livre (1871), que declarou livres os filhos de escravizadas nascidos dali em diante. São dados históricos: o livro não cita nenhum dos dois. Mas explicam por que uma estreante de 20 anos podia publicar um poema que manda o Brasil lançar ao pó “cetros e tronos”.</p>'+
    '<p><b>Uma rede de leituras:</b> quase todo poema traz no alto uma epígrafe, citação de outro autor (Gonçalves Dias, Álvares de Azevedo, Fagundes Varela, Castro Alves, Garrett, Victor Hugo, Lamartine, Byron, Goethe) e muitos têm dedicatória: à mãe, ao pai, a amigas, ao prefaciador. A poeta se apresenta como leitora que conversa de igual para igual com a tradição romântica.</p>'+
    '<p><b>Poemas secundários que podem cair:</b></p>'+
    '<p>• <b>“Lembras-te?” (2ª parte):</b> a amiga pergunta por que a voz contempla “as tênues nebulosas”; a resposta é que vê o Criador na natureza. Retoma o título do livro.</p>'+
    '<p>• <b>“Sadness” (3ª parte):</b> o título quer dizer tristeza, em inglês; o “anjo inspirador” da poeta “chama-se – Tristeza!”. Mostra que a dor é a fonte dos versos.</p>'+
    '<p>• <b>“O baile” (3ª parte):</b> sátira da festa elegante; a voz vê “As penas da mulher, dessa – ave de beleza –” pisadas sem piedade. Outra marca da condição feminina.</p>'+
    '<p>• <b>“A festa de S. João” (3ª parte):</b> lembrança de uma festa numa fazenda, com o canto dos escravos; o “anjo da liberdade” parte um grilhão, e a voz abençoa uma mão feminina. Parece uma alforria (libertação de escravizados), mas é interpretação.</p>',
  cx:[
    '<b>Opúsculo humanitário:</b> escravidão no Império. Nísia trata a ama escravizada pelos efeitos na menina livre, que chega a maltratá-la (art. XLII); Narcisa dá voz ao próprio cativo em “O africano e o poeta”.',
    '<b>Geografia:</b> natureza e eu. Em “Desengano”, o pôr do sol espelha a vida que se apaga: a natureza é extensão do eu; em “Poema”, Sophia faz o contrário: sua identidade é o mundo que ela vê.',
    '<b>Canção para ninar menino grande:</b> a testemunha. Em “O africano e o poeta”, só o poeta escuta e chora o cativo; em Evaristo, a narradora ouve Juventina e reconta a história de Fio Jasmim e das mulheres que ele marcou.',
    '<b>A visão das plantas:</b> a travessia. O africano de Narcisa cruza o mar “Em rígidos laços”; Celestino, o ex-capitão de navio negreiro de Djaimilia, sufocou com cal uma revolta no porão e, velho, revê os corpos.'
  ],
  aq:{p:'Em “Sete de setembro”, depois de celebrar a Independência, a voz avisa: “Mas não se cinge a escravidão à algema” (a escravidão não se limita à corrente); em “Vinte e cinco de março”, a Constituição outorgada é chamada de “Emblema de mesquinho cativeiro”. a) Explique os sentidos da palavra escravidão nesses versos. b) Mostre como o livro relaciona essa escravidão à escravidão dos africanos.',
    a:['A palavra é polissêmica: além do cativeiro real, escravidão = submissão política, pois o país livre de Portugal continua curvado a um poder imposto, e a Constituição de 1824 é uma algema.',
       'A mesma imagem passa da política para os africanos: em “Miragem”, os montes mandam o povo quebrar “as algemas de escravo”; em “O africano e o poeta”, o cativo conta a travessia acorrentado, o trabalho e o castigo.',
       'Assim, o livro une liberdade política e abolição: um Brasil que mantém escravos não é livre, e só a irmandade, defendida pelo poeta, completaria a Independência.']}
});

// Argumento, vozes e aprofundar do Opúsculo humanitário. Domínio público: citações curtas conferidas em textos/opusculo.txt.
Object.assign(BOOKS.find(b=>b.id==='opusculo'),{
  enT:'O argumento em 9 etapas',
  fio:'Não há história: são 62 artigos (capítulos curtos, numerados em algarismos romanos), escritos como um discurso. Nísia prova que a educação da mulher mede a civilização de um povo, examina o Brasil e termina repetindo o grito do começo.',
  cenas:[
    ['#Fora do Brasil: a prova (arts. I a XVI)'],
    ['O grito e a história (arts. I a V)','A autora clama “educai as mulheres!” e cobra o povo que se diz civilizado e o governo que se diz liberal (defensor da liberdade). Depois mostra povos antigos (Egito, Grécia, Roma) em que a mulher foi serva, e onde o progresso parou.','Metáfora-chave (art. V): o lugar da mulher = “o barômetro” (aparelho que mede a pressão do ar), ou seja, o medidor da civilização.',0],
    ['Os países modelo (arts. VI a XVI)','Alemanha, Inglaterra, França e Estados Unidos educam e respeitam a mulher. Nísia contesta dois filósofos franceses, Montesquieu e Rousseau, para quem a mulher existia para agradar ao homem, mas deixa a outros autores a defesa dos direitos das mulheres: sua tarefa, diz, é a educação (art. X).','Limite do feminismo de Nísia: educação, não voto. Portugal fica fora: é o antimodelo.',0],
    ['#No Brasil: o diagnóstico (arts. XVII a LXII)'],
    ['O recorte e a herança portuguesa (arts. XVII a XXVIII)','No art. XIX, Nísia diz de quem vai tratar: das mulheres livres e não indígenas. As indígenas ficam para o fim; as escravizadas não entram. Culpa Portugal, que via a mulher como “servente” da casa e trouxe a escravidão.','Caiu na 1ª fase 2027 (Q8): por essa escolha, o livro defende a educação de mulheres brancas e indígenas, sem ligá-la ao fim da escravidão.',1],
    ['O governo e os colégios (arts. XXIX a XXXVIII)','Colégios abertos só para dar lucro e os números de 1852: 8.443 meninas entre 55.500 alunos das escolas públicas. Quem acha que tudo vai bem confunde instrução (saber coisas) com educação (formar o caráter).','O dado mais fácil de citar numa resposta.',0],
    ['A casa: amas e escravidão (arts. XXXIX a XLIII)','Mães ricas entregam o filho a amas de leite escravizadas. Criada entre cativos, a menina aprende a mandar e chega a maltratar a ama que a amamentou, que depois é vendida “como um fardo inútil”.','Caiu na 1ª fase 2027 (Q10): a escravidão estraga a moral das crianças livres. Mas o texto também rebaixa os escravizados, com o preconceito da época (fala em “leite impuro”).',1],
    ['A educação de vitrine (arts. XLIV a XLIX)','Uma menina de 6 anos morre na escola, sufocada pelo espartilho (cinta apertada para afinar a cintura) (art. XLVI). A “boa educação” é só dança, piano e um pouco de francês (art. XLVII). Nísia pede às mães que ensinem os filhos a ver os escravizados como semelhantes (art. XLIX).','A aparência sacrifica a menina; compaixão cristã é o máximo que o livro oferece aos cativos.',0],
    ['Ricas, pobres e o clero (arts. L a LVII)','A rica depende das escravas para tudo. Para as pobres, Nísia propõe trabalho organizado pelo governo (uma “classe pública de operárias”) e espera um futuro de “braços livres”, isto é, sem escravidão. Por fim, critica os padres mal preparados.','É a divisão por classe social (ricas × pobres) que a Fuvest 2026 cobrou.',0],
    ['As indígenas (arts. LVIII a LXI)','“Primeiras vítimas” dos colonizadores, escravizadas por cristãos, as indígenas merecem educação moral e intelectual. Exemplos: Paraguaçu, indígena que foi esposa fiel do náufrago português apelidado Caramuru, e Moema, que se lançou ao mar atrás do navio do amado (talvez só uma personagem do poema épico <i>Caramuru</i>, de 1781).','Fuvest 2026: educação também para outras etnias, como os indígenas. Mas há hierarquia, uma escala de valor entre os povos: elas seriam “mais íntegras que as africanas”.',1],
    ['O fecho (art. LXII)','O Brasil tem terra mais rica que a dos Estados Unidos, mas falta a “mola principal”, a educação: “Educai para isto a mulher, e com ela marchai avante”.','O livro é circular: o grito do art. I vira a conclusão.',0]
  ],
  pers:[
    ['A autora-oradora (o “nós”)','Fala como um orador num palanque e usa “nós” em vez de “eu”, por modéstia, e chama a própria voz de “débil”, uma falsa modéstia para conquistar o leitor. Deixa escapar a experiência pessoal: as filhas, cenas vistas em Paris. O grito do art. I é o mesmo da conclusão.'],
    ['Os interlocutores','Povo, governo, pais e sobretudo as mães, chamados diretamente (“Povos do Brasil!”, “Mães brasileiras”): leitores e réus ao mesmo tempo.'],
    ['As mães','Decidem sozinhas a educação das filhas (são o “árbitro exclusivo”, art. XLVIII), mas sem preparo: não amamentam, apertam as filhas no espartilho, castigam escravos diante delas. São a causa do mal e a esperança do remédio.'],
    ['A menina brasileira','A menina livre e rica, criada para enfeitar salões. Casos-limite: a que morre no espartilho e a que maltrata a ama.'],
    ['As escravizadas (as amas)','Aparecem pelos efeitos na família livre. Nísia condena o cativeiro como “jugo anticristão”, mas chama os cativos de raça “desmoralizada pelo cativeiro” e não os inclui no projeto de escola.'],
    ['As indígenas','“Primeiras vítimas” da colonização, idealizadas (Paraguaçu, Moema): o único grupo não branco para o qual o livro pede educação.'],
    ['Modelos e adversários','A americana Harriet Stowe, autora do romance contra a escravidão <i>A cabana do Pai Tomás</i>, é o “mais perfeito modelo” de mulher; os filósofos Montesquieu e Rousseau são contestados; Portugal é o antimodelo.']
  ],
  ap:'<p><b>Contexto:</b> o livro sai em 1853, três anos depois da lei que proibiu o tráfico de africanos (Lei Eusébio de Queirós, 1850; dado histórico que o livro não cita), com a escravidão ainda legal e um Império que se dizia liberal. Nísia escreve depois de voltar da Europa e dedica o livro ao irmão, Joaquim Pinto Brasil. No art. LX, ela mesma lembra que a escravidão indígena foi abolida por decreto, mas a caça aos índios continuava.</p>'+
    '<p><b>Artigos secundários que valem ponto:</b></p>'+
    '<p>• <b>Ignorância e tirania (art. XXVI):</b> quanto mais ignorante um povo, mais fácil a um governo absoluto (sem limites, como o de um rei todo-poderoso) dominá-lo. Negar instrução à mulher prejudica a nação e o lar. Liga educação e política.</p>'+
    '<p>• <b>A alma não é enfeite (art. XXVII):</b> citando o filósofo grego Platão, a mulher é, como o homem, “uma alma servindo-se de um corpo”; dedicar esse corpo só a adornos é, para Nísia, uma profanação.</p>'+
    '<p>• <b>Casa ou colégio (arts. XXXIX e XL):</b> uma diretora limita o número de alunas para ensinar bem (o texto não diz que é a autora). Nísia prefere a educação pela mãe instruída; enquanto as mães não estão preparadas, recomenda colégio sério, também para a menina não ficar “tão em contato com os escravos”.</p>'+
    '<p>• <b>A esposa abandonada (art. LII):</b> filha de um homem importante da corte e mãe de cinco filhos, morre pobre, esquecida pelo marido e pelos filhos ricos. Lição: o casamento não garante a mulher.</p>'+
    '<p>• <b>“Todas as mulheres brasileiras” (art. LIV):</b> Nísia diz escrever em favor de todas e insiste nas pobres; mas, pelo art. XIX, “brasileiras” são as livres.</p>',

    '<b>Nebulosas:</b> a escravidão vista por duas autoras do Império. Nísia mostra a ama escravizada pelos efeitos na menina livre, que chega a maltratá-la (art. XLII); Narcisa dá a palavra ao próprio cativo em “O africano e o poeta”, e só o poeta o escuta.',

// Aprofundamento do módulo de figuras de linguagem (gerado pelo subagente aprofundador-figuras, 26/11/2026).
// Acrescenta seções a FIG_EXTRA, questões a FIGQ e flashcards a XCARDS (ver kit/d6.js).
// Respostas-modelo dos itens 2023–2026 calibradas pelas respostas oficiais da Fuvest (fontes na última seção e em saida/aprofundamento-figuras.md).

FIG_EXTRA += '<section class="card"><h2>Raio-X 2023: item por item</h2>'
+'<p>Todos os itens de 2023 a 2026 que cobraram recurso expressivo, com o mecanismo e uma resposta curta. As respostas condensam as <b>respostas oficiais da Fuvest</b> (em 2023, o documento se chama “Abordagens esperadas”). Leia um ano por dia.</p>'
+'<ul class="tight">'
+'<li><b>Q1a · Metáfora visual (anúncio do Greenpeace).</b> Uma árvore de raízes enormes e o texto que pede para preservar as raízes, “passado” e “esperança de futuro”. <i>Mecanismo:</i> a raiz, formada ao longo de anos, sustenta a árvore viva amanhã. <i>Resposta:</i> imagem e texto mostram que o passado (raiz) garante o futuro; preservar as raízes é preservar a vida da planta e a do leitor.</li>'
+'<li><b>Q1b · Ambiguidade (o possessivo “suas”).</b> <i>Mecanismo:</i> “suas raízes” pode ser da árvore ou do leitor. <i>Resposta oficial, resumida:</i> o anúncio pede que o leitor preserve a espécie humana e a natureza, porque uma depende da outra para sobreviver.</li>'
+'<li><b>Q2a · Ironia (“Ironicamente, ser artista é um ofício”).</b> <i>Mecanismo:</i> o texto pinta o artista como quase divino (pode declarar qualquer coisa arte, age como “deidade”), mas ele precisa conquistar seguidores, como qualquer profissional conquista clientes. <i>Resposta:</i> a ironia está em o “deus” da arte depender de trabalho e de convencer os outros, isto é, de um ofício.</li>'
+'<li><b>Q3a · Metáfora (“educação bancária”).</b> <i>Mecanismo:</i> transfere do banco para a escola a ideia de depósito: o professor “deposita” saber no aluno como dinheiro numa conta. <i>Resposta:</i> é o ensino que só transmite e desconsidera o que o aluno sabe; a banca acrescenta que a imagem critica o sistema econômico reproduzido na escola.</li>'
+'<li><b>Q3b · Anáfora (“já não”, cinco vezes).</b> <i>Resposta oficial, resumida:</i> cada “já não” abre uma oração que nega uma ação do educador bancário (depositar, domesticar, prescrever); a repetição enfatiza a superação dessa prática e marca a voz crítica do autor.</li>'
+'<li><b>Q4a · Ironia em charge (“Infográfico: desigualdade de renda no Brasil”).</b> <i>Mecanismo:</i> “infográfico” faz esperar gráficos e números; a charge mostra duas “barras”: uma pilha alta de dinheiro com um homem de charuto no topo e uma pilha baixa de caixas de papelão com um homem pobre, de short, triste. <i>Resposta:</i> o formato do infográfico é usado para uma crítica socioeconômica que os números sozinhos não fariam.</li>'
+'<li><b>Q4b · Símbolo e diálogo entre imagens (“frágil”).</b> <i>Mecanismo:</i> o símbolo de “frágil” impresso no papelão passa a valer para o homem pobre sobre as caixas. <i>Resposta:</i> ele é o objeto frágil, abandonado; o símbolo oficial de “Cuidado frágil” (duas mãos em concha protegendo a caixa) lembra o contrário: o que é frágil precisa ser cuidado.</li>'
+'<li><b>Q5b · Antítese (canção de Criolo).</b> A banca aceitou pares como saúde × doença, vida × morte, o eu que quer × o outro que sente, felicidade (amor) × dor. <i>Resposta:</i> ao contrapor ideias, a letra mostra que, para cada aspecto negativo, existe outro em oposição, e que as pessoas podem mudar: daí o título “Ainda há tempo”.</li>'
+'<li><b>Q6a · Comparação (“como num jogo de dominó”: tem o “como”).</b> <i>Mecanismo:</i> as peças só se encaixam pela ponta igual. <i>Resposta oficial, resumida:</i> a expressão tem sentido de elo: o prestígio de quem escreve a biografia passa ao biografado, à instituição (o IHGB) e à nação.</li>'
+'<li><b>Q7 · Apóstrofe e alegoria (soneto de Gregório de Matos).</b> O eu lírico fala diretamente a Deus e se apresenta como a “ovelha desgarrada” da parábola bíblica. <i>Resposta:</i> há um falso rebaixamento: o pecador se humilha, mas argumenta que, se Deus não o salvar, perde a própria glória de bom pastor.</li>'
+'<li><b>Q8a · Gradação causal com anadiplose (<i>Romanceiro da Inconfidência</i>).</b> Na sequência ambição → injustiça → covardia, a palavra que fecha um verso abre o seguinte, e o verbo do primeiro fica subentendido no segundo (zeugma). <i>Resposta oficial, resumida:</i> são os três passos da morte de Tiradentes: a causa (a ambição ligada ao ouro), o falso julgamento (injustiça oficial) e a paralisia das testemunhas pelo medo (covardia cúmplice).</li>'
+'<li><b>Q10b · Intertextualidade e ironia (Drummond × “Canção do exílio”).</b> <i>Resposta:</i> Gonçalves Dias exalta o “lá” da pátria em tom saudoso; Drummond, sem sair do Brasil, sonha com a Europa, enjoa dela e procura a “Canção do exílio” que já nem lembra: ironiza o exotismo e a nostalgia, num exílio “sem sair do lugar”.</li>'
+'</ul></section>';

FIG_EXTRA += '<section class="card"><h2>Raio-X 2024: item por item</h2><ul class="tight">'
+'<li><b>Q2a · Expressão (“olhos de ver”).</b> <i>Mecanismo:</i> redundância intencional (olhos servem para ver), que reativa o sentido forte de ver = compreender; pode-se chamar de pleonasmo expressivo, mas a banca não exigiu o nome. <i>Resposta oficial, resumida:</i> é ver além do ato físico, buscar e fabricar sentidos, analisar criticamente o que circula na internet; em tempos de desinformação, é o filtro contra notícias falsas e manipulação.</li>'
+'<li><b>Q3a · Formação de palavras (“humanidade” e “sub-humanidade”, Krenak).</b> <i>Mecanismo:</i> humano + sufixo -idade; prefixo sub- (inferioridade). <i>Resposta oficial, resumida:</i> “humanidade” vira, no texto, uma casta fechada que se protege; “sub-humanidade” são os que ficam fora dela, explorados e sem proteção.</li>'
+'<li><b>Q5b · Repetição com dois sentidos (“os objetos não são simplesmente objetos”).</b> <i>Mecanismo:</i> a mesma palavra aparece como coisa de museu e como algo que vai além disso (o manto “fala” com Glicéria, uma prosopopeia). <i>Resposta oficial, resumida:</i> o manto não é item de coleção, mas artefato que permite relação com o sagrado, a ancestralidade e a visão de mundo indígena.</li>'
+'<li><b>Q6 · Gradação e polissemia (charge de Alberto Benett).</b> As palavras rotulam as etapas de um único tiro: o policial é a “acusação”, a arma, o “julgamento”, a bala, a “condenação”, o impacto, a “execução”. <i>Resposta oficial, resumida:</i> a charge critica o abuso de poder que mata civis, pois o mesmo agente acusa, julga, condena e mata; “execução” significa ao mesmo tempo cumprir uma sentença e matar sumariamente.</li>'
+'<li><b>Q7a · Intertextualidade e paradoxo (Drummond × Caetano).</b> O anjo de Drummond manda o poeta ser <i>gauche</i>; a canção recria o imperativo como um conselho de ser “virtuoso no vício”. <i>Resposta oficial, resumida:</i> em Drummond, o imperativo é um destino de exclusão; em Caetano, é um apelo de propaganda da indústria tecnológica, que inclui o indivíduo na massa consumidora e esconde um paradoxo: o excesso toma o lugar do equilíbrio.</li>'
+'<li><b>Q7b · Símbolo (o azul).</b> <i>Resposta oficial, resumida:</i> em Drummond, a tarde azul é imagem celeste de serenidade e repouso, nublada pelos desejos; em Caetano, o azul das telas é artificial, multiplicado (“mais que azuis”), ilusão de infinito.</li>'
+'<li><b>Q8b · A figura como ferramenta de análise (<i>Quincas Borba</i>).</b> A própria resposta oficial chama Rubião de “uma espécie de metonímia”: em escala reduzida, ele reflete a ambição nacional de imitar os costumes do centro, por isso sua loucura tem um lado de sátira e outro de tragédia.</li>'
+'<li><b>Q10b · Personificação e antítese (Lira X, de Gonzaga).</b> <i>Resposta oficial, resumida:</i> o Amor aparece como personagem, o Cupido da mitologia, descrito de modo contraditório: belo, menino, mas armado de setas que ferem e vencem todos.</li>'
+'</ul></section>';

FIG_EXTRA += '<section class="card"><h2>Raio-X 2025: item por item</h2><ul class="tight">'
+'<li><b>Q1a · Antítese com o <i>locus amoenus</i> (<i>Romanceiro</i>, “Das ideias”).</b> <i>Mecanismo:</i> à vastidão dos campos e à “muralha das serras” se opõem os rios “virados” e a terra “revirada” pela mineração; as “doces invenções da Arcádia” convivem com ameaças de impostos. <i>Resposta:</i> o cenário de Vila Rica é o oposto do lugar ameno e tranquilo da poesia árcade.</li>'
+'<li><b>Q1b · Refrão (“E as ideias”).</b> <i>Resposta oficial, resumida:</i> funciona como estribilho que rompe a medida dos versos e reforça o caráter subversivo das ideias que anunciam a Inconfidência, o processo e a morte de Tiradentes (e remetem ao Iluminismo, à independência dos EUA e à Revolução Francesa).</li>'
+'<li><b>Q2 · Metáfora invertida (<i>Água funda</i>).</b> No trecho, Sinhá é “a borboleta que virou lagarta”. <i>Resposta oficial, resumida:</i> há paralelismo “de sentido, mas não de direção”: a fazenda progride (engenho vira usina) enquanto a dona degenera (vira mendiga).</li>'
+'<li><b>Q6b · Inversão sintática (“Irá mal, de fato, o vernáculo no Brasil?”).</b> <i>Resposta oficial, resumida:</i> ao começar pelo predicado, a autora inverte a ordem sujeito + predicado para chamar a atenção para a dúvida sobre a afirmação anterior e refutá-la por meio de uma pergunta.</li>'
+'<li><b>Q7a · Ironia de situação (tirinha sobre inteligência artificial).</b> <i>Resposta oficial, resumida:</i> o jovem que se formou usando IA não consegue emprego porque um robô ocupa a vaga; rompe-se a expectativa do recém-formado, e a tira critica a formação superficial e a substituição de pessoas por máquinas.</li>'
+'<li><b>Q8a · Personificação e metáfora (“a bola beija a trave”, “morrer na bochecha da rede”).</b> <i>Resposta oficial, resumida:</i> a bola ganha ações humanas (beijar, morrer); beijar = encostar levemente, morrer = parar, bochecha = lateral da rede; a banca aceitou também catacrese em “bochecha da rede”.</li>'
+'<li><b>Q8b · Neologismo por sufixação (“volância”, “centroavância”).</b> <i>Resposta oficial:</i> o sufixo de agente -nte (volante, centroavante) é trocado por -ância, que indica estado ou qualidade duradouros.</li>'

+'</ul></section>';

FIG_EXTRA += '<section class="card"><h2>Treino 1: polissemia e ambiguidade</h2>'
+'<p><b>Reconheça.</b> <b>Polissemia:</b> uma palavra com dois sentidos ativados ao mesmo tempo (“destino”, “execução”). <b>Ambiguidade:</b> o enunciado inteiro admite duas leituras, quase sempre por causa de um pronome, de um possessivo ou da ordem das palavras (“Preserve suas raízes”).</p>'
+'<p><b>Teste.</b> Reescreva a frase duas vezes, uma para cada sentido. Se as duas leituras cabem no contexto e enriquecem o texto, é recurso expressivo; se uma atrapalha, é ambiguidade de descuido (“O médico falou com o paciente sobre sua doença”).</p>'
+'<p><b>Frase-modelo.</b> “A palavra X tem dois sentidos: (1) ... e (2) ...; o elemento Y ativa o segundo, e o efeito é ...”.</p>'
+'<p><b>Treino</b> (responda antes de ler a seta):</p><ul class="tight">'
+'<li>Campanha de doação de órgãos: “Doe de coração.” → <i>polissemia: com sinceridade (sentido fixo) e o órgão coração (literal).</i></li>'
+'<li>Manchete: “Time perde a cabeça e o jogo.” → <i>um só verbo com dois sentidos: perder a cabeça (descontrolar-se) e perder o jogo (literal); humor pela economia.</i></li>'
+'<li>Cartaz de academia: “Aqui você perde peso e ganha fôlego.” → <i>sem duplo sentido: é antítese (perder × ganhar), não polissemia. Cuidado para não forçar.</i></li>'
+'<li><i>Caminho de pedras</i>: “companheiro” é camarada, marido, amante e, na última fala, o bebê. → <i>polissemia que funde política, amor e maternidade.</i></li>'
+'<li><i>A visão das plantas</i>: o título. → <i>o olhar das plantas sobre Celestino e o espetáculo das plantas visto pelos outros.</i></li>'
+'</ul></section>';

FIG_EXTRA += '<section class="card"><h2>Treino 2: ironia (inclusive em charges)</h2>'
+'<p><b>Reconheça.</b> O enunciado diz uma coisa e o contexto, ou a imagem, mostra o contrário. Há três tipos que caem: <b>verbal</b> (elogio que é crítica), <b>de situação</b> (o resultado contraria a expectativa, como o formado com IA que perde a vaga para um robô) e <b>entre imagem e palavra</b> (o rótulo diz A, a cena mostra não-A).</p>'
+'<div class="note mn"><span class="lab">Fórmula para charge</span><p>“A palavra X faz esperar Y; a imagem mostra Z; o choque entre as duas critica W.”</p></div>'
+'<p><b>Treino:</b></p><ul class="tight">'
+'<li>Charge: rua alagada, pessoas de canoa, e uma placa da prefeitura: “Obra concluída: drenagem 100%”. → <i>ironia entre placa e cena; critica a propaganda oficial que anuncia o que não funciona.</i></li>'
+'<li>“Que pontualidade: o ônibus das 7h chegou às 9h.” → <i>ironia verbal: o elogio é crítica.</i></li>'
+'<li><i>Nebulosas</i>, “Miragem”: o homem, chamado “rei da natureza”, beija o ferro que lhe esmaga o pulso. → <i>ironia: o “rei” é escravo; a natureza livre denuncia a servidão humana.</i></li>'
+'<li><i>Memórias de Martha</i>, cap. IX: Clara, cheia de joias, olha Martha com a doçura dos “vencidos bons” diante dos “vencedores da vida”. → <i>inversão irônica: a rica é a vencida; a pobre que estudou, a vencedora.</i></li>'
+'<li><i>A visão das plantas</i>: as plantas, “alforriadas”, tomariam a casa se Celestino morresse. → <i>o vocabulário da escravidão aplicado ao jardim inverte os papéis do traficante.</i></li>'
+'</ul></section>';

FIG_EXTRA += '<section class="card"><h2>Treino 3: metáfora, metonímia ou prosopopeia?</h2>'
+'<p><b>Teste em uma pergunta:</b> a relação entre os dois termos existe na realidade?</p><ul class="tight">'
+'<li><b>Sim, por proximidade</b> (lugar e quem está nele, roupa e quem a usa, parte e todo, instrumento e quem o usa, marca e produto, autor e obra) → <b>metonímia</b>.</li>'

FIG_EXTRA += '<section class="card"><h2>Treino 4: antítese ou paradoxo?</h2>'
+'<p><b>Teste.</b> Os opostos podem ser verdadeiros em seres ou momentos diferentes? <b>Antítese.</b> São afirmados do mesmo ser, ao mesmo tempo, contra a lógica? <b>Paradoxo.</b> Quando cabe em duas palavras (adjetivo + substantivo), chame de <b>oxímoro</b>.</p>'

+'<li><i>Geografia</i>, “Procelária”: a ave faz da insegurança a sua força. → <i>paradoxo: a ética de quem canta no mau tempo da ditadura.</i></li>'

FIG_EXTRA += '<section class="card"><h2>Treino 5: gradação (e o que não é gradação)</h2>'
+'<p><b>Reconheça.</b> Termos em degraus, do menor ao maior (clímax) ou do maior ao menor (anticlímax). Se os termos apenas se somam, sem intensificar, é <b>enumeração</b> (acumulação). As duas costumam vir com <b>assíndeto</b> (sem “e”).</p>'
+'<p><b>Frase-modelo.</b> “Gradação crescente: de X a Z; a intensificação mostra ...”.</p>'
+'<p><b>Treino:</b></p><ul class="tight">'
+'<li>“Primeiro, ignoraram; depois, riram; por fim, perseguiram.” → <i>gradação crescente da reação.</i></li>'
+'<li><i>Romanceiro</i> (2023): ambição → injustiça → covardia. → <i>gradação causal: cada termo produz o seguinte.</i></li>'
+'<li><i>Balada de amor ao vento</i>, cap. 3: Sarnau aceita ser segunda, terceira, décima primeira, centésima primeira esposa. → <i>gradação que termina em hipérbole.</i></li>'
+'<li><i>A visão das plantas</i>: na queima das roupas, a lista de vestidos, lençóis, toalhas, cueiros, xailes. → <i>enumeração, não gradação: o acúmulo mede o trabalho das mulheres apagado no fogo (caiu na 1ª fase de 2027).</i></li>'
+'<li><i>A visão das plantas</i>, perto do fim: Celestino desce mais cego, mais velho, mais tonto, mais morto. → <i>gradação: o último degrau rompe a lógica (a morte não tem grau).</i></li>'
+'<li><i>Memórias de Martha</i>, cap. I: as crianças a chamam de lesma, mole, palerma. → <i>enumeração de insultos em exclamação: o coro que exclui a menina tímida.</i></li>'
+'</ul></section>';

FIG_EXTRA += '<section class="card"><h2>Treino 6: repetições que caem</h2><ul class="tight">'
+'<li><b>Anáfora:</b> repetição no início de versos ou frases (“já não”, Freire; “Quereis ver...”, <i>Opúsculo</i>, art. LIX).</li>'

+'<li><b>Quiasmo:</b> repetição cruzada, AB / BA (“Se beber, não dirija; se dirigir, não beba”).</li></ul>'
+'<div class="note mn"><span class="lab">Como dizer a função</span><p>Não basta “dá ênfase”. Escolha: insistência de uma ideia, ritmo de oração ou ladainha, oralidade, obsessão ou luto, acúmulo de provas, encadeamento de causa e efeito. E diga em quê.</p></div>'

FIG_EXTRA += '<section class="card"><h2>Treino 7: inversão sintática (hipérbato)</h2>'
+'<p><b>Método em 3 passos.</b> 1. Reescreva na ordem direta (sujeito + verbo + complementos). 2. Diga qual termo foi antecipado. 3. Diga o efeito: destaque, dúvida, solenidade, ritmo ou rima.</p>'

FIG_EXTRA += '<section class="card"><h2>Treino 8: expressões idiomáticas</h2>'

FIG_EXTRA += '<section class="card"><h2>Treino 9: neologismos e formação de palavras</h2>'
+'<p><b>Método.</b> 1. Separe radical e afixos. 2. Nomeie o processo: derivação prefixal ou sufixal, composição (justaposição ou aglutinação), troca de sufixo, cruzamento de palavras (palavra-valise). 3. Dê o sentido do afixo. 4. Diga o efeito (humor, crítica, precisão poética).</p>'

+'<p><b>Treino:</b></p><ul class="tight">'
+'<li>“volância”, “centroavância” (2025) → <i>-nte trocado por -ância: a função vira qualidade duradoura; humor.</i></li>'

+'<li>“necropolítica” (2025) → <i>necro- + política: política da morte.</i></li>'
+'<li>“notificacite” → <i>notificação + -ite: o hábito de checar o celular tratado como doença.</i></li>'
+'<li><i>Canção para ninar menino grande</i>: “escrevivência”, “desmemória”, “dessentidos” → <i>escrever + vivência, por cruzamento; des- + memória, des- + sentidos: o avesso da lembrança e do sentido.</i></li>'
+'</ul></section>';

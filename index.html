perto:[
['1. A dupla traição e a missão de escutar (Introdução)','<p><b>O que acontece.</b> A narradora diz que pedaços do relato se perdem: contar já trai o vivido, e recontar o que se ouviu pode trair duas vezes. Por isso voltou a Juventina e trouxe as histórias que faltavam na 1ª edição: <b>Aurora, Antonieta, Dolores e Dalva</b>. Tina a acusa de escuta distraída; ela aceita a dúvida, mas insiste que estava inteira. Lamenta que a letra não pegue o corpo (gestos, choro, riso, silêncios). Diz que vigia sem descanso e capta vidas como testemunha. Admite que talvez tenha sido uma das mulheres de Fio, e que ele pode ser o pai que lhe faltou.</p><p><b>Como está escrito.</b> 1ª pessoa que fala com o leitor; <b>metaficção</b>; <b>gradação</b> de perdas (contar, recontar, escrever); série de negações (<b>anáfora</b>) que mostra vigilância; a história como tecido e como “fios”, o que ecoa o nome Fio.</p><p><b>O que significa.</b> A memória é <b>missão</b>, não tormento: a narradora se obriga a recolher vozes de mulheres, sabendo que a escrita sempre perde algo.</p><p><b>Como cairia.</b> Já caiu (2026, com <i>As meninas</i>). Variações: explicar a “dupla traição”; escrevivência e testemunho; comparar com Martha ou Sarnau.</p>'],
['2. A dor no peito e a canção (cap. 1)','<p><b>O que acontece.</b> Na roda de amigas, Juventina quase cai. As amigas a testam: braços para o alto, andar em linha reta, andar de costas, cantar. Ela canta a canção do título e se recompõe. Mais tarde a narradora entende: era dor de amor. Agora ela é Juventina; a apaixonada era a Tina de antes. Corte para Fio em casa, amassando mais uma carta de Tina, que ele costuma deixar à vista da esposa.</p><p><b>Como está escrito.</b> 1ª pessoa do plural (“nós”, as amigas); <b>comparações</b> (dançar sobre um rio, ímã que puxa para o passado); <b>hipérbole</b> na voz que faz dormir e acordar a natureza.</p><p><b>O que significa.</b> O livro começa e termina com o <b>corpo</b> de Tina: a história é verdadeira porque passou por um corpo. A roda (a “confraria”) é o espaço de cuidado.</p><p><b>Como cairia.</b> Moldura narrativa; oralidade e corpo; por que a narradora acredita no relato (ligar ao posfácio).</p>'],
['3. Os pés de Neide e a Cinderela negra (cap. 2)','<p><b>O que acontece.</b> Em Vale dos Laranjais, na festa da colheita, cada família escolhe um jovem para receber os maquinistas. Neide é a escolhida. Fio, quase com 20 anos e noivo de Pérola, fixa-se nos pés dela e esquece de dar um passo. Lembra que, aos 8 anos, a professora Dona Celeste escolheu um menino loiro para ser o príncipe da Cinderela. Agora ele seria o <b>Príncipe Negro</b> e teria tantas mulheres quanto o colega branco. No começo, calcula cada gesto para agradar a cidade. Neide namora Fio nas voltas do trem e, na última, <b>pede a ele um filho</b>, sem querer ser esposa de ninguém; o menino leva só o nome da mãe.</p><p><b>Como está escrito.</b> <b>Intertextualidade</b> com o conto de fadas, invertido (Cinderela negra, trem-carruagem); <b>sinestesia</b> nas laranjas; discurso indireto livre no pensamento de Fio.</p><p><b>O que significa.</b> Cena-chave da <b>dupla consciência</b> (Du Bois, 1ª fase 2027): a ferida racial da infância vira compensação pela virilidade, e Fio encena uma imagem para ser aceito. Neide decide sobre o próprio corpo e a maternidade.</p><p><b>Como cairia.</b> Masculinidade negra e racismo; Fio como produto de uma educação; autonomia de Neide.</p>'],
['4. A malhação do Judas e o falso noivo (cap. 2, Angelina)','<p><b>O que acontece.</b> Angelina, enfermeira e primeira da família com curso superior, criou as irmãs depois que a mãe se matou. Toda a cidade de <b>Alma das Flores</b> esperava o noivo dela. No sábado de véspera de Páscoa, enquanto meninos malham o Judas perto da estação, o trem chega. Fio sorri com a brincadeira e pensa que traidores devem ser punidos. Um menino pergunta se ele vai casar; ele diz que sim (pensando em Pérola), e a cidade o toma pelo noivo. Os maquinistas mandam ele entrar no jogo. Ele passa uns dias com Angelina e parte rindo. Ao descobrir a farsa, <b>ela se joga de uma ribanceira</b>.</p><p><b>Como está escrito.</b> <b>Ironia dramática</b> (o homem que condena traidores é o traidor); intertexto bíblico (Páscoa, Judas, ceia com fel, morte antes dos 33 anos); nomes alegóricos (Devaneia, Monte Vazio).</p><p><b>O que significa.</b> O lúdico da malhação (questão 76 da 1ª fase 2027) contrasta com o jogo cruel dos homens, que custa uma vida.</p><p><b>Como cairia.</b> Identificar a ironia; o lúdico; os maquinistas como escola de machismo.</p>'],
['5. Aurora no rio Naipã (cap. 3)','<p><b>O que acontece.</b> Aurora, de Vila Azul, chamada de sem juízo, apanha da família por banhar-se nua no rio. Homens a seguem e se desfazem olhando; mulheres olham em silêncio. A tia Prudência pergunta por que só a menina é culpada e lhe ensina a se defender; Aurora fere um homem que entra no rio sem convite. Fio, ela convida. No rio, cada um sente na cabeça do outro a <b>moleira aberta</b>: ambos sem juízo. Fio perde a hora e o trem atrasa um dia, a única falha da carreira dele.</p><p><b>Como está escrito.</b> <b>Antítese</b> ferro × água (os “homens de ferro” viram água); perguntas retóricas sobre quem é o espetáculo; <b>prosopopeia</b> (o rio em festa, as águas que silenciam); a expressão popular “moleira aberta”.</p><p><b>O que significa.</b> O olhar é invertido: os homens viram espetáculo. A liberdade de Aurora é protegida pelo consentimento. A falta de juízo do homem é desculpada; a da mulher, castigada.</p><p><b>Como cairia.</b> Corpo feminino e olhar masculino; dupla moral; antítese.</p>'],
['6. Dolores: a foto e a arma no rio (cap. 5)','<p><b>O que acontece.</b> Dolores, herdeira de joias, sabe ver o valor de uma pedra bruta, mas não a sinceridade dos homens. Fio, já casado, diz que o anel é para a “irmã” Pérola Maria. Ela engravida de gêmeas, Rubia e Safira; escreve à companhia e não tem resposta. Recebe, anônima, uma foto de Pérola, Fio e seis filhos. Vem o <b>ódio</b> e o plano de matar a família. Mas, olhando a foto, vê no lugar de Pérola os rostos de muitas mulheres (avó, mãe, vizinhas, mães sozinhas) e entende que matar aquela mulher seria matar a si mesma. Joga a arma no rio e decide apresentar as filhas ao pai e aos irmãos.</p><p><b>Como está escrito.</b> <b>Metáfora</b> das pedras (rubis e safiras = flores que brotam da terra; Pérola × pedras brutas); <b>enumeração</b> de mulheres com antíteses; a palavra ódio em maiúsculas.</p><p><b>O que significa.</b> É a cena da <b>irmandade</b> (resposta oficial de 2026): a rival vira semelhante. Também mostra a paternidade ausente em série (o pai de Dolores, o próprio Fio).</p><p><b>Como cairia.</b> Transformação de personagem; irmandade; contraste com a rivalidade entre esposas em <i>Balada</i>.</p>'],
['7. Dalva Ruiva: o príncipe negro nos filhos (cap. 6)','<p><b>O que acontece.</b> Fio cai na linha num temporal em Águas Infindas, bate a cabeça e não guarda lembrança de Dalva, que o visitou no hospital. Dalva, filha da roça, casou aos 16; o marido virou médico e desfez o combinado de ela estudar. Ela sai de casa com os filhos, paga os estudos atendendo clientes ricos e vira farmacêutica. Tem três filhos com Fio, por escolha. Quando conta o primeiro, ele pergunta como ela sabe que é dele. Antes de mudar para o Nordeste, visita Pérola como comadre.</p><p><b>Como está escrito.</b> Ironia na festa em que elogiam as mulheres por “fazer do rapaz um homem”; enumeração de profissões que vendem algo do corpo, que tira o trabalho de Dalva da moral; contraste entre os boatos e a versão da narradora.</p><p><b>O que significa.</b> Dalva é <b>branca</b> e quer que os filhos herdem a negritude de Fio: vê nele o príncipe negro que a professora negou ao menino. Inverte a ideologia do branqueamento. Atenção: nem todas as mulheres de Fio são negras.</p><p><b>Como cairia.</b> Raça e desejo; autonomia e trabalho; paternidade irresponsável.</p>'],
['8. A Virgem de Ébano e o pai de bicicleta (caps. 7 a 9)','<p><b>O que acontece.</b> Tina, aos 17, cruza com Fio (33) e sente no rosto o ardor de um tapa que não houve; ele vê dor no rosto dela. A mãe de Tina dizia que os homens são <b>“meninos grandes”</b>, agarrados às saias das mulheres. Fio, educado pelo pai para ter várias mulheres e casar com uma, inventa com Tina um jogo de carícias sem penetração, dizendo respeitar a virgindade dela; com Pérola, chega ao fim do jogo. Tina acredita no sacrifício dele. Na infância dela, um homem sujo de tinta, de bicicleta, diz ser o pai, culpa a mãe e abre a camisa; ela sente nojo e apaga a lembrança.</p><p><b>Como está escrito.</b> O apelido “Virgem de Ébano” (<b>metáfora</b> que santifica e controla); <b>antítese</b> Tina passiva × Pérola voraz; repetições obsessivas (amou sozinha); falas de Tina entre aspas, marca de oralidade.</p><p><b>O que significa.</b> O título nasce aqui. O “respeito” de Fio é controle: ele define as regras. O pai ausente liga Tina, Dolores, a narradora e o próprio Fio.</p><p><b>Como cairia.</b> Sentido do título; masculinidade aprendida; ausência paterna.</p>'],
['9. Eleonora no bar: o choro do menino grande (caps. 10 a 13 e 16)','<p><b>O que acontece.</b> Eleonora, expulsa de casa aos 17 por beijar uma moça, perde por causa de um acidente no trânsito o reencontro com Nina, o amor da juventude. Bebe sozinha. Fio chega para seduzir, mas se sente só e quer amparo. Derruba as garrafas, os dois riem, e ele cai num <b>choro profundo</b> que não sabe explicar. Dormem lado a lado, sem sexo. Ele, que aprendeu desde menino a engolir o choro (só a raiva era permitida), descobre que um homem pode chorar e que duas mulheres podem se amar. Pela primeira vez, pergunta se as mulheres que passaram por ele foram felizes.</p><p><b>Como está escrito.</b> <b>Prosopopeia</b> (garrafas que gargalham); <b>antítese</b> riso × pranto; série de perguntas retóricas em que cada mulher é lembrada por uma <b>perífrase</b> (a moça dos pés livres, a das joias, a do rio).</p><p><b>O que significa.</b> Centro da leitura de Du Bois e da <b>repressão dos sentimentos</b>: a virilidade é armadura sobre um vazio. Quem o acolhe é uma mulher que ele nunca cortejou. Eleonora também leva as histórias de Fio a Tina.</p><p><b>Como cairia.</b> Transformação de Fio; “ninar” como acolher o choro; masculinidade e preconceito.</p>'],
['10. Tina parte, a partitura fica (caps. 14 a 16 e posfácio)','<p><b>O que acontece.</b> Depois de 35 anos, já aposentada, Tina (professora de música e compositora) deixa Fio para entender o próprio amor: vai ouvir outras mulheres e compor uma grande ária. Fio percebe que nunca deu nada a ela, que ela se fez livre e que ele, viajante por profissão, ficou para trás. Ele guarda a partitura na caixa da camisa “volta-ao-mundo” do pai. A narradora e Eleonora seguem Tina; um encantamento surge entre as duas. No posfácio, a narradora diz que ficção e verdade têm a mesma medida e que a canção também é dela.</p><p><b>Como está escrito.</b> <b>Símbolo</b>: a caixa da vaidade masculina passa a guardar a obra de uma mulher; <b>antítese</b> o viajante que fica × a mulher que parte; neologismos no posfácio (o escutar-vendo).</p><p><b>O que significa.</b> A canção de ninar vira <b>arte coletiva</b>. O “menino grande” é ninado, mas quem cresce são as mulheres.</p><p><b>Como cairia.</b> Desfecho; título; metaficção; irmandade.</p>']
],
critica:'<p><b>A autora e a escrevivência.</b> Conceição Evaristo (Belo Horizonte, 1946) estreou nos <i>Cadernos Negros</i> (1990), ganhou o Jabuti com <i>Olhos d’água</i> (2015) e assumiu em 2022 a Cátedra Olavo Setúbal da USP. No próprio livro, a dedicatória define escrevivência como o embaralhar de vivência e criação, e os agradecimentos dizem que ela não se esgota na experiência pessoal: mistura-se às vivências de outras mulheres. Segundo reportagem, o termo surgiu em 1995, num seminário sobre mulher e literatura na UFRJ.</p><p><b>Ninar ou acordar?</b> Em fala muito citada, Evaristo diz que a escrevivência das mulheres negras não serve para adormecer os da casa-grande, e sim para acordá-los de seus sonos injustos. A frase ilumina o título: o livro tem forma de canção de ninar, mas o efeito é despertar.</p><p><b>As edições.</b> 1ª edição em 2018; 2ª (Pallas, 2022), ampliada com Aurora, Antonieta, Dolores e Dalva, como diz a introdução. A capa da 2ª edição reproduz <i>Desdobramentos sobre sankofa</i> (2021), de Antônio Obá. <b>Sankofa</b> é um símbolo adinkra (povo Akan): um pássaro com a cabeça voltada para trás, traduzido como “voltar e pegar”; é o gesto da narradora que volta ao relato para buscar o que faltava.</p><p><b>Crítica acadêmica</b> (li títulos e resumos):</p><ul><li>Nismária Alves David e Jane Adriane Gandra, <i>Diadorim</i> (UFRJ), 2024: Fio como personagem moldado pela colonialidade do poder, do saber, do ser e do gênero.</li><li>Crislayde Maria de Sousa e Algemira de Macedo Mendes, <i>Revista Moara</i> (UFPA), 2024: a masculinidade de Fio como <b>performance</b> de sedução.</li><li>Luana Gabriela Paslawski e Maria Mirtis Caser, <i>Palimpsesto</i> (UERJ), 2025: gênero, classe e raça impedem os homens negros de exercer plenamente a masculinidade patriarcal.</li><li>Wanderson Barbosa dos Santos, <i>Missangas</i> (UNEB): a formação da masculinidade negra (a criança, o maquinista, o homem).</li></ul><p><b>Como a Fuvest leu.</b> 2026: memória como <b>missão</b>, narradora testemunha ativa, <b>irmandade</b> das mulheres que amaram o mesmo homem. 1ª fase 2027: <b>Du Bois</b> e a dupla consciência (Fio ajusta sua atuação como homem e como negro ao olhar dos estereótipos e reprime os sentimentos); e a malhação do Judas em Alma das Flores, comparada à dança em <i>Balada</i> (o lúdico). Para a 2ª fase, junte: educação masculina (pai e maquinistas), ferida racial (o príncipe negado na escola) e repressão do choro (desfeita por Eleonora).</p><p><b>Escola.</b> Literatura contemporânea afro-brasileira. <b>Confirma:</b> novas vozes, memória e testemunho, metaficção, mosaico, oralidade. <b>Rompe:</b> com o romance de amor (o príncipe é desmontado e o casal final dá lugar à irmandade), com o determinismo realista (Fio muda; as mulheres escolhem) e com a representação do corpo negro como objeto.</p>',
qbank:[
{p:'(Texto externo) W. E. B. Du Bois, em <i>As almas do povo negro</i> (1903), descreve a “dupla consciência”: a pessoa negra se vê por si e pelo olhar de uma sociedade racista, por trás de um “véu” de estereótipos. a) Que episódio da infância de Fio Jasmim mostra esse olhar de fora, e como ele reaparece em Vale dos Laranjais? b) Mostre como a virilidade de Fio funciona como “véu” e quando ela se rompe.',a:['Fio carrega a ferida de ter sido preterido, por ser negro, no papel de príncipe, e responde a ela encenando uma virilidade conquistadora.','Aos oito anos, a professora escolheu um menino loiro para ser o príncipe da Cinderela; em Vale dos Laranjais, ele calcula os gestos para agradar e se imagina o Príncipe Negro, igual ao homem branco no número de mulheres. Essa armadura, ensinada pelo pai e pelos maquinistas (homem não chora), só se rompe no bar com Eleonora, quando ele cai num choro que não sabe explicar.','A virilidade é o “véu” que Fio veste para ser aceito; Eleonora, a mulher que ele não corteja, permite que ele se veja por dentro, além do estereótipo.']},
{p:'(Texto externo e figura) Em fala muito citada, Conceição Evaristo diz que a escrevivência das mulheres negras não foi feita para adormecer os da casa-grande, mas para acordá-los de seus sonos injustos. a) Explique a metáfora do “ninar” nessa fala e no título do romance. b) O livro “nina” ou “acorda” Fio Jasmim? Justifique com o desfecho.',a:['“Ninar” é metáfora de acalmar e fazer dormir quem tem poder; no título, uma canção de ninar para um homem adulto ironiza a infantilidade dele.','A mãe de Tina dizia que os homens são meninos grandes agarrados às saias das mulheres, e Tina compõe a canção quando Fio some por meses; mas, no fim, Fio chora com Eleonora, pergunta se as mulheres que teve foram felizes e percebe, quando Tina parte, que ela se fez livre e ele ficou para trás.','A forma é de canção de ninar, mas o efeito é o da escrevivência descrita pela autora: acordar o homem, e o leitor, para as dores que ele causou e as que reprimiu.']},
{p:'(Imagem descrita) O símbolo adinkra <i>sankofa</i> mostra um pássaro que avança com a cabeça voltada para trás, às vezes com um ovo no bico; o nome se traduz como “voltar e pegar”. A capa da 2ª edição de <i>Canção</i> reproduz uma pintura de Antônio Obá chamada <i>Desdobramentos sobre sankofa</i>. a) Relacione o símbolo ao projeto da narradora na introdução. b) Mostre esse “voltar e pegar” no destino de uma personagem no fim do livro.',a:['A narradora age como o pássaro sankofa: volta ao relato de Juventina para recolher os pedaços que se perderam.','Na introdução, ela diz que recontar é trabalho sem fim e que voltou a Tina para trazer as histórias de Aurora, Antonieta, Dolores e Dalva; no fim, Juventina deixa Fio para entender o próprio amor e viaja para ouvir outras mulheres e compor uma grande ária com as histórias delas.','Nos dois casos, voltar ao passado não é prisão, é missão que prepara o futuro: a memória gera nova canção e nova paixão, anunciadas no fim.']},
{p:'(Comparação com <i>Balada de amor ao vento</i>) a) Compare a poligamia de Nguila com a vida amorosa de Fio Jasmim. b) Compare a reação final de Sarnau a Mwando com a de Juventina a Fio.',a:['Em <i>Balada</i>, a poligamia é instituição reconhecida (lobolo, esposas oficiais); em <i>Canção</i>, é uma poligamia de fato, sustentada pela circulação do ferroviário.','Nguila toma várias esposas e humilha Sarnau na corte; Fio tem a esposa oficial, Pérola, e uma mulher em cada parada do trem, com filhos que não assume (as gêmeas de Dolores, os ruivos de Dalva). No fim, Sarnau exige que Mwando pague, mas acaba aceitando-o; Juventina, depois de 35 anos, deixa Fio para entender o próprio amor.','Os dois livros mostram o patriarcado atravessando continentes, mas <i>Canção</i> termina com autonomia e irmandade das mulheres, e <i>Balada</i> com uma aceitação resignada.']},
{p:'(Comparação com <i>Caminho de pedras</i>) a) Noemi é julgada pelo amor que escolhe. Mostre um julgamento semelhante em <i>Canção</i>. b) Compare como as duas obras tratam a maternidade e a ausência dos pais.',a:['Nos dois romances, a sociedade julga a mulher pela vida amorosa e poupa o homem.','Noemi perde o emprego e é condenada até pelos camaradas; em <i>Canção</i>, Dolores é chamada de sem vergonha por engravidar solteira e Aurora apanha por banhar-se nua, enquanto Fio é aplaudido pelos maquinistas. Noemi termina sozinha e grávida; Neide, Dolores, Dalva e Antonieta criam filhos sem Fio, que pergunta a Dalva como ela sabe que o filho é dele e nunca responde às cartas de Dolores.','A paternidade irresponsável é estrutura social nas duas obras, e a maternidade solo é resistência; em <i>Canção</i>, ela é muitas vezes escolha (Neide pede o filho, Dalva escolhe o pai).']},
{p:'(Comparação com <i>Memórias de Martha</i>) a) Compare o foco narrativo das duas obras quanto ao uso da memória. b) Mostre como a educação muda a vida de mulheres nos dois livros.',a:['Martha lembra a própria vida em 1ª pessoa; a narradora de <i>Canção</i> lembra o que ouviu de outra mulher e reconta vidas alheias, admitindo falhas.','Martha julga a menina que foi (a culpa por Mathilde); a narradora de <i>Canção</i> diz que contar trai o vivido e que muito pode ser invenção. Martha sai do cortiço como professora; em <i>Canção</i>, Angelina passa da limpeza à enfermagem, Dalva paga os estudos e vira farmacêutica, e Tina é professora de música concursada.','Nas duas obras a educação é saída para mulheres pobres; mas em Martha a memória é acerto de contas individual, e em <i>Canção</i> é memória coletiva e oral, a escrevivência.']},
{p:'(Desfecho e título) a) Por que Juventina deixa Fio Jasmim? b) Considerando o desfecho, explique o título do livro.',a:['Juventina não deixa Fio por falta de amor, mas para entender esse amor e transformá-lo em obra.','Já aposentada, depois de 35 anos de uma relação cujas regras Fio definiu (carícias sem penetração, ausências de meses), ela decide viajar, ouvir outras mulheres e compor uma grande ária; Fio guarda a partitura na caixa da camisa do pai e descobre que ela se fez livre.','O “menino grande” é o homem adulto que as mulheres acalentaram; a canção que o ninava vira obra coletiva das mulheres, e é ele quem precisa crescer.']},
{p:'(Personagem) a) Explique por que Dolores dos Santos desiste da vingança. b) Mostre outros momentos em que a rivalidade entre as mulheres de Fio dá lugar à irmandade.',a:['Dolores desiste quando reconhece em Pérola uma semelhante, e não uma rival.','Diante da foto de Pérola com os filhos, vê ali os rostos de muitas mulheres (a avó, a mãe, vizinhas, mães sozinhas) e entende que matar aquela mulher seria matar a si mesma; joga a arma no rio e decide apresentar as gêmeas ao pai e aos irmãos. Do mesmo modo, Dalva visita Pérola como comadre e as crianças se despedem como irmãos, e Eleonora entra na confraria que acolhe Juventina.','A irmandade das mulheres que amaram o mesmo homem, ponto da resposta oficial da Fuvest em 2026, é o eixo que substitui o “herói” Fio.']},
{p:'(Escola e foco narrativo) a) Que traço da literatura contemporânea aparece quando a narradora estranha que Tina saiba tantos detalhes da vida de Fio? b) Indique um traço que confirma e um que rompe com a tradição do romance de amor.',a:['É a metaficção: a narrativa questiona a própria fonte e a fronteira entre ficção e verdade.','A narradora duvida e descobre que muitas histórias chegaram a Tina por Eleonora; no posfácio, diz que parte pode ser invenção de Tina ou dela, e que ficção e verdade têm a mesma medida. O livro confirma o romance de amor no tema (paixão, espera, ciúme), mas rompe com ele ao desmontar o príncipe e trocar o casal final pela irmandade das mulheres.','A obra é contemporânea porque faz da escrita um tema, mistura testemunho e invenção e dá voz a mulheres negras que a tradição deixou à margem.']},
{p:'(Figuras) a) Identifique a ironia na chegada de Fio a Alma das Flores, no sábado da malhação do Judas. b) Explique o efeito dos nomes alegóricos de personagens e cidades, com dois exemplos.',a:['Há ironia dramática: Fio pensa que traidores devem ser punidos e, logo depois, trai Angelina, fingindo ser o noivo que ela esperava.','Ele ri da brincadeira dos meninos, aceita a farsa sugerida pelos maquinistas e parte rindo; Angelina, cujo nome do meio é Devaneia (a que sonha), se mata antes dos 33 anos, a idade de Cristo. Os nomes reforçam o sentido: o trem chega de Monte Vazio, e Fio mora em Chegada Feliz, para onde as mulheres acabam indo com os filhos.','A ironia e os nomes dão à história um tom de fábula ou parábola, e ao mesmo tempo denunciam o jogo masculino que destrói vidas reais.']}
]
});

// Enredo, personagens e aprofundar de Balada de amor ao vento. Obra moderna: só paráfrase; conferido em textos/balada.txt.
Object.assign(BOOKS.find(b=>b.id==='balada'),{
  enT:'O enredo: moldura e 3 movimentos',
  fio:'Sarnau, já velha, conta uma vida igual à de muitas mulheres: oprimida na aldeia e na cidade, ela se liberta pelo trabalho, mas no fim aceita de volta o homem que a abandonou, e fica a dúvida se isso é vitória ou derrota.',
  arco:'Sarnau: moça que aceitaria qualquer lugar ao lado de Mwando → vendedora independente que cobra caro o próprio valor e, vencida, aceita sustentar quem a abandonou.',
  cenas:[
    ['#Moldura: a voz da velha Sarnau (cap. 1)'],
    ['A Mafalala (cap. 1)','Velha, na Mafalala, bairro pobre da capital de Moçambique, Sarnau conta sua vida. Compara a terra à mulher, que aguenta golpes calada até explodir como um vulcão, e diz que sua história não é nova: muitas mulheres vivem assim.','A vida de Sarnau vale como exemplo, não como exceção: o problema não é um homem mau, é o patriarcado, o sistema que dá aos homens poder sobre as mulheres.',0],
    ['#Movimento 1: o primeiro amor (caps. 2 e 3)'],
    ['A recusa cristã (caps. 2 e 3)','Sarnau ama Mwando, rapaz educado pelos padres, à beira do Save, o rio de sua aldeia. Grávida, ela aceita ser até a centésima primeira esposa, mas ele, cristão, vai casar com a noiva escolhida pelos pais e recusa a poligamia (o costume de um homem ter várias esposas). Sarnau entra numa lagoa para morrer; é salva, mas perde o filho.','Ironia: a regra cristã de ter uma só esposa vira desculpa para abandonar uma moça grávida.',0],
    ['#Movimento 2: a corte do rei (caps. 4 a 12)'],
    ['O lobolo e o casamento (caps. 4 e 5)','Sarnau é escolhida para casar com Nguila, herdeiro do trono; pelo lobolo, o pagamento da família do noivo à da noiva, chegam trinta e seis vacas, e ela se sente à venda. As mulheres cantam, ao socar milho no pilão, que o marido é senhor e que apanhar é prova de amor. Na festa, dançam em roda; uma tia lhe dá um pilão (lar = pilão, mulher = grão triturado), e a mãe chora: a filha vai para a escravidão.','Caiu na 1ª fase 2027 (Q76): a dança é lúdica, mas o rito ensina a submissão.',1],
    ['Rainha e desprezada (caps. 6 a 8)','Sarnau acha Nguila com outra esposa na cama dela; por ter chorado, leva uma bofetada que lhe arranca um dente, e ele chama isso de disciplina. Depois, é trocada por Phati, a quinta esposa.','Caiu na 1ª fase 2027 (Q78): a violência é tratada como normal, como parte do sistema.',1],
    ['O amante e o herdeiro (caps. 7 e 9 a 12)','Abandonado pela esposa, Mwando volta e vira amante de Sarnau; o filho dos dois é festejado como herdeiro do rei. Phati flagra os amantes, e eles fogem de barco pelo Save; Sarnau deixa os três filhos.','O filho do adultério será, mais tarde, coroado rei.',0],
    ['#Movimento 3: o mar, o degredo e a cidade (caps. 13 a 20)'],
    ['O segundo abandono (caps. 13 e 14)','Mwando descobre que o rei mandou matá-lo e que Phati foi executada, acusada de feitiço. Culpa Sarnau, a derruba com um golpe e foge. Grávida e sozinha na praia, ela o chama de nuvem.','Nuvem = amor que passa e não se segura, como o vento do título.',0],
    ['O degredo (caps. 15 a 17)','Na cidade, Mwando cai numa cilada de um sipaio, policial africano dos colonos. Sua caderneta de indígena, documento que os portugueses obrigavam os africanos a carregar, está sem carimbo, e ele é deportado para trabalho forçado em Angola. Lá vira padre improvisado, apelidado padre Moçambique, útil aos colonos; volta quinze anos depois.','O domínio colonial português esmaga também o homem africano, não só a mulher.',0],
    ['O preço e o candeeiro (caps. 18 a 20)','Sarnau vende legumes no mercado e cria dois filhos. Num temporal, Mwando a reencontra e a toma à força. Ela exige um preço pela própria honra e explica: as trinta e seis vacas do seu lobolo tinham servido, de família em família, para pagar outros vinte e quatro casamentos; se não fossem devolvidas a Nguila, todos se desfariam. Ela trabalhou e devolveu tudo sozinha, por isso agora vale vinte e quatro casamentos. Foge, mas ele bate à porta, os filhos o chamam de pai, e ela, vencida, apaga o candeeiro (a lamparina): aceita-o de volta.','Desfecho provável e de duplo sentido: ela tem casa, negócio e dinheiro e vai sustentá-lo; é independente, mas cede.',1]
  ],
  pers:[
    ['Sarnau (narradora)','Quer viver com Mwando. <b>Antes:</b> moça que aceita qualquer lugar ao lado dele e se orgulha de valer trinta e seis vacas. <b>Depois:</b> vendedora que devolveu sozinha o lobolo, sustenta dois filhos e cobra o preço da própria honra, mas se diz vencida.'],
    ['Mwando','Rapaz criado pelos padres, dividido entre a Bíblia e o desejo. <b>Antes:</b> abandona Sarnau grávida em nome da monogamia cristã. <b>Depois:</b> abandona-a de novo na fuga, é deportado, vira padre improvisado a serviço dos colonos e volta pedindo perdão.'],
    ['Nguila','Herdeiro e depois rei, polígamo. Arranca um dente de Sarnau e chama isso de disciplina. No fim, casou com Rindau, irmã de Sarnau; doente, perde o trono para Zucula, que na verdade é filho de Mwando.'],
    ['Phati (a rival)','Quinta esposa e favorita de Nguila. Flagra o adultério e acaba executada, acusada de feitiço. Volta como nome: a filha de Sarnau com Mwando é rebatizada Phati para acalmar o espírito dela.'],
    ['Sumbi','Esposa de Mwando que não aceita as regras de submissão. Os velhos da aldeia julgam Mwando por não dominá-la, e ela o deixa por um homem mais velho e rico.'],
    ['As mulheres da família','Mãe, tias e avós que trancam Sarnau na palhota e cantam conselhos de obediência; a mãe chora ao entregá-la. Rindau, a irmã, é a única que a acompanha ao novo lar.']
  ],
  ap:'<p><b>A epígrafe:</b> antes do cap. 1, o livro cita um poema curto de Leite Vasconcelos chamado “Amor” diz que o amor é o tear em que se fabrica a vida (metáfora: amor = tear). O romance mostra o avesso desse tecido: o mesmo amor que faz a vida de Sarnau a desmancha duas vezes.</p>'+
    '<p><b>O mapa da história:</b> tudo começa em Mambone, aldeia às margens do Save, no interior de Moçambique. A fuga desce o rio até o mar e o litoral de Vilanculos; sozinha, Sarnau segue para Lourenço Marques, a capital colonial, hoje Maputo. Mwando vai mais longe: Angola, outra colônia portuguesa. O campo é a memória; a cidade, a sobrevivência.</p>'+
    '<p><b>Cenas secundárias que valem ponto:</b></p>'+
    '<p>• <b>A caneta e o dedo (cap. 5):</b> no casamento na igreja, Nguila assina o livro com caneta de ouro; Sarnau só deixa a impressão do dedo. Desigualdade de gênero e de estudo numa imagem só.</p>'+
    '<p>• <b>O feitiço contra o marido (cap. 10):</b> grávida de Mwando, Sarnau paga a curandeira para atrair Nguila à sua cama e disfarçar a gravidez. A heroína também calcula e usa as armas da tradição.</p>'+
    '<p>• <b>Nhambi e o naufrágio (cap. 14):</b> o homem do rei mandado para matar Mwando é seu irmão de iniciação, pois os dois passaram juntos pelo rito que faz dos meninos homens, e o deixa fugir, por gratidão. Abandonada na praia, Sarnau lembra que, aos doze anos, sobreviveu a um naufrágio no Save que matou duas esposas do pai e três irmãos, e se sente de novo a única sobrevivente.</p>',
  cx:[
    '<b>Caminho de pedras:</b> a mulher que ganha o próprio dinheiro. Sarnau termina dizendo que tem casa, negócio e dinheiro para sustentar Mwando; Noemi, na briga pelo filho, lembra ao marido que ganha quase tanto quanto ele, mas é demitida e termina costurando, grávida e sozinha.',
    '<b>Canção para ninar menino grande:</b> filhos sem o nome do pai. O pai de João, o filho mais novo de Sarnau na cidade, é casado e cristão e não deixa o menino conviver com os irmãos; em Canção, Neide Paranhos quer de Fio Jasmim só um filho, e o menino leva só o nome da mãe, mas por escolha dela.',
    '<b>A visão das plantas:</b> o mar como rota da violência colonial portuguesa. Mwando desce ao porão escuro de um navio de deportados rumo às roças de Angola; Celestino, ex-capitão de navio negreiro, revê o porão onde sufocou com cal uma revolta de escravizados.',
    '<b>Memórias de Martha:</b> o casamento final como acordo, e não como paixão realizada. Martha, já professora e independente, aceita Miranda sem paixão para amparar a mãe; Sarnau, já dona do próprio negócio, aceita Mwando pelos filhos e se diz vencida.'
  ],
  aq:{p:'Sarnau conta que a filha que teve de Mwando, chamada primeiro de Chivite, adoeceu e só se curou quando uma curandeira mandou dar a ela o nome de Phati, a rival morta. a) Explique o sentido dessa troca de nome. b) Relacione o episódio à visão que o romance dá da rivalidade entre as esposas na poligamia.',
    a:['A troca de nome é um rito para acalmar o espírito de Phati, que, segundo a curandeira, perseguia Sarnau: a menina nascida do amor proibido passa a carregar o nome da mulher que denunciou esse amor e morreu por isso.',
       'Na corte de Nguila, as esposas viviam em guerra: Phati foi espancada e acusada de feitiço, flagrou o adultério e acabou executada; já na Mafalala, Sarnau passa a amar a filha, vê na rival uma irmã mais nova que lutou pelo mesmo homem e lhe faz um pequeno altar atrás da barraca.',
       'Assim, o romance mostra que a rivalidade nasce do sistema que põe várias mulheres a disputar um só homem: longe dele, Sarnau reconhece em Phati uma vítima igual a ela, e conclui que a poligamia leva as mulheres a se enfeitiçarem e se matarem.']}
});

// Enredo, personagens e aprofundar de Caminho de pedras. Obra moderna: só paráfrase; conferido em textos/caminho.txt.
Object.assign(BOOKS.find(b=>b.id==='caminho'),{
  enT:'O enredo em 3 movimentos',
  fio:'Noemi deixa o marido por Roberto, colega de militância comunista, e paga caro: é castigada pela polícia, pelo patrão e pelos próprios camaradas, mas segue em frente.',
  arco:'Noemi: retocadora de fotos, casada e mãe do Guri → mulher sozinha, grávida de um preso político deportado, que chama o bebê de companheiro.',
  cenas:[
    ['#Movimento 1: a organização (caps. 1 a 8)'],
    ['A chegada (caps. 1 a 3)','Roberto, intelectual militante, volta a Fortaleza mandado pelos camaradas do Rio para montar o núcleo local do partido comunista, que o livro chama só de <i>organização</i>. Na reunião, o operário negro Vinte-e-Um (é um apelido) pergunta, com ironia, de que classe ele é, e Roberto se sente um impostor.','Abre o conflito entre os intelectuais de classe média, que lideram, e os operários, que desconfiam deles.',0],
    ['A regra (caps. 6 e 8)','Os intelectuais do grupo falam de mulher como prêmio a conquistar e sonham com um amor livre de dinheiro e preconceito. Numa reunião, o velho Rufino diz que revolucionário não pode ter vida particular.','Quando Noemi viver esse amor livre, os mesmos camaradas vão condená-la.',0],
    ['#Movimento 2: o amor e a ruptura (caps. 9 a 20)'],
    ['Noemi desperta (caps. 5 e 9)','Noemi, que retoca fotos no estúdio de Seu Benevides e é casada com João Jaques, volta de um curso político sentindo-se livre pela primeira vez. O marido, bebendo, pede que ela largue as reuniões; ela responde que quer aprender por si.','Virada: a política entra na vida dela como libertação interior.',0],
    ['O comício (cap. 12)','Os militantes fazem um comício na praça da estação. A cavalaria da polícia chega e a multidão foge, comparada a uma boiada em pânico. Roberto protege Noemi e é preso; um homem negro fica caído, agonizando.','Caiu na 1ª fase 2027 (Q77, questão de biologia sobre o medo). Repressão do Estado em cena aberta.',1],
    ['A confissão adiada (caps. 13 a 18)','O marido chama o comício de loucura e insinua ciúme. Solto, Roberto se declara a Noemi e exige que ela conte tudo ao marido; ela adia. Quando viram amantes, a paixão sonhada a decepciona.','O adultério é contado sem castigo e sem romantismo, do ponto de vista dela.',0],
    ['A partida (caps. 19 e 20)','Roberto conta ao marido que ama Noemi. João Jaques quer levar o Guri; ela lembra que ganha quase tanto quanto ele. O marido parte de navio para o Rio. Noemi fala com ele em pensamento e se sente viúva de um homem vivo.','O salário é a arma da independência dela; o narrador não a julga.',0],
    ['#Movimento 3: as perdas (caps. 21 a 27)'],
    ['O julgamento (cap. 21)','Os camaradas condenam o adultério e dizem que as mulheres confundem luta social com sexo. Seu Benevides, o patrão, demite Noemi porque as famílias que frequentam o estúdio reclamaram; ela cobra o mês de salário que a lei garante.','Eixo muito provável: na hora de julgar a mulher, a moral dos camaradas de esquerda é igual à do patrão conservador.',0],
    ['A morte do Guri (caps. 25 e 26)','Noemi, sem emprego, acha o Guri com febre. O médico, simpático à causa, chega rindo e falando de política; vêm as convulsões, e o menino morre. Ela o veste sozinha, mas não consegue calçar-lhe os sapatos.','Caiu na 1ª fase 2027 (Q77, a convulsão). A política não salva o filho; o grupo se desfaz.',1],
    ['A ladeira (cap. 27)','Um ano depois, Noemi e Roberto são denunciados e presos espalhando panfletos de madrugada, numa tarefa que era dela. Ela é solta por estar grávida; ele vai para uma colônia penal que dizem ser numa ilha. Agora costureira, Noemi sobe uma ladeira calçada de pedras; no muro, vê se apagar um letreiro pedindo liberdade para um preso, pintado por Roberto, e chama o bebê de companheiro.','O título se realiza: a ladeira de pedras é real e é também imagem da vida dura dela (caminho de pedras = vida difícil). Cena mais provável.',1]
  ],
  pers:[
    ['Noemi (protagonista)','Quer aprender por si e amar livremente. <b>Antes:</b> retocadora nascida no Acre, casada há seis anos, que ganha quase tanto quanto o marido. <b>Depois:</b> sem marido, filho, emprego nem Roberto, costura grávida para viver e, mesmo assim, segue em frente.'],
    ['Roberto','Intelectual vindo do Rio, entregue à causa. <b>Antes:</b> tratado como impostor pelos operários. <b>Depois:</b> companheiro de Noemi, preso e deportado. Exige lealdade e protege demais: insiste em acompanhá-la na tarefa dela, e os dois caem.'],
    ['João Jaques','O marido, ex-militante expulso da organização no Rio, leitor do anarquista russo Kropotkine, cético. <b>Antes:</b> pai brincalhão do Guri. <b>Depois:</b> parte de navio e, quando o filho morre, manda um telegrama desesperado.'],
    ['Filipe','Guarda-livros (contador) que mora nas areias, bairro pobre sem calçamento, com a mãe, dona de uma vendinha; único confidente de Noemi. Lúcido e irônico, perde o emprego e é mandado pela organização para Russas, no interior do Ceará, onde dizem que está muito doente.'],
    ['Angelita','Costureira de roupas de missa, operária firme, mãe de Vladimir. Contraponto de Noemi: militância sem drama amoroso; no fim, vai para longe com o marido e os filhos.'],
    ['Vinte-e-Um','Operário negro, ex-marinheiro, que desconfia dos intelectuais; no comício, salva dos cavalos a mulher do padeiro preso.'],
    ['Seu Benevides e Guiomar','O patrão que se gaba de não ter ideias e demite Noemi em nome das famílias; a colega solteira que a espia e se sente vingada.']
  ],
  ap:'<p><b>O Bloco e a nova organização:</b> os veteranos lembram as greves do tempo do Bloco Operário, que custaram prisão e fome. Historicamente, o Bloco Operário e Camponês foi a frente legal, isto é, permitida por lei, dos comunistas no fim dos anos 1920. Roberto vem refundar o trabalho sobre essa derrota: por isso o grupo é pequeno, desconfiado e dividido.</p>'+
    '<p><b>Cenas secundárias que valem ponto:</b></p>'+
    '<p>• <b>O retoque (cap. 5):</b> o trabalho de Noemi é apagar à mão, nas chapas das fotos, as papadas e rugas de freguesas vaidosas, como Dona Vivinha, enquanto o patrão olha as moças com segundas intenções. Ela embeleza a imagem das famílias que depois vão exigir sua demissão.</p>'+
    '<p>• <b>A cobra do quintal (cap. 15):</b> o Guri e a comadre matam uma cobra, e o pai faz da caçada uma brincadeira: a cobra seria uma jiboia que guardava uma princesa encantada. O riso une o casal, e Noemi não tem coragem de falar: a paz da família a segura.</p>'+
    '<p>• <b>A carta ao Guri (cap. 22):</b> João Jaques escreve do Rio ao filho; o menino pede que Roberto a leia de novo, letra por letra, e Noemi sai da sala. O pai ausente domina a cena, e Roberto se sente um intruso no lugar dele à mesa.</p>'+
    '<p>• <b>Mendonça e o Acre (cap. 23):</b> Noemi e Roberto visitam um camarada tuberculoso; cinco dias depois ele está enterrado, e ela entrega à viúva o dinheiro juntado pelos camaradas. Na mesma noite, Noemi conta que nasceu e se casou no Acre e pensa que o Guri, ao contrário, nunca vai morrer: a cena prepara a perda do filho.</p>',
  cx:[
    '<b>Balada de amor ao vento:</b> o fim das duas mulheres que deixaram o marido. Noemi termina grávida de Roberto, deportado, costurando para viver; Sarnau, agredida e abandonada grávida por Mwando na fuga, sustenta os filhos vendendo no mercado da Mafalala, bairro pobre da capital de Moçambique.',
    '<b>Memórias de Martha:</b> o emprego como chave da independência. Martha é nomeada professora pública e deixa o cortiço para trás; Noemi, retocadora havia quatro anos, ganhava quase tanto quanto o marido, mas perde o lugar quando a moral entra em cena.',
    '<b>A paixão segundo G. H.:</b> a mulher de classe média diante da violência racial dentro de casa. Noemi lembra que, aos dez anos, quis que o menino negro açoitado pelo pai reagisse, e confessou isso ao padre como pecado; G. H. percebe que nunca tinha visto de verdade Janair, a empregada negra.',
    '<b>Geografia:</b> repressão que apaga nomes. No muro, o letreiro pintado por Roberto pedindo liberdade para um preso está tão apagado que já não se lê o nome; no poema “Túmulo de Lorca”, sobre o poeta espanhol morto em 1936, Sophia chora os presos e mortos sem nome. Os dois livros nasceram sob regimes repressivos: o de Vargas no Brasil, o de Salazar em Portugal.'
  ],
  aq:{p:'Um lema do feminismo dos anos 1970 afirma que o pessoal é político: casamento, sexo e maternidade, que parecem assuntos íntimos, são atravessados por relações de poder. a) Mostre como a organização trata a vida particular dos militantes em “Caminho de pedras”. b) Explique como a trajetória de Noemi confirma o lema.',
    a:['A organização quer militantes sem vida particular: numa reunião, Roberto é acusado de cuidar de assuntos pessoais, e Rufino afirma que revolucionário de verdade não pode ter vida própria.',
       'Mas é a vida íntima de Noemi que decide seu destino político e econômico: ao deixar o marido, ela é condenada pelos camaradas, demitida por Seu Benevides em nome das famílias, e seu argumento para ficar com o Guri é o salário que ganha.',
       'Assim, o romance confirma o lema: as mesmas forças que dissolvem o comício, o Estado, o mercado e a moral, controlam também o corpo, o amor e a maternidade da mulher.']}
});

// Enredo, personagens e aprofundar de Canção para ninar menino grande (2ª ed., 2022). Obra moderna: só paráfrase; conferido em textos/cancao.txt (introdução, 16 capítulos e posfácio; os capítulos abrem com nomes em maiúsculas).
Object.assign(BOOKS.find(b=>b.id==='cancao'),{
  enT:'O livro em 3 partes: moldura, mulheres e desfecho',
  fio:'Uma narradora escreve, como missão, o que a amiga Juventina lhe contou sobre Fio Jasmim, maquinista de trem casado, e as muitas mulheres dele. O sedutor vira um “menino grande” que precisa ser ninado, e as rivais viram irmãs.',
  arco:'Fio Jasmim: sedutor que aprendeu a engolir o choro desde os dez anos → homem que chora diante de uma mulher que nunca quis conquistar e fica para trás quando Tina o deixa.',
  cenas:[
    ['#A moldura (introdução e cap. 1)'],
    ['A dupla traição (introdução)','A narradora diz que contar uma vivência já a trai um pouco e que recontar o que outra pessoa contou trai duas vezes. Mesmo assim, voltou a ouvir Juventina para buscar as histórias que faltavam.','Caiu na 2ª fase 2026 (Q3): lembrar e recontar é uma missão; a narradora é uma testemunha que participa, não só ouve; e as mulheres se unem como irmãs.',1],
    ['A canção na roda (cap. 1)','Numa roda de amigas, Juventina sente dor no peito e quase cai. Pedem que cante, ela canta a canção do título e se levanta. Era dor de amor.','O livro abre e fecha nesse corpo: a narradora crê no relato porque viu Tina cair e se erguer cantando.',0],
    ['#As mulheres do caminho de ferro (caps. 2 a 6)'],
    ['Neide e o príncipe negro (cap. 2)','Em Vale dos Laranjais, Fio, já noivo, encanta-se pelos pés de Neide. Lembra que, aos oito anos, a professora deu a um menino loiro o papel de príncipe da Cinderela. Agora quer ser o Príncipe Negro, com tantas mulheres quanto o colega branco. Neide lhe pede um filho, sem querer casar.','A ferida do racismo vira conquista de mulheres: é a dupla consciência descrita pelo pensador negro norte-americano W. E. B. Du Bois (a pessoa negra se vê também pelo olhar racista dos outros), que caiu na 1ª fase 2027 (Q79).',1],
    ['Angelina e o Judas (cap. 2)','Na véspera da Páscoa, o trem chega a Alma das Flores durante a malhação do Judas, brincadeira em que meninos surram um boneco do traidor. Fio diz a um menino que vai casar, a cidade o toma pelo noivo que Angelina esperava, e ele mantém a farsa. Ao descobrir, ela se joga de uma ribanceira.','Caiu na 1ª fase 2027 (Q76): a festa como brincadeira coletiva. Ironia: o traidor da história é Fio.',1],
    ['Aurora, Antonieta, Dolores, Dalva (caps. 3 a 6)','Histórias acrescentadas na 2ª edição (2022). Aurora toma banho nua no rio; Antonieta diz que o filho caçula é de Fio; Dolores, mãe de gêmeas dele, planeja matar Pérola, a esposa, mas vê nela muitas mulheres e joga a arma no rio; Dalva, branca, visita Pérola como amiga.','As rivais deixam de se odiar e passam a se ver como irmãs, todas marcadas pelo mesmo homem.',0],
    ['#Tina, Eleonora e o fim (caps. 7 a 16 e posfácio)'],
    ['Tina e Fio (caps. 7 a 9)','Tina conhece Fio aos dezessete anos. A mãe dela dizia que os homens são meninos grandes, agarrados às saias das mulheres. Fio a chama de Virgem de Ébano (ébano é uma madeira negra) e a mantém virgem num jogo de carícias com regras dele; ela ama sozinha.','Daqui vem o título. Fio diz que a preserva por respeito, mas na verdade a controla.',0],
    ['O choro no bar (caps. 10 a 13)','Eleonora, expulsa de casa por amar uma moça, bebe sozinha. Fio chega para seduzi-la e desaba num choro. Dormem lado a lado, como irmãos.','O menino grande é ninado por uma mulher que ele não quis conquistar.',0],
    ['Tina parte (caps. 14 a 16 e posfácio)','Após trinta e cinco anos, Tina deixa Fio para entender esse amor e compor, com histórias de outras mulheres, uma grande ária (canção de ópera). Fio guarda a partitura na caixa de uma camisa do pai. A narradora diz que ficção e verdade se equivalem e que a canção também é dela.','Desfecho provável: as mulheres seguem viagem e se libertam; Fio fica para trás.',0]
  ],
  pers:[
    ['Fio Jasmim (o menino grande)','Maquinista de trem, casado. O pai, Máximo, teve dezessete filhos pelo interior de Minas. <b>Antes:</b> coleciona mulheres em cada estação e engole o choro. <b>Depois:</b> chora com Eleonora e se pergunta se as mulheres que passaram por ele foram felizes.'],
    ['Juventina (Tina)','Professora de música concursada e compositora. <b>Antes:</b> ama sozinha por trinta e cinco anos. <b>Depois:</b> deixa Fio para ouvir outras mulheres e compor com as histórias delas.'],
    ['A narradora','Quem conta o livro; viúva, mãe de uma filha. <b>Antes:</b> ouvinte, acusada por Tina de ter escutado mal. <b>Depois:</b> escritora que assume a canção como sua e sente nascer uma paixão.'],
    ['Eleonora','Expulsa de casa por amar uma moça. <b>Antes:</b> sonhava um mundo separado entre homens e mulheres. <b>Depois:</b> descobre que um homem pode ser irmão e entra na roda de amigas.'],
    ['Dolores','Herdeira de joias, mãe das gêmeas Rubia e Safira. Passa do amor ao ódio e à irmandade: joga a arma no rio e decide apresentar as filhas ao pai e aos irmãos.'],
    ['Neide','Escolhe ter um filho de Fio sem se casar; o menino leva só o nome da mãe.'],
    ['Pérola Maria','A esposa: oito filhos, o nono a caminho; Fio diz que ela é a pérola e as outras, pedras sem brilho.']
  ],
  ap:'<p><b>A ferrovia e os nomes:</b> as cidades têm nomes inventados e simbólicos (Vale dos Laranjais, Remanso Velho, Chegada Feliz), mas a única referência real é o interior de Minas, onde o pai de Fio espalhou filhos, e quem ensina Fio a ser homem é a própria ferrovia: os maquinistas mais velhos ensinam a separar moças de família, vigiadas pelos parentes, de mulheres livres, que esperam em outros lugares.</p>'+
    '<p><b>Cenas secundárias que valem ponto:</b></p>'+
    '<p>• <b>Paranhos da Silva (cap. 2):</b> a família de Neide é uma das poucas famílias negras donas de terra da região. Mantém o sobrenome Paranhos, herdado dos antigos senhores de escravos, como forma de enfrentar os brancos e lembrar que parte da riqueza deles foi feita pelos negros; adotou Silva, que, lamenta a avó Ismênia, marca a perda dos nomes africanos. A escravidão fica no nome.</p>'+
    '<p>• <b>A carta à vista (cap. 1):</b> Fio deixa as cartas de Tina sobre a mesa, a pia, até debaixo do travesseiro, sabendo que a esposa as lerá. A traição exposta como jogo.</p>'+
    '<p>• <b>O pai de Fio (cap. 7):</b> Máximo, homem miúdo e tímido, teve Fio com uma menina de quinze anos quando beirava os sessenta e ensinou que ser homem é ter várias mulheres e escolher uma para casar. A educação explica o filho.</p>'+
    '<p>• <b>Jasminzinho (cap. 4):</b> Antonieta muda-se para a cidade de Fio, planta jasmins e anuncia que o caçula é dele.</p>'+
    '<p>• <b>Os filhos de Dalva (cap. 2):</b> os três filhos mais novos têm o cabelo ruivo da mãe, branca, mas crespo como o de Fio, apontado como o pai.</p>',
  cx:[
    '<b>Balada de amor ao vento:</b> festa e brincadeira (1ª fase 2027, Q76). Em <i>Balada</i>, a dança no casamento de Sarnau com Nguila, herdeiro do rei; em <i>Canção</i>, a malhação do Judas em Alma das Flores, quando Fio desce do trem.',
    '<b>A paixão segundo G. H.:</b> voz da mulher negra. Janair, a empregada de G. H., nunca fala e deixa só um desenho na parede; Juventina conta sua história às amigas, e a narradora a escreve.',
    '<b>Caminho de pedras:</b> mães sozinhas. Noemi, grávida, fica só depois que o companheiro é preso e deportado, e costura para viver; Dolores cria as gêmeas e escreve à companhia ferroviária sem nunca ter resposta.',
    '<b>A visão das plantas:</b> canção que embala. Tina compõe uma canção para ninar Fio; Celestino, ex-traficante de escravizados, conta seus crimes às crianças como cantiga doce e, no fim, é carregado no colo como um menino pelo fantasma de uma escravizada.'
  ],
  aq:{p:'No último capítulo, o romance revela que Fio Jasmim guarda a partitura da canção composta por Tina na caixa que antes guardava a camisa “volta-ao-mundo” de seu pai, Máximo Jasmim. a) Explique o valor simbólico desse gesto. b) Relacione-o à formação de Fio e à decisão de Juventina no desfecho.',
    a:['A caixa da camisa do pai simboliza a vaidade e o modelo de homem viajante e conquistador que Fio herdou; guardar nela a partitura é pôr a obra de uma mulher no lugar desse legado masculino.',
       'Fio aprendeu com Máximo, pai de dezessete filhos pelas Gerais, que ser homem é ter várias mulheres, e por isso engolia o choro; depois de chorar com Eleonora e de ver Tina partir, após trinta e cinco anos, para ouvir outras mulheres e compor uma ária, canção de ópera, percebe que ela se fez livre e que ele ficou para trás.',
       'O gesto mostra que a herança do pai perde lugar para a canção de Tina: o menino grande guarda a canção que o ninou, mas quem segue viagem agora são as mulheres.']}
});

// Percurso, vozes e aprofundar de Geografia (piloto). Obra moderna: só paráfrase; conferido em textos/geografia.txt.
Object.assign(BOOKS.find(b=>b.id==='geografia'),{
  enT:'O percurso do livro em 7 partes',
  fio:'O livro é um mapa e também um caminho moral: começa na praia, onde o mundo parece nascer de novo; passa pela cidade suja de mentira e medo da ditadura portuguesa; e termina num poema em que o eu diz ser feito só do mundo que vê. A paisagem limpa é a régua da verdade: perto dela, aparece a sujeira escondida do regime.',
  cenas:[
    ['Ingrina (parte I)','Ingrina é uma pequena praia do Algarve, no sul de Portugal. A cigarra, o orégão e o sol fazem o eu esquecer a morte e escrever na areia e na cal dos muros que o mundo recomeça. Em “Mundo nomeado ou descoberta das ilhas”, viajantes dão nome a baías e praias, e as coisas respondem como se nascessem.','Ponto de partida e modelo do livro: diante da paisagem clara, o eu se sente inteiro. E dar nome às coisas é quase criá-las.',0],
    ['Procelária (parte II)','A parte política. A procelária, ave marinha das tempestades, não procura abrigo e faz do perigo sua força: imagem de quem canta sob opressão. Em “Eu me perdi”, o eu se perde num mundo sujo onde, para viver, é preciso ser policial, agiota, hipócrita ou prostituta; salva-se na terra limpa e se reencontra no mar.','Caiu na 1ª fase 2027 (Q27): a paisagem limpa é a régua da verdade e denuncia, por contraste, a “noite” (a sujeira moral) da ditadura de Salazar, que governava Portugal com censura e polícia política. “Esta gente” (o povo pisado) e “Túmulo de Lorca” (os fuzilados sem nome) completam a denúncia.',1],
    ['A noite e a casa (parte III)','Poemas passados em casa, à noite: quarto, vela e janela viram lugar de recolhimento, longe da rua e da política da parte II. Em “Vela” e “A noite e a casa”, uma pequena chama e a escuridão reúnem a casa em silêncio. Em “Escuto”, o eu não sabe se ouve o silêncio ou Deus.','Nuance que vale ponto: aqui a noite protege. Ruim no livro é a luz artificial e violenta: em “Néon”, último poema da parte II, uma luz crua de máquina invade tudo, e a casa parece um quarto saqueado.',0],
    ['Dual (parte IV)','A parte mais longa (19 poemas), sobre amor, perda e morte; o título indica um eu dividido em dois. Em “No deserto”, a voz (feminina) trata a metade de si dos impulsos como um cavalo, que ela monta e controla com rédea e espora para que não se perca nas “cidades mortas”: Babilônia e Nínive, cidades antigas que o poema liga ao comércio e a rituais sangrentos. No deserto, lugar limpo e solitário, ela o solta, e as duas metades voltam a ser uma só. Em “Caminho”, numa travessia do deserto, a voz sabia que alguém morreria antes do próximo oásis e descobre que quem morre é ela mesma.','É a mesma busca de limpeza, agora na vida íntima: disciplinar-se para não se corromper. Figuras: metáfora (metade de si = cavalo), antítese (cidades mortas × deserto limpo) e paradoxo (dominar para libertar). Não confunda com <i>Dual</i>, livro de Sophia de 1972.',0],
    ['Mediterrâneo (parte V)','Grécia e Itália antigas. Em “Epidauro” (santuário grego), a voz grita para destruir o Minotauro, monstro mitológico meio homem, meio touro, que devora nossa vida e se diz complexo e misterioso, mas é só um homem com a violência do touro. Em “Electra” (heroína da tragédia grega que clama por vingança pelo pai assassinado), o grito leva os crimes escondidos à luz do sol e chama a justiça dos deuses.','A Grécia não é fuga da realidade (a Fuvest marcou essa leitura como errada): é a luz que mostra o crime. O Minotauro pode ser lido como a tirania, o poder violento que se disfarça.',0],
    ['Brasil ou do outro lado do mar (parte VI)','Sophia é portuguesa: o Brasil está “do outro lado do mar”. São 4 poemas. Em “Descobrimento”, a chegada dos navegadores portugueses em 1500 é contada por eles: o mar parece um ser vivo e enorme, e surge um povo nu, “cor de barro”, como se tivesse acabado de ser criado. Em “Manuel Bandeira”, ela lembra que, jovem, em Portugal, lia em voz alta poemas do brasileiro, para espanto da avó. Em “Brasília”, elogia a capital de Lúcio Costa e Niemeyer, que une a razão e a proporção dos gregos à natureza tropical, e lembra os candangos, os trabalhadores que a construíram. Em “Poema de Helena Lanari”, gosta do português do Brasil, que pronuncia todas as sílabas e torna as palavras mais concretas.','Muito provável numa prova brasileira. “Descobrimento” mostra a chegada como o começo do mundo (como na Bíblia, o homem feito de barro), mas pelo olhar de quem chega: o espanto é dos navegadores e o poema o põe no rosto dos indígenas, vistos como “recém-criados”, sem história; a violência colonial fica de fora (compare com a Carta de Caminha). Os outros 3 poemas mostram o Brasil como encontro: poesia, arquitetura e língua.',1],
    ['No poema (parte VII)','Em “Poesia de inverno”, o eu lamenta um tempo sem deuses, de palavras gastas e envergonhadas. “Poema”, que fecha o livro, responde: o eu se volta para fora, procura Deus no mundo real, diz que sua história e seu rosto são a paisagem (terra, sol, vento, mar) e recusa carteira de identidade e entrevistas.','O fim explica o título <i>Geografia</i>: a identidade da poeta é o mundo que ela olha. É o oposto do eu romântico de <i>Nebulosas</i>, que vê na natureza o reflexo dos próprios sentimentos.',1]
  ],
  pers:[
    ['O eu lírico (voz feminina)','Busca justiça e o sagrado nas coisas concretas. <b>Antes:</b> perdido num mundo sujo e corrupto. <b>Depois:</b> diz que sua identidade é o mundo que vê. O feminino aparece na concordância das palavras: em “Caminho”, é ela quem morre no deserto.'],
    ['A procelária','Ave das tempestades que dispensa porto seguro: símbolo da poeta que continua a cantar sob a ditadura.'],
    ['O povo de “Esta gente”','Rosto em que o eu vê ao mesmo tempo escravos e reis, marcado pela paciência e pela fome; é nele que o país dominado pela ditadura deixa sua marca. Diante dele, o eu volta a cantar e a buscar um país livre.'],
    ['Os navegantes','O “nós” de “Descobrimento”. O encanto que o poema mostra no povo encontrado é, na verdade, o encanto de quem chega e olha; a violência colonial fica fora do poema.'],
    ['Electra e o Minotauro','Figuras da mitologia grega. Electra é o grito que exige justiça à luz do dia; o Minotauro, a tirania que devora a vida e se disfarça de coisa complicada.'],
    ['Lorca','Federico García Lorca, poeta espanhol fuzilado em 1936, no início da Guerra Civil Espanhola. No poema, representa todos os presos e mortos sem nome, e sua memória não se deixa enterrar.'],
    ['Bandeira, Helena Lanari e os candangos','O Brasil como encontro: o poeta lido desde a juventude, a amiga cuja fala devolve peso às palavras e os trabalhadores cuja caminhada termina na cidade clara de Brasília.']
  ],
  ap:'<p><b>O livro na obra de Sophia:</b> <i>Geografia</i> vem depois de <i>Livro sexto</i> (1962) e antes de <i>Dual</i> (1972). Só depois do 25 de Abril de 1974 (a Revolução dos Cravos, que derrubou a ditadura), em <i>O nome das coisas</i> (1977), a liberdade é celebrada às claras. Em 1967, com a censura, a política entra disfarçada em paisagens, mitos e figuras estrangeiras.</p>'+
    '<p><b>Poemas secundários que podem cair:</b></p>'+
    '<p>• <b>“Velório rico” (parte II):</b> um morto cercado de herdeiros aflitos que envenenam o ar com suas culpas. Três versos sobre a cobiça, ao lado de “Cidade dos outros”, sobre a desonestidade que cobre a cidade.</p>'+
    '<p>• <b>“De um amor morto” (parte IV):</b> o amor que morre não deixa lembrança nem imagem duradoura: sobra um dia a dia pesado, e ele vira um simples fato que a eternidade ignora. Bom para mostrar que o livro não é só político.</p>'+
    '<p>• <b>“Acaia” e “Ítaca” (parte V):</b> no primeiro, de dois versos, a voz tira a roupa do exílio ao chegar à Grécia (Acaia é uma região grega). No segundo, um “tu” feminino parte de noite de Brindisi, porto da Itália, e desperta ao sol, como num segundo nascimento (Ítaca é a ilha de Ulisses, na <i>Odisseia</i>). A Grécia é volta para casa, não fuga.</p>'+
    '<p>• <b>“Crepúsculo dos deuses” (parte V):</b> a claridade grega venceu os monstros, mas os deuses se apagaram, e as coisas ficaram separadas de nós. O poema termina com a resposta do oráculo ao imperador romano Juliano, que tentou trazer os deuses antigos de volta: o templo caiu e a fonte que falava se calou. É o mesmo diagnóstico de “Poesia de inverno”.</p>'+
    '<p>• <b>“Escrita do poema” (parte VII):</b> escrever aparece como gesto físico, letras escuras sobre parede branca, em silêncio pesado, e o eu se sente distante. É metalinguagem: o poema fala do próprio ato de escrever, tratado como coisa concreta.</p>',
  cx:[
    '<b>Nebulosas:</b> Narcisa olha as nebulosas como consolo para a própria dor: a natureza reflete o que o eu sente (Romantismo). Em “Poema”, Sophia faz o contrário: o eu é formado pelo mundo. As duas ligam poesia e liberdade: “Pesadelo” anuncia a queda dos tronos; “Esta gente” busca um país livre.',
    '<b>A visão das plantas:</b> o mar português visto de dois lados. Em “Descobrimento”, o mar parece um ser vivo, feito de músculos e cavalos, e revela um povo que parece recém-criado; em Djaimilia, Celestino revê o porão do navio negreiro com corpos sufocados pela cal.',
    '<b>Caminho de pedras:</b> poesia e romance sob ditaduras. Sophia chora, com Lorca, os fuzilados e presos sem nome; Rachel mostra Roberto deportado para uma colônia penal numa ilha e Noemi presa por distribuir panfletos sob o governo de Vargas.',
    '<b>A paixão segundo G. H.:</b> o sagrado nas coisas concretas. G. H. o encontra no quarto branco e seco como um deserto, diante da barata; em “No deserto” e “Caminho”, Sophia também atravessa o deserto limpo, e em “Poema” procura Deus no mundo.'
  ],
  aq:{p:'Em “Ingrina”, o eu sente seu reino ajustado a ele como uma roupa sob medida; em “No quarto” (parte IV), a vida parece uma roupa que ficou pequena para quem a usa; em “Acaia” (parte V), a voz se livra da roupa do exílio. a) Explique a metáfora da roupa em “Ingrina” e em “No quarto”. b) Mostre como “Acaia” e o percurso do livro resolvem essa oposição.',
    a:['A roupa é metáfora da relação entre o eu e o lugar onde vive: em “Ingrina”, a praia luminosa se ajusta ao eu como roupa feita sob medida; em “No quarto”, a vida fechada entre paredes não acompanha o crescimento de quem a veste.',
       'Em “Acaia”, chegar à Grécia é tirar a roupa do exílio: o eu volta a um lugar de luz e equilíbrio, como em “Epidauro”, em que a voz se diz vestida de sol e de silêncio.',
       'O percurso do livro faz esse movimento do aperto à inteireza: da cidade suja e do quarto fechado à paisagem limpa, até “Poema”, em que a única identidade do eu é o mundo que vê.']}
});

// Enredo, personagens e aprofundar de A paixão segundo G. H. Obra moderna: só paráfrase; conferido em textos/gh.txt (33 seções).
Object.assign(BOOKS.find(b=>b.id==='gh'),{
  enT:'Uma manhã em 3 movimentos',
  fio:'Uma mulher rica conta a manhã em que encarou uma barata no quarto da empregada. A pessoa que ela fingia ser desaba: ela desiste de explicar tudo e passa a simplesmente adorar a vida como ela é.',
  arco:'G. H.: patroa organizada, que vive de aparências e nunca olhou para a empregada → mulher sem nome, que se reconhece no desenho deixado por Janair e aceita que o mundo não gira em torno dela.',
  cenas:[
    ['#Movimento 1: antes do quarto (seções 1 a 3)'],
    ['A terceira perna (seção 1)','No dia seguinte, G. H. diz que perdeu algo como uma terceira perna, que a deixava firme, mas não a deixava andar. Para ter coragem de contar, imagina uma mão que segura a sua.','A terceira perna = a identidade social, um apoio postiço que dá segurança e prende.',0],
    ['A patroa (seções 2 e 3)','Quase dez horas, numa cobertura no Rio. A empregada pediu demissão na véspera. G. H., rica, com as iniciais gravadas nas malas, decide arrumar a casa pelo quarto dos fundos, que imagina sujo. Ela diz que, ao ir da sala para lá, estava a um passo de descobrir um império, isto é, um mundo enorme e desconhecido dentro dela.','Essa frase abriu a Q16 da 1ª fase 2027: a descoberta interior começa num espaço social, o quarto da empregada.',0],
    ['#Movimento 2: o quarto e a barata (seções 4 a 8)'],
    ['O quarto de Janair (seção 4)','Ela chama o quarto de <i>bas-fond</i> (o fundo, o lugar mais baixo da casa). Surpresa: está limpo, branco, seco como um deserto. Na parede, Janair desenhou a carvão um homem, uma mulher e um cão nus. G. H. custa a lembrar o nome e o rosto da empregada negra e percebe que, em seis meses, nunca a viu. Irritada, planeja lavar o quarto e raspar o desenho.','Caiu na 1ª fase 2027 (Q16): privilégio da patroa e servilismo da empregada. G. H. não é violenta com Janair: é indiferente.',1],
    ['A barata presa na porta (seções 5 e 6)','No guarda-roupa surge uma barata. G. H. bate a porta sobre ela, sem força bastante: a barata fica presa pela cintura, viva. Ao erguer a mão para o golpe final, vê a cara do bicho e desiste.','Pegadinha: não há esmagamento. A coisa nojenta vira uma vida que a olha.',0],
    ['A mulher da parede (seções 7 e 8)','Do corpo da barata, apertado pela porta e ainda vivo, sai devagar uma massa branca. Diante dela, G. H. sente que é a mulher nua desenhada por Janair na parede.','Antes queria apagar o desenho; agora aceita o retrato que Janair fez dela: uma mulher sem enfeites, sem nada que a esconda.',0],
    ['#Movimento 3: a travessia (seções 9 a 33)'],
    ['Nojo, memória e janela (seções 10 a 18)','Ela se sente suja como os animais que a Bíblia proíbe comer. Lembra um homem amado e um aborto. Reza à mãe imitando a Ave-Maria, com a barata no meio da oração. Da janela, vê o Rio como uma ruína antiga, com a favela no morro.','Procura Deus no nojento e, do alto, vê a cidade desigual que a cobertura escondia.',0],
    ['O ato (seção 30)','Decide pôr na boca a massa branca da barata. Chama esse gesto de antipecado: para ela, pecado seria continuar limpa e protegida. Vomita o café, avança de novo e perde a consciência numa vertigem; ao voltar, sabe que o gesto aconteceu. Depois cospe.','Clímax provável: o momento de comer não é narrado. Massa = hóstia ao contrário: em vez do pão sagrado da missa, ela comunga com o nojento.',1],
    ['Ato ínfimo e adoração (seções 31 a 33)','Conclui que buscou um gesto de santa; depois o chama de ato ínfimo, isto é, mínimo, nada heroico. Aceita que o mundo não depende dela e termina com o verbo adorar, no presente.','Desfecho provável: a revelação é desistir de entender. Quem queria marcar o quarto com suas iniciais termina sem nome, uma mulher qualquer.',1]
  ],
  pers:[
    ['G. H. (narradora)','Quer contar o que viveu, sabendo que as palavras falham. <b>Antes:</b> escultora amadora, rica, que se via pelos olhos dos amigos e pelas iniciais nas malas. <b>Depois:</b> diz não ter nome e quer ser uma mulher qualquer. Detalhe: lembra uma infância pobre, com percevejos no colchão.'],
    ['Janair (a empregada)','Negra, trabalhou seis meses ali e saiu na véspera. Nunca aparece nem fala. Deixa o quarto limpo e o desenho na parede, que funciona como um julgamento silencioso da patroa. Quem muda é o olhar de G. H.: de não vê-la a perceber que era vista por ela.'],
    ['A barata','Fêmea, presa pela cintura, de uma espécie antiquíssima. Representa a vida em estado bruto, anterior aos sentimentos e valores humanos, sem bem nem mal: é o que G. H. chama de neutro. A Bíblia a põe entre os animais impuros.'],
    ['O “tu” e a mão','Alguém imaginado a quem ela fala. <b>Antes:</b> pede que ele segure sua mão. <b>Depois:</b> na seção 21 larga a mão para seguir sozinha e, na 31, é ela quem oferece a mão ao outro.'],
    ['O homem amado','Lembrança de amor: ao beijar seus olhos, ela sentiu o sal das lágrimas. Às vezes é o “tu”.'],
    ['A mãe e Deus','A quem ela também fala: à mãe confessa ter matado uma vida e reza; a Deus fala no fim, dizendo-se batizada pelo mundo.']
  ],
  ap:'<p><b>Clarice antes e depois de G. H.:</b> no conto “Amor”, de <i>Laços de família</i> (1960), Ana tem uma epifania, uma revelação súbita, ao ver um cego mascando chiclete. G. H. leva o mesmo mecanismo ao extremo. Em <i>A hora da estrela</i> (1977), Clarice volta à desigualdade com Macabéa, nordestina pobre contada por um escritor de classe média: de novo, alguém de cima olha uma mulher que quase não tem voz.</p>'+
    '<p><b>Cenas secundárias que valem ponto:</b></p>'+
    '<p>• <b>A manchete do canyon (seção 2):</b> G. H. lembra o título de uma reportagem, que nunca leu, sobre uma mulher perdida num canyon escaldante lutando pela vida. Antecipa o quarto seco como deserto.</p>'+
    '<p>• <b>O telefone fora do gancho (seções 3 e 14):</b> para não ser perturbada, ela desliga o telefone; diante da barata, lembra que um toque poderia tê-la salvo. Ela mesma se trancou na experiência.</p>'+
    '<p>• <b>A infância pobre (seção 5):</b> menina, levantou o colchão e achou centenas de percevejos, numa casa com goteiras e ratos. Enriqueceu depois, investindo dinheiro: a patroa já esteve perto do outro lado.</p>'+
    '<p>• <b>A censura muda (seção 4):</b> G. H. desconfia que o silêncio de Janair escondia uma crítica à sua vida, e se pergunta se ela seria o homem do desenho e o cão, um apelido que a empregada lhe dava.</p>'+
    '<p>• <b>O sabá (seção 17):</b> sabá é a festa noturna das bruxas. Ela compara a alegria assustadora de se perder diante da barata a essa orgia, sem piedade nem esperança: o inferno sentido como prazer.</p>',
  cx:[
    '<b>A visão das plantas:</b> apagar a marca do outro. G. H. planeja raspar com faca o desenho de Janair e cobrir o colchão com um lençol bordado com suas iniciais; Celestino queima numa vala as roupas, rendas e bordados feitos pelas mulheres da família.',
    '<b>Canção para ninar menino grande:</b> a voz da mulher negra. Janair nunca fala e só deixa um desenho; Juventina, professora de música, conta sua história às amigas, e a narradora a escreve.',
    '<b>Memórias de Martha:</b> o trabalho doméstico visto de baixo e de cima. A mãe de Martha engoma roupa o dia todo para freguesas ricas; G. H. diz que, se não fosse rica, teria sido arrumadeira em casa de ricos.',
    '<b>Geografia:</b> Deus procurado nas coisas concretas. G. H. o busca no quarto seco como deserto, diante da barata; no último poema de Sophia, “Poema”, o eu procura Deus no mundo que vê, e em “No deserto” atravessa cidades mortas até um deserto limpo, símbolo de pureza.'
  ],
  aq:{p:'Na abertura, G. H. pede que alguém segure sua mão enquanto ela narra, embora não consiga inventar o rosto dessa pessoa. a) Explique a função dessa mão inventada. b) Mostre como a relação de G. H. com essa mão muda ao longo do romance e o que isso revela sobre sua transformação.',
    a:['A mão inventada cria um interlocutor, um “tu”, e transforma o monólogo de G. H. num diálogo e num pedido de amparo diante de uma experiência que a assusta.',
       'No começo ela depende dessa mão para conseguir falar; no meio da travessia diz que a mão a abandonou, corrige-se e admite que foi ela quem a largou para seguir sozinha; depois do ato, afirma que agora é ela quem dá a mão.',
       'A mudança acompanha a perda da terceira perna, o apoio postiço da identidade: G. H. passa da dependência de apoios à confiança de quem aceita o desconhecido, e termina capaz de amparar em vez de ser amparada.']}
});

// Enredo, personagens e aprofundar de Memórias de Martha (piloto). Fatos conferidos em textos/martha.txt.
Object.assign(BOOKS.find(b=>b.id==='martha'),{
  enT:'O enredo em 3 movimentos',
  fio:'Martha, já adulta, relembra como saiu do cortiço graças à escola. O estudo muda sua vida, mas a subida custa caro: ela casa sem amor e perde a mãe.',
  arco:'Martha: menina humilhada, que não se adapta ao cortiço → professora pública que se casa sem paixão, por amparo (proteção), e logo perde a mãe.',
  cenas:[
    ['#Movimento 1: o cortiço (caps. I a IV)'],
    ['A queda (cap. I)','Aos cinco anos, Martha vê o pai morto. Despejadas, mãe e filha vão para um cortiço em São Cristóvão, bairro do Rio. A mãe passa o dia engomando roupa para fora; as crianças do pátio chamam a tímida menina de “lesma”.','Martha não se adapta e conta tudo de dentro, em 1ª pessoa. Caiu na 1ª fase 2027 (Q14), contra Pombinha, de <i>O cortiço</i> (Aluísio Azevedo), moça que o cortiço molda.',1],
    ['O espelho de Lucinda (cap. I)','Na casa de uma freguesa rica da mãe, Martha se vê “triste e feia” num grande espelho ao lado de Lucinda, a filha da casa. Ganha um vestido usado, e Lucinda diz que ela parece um “macaquinho”.','A humilhação de ser pobre gera a inveja e a ambição que vão empurrá-la para o estudo.',0],
    ['Mathilde (cap. II)','Na escola de D. Anninha, Mathilde, colega mulata e pobre que ensinava Martha a ler, é acusada de furto e expulsa. Martha lhe vira as costas.','Mais de trinta anos depois, a narradora sente essa ingratidão como uma “nódoa” (mancha): lembrar é acertar contas com o próprio preconceito.',0],
    ['O segredo do pai (cap. IV)','A mãe revela: o pai foi acusado de roubar os patrões e se matou com veneno. Ela virou “a viúva de um ladrão”.','A queda é moral antes de ser econômica: perdida a boa fama, a família perde o lugar social. Isso explica o cortiço e o sonho de limpar o nome do pai.',0],
    ['#Movimento 2: a escola (caps. III, V e VI)'],
    ['Ordenado e chalé (caps. III e V)','O sonho de ser mestra nasce quando Martha ouve uma adjunta (professora auxiliar) agradecer o emprego que a livra de depender do irmão. Depois, Martha é nomeada e passa a receber ordenado (salário); mãe e filha alugam um chalé perto do colégio.','Para a Fuvest 2026, o cortiço é só lugar de passagem, e a força que transforma Martha é a educação.',1],
    ['A festa da mestra (cap. VI)','Aos vinte anos, Martha vai a uma festa de D. Anninha; a mãe espera na entrada, onde só os criados a veem. No espelho, Martha se vê humilhada e feia “como há doze anos”.','A escola abre a porta da casa rica, mas não faz Martha pertencer a ela: a barreira de classe continua.',0],
    ['#Movimento 3: amor e casamento (caps. VII a XII)'],
    ['Luiz, a ilusão (caps. VII a IX)','Doente dos nervos, Martha passa férias com a mestra em Palmeiras, no campo, e se apaixona por Luiz, que lhe dá versos; mas o vê abraçado a uma norte-americana, e ele se casará com Leonor, loura e muito alva.','A narradora adulta mostra que esse amor de romance era ilusão: traço do Realismo, que desmonta o amor idealizado.',0],
    ['Professora e noiva (caps. IX a XI)','Aprovada no concurso, Martha é nomeada professora pública no dia do casamento de Luiz. Miranda, vizinho que se apaixonou por ela lendo as cartas que ela mandava à mãe, pede sua mão. Martha diz que é independente, mas cede porque a mãe quer vê-la casada, e queima os versos de Luiz.','O nó do desfecho: independência conquistada pelo trabalho, mas casamento de proteção, sem paixão.',0],
    ['A morte da mãe (cap. XII)','No oitavo dia depois do casamento, a mãe adoece: o coração estava arruinado havia anos. Morre na poltrona, e Martha passa a noite ajoelhada ao lado dela.','O livro fecha no sacrifício da mãe: ela só cai quando a filha está protegida. Desfecho provável.',1]
  ],
  pers:[
    ['Martha (narradora)','Quer fugir do cortiço. <b>Antes:</b> menina tímida, chamada de “lesma”, que inveja Lucinda. <b>Depois:</b> professora pública e casada, que olha com ironia a menina que foi. Aos 24 anos, diz ter “uma posição independente”, mas cede ao casamento.'],
    ['A mãe (engomadeira)','Viúva que engoma dia e noite para pagar o estudo da filha e se esconde de uma antiga amiga rica. <b>Antes:</b> pura força de vontade. <b>Depois:</b> desaba quando sente que a filha já não precisa dela.'],
    ['D. Anninha (a mestra)','Dona da escola: dá a Martha estudo, emprego e as férias em Palmeiras; é madrinha do casamento. Modelo de mulher instruída, mas em sua casa Martha sente a barreira entre ricos e pobres.'],
    ['Mathilde','Colega mulata que ensina Martha a ler, acusada de furto e expulsa. Quem muda é Martha: da indiferença da menina à culpa da adulta.'],
    ['Carolina e Maneco','Filhos da ilhoa (vizinha portuguesa dos Açores), destruídos pelo cortiço. Maneco, viciado em cachaça pelo vendeiro, morre menino; Carolina, generosa, acaba explorada e espancada pelo marido num cortiço da Gamboa, outro bairro pobre do Rio.'],
    ['Clara Sylvestre','Amiga alegre da escola que reaparece anos depois, rica, enfeitada e chamada por rapazes num carro: o texto sugere, sem dizer, que ela vive de homens, a queda moral que Martha evitou.'],
    ['Luiz e Miranda','Luiz, estudante de medicina que não estuda, é o amor romântico e vazio. Miranda, solicitador (espécie de advogado sem diploma) de quarenta e tantos anos, adianta o dinheiro da viagem a Palmeiras: é a proteção sem paixão.']
  ],
  ap:'<p><b>Romance de formação no feminino:</b> esse tipo de romance costuma seguir um rapaz que sai de casa e conquista o mundo. Aqui a formação termina em profissão e casamento ao mesmo tempo. Júlia, que também escreveu livros de conselhos para mulheres, mantém essa mensagem dupla: instrução e trabalho, sim, mas dentro da família.</p>'+
    '<p><b>Cenas secundárias que valem ponto:</b></p>'+
    '<p>• <b>A mãe escondida (cap. I):</b> na rua, ela puxa a filha para um corredor para não ser vista por uma antiga amiga rica. A narradora só entende anos depois: havia “uma barreira” entre as duas. É a primeira lição sobre classe social no livro.</p>'+
    '<p>• <b>O crime do cortiço (cap. IV):</b> Giovanni mata o amigo Túlio, que juntava dinheiro com sacrifício, com um compasso no coração, para roubar suas economias. A narradora diz que o caso é banal, mas abalou seus nervos. É a violência típica do Naturalismo (a miséria gerando crime), mas contada pelo que a menina sentiu.</p>'+
    '<p>• <b>O motivo confessado (cap. III):</b> Martha admite que quis ser mestra mais para fugir do cortiço e por inveja do luxo de Lucinda do que por dever; mesmo assim, abençoa a decisão. A heroína não é perfeita.</p>'+
    '<p>• <b>A “ciência” do casamento (cap. XI):</b> a mãe ensina que, se a mulher for mais instruída que o marido, deve disfarçar a diferença. Martha sonha com dois espíritos afinados “pelo mesmo diapasão” (o instrumento que dá o tom para afinar), mas chama esse sonho de absurdo. Boa prova de que, no fim, ela se acomoda.</p>',
  cx:[
    '<b>Opúsculo humanitário:</b> Nísia (1853) denuncia, com dados de 1852, que só 8.443 dos 55.500 alunos das escolas públicas eram meninas; quase meio século depois, Martha sobe justamente pela escola pública e pelo concurso de professora.',
    '<b>Caminho de pedras:</b> nos dois livros o emprego dá dignidade à mulher, mas a moral pesa: Noemi é demitida porque as famílias que frequentam o estúdio reclamam dela; Martha, já independente, cede ao casamento que a mãe deseja.',
    '<b>A paixão segundo G. H.:</b> mulheres negras que a narradora só enxerga depois. G. H. lembra com esforço o nome da empregada Janair e percebe que nunca a viu; Martha sente, décadas depois, a culpa por ter abandonado Mathilde. A classe social vista de cima (G. H., rica) e de baixo (Martha, pobre).',
    '<b>A visão das plantas:</b> trabalho feminino apagado. Celestino queima numa vala roupas, rendas e bordados das mulheres da casa; em Martha, a mãe engoma até se acabar, e as rendas feitas pelas alunas, Martha entre elas, enfeitam a casa da mestra.'
  ],
  aq:{p:'Na casa de Lucinda, ainda menina, Martha se acha “triste e feia” diante de um grande espelho; anos depois, no toalete da festa de D. Anninha, volta a se ver humilhada e feia “como há doze anos”. a) Explique o que o espelho revela nas duas cenas. b) Considerando a trajetória inteira de Martha, explique o que mudou e o que permaneceu entre uma cena e outra.',
    a:['O espelho é símbolo da distância social: nele Martha se compara às moças ricas e se vê pobre, feia e fora do lugar.',
       'Entre as cenas ela mudou de vida, pois saiu do cortiço e ganha salário graças à escola; mas na festa a mãe espera na entrada, junto aos criados, e ninguém nota a ausência de Martha.',
       'Assim, o espelho mostra que a educação muda a condição material de Martha, mas não apaga a marca de classe nem a insegurança com o próprio corpo: a subida é real, porém incompleta e cara.']}

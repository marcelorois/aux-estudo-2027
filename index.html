+'<li><b>Opúsculo:</b> metáforas do “barômetro” da civilização (art. V) e da “boneca dos salões” (art. LXII); anáfora “Quereis ver...” (art. LIX).</li>'
+'<li><b>Memórias de Martha:</b> eufemismo e elipse no destino de Clara (cap. IX); enumeração de insultos e prosopopeia do ar (cap. I); os olhos da mãe sentidos “como brasas” (cap. I).</li>'
+'<li><b>Caminho de pedras:</b> metonímia “gravatas” × “tamancos” (cap. 8); comparação da multidão em fuga com uma boiada (cap. 12); polissemia de “companheiro” (cap. 27).</li>'
+'<li><b>Balada:</b> gradação hiperbólica dos números de esposas (cap. 3); metáfora do pilão (cap. 5); refrão “paga-me” (cap. 19).</li>'
+'<li><b>Canção:</b> neologismos (escrevivência, desmemória, dessentidos); paradoxo “pai, não pai”; nomes alegóricos de cidades e pessoas.</li>'
+'<li><b>A visão das plantas:</b> enumeração na queima das roupas (1ª fase de 2027); gradação da decadência; comparação da casa com o porão do navio (2ª fase de 2026).</li>'
+'</ul><p class="sub">Fontes das respostas oficiais: Fuvest, “Abordagens esperadas” 2023 (fuvest.br/wp-content/uploads/fuvest2023_abordagens_esperadas_2fase.pdf); “Caderno de respostas esperadas” 2024 (fuvest.br/wp-content/uploads/fuvest_2024_2024.01.22_RESPOSTAS_USP_Guia.pdf); “Guia de respostas” 2025 (fuvest.br/wp-content/uploads/fuvest_2025_guia_respostas.pdf); “Respostas esperadas” 2026 (fuvest.br/fuvest2026-fase2-dia1-respostas-esperadas.pdf).</p></section>';

FIGQ.push(
{p:'(Charge descrita) Uma escavadeira derruba árvores numa floresta. Na lateral da máquina, uma faixa diz “Progresso sustentável”. O operador, sorridente, comenta: “Estamos abrindo caminho para o futuro”. a) Em que consiste a ironia da charge? b) Explique o duplo sentido de “abrindo caminho”.',a:['A ironia está no choque entre o que as palavras prometem e o que a imagem mostra: a faixa fala em progresso “sustentável”, mas a cena é de destruição da floresta.','“Abrir caminho” tem sentido literal (rasgar uma passagem no mato, exatamente o que a escavadeira faz) e figurado (preparar o futuro); a fala do operador une os dois, e a imagem revela que o “caminho” aberto é o desmatamento.','A charge critica o discurso que usa palavras positivas para justificar a devastação: o futuro anunciado é, na verdade, a perda da floresta.']},
{p:'(Campanha descrita) Um cartaz de doação de órgãos mostra um coração desenhado com a linha de um eletrocardiograma e a frase “Doe de coração. Converse com sua família.”. a) Explique a polissemia da expressão “de coração”. b) Como imagem e texto se combinam para persuadir?',a:['“De coração” tem dois sentidos: o figurado, já fixo na língua (com sinceridade, por generosidade), e o literal, pois o coração é um dos órgãos que podem ser doados.','A imagem do coração ligado ao traço do eletrocardiograma ativa o sentido literal (um órgão vivo, que bate) sem apagar o figurado, e a segunda frase lembra que a decisão passa pela família.','A polissemia faz o leitor ver a doação como gesto afetivo e concreto ao mesmo tempo, como o “destino” da campanha de 2025 unia uma história de amor e a coleta de lixo.']},
{p:'(Crônica criada) “Na reunião do condomínio, todo mundo falou ao mesmo tempo durante um século. O síndico, para não brigar com ninguém, pôs panos quentes, e cada morador chovia no molhado: a garagem é pequena, a garagem é pequena. No fim, como sempre, tudo acabou em pizza.” Explique o sentido de “pôr panos quentes”, “chover no molhado” e “acabar em pizza” e o efeito do conjunto, apontando outro recurso do trecho.',a:['São expressões idiomáticas, de sentido figurado fixo: pôr panos quentes é amenizar um conflito sem resolvê-lo; chover no molhado, repetir o que já se sabe; acabar em pizza, terminar sem decisão ou sem punição.','O cronista reforça o sentido com outros recursos: repete a mesma queixa (a garagem é pequena) para encenar o chover no molhado e usa hipérbole em “durante um século” para exagerar a duração da reunião.','O conjunto produz o humor irônico da crônica: a reunião feita para resolver problemas não resolve nada, e as expressões populares resumem essa inutilidade com rapidez e graça.']},
{p:'(Texto criado, no estilo da questão 6 de 2025) “Dizem por aí que os jovens não leem mais. Lerão menos, de fato, os jovens de hoje? Não. Leem de outro jeito: em telas, em pedaços, em grupos.” a) Reescreva a pergunta na ordem direta. b) Explique o efeito expressivo da inversão.',a:['Na ordem direta, a pergunta seria: “Os jovens de hoje, de fato, lerão menos?”, com o sujeito antes do verbo.','Ao antecipar “lerão menos” e separar o sujeito com “de fato”, o autor põe em destaque justamente a afirmação que quer pôr em dúvida, retomando o “dizem por aí” do início.','A inversão transforma a pergunta numa refutação: o leitor percebe a dúvida do autor antes de chegar ao sujeito, e o “Não” seguinte confirma a posição contrária ao senso comum.']},
{p:'(Crônica criada) “Meu sobrinho sofre de notificacite aguda: qualquer vibração no bolso e ele interrompe a frase no meio. Tentei uma desplugação de fim de semana, mas ele teve crise de abstinência de curtidas.” a) Explique a formação de “notificacite” e “desplugação”. b) Que efeito esses neologismos produzem?',a:['“Notificacite” junta “notificação” ao sufixo “-ite”, usado na medicina para inflamações (gastrite, bronquite); “desplugação” vem de “plugar”, com o prefixo “des-” (ação contrária) e o sufixo “-ção” (ação ou resultado).','Os dois seguem regras reais da língua: o “-ite” transforma o hábito de olhar o celular em doença, e “desplugação” nomeia o tratamento, completado pela metáfora médica da “crise de abstinência”.','O efeito é humorístico e crítico: tratar o uso do celular como vício e doença mostra, com exagero, a dependência das redes, assim como “volância” e “centroavância” brincavam com o vocabulário do futebol em 2025.']},
{p:'(Poema criado) “Ainda há quem plante / onde o chão é só pedra. / Ainda há quem cante / depois que a festa acaba. / Ainda há quem espere / o trem que não vem mais: / vazia, a plataforma; / cheio de fé, quem fica.” a) Explique o efeito da repetição que organiza o poema. b) Identifique e explique uma antítese.',a:['A anáfora de “Ainda há quem” abre três frases seguidas e cria ritmo de insistência: cada repetição apresenta mais uma pessoa que resiste.','Essa insistência se apoia em antíteses: plantar no chão de pedra (vida × esterilidade), cantar depois do fim da festa e, no fecho, a plataforma vazia oposta a quem fica cheio de fé (versos em que o verbo está subentendido, um zeugma).','O poema une repetição e oposição para dizer que a esperança existe justamente onde tudo parece perdido, sentido concentrado no advérbio “ainda”.']},
{p:'(Notícia criada) “O Planalto não gostou da decisão; a Faria Lima comemorou, e o mercado, que tinha acordado nervoso, dormiu aliviado.” Identifique e explique as figuras usadas para nomear os atores dessa notícia.',a:['“Planalto” e “Faria Lima” são metonímias: o lugar substitui quem está nele (o Palácio do Planalto, sede da Presidência, pelo governo; a avenida paulistana dos bancos pelo setor financeiro).','Já o mercado que “acordou nervoso” e “dormiu aliviado” é prosopopeia: um conjunto abstrato de negociações ganha corpo e emoções humanas, como uma pessoa que dorme e acorda.','O efeito é de síntese e dramatização jornalística: a metonímia resume instituições numa palavra e a personificação torna viva a reação econômica, mas também esconde que, por trás do “mercado”, há pessoas e interesses concretos.']},
{p:'(Memórias de Martha, cap. IX) Martha reencontra Clara Sylvestre, colega da escola de D. Anninha que já sonhava com luxo, agora de cabelos pintados, lábios de carmim, joias e leque, chamada por rapazes num carro. Clara se despede: “Não pense mais em mim; eu não mereço a sua amizade.” Depois, Martha diz que a amiga tem no seu coração “um túmulo virginal, engrinaldado de rosas”. a) Que recursos o romance usa para tratar do destino de Clara? b) Compare os caminhos de Clara e de Martha.',a:['O romance trata o destino de Clara por eufemismo e elipse: nunca diz o que ela se tornou, mas sugere, pelos sinais de luxo, pelos rapazes e pela frase “eu não mereço a sua amizade”, uma vida que a moral da época considerava desonrosa; a metáfora do “túmulo virginal” enterra a menina inocente que Clara foi.','Martha, feia, tímida e pobre, se esgota nos estudos, passa nos exames e vira professora, e o próprio texto inverte os papéis ao ver em Clara a doçura dos “vencidos bons” diante dos “vencedores da vida”.','O eufemismo respeita o pudor da narradora, mas o contraste expõe a tese do romance: para a moça pobre, a saída digna é o estudo e o trabalho, a mesma força transformadora, a educação, que a resposta oficial de 2026 apontou no livro.']},
{p:'(Opúsculo humanitário) No art. V, Nísia Floresta afirma que o lugar que a mulher ocupa num povo “é o barômetro que indica os progressos de sua civilização”; no art. LXII, pede aos pais que ensinem às filhas que a mulher “não foi criada para ser a boneca dos salões”. a) Identifique e explique as duas figuras. b) Relacione-as à crítica que a obra faz à educação feminina no Brasil.',a:['As duas são metáforas: o “barômetro”, instrumento que mede a pressão do ar, passa a medir a civilização pela condição da mulher; a “boneca dos salões” transfere para a moça os traços de um objeto enfeitado, sem vontade, feito para ser exibido.','A primeira sustenta a tese do livro, já anunciada na abertura que interpela os “Povos do Brasil, que vos dizeis civilizados”; a segunda resume o que o art. XLVII critica na chamada “boa educação” das meninas: dança, piano, um pouco de francês e bordados para a sala, sem formar o raciocínio.','Juntas, as metáforas mostram o argumento de Nísia: a educação de enfeite produz bonecas, e só uma formação moral e intelectual sólida faria do Brasil uma nação de fato civilizada.']},
{p:'(Nebulosas, “Invocação”) O poema enfileira estrofes iniciadas por “Quando...” (a noite, o pescador, os mundos no éter, a brisa, a cascata) e, depois de desejar voar à pátria como cisne ou condor, a voz diz: “Mas, ó pátria, são frágeis as asas!”; adiante, ao tentar elevar-se no espaço, as rajadas lhe “arremessam a frase – mulher!...”. a) Identifique dois recursos expressivos e explique seu efeito. b) Relacione esses versos à condição da mulher poeta em Nebulosas.',a:['Há anáfora de “Quando”, que acumula imagens da natureza até um clímax de desejo, e há aposiopese: a frase se interrompe em “mulher!...”, com exclamação e reticências, como se a palavra bastasse para cortar o voo (há ainda apóstrofe à pátria e a metáfora das asas frágeis).','A conjunção “Mas” quebra o crescendo da anáfora; o condor que a voz quer ser é a ave da poesia condoreira de Castro Alves, homenageado no livro, e o obstáculo não é a falta de talento, e sim a palavra que define seu sexo.','Em forma romântica, Narcisa denuncia que o século XIX limitava a mulher que escrevia, e o livro inteiro desafia esse limite ao tratar de política, escravidão e república, temas tidos como masculinos.']},
{p:'(Caminho de pedras, cap. 8) Na organização, o narrador conta que os intelectuais formavam o grupo dos “gravatas” e os operários, o dos “tamancos”; os primeiros afetavam uma simplicidade que o narrador chama de artifício de gente requintada, e os segundos passaram a exigir que eles se “proletarizassem”. a) Identifique a figura presente em “gravatas” e “tamancos” e explique seu efeito. b) Relacione essa divisão à crítica que o romance faz à própria militância.',a:['É metonímia: a peça de vestuário (a gravata do escritório, o tamanco do trabalho braçal) substitui as pessoas e a classe a que pertencem, por uma relação real de proximidade.','Os apelidos mostram que, num partido que pregava a igualdade, a diferença de classe continuava visível até nos pés, e o narrador ainda ironiza a simplicidade fingida dos intelectuais; no cap. 21, os camaradas julgam Noemi com a mesma moral conservadora do patrão que a demite.','A metonímia condensa o tema do livro: a revolução sonhada esbarra em preconceitos de classe e de gênero dentro da própria esquerda, e Noemi termina vivendo de verdade a vida dura de trabalhadora que os “gravatas” apenas encenavam.']},
{p:'(Balada de amor ao vento, cap. 3) Quando Mwando revela que vai casar com a moça escolhida pelos pais, Sarnau, em lágrimas, diz aceitar ser a segunda ou a terceira mulher; se ele tivesse dez, seria a décima primeira; se tivesse cem, a centésima primeira. Mwando responde que ela não será nem segunda, nem terceira, nem centésima primeira, porque é cristão e não aceita a poligamia. a) Identifique os recursos da fala de Sarnau e explique o efeito. b) Relacione o episódio ao modo como o romance trata o amor e a poligamia.',a:['A fala de Sarnau é uma gradação crescente que termina em hipérbole (de segunda a centésima primeira esposa), e Mwando a devolve em forma negativa, com os mesmos números: a repetição transforma a súplica em recusa.','O exagero mostra uma moça disposta a se anular para ficar com o amado e expõe o choque entre a tradição polígama e a moral cristã da missão; logo depois Sarnau entra na lagoa para morrer e acaba casada, pelo lobolo de 36 vacas, com Nguila, num lar de várias esposas onde é humilhada.','O romance fala de amor com números de contabilidade (ordinais, vacas, preços), e no desfecho é Sarnau quem repete “paga-me” e cobra a dívida de Mwando: a gradação do cap. 3 é o primeiro sinal de que, nesse mundo, o amor da mulher é medido e negociado.']},
{p:'(Canção para ninar menino grande) Na introdução, a narradora diz perseguir uma “escrevivência”; em outros momentos, o livro fala da “desmemória” de Tina sobre o pai e dos “dessentidos” dos fios amorosos de Fio Jasmim. a) Explique a formação dessas palavras e o sentido que adquirem. b) Relacione-as ao papel da narradora no romance.',a:['“Escrevivência” funde “escrever” e “vivência” numa só palavra (cruzamento vocabular, uma palavra-valise); “desmemória” e “dessentidos” juntam o prefixo “des-”, de negação ou privação, a “memória” e “sentidos”, criando o avesso dessas ideias.','A narradora se apresenta como testemunha que escuta e escreve vidas de mulheres que se confundem com a sua, admitindo que contar e recontar já são atos incompletos; os prefixos negativos nomeiam o que falta: o que se esqueceu e o que, nos amores de Fio, não faz sentido.','Os neologismos mostram que a língua pronta não basta para dizer essas experiências: é preciso inventar palavras, e a escrevivência é a missão de memória que a resposta oficial de 2026 destacou ao comparar Canção com As meninas.']},
{p:'(A visão das plantas) Perto do fim do romance, Celestino volta do bosque para casa, como diz a narração, cada vez mais cego, mais velho, mais tonto e “mais morto”, acompanhado por uma velha negra que cuida dele como uma ama. a) Identifique o recurso e explique o que o último termo acrescenta. b) Relacione o trecho ao estado de Celestino na velhice e ao desfecho do romance.',a:['É uma gradação de adjetivos intensificados por “mais”, que acompanha a decadência do corpo; o último termo rompe a lógica, porque a morte não admite grau, e cria um paradoxo: Celestino já está morto em vida.','Na velhice, como diz a resposta oficial de 2026, ele vive em tormento: os trovões despertam a “arte antiga” de marinhar e a casa vira porão de navio; agora as vítimas voltam como figuras que o lavam e alimentam, e a velha negra é associada à própria morte, de quem ele fica “amigo” sem saber.','A gradação mostra que o corpo se apaga mais depressa do que a culpa aparece: Celestino morre sem punição, e a ironia do desfecho está em o carrasco ser cuidado até o fim por quem ele destruiu.']},
{p:'(A paixão segundo G. H.) Nas 33 seções do romance, a frase que fecha uma seção é repetida no início da seguinte. O livro começa com uma fileira de travessões antes da primeira palavra e termina com outra depois da última, e a última frase usa o verbo “ser” de um modo que a gramática não admite. a) Que nome recebe a repetição entre as seções e qual o seu efeito? b) Explique como esses recursos formais se ligam à experiência narrada.',a:['É a anadiplose (o fim de uma unidade retomado no início da seguinte), aqui em escala de livro: as seções se encadeiam como elos, e o texto avança como um pensamento contínuo que precisa voltar atrás para seguir.','Os travessões fazem o livro parecer o trecho de uma fala que já tinha começado e que não termina, e a frase final agramatical mostra que, depois do encontro com a barata, a narradora tenta dizer algo que a língua comum não comporta.','A forma imita o conteúdo: G. H. perde a vida organizada “entre aspas” e chega a uma experiência que só consegue dizer forçando a sintaxe, o que confirma o tema central do romance, o limite da linguagem.']}
);

XCARDS.push(
['Polissemia ou ambiguidade: qual a diferença?','Polissemia: uma palavra com dois sentidos ativados (“destino”). Ambiguidade: o enunciado inteiro admite duas leituras, muitas vezes por um pronome (“Preserve suas raízes”).'],
['O que a banca disse do “suas” no anúncio do Greenpeace (2023)?','Ambiguidade: as raízes são da árvore e do leitor; preservar a natureza é preservar a espécie humana, porque uma depende da outra.'],
['Fórmula para explicar ironia numa charge?','A palavra faz esperar algo (infográfico = números); a imagem mostra outra coisa (dinheiro × papelão); o choque gera a crítica.'],
['Que três figuras a banca aceitou no boi gigante da charge de 2026?','Metonímia (um boi = a pecuária), metáfora (comer árvores = desmatar) e hipérbole (boi maior que as árvores).'],
['Em “bochecha da rede” (2025), que figura a banca aceitou além de metáfora e personificação?','Catacrese, resultado de uma metaforização anterior.'],
['O que significa o sufixo -ância em “volância” (2025)?','Estado ou qualidade duradouros; substitui o sufixo de agente -nte (volante → volância).'],
['Como se formaram “fluviante” e “flutual” (2026)?','Por troca de sufixos: o esperado seria fluvial e flutuante.'],
['Como explicar uma inversão sintática?','Dê a ordem direta (sujeito + predicado) e diga o que o termo antecipado destaca; em 2025, “Irá mal...” expõe a dúvida e prepara a refutação.'],
['Função do “já não” repetido em Paulo Freire (2023)?','Anáfora: cinco orações negam as ações do educador bancário e enfatizam a superação dessa prática.'],
['O que a banca disse do verso “E as ideias” (2025)?','É estribilho que rompe a métrica e reforça o caráter subversivo das ideias que anunciam a Inconfidência.'],
['O que é anadiplose?','Repetir no início de uma frase a palavra que fechou a anterior (“Ambição gera injustiça. / Injustiça, covardia.”). Em G. H., liga uma seção à seguinte.'],
['A resposta oficial de 2024 chama Rubião de “uma espécie de” quê?','De metonímia: em escala reduzida, ele reflete a ambição nacional de imitar o centro.'],
['Como responder sobre expressão idiomática?','Sentido literal ou de origem + sentido figurado + uso no texto (cumprir tabela: jogar sem objetivo, só para completar o calendário).'],
['O que é aposiopese? Exemplo na lista?','Frase interrompida por reticências. Em “Invocação”, de Narcisa Amália, o voo da poeta é cortado pela “frase – mulher!...”.'],
['Que figura há em “gravatas” e “tamancos”, em Caminho de pedras?','Metonímia: a roupa pela classe (intelectuais × operários) dentro da organização.'],
['Que recurso Sarnau usa ao aceitar ser a “centésima primeira” esposa?','Gradação que termina em hipérbole; Mwando repete os números negando, e a súplica vira recusa.'],
['Como se formou “escrevivência”?','Cruzamento de escrever + vivência (palavra-valise): escrita feita da vida, missão da narradora de Canção.'],
['Que metáfora mede a civilização no Opúsculo (art. V)?','O “barômetro”: o lugar da mulher num povo indica o progresso de sua civilização.'],
['Como Memórias de Martha trata o destino de Clara Sylvestre?','Por eufemismo e elipse: luxo, rapazes e a frase “eu não mereço a sua amizade” sugerem, sem nomear, uma vida tida como desonrosa.'],
['Enumeração ou gradação em A visão das plantas?','Enumeração na queima das roupas (acúmulo = apagamento do trabalho; 1ª fase 2027); gradação na decadência de Celestino, que termina em “mais morto”.']
);

Object.assign(BOOKS.find(b=>b.id==='geografia'),{
perto:[
['1. “Ingrina” e “Manhã”: recomeçar o mundo (parte I)','<p><b>O que acontece.</b> Em “Ingrina” (poema em prosa), a cigarra, o orégão e o sol fazem o eu esquecer a morte, as perdas e os desastres; ele recomeça em cada coisa, leva um lírio da pequena praia e escreve na areia, na cal e na pedra que naquela manhã recomeça o mundo. Em “Manhã”, no terraço branco, o eu não acha seu pranto nem sua sombra: a luz o liga ao mar e o “reúne”.</p><p><b>Como está escrito.</b> Prosa ritmada, com <b>repetição</b> do trio cigarra, orégão, sol (efeito de rito). <b>Substantivos concretos</b> (cal, pedra, areia, lírio). A praia é o lugar do “primeiro dia”, como no Gênesis. Em “Manhã”, versos longos sem pontuação e <b>sinestesia</b> (cheiro e luz que tocam).</p><p><b>O que significa.</b> É o ponto de partida do livro: o real luminoso devolve inteireza. O eu não se projeta na paisagem, ele se <b>encontra</b> nela. Essa limpidez será a medida contra a sordidez da parte II.</p><p><b>Como cairia.</b> Relacionar o recomeço da parte I com “Poema”, que fecha o livro (a biografia do eu é a terra, o sol, o vento e o mar); efeito da enumeração concreta.</p>'],
['2. “Mundo nomeado ou descoberta das ilhas” e “De pedra e cal” (parte I)','<p><b>O que acontece.</b> Viajantes vão de cabo em cabo dando nome a baías, promontórios e enseadas; as praias surgem como se fossem chamadas, e as coisas que estavam no “sem-nome” respondem ao nome como se fossem criadas. Em “De pedra e cal”, a cidade branca do sul, de campanários, labirintos e escadas, é um xadrez jogado só com pedras brancas.</p><p><b>Como está escrito.</b> Um só período, quase sem pontuação; o sujeito fica oculto no verbo (a palavra “navegadores” não aparece). <b>Paralelismo</b> e rima no fim das estrofes (chamadas / criadas). <b>Prosopopeia</b>: as coisas respondem. Em “De pedra e cal”, <b>anáfora</b> do título, versos curtos (perto da redondilha) e <b>polissemia</b>: os cavalos do xadrez viram cavalos-marinhos; as “moiras” podem ser as mouras do passado árabe ou as Moiras gregas do destino.</p><p><b>O que significa.</b> Nomear é criar: o poeta repete o gesto dos descobridores, fazendo as coisas existirem pela palavra. É uma arte poética escondida na parte I, que celebra a descoberta como ato de linguagem, sem falar de conquista.</p><p><b>Como cairia.</b> Nomear = criar (comparar com “Poema de Helena Lanari”); polissemia de “moiras”; descoberta celebrada × violência colonial (<i>A visão das plantas</i>).</p>'],
['3. “Procelária”: o poeta no mau tempo (parte II)','<p><b>O que acontece.</b> A procelária, ave das tempestades, aparece com vento e grandes ondas, faz o ninho na fúria do mar, voa firme como bala, empresta as asas ao temporal, passa sobre os abismos. Não procura rocha, cabo ou cais: faz da insegurança sua força e do risco de morrer seu alimento. O eu conclui que ela é a imagem “justa” para quem continua vivendo e cantando no mau tempo.</p><p><b>Como está escrito.</b> 11 versos: 9 descrevem a ave em 3ª pessoa; os 2 últimos, abertos por “Por isso”, tiram a lição em 1ª pessoa. É a estrutura de um <b>emblema</b> (imagem + moral). <b>Comparação</b> (como bala), <b>metáfora</b> (ondas = leões do mar, sem “como”), <b>enumeração</b> sem vírgulas (rocha, cabo, cais), <b>paradoxos</b> (insegurança = força). “Justa” é <b>polissêmica</b>: exata e conforme à justiça.</p><p><b>O que significa.</b> O mau tempo é o tempo político: ditadura, censura, guerra colonial. O poeta não foge para o porto seguro; canta dentro da tempestade. Por isso o poema dá nome à parte política.</p><p><b>Como cairia.</b> Identifique a figura e explique o efeito; relacione o mau tempo ao Portugal de 1967; diga que poemas da parte confirmam a leitura.</p>'],
['4. “Cidade dos outros”, “Eu me perdi”, “Esta gente”: limpidez contra sordidez (parte II)','<p><b>O que acontece.</b> <b>“Cidade dos outros”</b>: uma desonestidade imensa cobre a cidade; há combinações sem gestos nem sinais; o mal se entende com o mal, e tudo se compra e vende; essa cidade bate à nossa porta. <b>“Eu me perdi”</b> (o poema da Q27 da 1ª fase): o eu se perdeu num mundo sórdido onde era preciso ser polícia, agiota, fariseu ou cocote; salvou-se na limpidez da terra, buscou-se no vento, encontrou-se no mar, e nenhum navio partiu sem levá-lo. A Fuvest só reproduziu a 2ª estrofe; a 1ª, com os quatro tipos sociais, torna a sordidez concreta (força, dinheiro, hipocrisia, corpo vendido). <b>“Esta gente”</b>: o rosto do povo, marcado por paciência e fome, lembra ora escravos, ora reis; nele um país ocupado escreve seu nome; diante dessa gente pisada como pedra, o canto se renova e busca um país liberto, uma vida limpa e um tempo justo, contra o abutre, a cobra, o porco e o milhafre.</p><p><b>Como está escrito.</b> “Cidade dos outros”: adjetivos acumulados sem vírgula, <b>anáfora</b> de “sem”, rimas (cidade / desonestidade). “Eu me perdi”: <b>anáfora</b> (Eu me...), <b>antíteses</b> em cadeia (perdi × salvei; sordidez × limpidez, com o mesmo final “-idez”), <b>gradação</b> (perder, salvar, buscar, encontrar) e dupla negação final (nunca... sem = sempre). “Esta gente”: versos curtos de ritmo popular, rimas ocasionais, <b>antítese</b> (escravos × reis), <b>bestiário alegórico</b>, <b>gradação</b> (pisada como a pedra e mais que a pedra), enumeração ternária final.</p><p><b>O que significa.</b> É o eixo da Fuvest: a natureza (terra, vento, mar) é <b>critério moral</b>. O que é limpo e exposto mede e denuncia o que é combinado às escondidas e vendido. “País ocupado” sugere um Portugal ocupado por dentro, pelo próprio regime.</p><p><b>Como cairia.</b> Anáfora e antítese em “Eu me perdi”; sentido de “país ocupado”; comparação com o poema de <i>Mar novo</i> usado na redação Fuvest 2026 (os “outros” que se compram e se vendem).</p>'],
['5. “Túmulo de Lorca”: os mortos sem nome (parte II)','<p><b>O que acontece.</b> Falando a García Lorca (morto por forças nacionalistas em agosto de 1936, perto de Granada; o corpo nunca foi achado), um “nós” chora nele todos os fuzilados e presos sem nome, tão ignorados que nem se pode perguntar por eles. Recusa aceitar a morte: o sangue não seca, a sepultura é ferida aberta, a cal dos muros escreve que ele foi assassinado; por mais que o escondam, ele não fica sepultado.</p><p><b>Como está escrito.</b> <b>Apóstrofe</b> (fala a Lorca); voz <b>coletiva</b>; <b>anáfora</b> seca (não podemos aceitar); <b>hipérbole</b> (afogados no sangue de Norte a Sul); <b>prosopopeia</b>: a cal, pureza na parte I, vira testemunha; <b>metáforas</b> de animal bruto (cornos, patada da besta), que antecipam o touro do Minotauro; <b>polissemia</b> de “processo” (judicial e histórico); <b>paradoxo</b> final (escondido, mas não sepultado).</p><p><b>O que significa.</b> Falar de um crime espanhol era um modo de falar dos presos e mortos sem nome da Península, inclusive em Portugal, sem nomear o regime sob censura. A poesia recusa o esquecimento: memória e denúncia.</p><p><b>Como cairia.</b> Por que uma portuguesa homenageia Lorca em 1967; a prosopopeia da cal; comparação com as prisões políticas de <i>Caminho de pedras</i>.</p>'],
['6. “Os aviões”, “Néon” e a casa à noite: duas luzes, duas noites (partes II e III)','<p><b>O que acontece.</b> <b>“Os aviões”</b>: numa noite de luar, um avião passa rápido e inofensivo sobre os muros brancos da casa, e tudo volta à calma. Mas noutro lugar, bandos passaram em voos de terror, a morte nasceu dos ovos que deixaram, e depois a lua não achou as flores e ninguém morava nos muros brancos. <b>“Néon”</b>: luz crua que não envolve as coisas, as desventra; tudo vira interior violado, quarto saqueado. Na parte III, ao contrário, em <b>“Vela”</b> e <b>“A noite e a casa”</b>, a pequena chama e a noite <b>reúnem</b> a casa ao silêncio.</p><p><b>Como está escrito.</b> “Os aviões” é <b>espelhado</b>: a segunda metade repete, negadas, as imagens da primeira (lua, flores, muros brancos, cipreste): <b>antítese estrutural</b> aqui × noutro lugar. <b>Metáfora</b>: o avião é pássaro, as bombas são ovos. “Néon”: frases nominais e metáforas de violência. “Vela”: <b>anáfora</b> (em redor da luz) e <b>prosopopeia</b> (a casa atenta, espantada).</p><p><b>O que significa.</b> O livro distingue a luz que rodeia e reúne da luz de máquina que invade; a noite que recolhe da noite do bombardeio. O lugar da guerra não é nomeado (o leitor de 1967 podia pensar na guerra colonial, mas o poema não diz): a indeterminação universaliza e escapa da censura.</p><p><b>Como cairia.</b> Antítese e metáfora em “Os aviões”; mostrar que “noite” não é sempre negativa no livro (nuance que dá nota).</p>'],
['7. “Epidauro” e “Electra”: o mito grego a serviço da justiça (parte V)','<p><b>O que acontece.</b> <b>“Electra”</b>: no calor do verão, o grito de Electra atravessa as cigarras, persegue as Fúrias nos sepulcros e expõe crimes e remorsos na claridade dos pátios para convocar a justiça dos deuses. <b>“Epidauro”</b> (prosa): no país da luz, cada coisa é trazida à liberdade da luz; a voz gritou para destruir o <b>Minotauro</b>, que devora os anos da nossa vida e se disfarça de polvo, de duplo, de circular, de multiplicidade do real, até se ver que é um homem com a violência do touro. Só na manhã de Epidauro há libertação.</p><p><b>Como está escrito.</b> “Electra”: versos longos, <b>anáfora</b> (o seu grito), <b>metáfora</b> (o grito de Electra = a insônia das coisas). “Epidauro”: <b>gradação</b> (trazida à luz, à liberdade da luz, ao espanto da luz), frases curtas, <b>alegoria</b> e <b>desmascaramento</b> do monstro; “teoria” das sílabas guarda o sentido grego de procissão (<b>polissemia</b>).</p><p><b>O que significa.</b> A Grécia não é refúgio turístico: é o lugar da luz que expõe e da justiça. O Minotauro é a tirania que devora a vida e se finge complexa. É o mesmo eixo da Q27 noutro cenário: luz contra labirinto.</p><p><b>Como cairia.</b> Alegoria do Minotauro; refutar a leitura do “refúgio idílico no Mediterrâneo” (alternativa errada na 1ª fase).</p>'],
['8. “Descobrimento”: a chegada como gênese (parte VI)','<p><b>O que acontece.</b> Um “nós” de navegantes atravessa o oceano, descrito como corpo de músculos verdes, ídolo de muitos braços como um polvo, bailarino em volta dos navios; as ondas são cavalos que sacodem as crinas nos ventos alísios. O mar fica de repente muito novo e muito antigo para mostrar as praias e um povo de homens recém-criados, cor de barro, nus e deslumbrados.</p><p><b>Como está escrito.</b> Série de <b>metáforas</b> do mar; <b>paradoxos</b> (caos incorruptível, tumulto ordenado, novo e antigo); <b>anáfora</b> de “ainda” no fim, marcando o tempo da origem. Os cavalos de crina repetem “De pedra e cal”: o mar liga o Algarve ao Brasil.</p><p><b>O que significa.</b> A descoberta vira gênese (o barro lembra Adão), retomando o tópico da carta de Caminha (gente nua e inocente). O deslumbramento do outro é <b>projetado</b> por quem chega, e a violência colonial fica fora do poema. Não é exaltação imperial, mas também não é crítica explícita.</p><p><b>Como cairia.</b> Com a Carta de Caminha (texto externo); com <i>A visão das plantas</i> (o mar do navio negreiro); ponto de vista do “nós”.</p>'],
['9. “Manuel Bandeira”, “Brasília” e “Poema de Helena Lanari” (parte VI)','<p><b>O que acontece.</b> <b>“Manuel Bandeira”</b>: o poeta está do outro lado do mar, mas a voz dele é conhecida desde a juventude da portuguesa, que recitava na casa antiga a balada das três mulheres do sabonete Araxá (para espanto da avó) e lia “Trem de ferro” e “Poema do beco”. <b>“Brasília”</b>: cidade de Lúcio Costa, Niemeyer e Pitágoras, lógica e lírica, grega e brasileira; no planalto, a arquitetura escreveu a paisagem; o Brasil saiu do barroco e achou seu número; no fim da caminhada dos candangos, Atena ergueu no reino de Ártemis uma cidade clara como um pensamento. <b>“Poema de Helena Lanari”</b>: o prazer de ouvir o português do Brasil, que pronuncia todas as sílabas e devolve às palavras a substância; quando Helena dizia “coqueiro”, o coqueiro ficava mais vegetal.</p><p><b>Como está escrito.</b> “Manuel Bandeira”: memória, <b>intertextualidade</b> (três títulos de Bandeira), <b>oxímoro</b> (antigo jovem tempo), <b>prosopopeia</b> (os poemas caminham com ela). “Brasília”: <b>enumeração</b> de pares <b>antitéticos</b> conciliados, <b>comparações</b>, <b>metáfora</b> da escrita (planalto = página), antítese mitológica Ártemis (natureza) × Atena (razão). “Helena Lanari”: <b>comparações</b> (palavras como frutos, como pássaros) e <b>hipérbole</b> humorística.</p><p><b>O que significa.</b> O Brasil é lugar de encontro: com um poeta, com uma cidade que realiza a medida grega no trópico, com uma língua que devolve peso às palavras. Inversão: em “Descobrimento” o português vê; aqui a portuguesa aprende. A parte nasce da viagem de Sophia ao Brasil em 1966. “Brasília” não menciona o golpe de 1964.</p><p><b>Como cairia.</b> Foto de Brasília × poema; “Helena Lanari” × “Poesia de inverno”; intertextualidade com Bandeira.</p>'],
['10. “Poesia de inverno” e “Poema”: a poética do livro (parte VII)','<p><b>O que acontece.</b> <b>“Poesia de inverno”</b> (epígrafe de <i>Ricardo III</i>, fala de um rei tirano): é a poesia de um tempo sem deuses, de palavras envergonhadas e arrependidas; ninguém ousa dizer seda, nácar, rosa, porque ninguém mais teceu a seda nem colheu a rosa; o rio já não é sagrado; o homem pede residência num quartel provisório de sobreviventes; o coração busca as palavras do verão. <b>“Poema”</b> (fecho do livro): a vida do eu é o mar, abril, a rua; seu interior é atenção dirigida para fora; não traz Deus em si, procura-o no mundo; a terra, o sol, o vento e o mar são sua biografia; por isso recusa cartão de identidade, opiniões, entrevistas, datas e moradas.</p><p><b>Como está escrito.</b> “Poesia de inverno”: <b>anáfora</b> (poesia...), <b>enumeração</b> de palavras “poéticas”, <b>metáforas</b> (pinças assépticas, caserna provisória), versos quase prosa e <b>antítese</b> inverno × verão. “Poema”: frases curtas e afirmativas, <b>paradoxo</b> (o interior voltado para fora), <b>anáfora</b> negativa (não me peçam), <b>enumeração</b> em assíndeto.</p><p><b>O que significa.</b> O livro termina dizendo como foi feito: a poeta só tem a identidade que o mundo lhe dá. “Poesia de inverno” é o diagnóstico (palavras gastas, sem sagrado); “Poema” é a resposta (voltar às coisas). Recusar ser ficha e documento, num país com polícia política, também soa como resistência (leitura possível).</p><p><b>Como cairia.</b> “Poema” × Romantismo (<i>Nebulosas</i>); “Poema” × <i>G. H.</i> (o sagrado no real); sentido da epígrafe de Shakespeare.</p>']
],
critica:'<p><b>Contexto.</b> Portugal viveu sob ditadura de 1926 a 1974; a partir de 1933, o <b>Estado Novo</b> de Salazar (que governou até 1968; depois, Marcelo Caetano): censura, polícia política (PIDE), presos políticos e, desde 1961, <b>guerra colonial</b> em Angola, Guiné e Moçambique. São as datas que a Fuvest deu na Q27 da 1ª fase 2027. <i>Geografia</i> sai em <b>1967</b> (Lisboa, Edições Ática; 2ª edição aumentada em 1972).</p><p><b>A autora.</b> Sophia (Porto, 1919 – Lisboa, 2004) estreou com <i>Poesia</i> (1944) e publicou nos <i>Cadernos de Poesia</i>, sem se prender a grupo. Fez parte dos fundadores da Comissão Nacional de Socorro aos Presos Políticos e, depois do 25 de Abril, foi deputada constituinte (1975) pelo Partido Socialista. Prêmio Camões (1999). Num texto lido em 1964 (a “Arte poética III”), defendeu, em resumo, que o poeta que olha o real por inteiro é levado à <b>busca da justiça</b> pela própria natureza da sua poesia. Essa é a chave da leitura oficial.</p><p><b>Brasil (verificado).</b> A parte VI nasce de uma <b>viagem ao Brasil em 1966</b>, um ano antes do livro (Cristian Pagoto, revista <i>Entrelinhas</i>, 2018; reportagem da Tribuna PR, que a diz amiga de Murilo Mendes, Manuel Bandeira e João Cabral). O poema “Manuel Bandeira” mostra uma relação de <b>leitura</b> desde a juventude; um encontro pessoal com Bandeira não foi verificado.</p><p><b>A Fuvest e Sophia.</b> A redação da 2ª fase 2026 trouxe um poema de <i>Mar novo</i> que opõe “os outros”, que se mascaram, se calam, se compram e se vendem, a um “tu” que anda de mãos dadas com os perigos. Na 1ª fase 2027 (Q27), “Eu me perdi”: a paisagem é <b>parâmetro de verdade e transparência</b> que denuncia, por contraste, a opacidade moral do regime. Erradas: paisagem egocêntrica, exaltação imperial, refúgio idílico no Mediterrâneo, regionalismo saudosista.</p><p><b>Leituras que dão nota.</b></p><ul><li><b>Paisagem como ética:</b> o que é nítido, exterior e iluminado é critério de verdade; o que é escondido, combinado, vendido ou violento é denunciado (“Cidade dos outros”, “Eu me perdi”, “Esta gente”, “Epidauro”).</li><li><b>Não é fuga:</b> a Grécia de Sophia é luz que expõe e justiça (Electra, o Minotauro), não refúgio.</li><li><b>Beleza com drama:</b> Luís Adriano Carlos (<i>Teoliterária</i>, 2019) mostra que a beleza em Sophia, tida como serena, tem também um lado dramático e dionisíaco (o grito de Electra, a tempestade da procelária, o sangue de Lorca).</li><li><b>Nuance 1:</b> a noite da casa (parte III) é positiva, recolhe e reúne; o negativo é a luz de máquina que viola (“Néon”) e o que se esconde.</li><li><b>Nuance 2:</b> “Da transparência” desconfia de um eu inteiramente transparente: a limpidez é do olhar sobre o mundo.</li><li><b>Nuance 3:</b> “Descobrimento” se encanta com a chegada e deixa de fora a violência colonial; bom ponto de comparação com <i>A visão das plantas</i>.</li></ul><p><b>Forma.</b> Verso livre de tamanho muito variável (de dísticos a versos quase prosa), poemas em prosa (“Ingrina”, “Epidauro”), pontuação mínima, enumeração de substantivos concretos, anáfora, frases nominais. Há também versos curtos de ritmo popular e rimas ocasionais nos poemas mais cantáveis (“Esta gente”, “Cidade dos outros”, “Ali, então”). Títulos que são lugares ou pessoas fazem do livro um mapa.</p><p><b>Escola.</b> Moderna (verso livre, poema em prosa, metalinguagem na parte VII, diálogo com a escultura e a arquitetura do século XX) e clássica (mito grego, medida, clareza, confiança na palavra que nomeia). Não é neorrealista (sem documento social nem panfleto) nem surrealista (a imagem é nítida). Diferente do Romantismo, o eu não se projeta na natureza: recebe-se dela.</p><p><b>Fontes:</b> O Tempo, resolução da Q27 da Fuvest 2027; prova Fuvest 2026 (2ª fase, redação); C. Pagoto, “Imagens poéticas do Brasil no livro Geografia...”, <i>Entrelinhas</i> (Unisinos), 2018; Tribuna PR; L. A. Carlos, “O drama da beleza na poesia de Sophia...”, <i>Teoliterária</i>, 2019; L. F. C. Drumond, dissertação (UFMG, 2018); Britannica (Lorca e Bandeira). Links completos no arquivo de aprofundamento.</p>',
qbank:[
{p:'(Texto externo: Caminha) Na carta de 1500, Pero Vaz de Caminha descreve os habitantes da terra como “pardos, maneira de avermelhados”, que “andam nus, sem cobertura alguma” (ortografia atualizada). a) Compare essa descrição com o povo que aparece no fim de “Descobrimento”. b) Mostre como a parte “Brasil ou do outro lado do mar” desloca, nos poemas seguintes, o ponto de vista de quem “descobre”.',a:['“Descobrimento” retoma o tópico de Caminha (gente nua, cor de barro, inocente), mas o transforma em gênese: o povo parece recém-criado e deslumbrado, como Adão feito do barro, e esse deslumbramento é projetado por quem chega.','O poema é dito por um “nós” de navegantes, para quem o mar fica novo e antigo para revelar praias e um povo; já em “Poema de Helena Lanari” a portuguesa aprende com a fala brasileira, que devolve às palavras a substância, e em “Manuel Bandeira” é o poeta brasileiro que a acompanha desde a juventude.','Assim a parte passa do olhar europeu que vê o outro como origem, herdeiro de Caminha, ao diálogo entre iguais, em que o Brasil ensina língua e poesia a Portugal.']},
{p:'(Imagem descrita) A <i>Vitória de Samotrácia</i> (Louvre, séc. II a.C.) é uma estátua grega de mármore: a deusa alada pousa na proa de um navio, asas abertas, o manto colado ao corpo pelo vento. a) Explique por que “Senhora da rocha” começa negando que a santa seja como a Vitória à proa. b) Relacione o contraste entre deuses gregos e santa cristã a outros poemas do livro.',a:['A série de negações (anáfora de “Nem”) define a santa por contraste: ela não é a vitória gloriosa exposta ao vento e à luz, mas uma pequena imagem de madeira, pintada como um barco, inclinada em prece numa capela do promontório.','O poema diz que o reino dos antigos deuses não venceu a morte e que por isso a santa reza por nós até o fim do mundo, enquanto os deuses de mármore afundam; em “Crepúsculo dos deuses”, a glória grega termina no vazio que nos separa das coisas, e em “Poema” o eu procura Deus no mundo real.','A estátua representa a exaltação pagã da luz, que o livro admira, mas <i>Geografia</i> reconhece seu limite diante da morte e procura um sagrado atento à fragilidade humana.']},
{p:'(Texto externo: notícia) Reportagens sobre os 90 anos da morte de García Lorca lembram que ele foi morto por forças nacionalistas perto de Granada, em agosto de 1936, e que seus restos nunca foram encontrados. a) Explique o paradoxo final de “Túmulo de Lorca”: por mais que o escondam, o morto não fica sepultado. b) Por que uma poeta portuguesa escreve esse poema em 1967 e o põe na parte “Procelária”?',a:['O paradoxo diz que esconder o corpo não apaga o crime: a memória e a denúncia mantêm Lorca “insepulto”, isto é, presente e acusador.','O poema chora em Lorca todos os fuzilados e presos sem nome, repete que não pode aceitar sua morte e faz a cal dos muros escrever que ele foi assassinado (prosopopeia); está ao lado de “Esta gente” e “Cidade dos outros”, sobre um país ocupado e corrompido.','Sob a ditadura portuguesa, com censura e presos políticos, falar do crime espanhol era um modo de falar dos mortos sem nome da Península, e a parte “Procelária” reúne justamente a poesia que canta no mau tempo.']},
{p:'(Comparação: Nebulosas) Na 1ª fase da Fuvest 2027, a banca afirmou que, em “Desengano”, de Narcisa Amália, a natureza é extensão do eu, como é próprio do Romantismo. a) Explique por que essa definição não serve para “Poema”, que fecha <i>Geografia</i>. b) Aponte um ponto em comum entre as duas poetas na relação entre natureza e política.',a:['Em Narcisa o eu se projeta na paisagem (o poente espelha sua dor); em Sophia acontece o contrário: o eu se define pelo mundo, e seu interior é atenção dirigida para fora.','Em “Poema”, a terra, o sol, o vento e o mar são a biografia e o rosto do eu, que recusa documentos e entrevistas e diz crescer com tudo o que vê; em “Manhã”, a luz o reúne em vez de refletir sua tristeza.','Apesar da diferença, as duas fazem da natureza critério político: Narcisa liga o cosmos à liberdade e à abolição, e Sophia faz da limpidez da terra e do mar a medida contra a sordidez do regime (“Eu me perdi”, “Esta gente”).']},
{p:'(Comparação: G. H.) Em <i>A paixão segundo G. H.</i> (1964), a narradora encontra o quarto da empregada branco, seco e iluminado como um deserto, e ali chega ao sagrado pelo contato com a matéria crua da barata. a) Que semelhança há com a busca do sagrado em <i>Geografia</i>? b) Em que as duas experiências diferem?',a:['As duas obras procuram o divino no real concreto, e não em ideias: G. H. no “neutro” da matéria viva; Sophia na luz, no mar e nas coisas, como em “Poema”, em que Deus não está dentro do eu, mas é buscado no mundo.','Há imagens comuns, o branco e o deserto: em “No deserto” o eu doma o cavalo de si mesmo para chegar ao deserto limpo, e em “Caminho” morre cega de brancura; em G. H., o quarto branco e seco é o deserto onde a identidade se desfaz.','A diferença está no resultado: em Clarice o encontro com o real desmonta o eu e passa pelo nojo, enquanto em Sophia o real luminoso reúne e dá medida, numa forma breve e clara que se opõe ao fluxo do romance.']},
{p:'(Obra inteira: a palavra) a) Explique a imagem do “inverno” em “Poesia de inverno”, considerando a epígrafe de <i>Ricardo III</i> e o momento histórico. b) Mostre em que poemas o livro encontra as “palavras do estio” que o fim desse poema procura.',a:['O inverno é um tempo sem deuses e de descrença, em que as palavras perderam a substância porque ninguém mais faz as coisas com as mãos; a epígrafe, tirada da fala de um rei tirano, sugere também um inverno político.','O poema diz que ninguém ousa mais dizer seda, nácar, rosa, compara o trabalho do poeta a pinças assépticas e o homem a quem pede residência num quartel provisório de sobreviventes; o “estio” aparece em “Mundo nomeado”, em que as coisas respondem ao nome como se fossem criadas, e em “Poema de Helena Lanari”, em que a fala brasileira devolve às palavras a substância total.','O livro dramatiza a crise da linguagem moderna, mas responde a ela com a confiança na palavra que nomeia o real, o que é ao mesmo tempo sua poética e seu modo de resistir.']},
{p:'(Obra inteira: Mediterrâneo) Uma alternativa errada da 1ª fase dizia que Sophia busca abrigo “na beleza atemporal do Mediterrâneo” para ignorar as tensões históricas. a) Explique a alegoria do Minotauro em “Epidauro”. b) Use outro poema da parte “Mediterrâneo” para mostrar que a Grécia de Sophia não é refúgio.',a:['O Minotauro é a tirania que devora a vida (come os anos e o pão dos nossos dias) e se disfarça de complexidade (diz ser duplo, circular, a multiplicidade do real), até se revelar um homem com a violência do touro.','O eu grita para destruir o monstro e o palácio e só se liberta na luz de Epidauro, onde cada coisa é trazida à liberdade da luz; em “Electra”, o grito da heroína expõe crimes e remorsos na claridade dos pátios para convocar a justiça dos deuses.','Na Grécia de Sophia, a luz é instrumento de verdade e justiça contra o que se esconde, o mesmo eixo dos poemas de “Procelária”; por isso o Mediterrâneo é lugar de resistência, não de fuga.']},
{p:'(Escola) <i>Geografia</i> é poesia moderna de 1967, mas recorre a mito grego, medida e serenidade. a) Cite dois traços modernos do livro. b) Explique em que ele se afasta da vanguarda e da poesia neorrealista de seu tempo.',a:['São modernos o verso livre com pontuação mínima, os poemas em prosa (“Ingrina”, “Epidauro”) e a metalinguagem, que ocupa toda a última parte (“No poema”).','Ao mesmo tempo, o livro busca a clareza clássica (Electra, o Minotauro, as colunas de Sunion, as “formas justas” de “Brasília”), usa versos curtos e rimas ocasionais (“Esta gente”, “Ali, então”) e denuncia a opressão por imagens (procelária, Minotauro, cidade dos outros), não por panfleto ou documento social.','Sophia é moderna sem romper com a tradição: em vez da fragmentação de vanguarda ou do realismo programático, aposta na nitidez da palavra como forma de verdade e de justiça.']},
{p:'(Figuras) a) Identifique duas figuras de linguagem em “Procelária” e explique seu efeito. b) Explique por que esse poema abre a parte política do livro.',a:['Há comparação (a ave voa firme e certa como bala) e paradoxo (faz da insegurança sua força e do risco de morrer seu alimento), além da metáfora que chama as ondas de leões do mar (sem “como”: por isso é metáfora, e não comparação).','A comparação dá à ave precisão e coragem, e o paradoxo inverte a lógica do medo; nos dois versos finais, abertos por “Por isso”, o eu chama a ave de imagem “justa” para quem continua vivendo e cantando no mau tempo, adjetivo que significa exata e conforme à justiça.','Como emblema do poeta que não procura abrigo, a procelária anuncia os poemas seguintes (“Cidade dos outros”, “Esta gente”, “Túmulo de Lorca”), escritos no mau tempo da ditadura e da guerra colonial.']},
{p:'(Figuras e símbolo) a) Identifique a antítese e a metáfora que estruturam “Os aviões” e explique o efeito de cada uma. b) Mostre, com outros poemas, que em <i>Geografia</i> a “noite” nem sempre é negativa e explique o que ocupa, no livro, o lugar da opacidade e da violência.',a:['O poema opõe o avião que passa inofensivo sobre a casa ao que, noutro lugar, bandos fazem ao deixar ovos de onde nasce a morte (metáfora das bombas), e repete na segunda metade, negadas, as imagens da primeira (lua, flores, muros brancos, cipreste).','Na parte “A noite e a casa”, a noite reúne a casa ao silêncio e a pequena chama a torna atenta (“Vela”); o negativo está na luz de máquina que desventra e viola o interior como um quarto saqueado (“Néon”), nas combinações secretas da “Cidade dos outros” e nas cadeias de “Túmulo de Lorca”.','A antítese entre a paz próxima e a morte distante, e a diferença entre a noite que recolhe e a luz que viola, mostram que o livro não opõe simplesmente claro e escuro, mas o real exposto com verdade à violência escondida ou imposta.']}
]
});

Object.assign(BOOKS.find(b=>b.id==='gh'),{
perto:[
['1. A terceira perna e a mão inventada (seção 1)','<p><b>O que acontece.</b> Antes de contar qualquer fato, G. H. diz que perdeu algo como uma terceira perna, que a deixava estável mas não a deixava andar. Tem medo de se reorganizar depressa numa nova mentira. Para conseguir falar, inventa uma mão que segura a sua.</p><p><b>Como está escrito.</b> Começa no meio de uma frase, depois de travessões. Frases que se corrigem, perguntas sem resposta, paradoxos (a covardia como a maior aventura). A <b>metáfora</b> da terceira perna resume o livro: a identidade social é uma prótese.</p><p><b>O que significa.</b> O livro tenta dar forma a uma experiência sem forma, sabendo que contar é trair o vivido. A mão inventada (apóstrofe a um “tu”) transforma o monólogo em diálogo.</p><p><b>Como cairia.</b> Identifique a metáfora e explique; por que o romance começa com travessões e no meio da frase.</p>'],
['2. À mesa do café: a vida entre aspas (seção 2)','<p><b>O que acontece.</b> G. H. se descreve: escultora amadora, solteira, sem filhos, independente, mora numa cobertura que vê como criação artística, faz bolinhas de miolo de pão e monta com elas uma pirâmide. Nas fotos, vê um sorriso sobre um vazio. Suas iniciais estão no couro das malas.</p><p><b>Como está escrito.</b> Autorretrato irônico, com imagens de cópia, citação e réplica: a casa e ela vivem entre aspas. As iniciais funcionam como <b>metonímia</b> de uma pessoa reduzida à marca.</p><p><b>O que significa.</b> É o retrato da pessoa organizada que vai desabar: ela é o que os outros veem nela. O nome reduzido a iniciais anuncia a perda do nome no final.</p><p><b>Como cairia.</b> Transformação da personagem (antes e depois); sentido do título e das iniciais.</p>'],
['3. O quarto e o mural de Janair (seção 4)','<p><b>O que acontece.</b> G. H. chama o quarto dos fundos de <i>bas-fond</i> da casa. Esperando sujeira, ela encontra o quarto de empregada limpo, branco, seco, iluminado como deserto, alto como um minarete. Na parede, o contorno a carvão de um homem, uma mulher e um cão, nus, rígidos, de mãos espalmadas. Ela demora a lembrar o nome e o rosto da empregada; percebe que Janair a odiava (ou que ela, sem olhar, a odiara) e que Janair foi a primeira pessoa de fora do seu meio cujo olhar ela sentiu.</p><p><b>Como está escrito.</b> Descrição minuciosa do traço; comparações com múmias e autômatos; Janair vista como uma rainha africana, estrangeira dentro da casa. O desenho não é enfeite: é escrita, mensagem.</p><p><b>O que significa.</b> Centro da leitura social: o quarto dos fundos, herança da casa-grande, guardava uma mulher negra que a patroa não via. O mural é o julgamento de quem nunca teve voz. Janair nunca fala, e seu nome só aparece nesta seção.</p><p><b>Como cairia.</b> É o excerto mais provável: relação patroa e empregada, classe e raça, espaço simbólico (sala × quarto dos fundos).</p>'],
['4. O plano de “limpar” o quarto (seções 3 e 4)','<p><b>O que acontece.</b> G. H. planejava deixar o quarto pronto para a próxima empregada. Diante do mural, decide jogar baldes de água até o deserto virar lama, raspar o carvão com faca, apagar as figuras e cobrir o colchão com um lençol seu, de <b>iniciais bordadas</b>. Imagina a foto do quarto já transformado em coisa sua e se alivia. Ela mesma diz que queria matar alguma coisa ali.</p><p><b>Como está escrito.</b> <b>Gradação</b> de violência (lavar, encharcar, apodrecer, raspar, apagar), em contraste com a calma de antes. Detalhe social: ela diz que arrumar é sua única vocação e que, se não fosse rica, seria arrumadeira em casa de ricos.</p><p><b>O que significa.</b> Arrumar vira apagar a marca da outra e reocupar o espaço com o próprio nome. Cuidado: é um plano imaginado contra o quarto e o desenho, não uma agressão a Janair, com quem a relação foi de indiferença e invisibilidade. Essa cólera desemboca no golpe contra a barata.</p><p><b>Como cairia.</b> A casa como espaço de poder; relação com o desfecho (quem queria impor suas iniciais termina sem nome).</p>'],
['5. O golpe e a cara da barata (seções 5 e 6)','<p><b>O que acontece.</b> Ao abrir o guarda-roupa, a barata se move junto ao rosto de G. H. Ela tropeça entre a cama e o armário e fica encurralada. Com uma alegria de matar, fecha a porta sobre a barata, mas sem força: a barata fica viva, presa pela cintura, erguida como uma cariátide. Quando ergue a mão para o golpe final, vê a cara da barata e <b>desiste</b>.</p><p><b>Como está escrito.</b> Tempo desacelerado: segundos ocupam páginas. Comparações fazem a barata antiquíssima (fóssil, lenda, anterior aos dinossauros) e quase humana (rosto, olhos de noiva). A última imagem da seção 6 abre a seção 7 (encadeamento).</p><p><b>O que significa.</b> Ver a cara do bicho é o ponto sem volta: ela deixa de olhar uma coisa nojenta e passa a ver uma vida que a olha. A barata continua viva quase até o fim.</p><p><b>Como cairia.</b> Epifania; tempo psicológico; símbolo da barata. Pegadinha: ela não esmaga a barata de uma vez.</p>'],
['6. A mulher gravada na parede (seção 8)','<p><b>O que acontece.</b> A massa branca começa a sair da barata. G. H. se manda gritar e não grita; sente que sai do seu mundo para entrar no mundo. Recua dentro de si até a parede e se sente a mulher do desenho, como uma pintura de caverna de milhares de anos.</p><p><b>Como está escrito.</b> Imagens de arqueologia e pré-história; paradoxos (um silêncio luxuoso, uma eternidade que é danação).</p><p><b>O que significa.</b> Inverte a cena do mural: antes ela queria raspar o retrato feito por Janair; agora se reconhece nele, despida de tudo. A experiência pessoal vira experiência da espécie. A identificação com a mulher da parede volta nas seções 15 e 23.</p><p><b>Como cairia.</b> Relação entre o mural e o desfecho; transformação da personagem.</p>'],
['7. O imundo, a Ave-Maria às avessas e o aborto (seções 10 e 14)','<p><b>O que acontece.</b> G. H. se sente impura como os animais que a Bíblia proíbe comer (ela cita o Levítico). Lembra-se grávida, andando pelas ruas antes de um aborto já combinado com um médico, olhando manequins de vitrine. Depois fala com a mãe: confessa ter matado uma vida e reza na forma da Ave-Maria, bendizendo a barata.</p><p><b>Como está escrito.</b> <b>Intertextualidade e paródia</b>: versículos e oração católica aplicados ao que é nojento. Apóstrofes ao médico e à mãe.</p><p><b>O que significa.</b> O sagrado é procurado no imundo. A barata (fêmea, presa pela cintura, de olhos como ovários) liga-se à maternidade negada: a vida neutra que pulsa sem pedir licença.</p><p><b>Como cairia.</b> Religião às avessas; título como paródia da Paixão; corpo feminino.</p>'],
['8. A janela: o Rio como ruína antiga (seção 18)','<p><b>O que acontece.</b> Depois de dormir no colchão, como uma barata parada na parede, G. H. vai à janela. Os telhados viram planaltos da Ásia Menor e deserto; ela vê a favela no morro, uma cabra subindo, gente como mercadores antigos. Imagina-se arqueóloga escavando o Rio de Janeiro, cidade de ouro e pedra com multidões de mendigos.</p><p><b>Como está escrito.</b> Metáfora prolongada (alegoria) da escavação; tempos misturados (o presente como pré-história do futuro); enumerações e números exagerados (<b>hipérbole</b>).</p><p><b>O que significa.</b> Tempo e espaço se deformam: o quarto é um minarete fora da história. A cena também mostra a cidade desigual que a cobertura dominava sem enxergar.</p><p><b>Como cairia.</b> Tempo psicológico; espaço simbólico; leitura social pela vista do alto.</p>'],
['9. O ato: vômito, vertigem, cuspe (seção 30)','<p><b>O que acontece.</b> G. H. entende que a redenção teria de estar na própria coisa: pôr na boca a massa branca, o que ela chama de antipecado. Avança, vomita o leite e o pão do café, fica simples como uma menina, avança de novo e perde a consciência numa <b>vertigem</b>; ao voltar, sabe que o gesto aconteceu. Cospe com fúria, lembrando o Apocalipse sobre os mornos, até perceber que está se renegando.</p><p><b>Como está escrito.</b> Gradação (passo a passo), suspense físico (suor, dentes cerrados) e <b>elipse</b>: o momento de comer não é narrado.</p><p><b>O que significa.</b> É a comunhão invertida (a massa como hóstia às avessas). Mas o ato some na vertigem: nem aqui ela toca a coisa sem transcender.</p><p><b>Como cairia.</b> Clímax; paródia religiosa; ordem dos fatos.</p>'],
['10. A desistência e o verbo adorar (seções 31 a 33)','<p><b>O que acontece.</b> G. H. conclui que não precisava ter comido a massa: buscara um gesto de santa, um acréscimo. Fala em despersonalização e em desistir como escolha; diz que a condição humana é a paixão de Cristo. Planeja até jantar e dançar naquela noite. Sente confiança, sente-se batizada pelo mundo, chama o gesto de <b>ato ínfimo</b> (não heroico), aceita que o mundo independe dela e que não entende o que diz. Termina com o verbo adorar, no presente, e travessões.</p><p><b>Como está escrito.</b> Paradoxos em série (quanto menos é, mais vive), ritmo de oração, linguagem que confessa o próprio fracasso.</p><p><b>O que significa.</b> O final não é compreensão, é entrega. A mulher das iniciais termina sem nome, uma mulher qualquer. Os travessões finais ecoam os iniciais: a experiência continua fora do livro.</p><p><b>Como cairia.</b> Desfecho; epifania; limites da linguagem; comparação com a abertura.</p>']
],
critica:'<p><b>Duas leituras, sempre juntas.</b> A crítica lê G. H. pelo lado existencial e místico (a perda do eu, o neutro, Deus achado no imundo) e, cada vez mais, pelo lado social (Janair, o quarto de empregada, classe e raça). A Fuvest usou as duas: na <b>1ª fase de 2027 (questão 16 da V1, gabarito B)</b>, partiu de um fotograma do teaser (2024) do filme de Luiz Fernando Carvalho, com a bandeira do Brasil colada à porta do quarto da empregada (detalhe que não está no livro), e da frase em que G. H. diz que, ao ir da sala para aquele quarto, estava perto da descoberta de um “império”. A correta: a bandeira indica que esse “império” revela as fraturas da ordem familiar e social da classe patronal brasileira; Clarice leva para dentro do apartamento o drama do privilégio e do servilismo. Segundo a resolução do Objetivo, o quarto de Janair, que a narradora chama de <i>bas-fond</i>, oposto à cobertura, é um microcosmo da desigualdade. Alternativas erradas diziam que G. H. foi violenta e autoritária com Janair (o livro mostra indiferença, não maus-tratos), que ela chega a compreender Janair ou que o quarto é primitivo e sujo (ele é limpo). Fontes: Fuvest 2027, 1ª fase, questão 16 (V1); resoluções do Curso Objetivo e de O Tempo. No simulado oficial de 2027, a correta sobre a barata falava em jornada de despojamento do humano e das máscaras sociais.</p>'+
'<p><b>Benedito Nunes</b> (filósofo e crítico): leu o livro como experiência mística às avessas (ensaio “A experiência mística de G. H.”, em <i>O mundo de Clarice Lispector</i>) e, em <i>O drama da linguagem</i> (1995), mostrou o “fracasso da linguagem” como motor da obra: a palavra só se aproxima do vivido quando falha.</p>'+
'<p><b>Olga de Sá</b>: em <i>A escritura de Clarice Lispector</i> (1979) criou a ideia de “(anti)epifania”, a revelação que desmonta em vez de iluminar; em <i>A travessia do oposto</i> (1993) leu G. H. como paródia séria da Paixão de Cristo (imitação com desvio, sem deboche).</p>'+
'<p><b>Antonio Candido</b>, no ensaio “No raiar de Clarice Lispector” (sobre <i>Perto do coração selvagem</i>, 1943–44), viu na estreante uma tentativa ambiciosa de renovar a linguagem do romance brasileiro. G. H. radicaliza esse projeto.</p>'+
'<p><b>Biografias:</b> Benjamin Moser, <i>Clarice, uma biografia</i> (2009), destaca a origem judaica e a busca mística; Nádia Battella Gotlib, <i>Clarice: uma vida que se conta</i> (1995). Outros estudos aproximam a náusea de G. H. à de Roquentin, em <i>A náusea</i>, de Sartre.</p>'+
'<p><b>Leitura social:</b> artigos recentes (Francisco Pires, 2019; Natália Felix Amaral e Ravel Paz, 2018; Ludmilla Carvalho Fonseca, 2018) leem Janair como a mulher negra silenciada pela soma de raça, classe e gênero, e o quarto dos fundos como herança doméstica da escravidão.</p>'+
'<p><b>O filme</b> (Luiz Fernando Carvalho; Maria Fernanda Cândido como G. H. e Samira Nancassa, de Guiné-Bissau, como Janair) estreou no Festival do Rio em 2023 e nos cinemas em 2024 (a Fuvest o cita como 2024, pelo teaser oficial).</p>'+
'<p><b>Contexto:</b> publicado em 1964, ano do golpe militar, sem tratar de política diretamente. A crítica social vem pelo avesso: a cobertura que domina a cidade e não vê a favela, a empregada negra invisível.</p>'+
'<p><b>Escola:</b> confirma a prosa intimista da 3ª fase do Modernismo (fluxo de consciência, tempo psicológico, epifania) e a leva ao extremo: quase não há enredo, a epifania destrói a identidade, o romance vira ensaio filosófico e a narradora discute a própria escrita.</p>',
qbank:[
{p:'(Texto externo: filme) No teaser oficial do filme <i>A paixão segundo G. H.</i> (Luiz Fernando Carvalho, 2024), um plano mostra a bandeira do Brasil colada à porta do quarto de empregada, detalhe que não existe no livro. No romance, G. H. começa a narrar aquela manhã dizendo que, ao sair da sala para o quarto da empregada, estava a um passo da descoberta de um império. a) Que leitura do romance a bandeira propõe? b) Que elementos do livro sustentam essa leitura?',a:['A bandeira propõe ler o “império” descoberto no quarto de empregada também como o Brasil: a relação entre G. H. e Janair expõe as fraturas da ordem social da classe patronal, feita de privilégio de um lado e servilismo do outro.','No livro, o quarto é o <i>bas-fond</i> da cobertura, nos fundos; G. H. não entrava lá havia seis meses, mal lembra o nome e o rosto da empregada negra e percebe que a tratava como se ela não tivesse presença; Janair deixa na parede um desenho que funciona como julgamento silencioso da patroa.','A bandeira torna explícito o que Clarice deixa implícito: o espaço doméstico herdado da escravidão é uma imagem do Brasil, e a crise de G. H. começa quando ela é obrigada a ver a outra.']},
{p:'(Texto externo: crítica) Benedito Nunes fala em “fracasso da linguagem” na obra de Clarice: a palavra só se aproxima do vivido quando falha. a) Explique a ideia com um momento em que a narradora comenta a própria linguagem. b) Relacione-a ao final do romance.',a:['Em G. H., a narradora sabe que dizer é trair a experiência, e por isso o livro avança corrigindo e desdizendo o que diz.','Na abertura, ela teme inventar um sentido só para ser entendida e comemora ter perdido o medo de uma imagem feia; no fim, afirma que a palavra mentiria por ela, que não entende o que diz, e termina com o verbo adorar e travessões.','O fracasso da linguagem é método: só quando desiste de compreender G. H. chega ao indizível, e a última palavra é adoração, não explicação.']},
{p:'(Texto externo: epígrafe) O romance tem como epígrafe uma frase do crítico de arte Bernard Berenson que, em paráfrase, diz: uma vida completa talvez termine numa identificação tão plena com o não-eu que não reste um eu para morrer. a) Relacione a epígrafe à experiência de G. H. b) Mostre como o final retoma essa ideia.',a:['A epígrafe antecipa a jornada de despojamento de G. H.: perder as máscaras sociais e o próprio eu para se identificar com a vida impessoal.','A mulher das iniciais gravadas nas malas, que vivia entre aspas, passa pela barata, sente-se a mulher do mural e termina falando em despersonalização, dizendo que a vida nela não tem o seu nome e que o mundo independe dela.','O desfecho realiza a epígrafe: a completude não vem de se afirmar, mas de desistir de si, o que o livro chama de desistência e trata como revelação.']},
{p:'(Espaço) No início, G. H. planeja lavar o quarto de empregada, raspar o desenho da parede e cobrir o colchão com um lençol seu, de iniciais bordadas. a) O que o plano revela sobre a relação de G. H. com o espaço e com Janair? b) Como o desfecho inverte esse plano?',a:['O plano revela o desejo de apagar a marca da empregada e reocupar o quarto com o próprio nome, reafirmando a posse da patroa.','Ela quer encharcar o quarto-deserto, raspar com faca o homem, a mulher e o cão desenhados por Janair e imagina a foto do quarto já transformado em coisa sua; diz que queria matar alguma coisa ali, impulso que se descarrega no golpe contra a barata.','O desfecho inverte tudo: em vez de impor as iniciais ao quarto, G. H. se reconhece na mulher da parede, perde o nome e aceita que o mundo independe dela.']},
{p:'(Desfecho) a) Por que o momento em que G. H. põe na boca a massa da barata é narrado de modo indireto? b) Como ela reavalia esse gesto até a última seção?',a:['O gesto é elidido porque nem ali G. H. consegue tocar a coisa sem transcender: ela age numa vertigem e só sabe depois que o gesto aconteceu.','Ela vomita o café, avança, perde a consciência apoiada no guarda-roupa, volta a si e cospe com fúria lembrando o Apocalipse; depois conclui que buscara um gesto de santa, um acréscimo, e na seção final o chama de ato ínfimo, não heroico.','A transformação não está no gesto espetacular, mas na renúncia ao heroísmo: G. H. sai sem pose de heroína, confiante e sem entender, e planeja até voltar à vida comum naquela noite.']},
{p:'(Figuras) A narradora chama o inferno de tortura de uma alegria e diz que sua nova covardia é sua maior aventura. a) Identifique a figura de linguagem e explique o efeito. b) Por que ela é central no romance?',a:['É o paradoxo (oxímoro): termos opostos, como inferno e alegria, covardia e coragem, fundidos no mesmo ser.','Diante da barata, G. H. sente nojo e êxtase ao mesmo tempo, acha o horror bom e chama de antipecado o gesto de comer o que é imundo.','A figura é central porque a experiência do neutro não cabe nas oposições da lógica comum (bem e mal, belo e feio); só a contradição consegue apontar para ela.']},
{p:'(Figuras) Na abertura, G. H. diz ter perdido uma terceira perna que a mantinha estável, mas a impedia de andar. a) Identifique e explique o recurso. b) Relacione-o ao percurso da personagem até o final.',a:['É uma metáfora: a terceira perna é a identidade montada para os outros, um apoio artificial que dá segurança e imobiliza.','Antes, G. H. era a mulher realizada das iniciais nas malas, da casa como réplica artística e do sorriso vazio nas fotos; diante da barata essa montagem desaba, e ela teme criar outra perna depressa.','O final completa a metáfora: em vez de buscar novo apoio, ela desiste de se reorganizar numa nova verdade e aceita andar sem garantias, entregue ao que não entende.']},
{p:'(Escola) A paixão segundo G. H. é considerada exemplo extremo da prosa intimista da 3ª fase do Modernismo. a) Cite dois traços que confirmam essa filiação. b) Indique um aspecto em que o romance radicaliza ou rompe essa estética.',a:['A obra confirma a prosa intimista pelo fluxo de consciência em 1ª pessoa e pelo tempo psicológico.','Uma manhã no quarto de empregada ocupa 33 seções de reflexão, memória e delírio, encadeadas porque a frase final de cada uma reabre a seguinte; mas o livro quase não tem enredo, começa e termina com travessões e traz uma epifania que destrói a identidade em vez de confirmá-la.','G. H. leva a introspecção ao limite: a ação vira pensamento, e a própria linguagem se torna personagem ao confessar que não alcança o vivido.']},
{p:'(Comparação) Em <i>A paixão segundo G. H.</i> e em <i>A visão das plantas</i>, uma vida não humana (a barata, as plantas) é indiferente ao julgamento moral, e um espaço doméstico guarda uma violência histórica. a) Compare o efeito desse contato em G. H. e em Celestino. b) Compare o espaço da casa nas duas obras.',a:['Nas duas obras a natureza não julga, mas o efeito é oposto: G. H. é desmontada e se transforma; Celestino não se arrepende e morre em paz.','A barata que olha G. H. a faz perder a identidade e repensar moral, beleza e Deus; as plantas florescem para o velho negreiro sem gratidão nem condenação, e ele recusa a confissão ao padre Alfredo.','Na casa de G. H., o quarto de empregada guarda a herança da escravidão na figura de Janair; na de Celestino, casa e quintal repetem o navio e o porão: nos dois romances o espaço íntimo carrega a história que os protagonistas preferiam não ver.']},
{p:'(Comparação) Em <i>Memórias de Martha</i> e em <i>A paixão segundo G. H.</i>, uma narradora em 1ª pessoa lembra uma mulher negra ou mulata excluída, por quem sente algo próximo da culpa. a) Identifique essas personagens e o lugar social de cada narradora. b) Compare o modo como cada obra trata essa culpa.',a:['Em Martha, é Mathilde, a colega mulata e pobre acusada de roubo; em G. H., é Janair, a empregada negra. Martha narra de baixo, a pobre que sobe; G. H. narra de cima, a patroa que desce ao quarto dos fundos.','Martha abandona Mathilde como as outras e ainda sente essa mancha trinta e tantos anos depois; G. H. percebe que nunca viu Janair, mal lembra seu rosto e se pergunta se foi odiada ou se foi ela quem odiou sem olhar.','Nos dois livros a lembrança expõe o preconceito racial e de classe, mas Martha o vive como culpa moral individual, enquanto em G. H. o encontro com Janair abala a identidade inteira da narradora e revela o lugar estrutural da empregada na casa brasileira.']}
]
});
